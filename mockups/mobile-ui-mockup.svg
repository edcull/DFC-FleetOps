<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="980" viewBox="0 0 1340 980" font-family="'Roboto Mono','DejaVu Sans Mono',monospace">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1518"/><stop offset="1" stop-color="#0a1014"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e0d"/><stop offset="1" stop-color="#060a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#4ad6ff" stop-opacity="0.05"/><stop offset="0.6" stop-color="#4ad6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scrA"><rect x="0" y="0" width="360" height="800" rx="30"/></clipPath>
    <clipPath id="scrB"><rect x="0" y="0" width="360" height="800" rx="30"/></clipPath>
    <clipPath id="scrC"><rect x="0" y="0" width="360" height="800" rx="30"/></clipPath>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#d4a647" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1340" height="980" fill="#05080a"/>
  <text x="40" y="42" font-size="22" letter-spacing="3" fill="#d4a647" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700">DFC FLEET OPS — MOBILE UI MOCKUP</text>
  <text x="40" y="64" font-size="12" fill="#7a8a94">Phone-first layout (≤860px): board fills the screen · side panels become slide-over drawers · in-game modals become bottom sheets</text>

  <!-- ======================= PHONE 1 : PLAY ======================= -->
  <g transform="translate(40,92)">
    <rect x="-12" y="-12" width="384" height="824" rx="40" fill="#000" stroke="#1a2228" stroke-width="2"/>
    <g clip-path="url(#scrA)">
      <rect width="360" height="800" fill="url(#page)"/>
      <rect width="360" height="800" fill="url(#glow)"/>
      <!-- board grid + tokens -->
      <rect y="48" width="360" height="722" fill="#08100f"/>
      <rect y="48" width="360" height="722" fill="url(#grid)"/>
      <!-- range ring + firing arc -->
      <circle cx="150" cy="430" r="95" fill="none" stroke="#7a8a94" stroke-opacity="0.25" stroke-dasharray="3 4"/>
      <path d="M150 430 L255 360 A126 126 0 0 1 255 500 Z" fill="#d4a647" fill-opacity="0.12" stroke="#7a5e1f" stroke-opacity="0.6"/>
      <!-- UCM ship (gold) -->
      <g transform="translate(150,430)"><path d="M0 -14 L11 12 L0 6 L-11 12 Z" fill="#d4a647" stroke="#161e22"/></g>
      <!-- Shaltari ship (cyan) -->
      <g transform="translate(245,250)"><path d="M0 -12 L10 10 L0 5 L-10 10 Z" fill="#4ad6ff" stroke="#161e22"/></g>
      <g transform="translate(95,560)"><path d="M0 -12 L10 10 L0 5 L-10 10 Z" fill="#4ad6ff" stroke="#161e22"/></g>

      <!-- activation HUD pinned top-left -->
      <g transform="translate(8,108)">
        <rect width="200" height="62" rx="4" fill="#0a0f0e" fill-opacity="0.92" stroke="#2f4250"/>
        <text x="10" y="17" font-size="9" letter-spacing="1" fill="#4a5862">ACTIVATION</text>
        <text x="10" y="34" font-size="12" font-weight="700" fill="#d8e3e8">UCM Cruiser ×3</text>
        <text x="10" y="51" font-size="10" fill="#d4a647">Order · WEAPONS FREE</text>
      </g>
      <!-- scenario banner top-right -->
      <g transform="translate(232,108)">
        <rect width="120" height="40" rx="3" fill="#0a0f0e" fill-opacity="0.85" stroke="#233038"/>
        <text x="60" y="16" font-size="9" letter-spacing="1.5" fill="#d4a647" text-anchor="middle" font-family="'Oswald',sans-serif">CHANCE ENGAGE</text>
        <text x="60" y="31" font-size="9" fill="#7a8a94" text-anchor="middle">Round 4 / 6</text>
      </g>
      <!-- deploy/help hint bottom -->
      <g transform="translate(60,712)">
        <rect width="240" height="34" rx="3" fill="#0a0f0e" fill-opacity="0.92" stroke="#2f4250"/>
        <text x="120" y="22" font-size="10" fill="#7a8a94" text-anchor="middle">Tap a target ship to lock weapons</text>
      </g>

      <!-- top bar -->
      <rect width="360" height="48" fill="url(#topbar)"/>
      <line x1="0" y1="48" x2="360" y2="48" stroke="#2f4250"/>
      <text x="12" y="30" font-size="15" letter-spacing="1.5" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700"><tspan fill="#d4a647">UCMF</tspan><tspan fill="#4a5862" font-size="10"> VS </tspan><tspan fill="#4ad6ff">SHAL</tspan></text>
      <!-- toggles -->
      <g transform="translate(178,12)">
        <rect width="78" height="26" rx="3" fill="#11181c" stroke="#2f4250"/>
        <text x="39" y="17" font-size="10" letter-spacing="1" fill="#d8e3e8" text-anchor="middle">☰ FLEET</text>
      </g>
      <g transform="translate(262,12)">
        <rect width="86" height="26" rx="3" fill="#11181c" stroke="#2f4250"/>
        <text x="43" y="17" font-size="10" letter-spacing="1" fill="#d8e3e8" text-anchor="middle">▤ DETAIL</text>
      </g>
      <!-- home indicator -->
      <rect x="120" y="784" width="120" height="5" rx="2.5" fill="#2f4250"/>
    </g>
    <text x="174" y="846" font-size="13" fill="#7a8a94" text-anchor="middle" font-family="'Oswald',sans-serif" letter-spacing="2">1 · PLAY</text>
  </g>

  <!-- ======================= PHONE 2 : FLEET DRAWER ======================= -->
  <g transform="translate(480,92)">
    <rect x="-12" y="-12" width="384" height="824" rx="40" fill="#000" stroke="#1a2228" stroke-width="2"/>
    <g clip-path="url(#scrB)">
      <rect width="360" height="800" fill="url(#page)"/>
      <rect y="48" width="360" height="722" fill="#08100f"/>
      <rect y="48" width="360" height="722" fill="url(#grid)"/>
      <!-- scrim dimming the board -->
      <rect y="48" width="360" height="752" fill="#000" fill-opacity="0.5"/>

      <!-- LEFT DRAWER slid in -->
      <g transform="translate(0,48)">
        <rect width="300" height="752" fill="#11171a"/>
        <line x1="300" y1="0" x2="300" y2="752" stroke="#2f4250"/>
        <!-- player fleet header (own side first) -->
        <text x="14" y="28" font-size="12" letter-spacing="2.5" fill="#d4a647" font-family="'Oswald',sans-serif" font-weight="600">FLEET <tspan fill="#4a5862" font-size="10">· UCMF · 6/8</tspan></text>
        <!-- gold cards -->
        <g transform="translate(8,40)">
          <rect width="284" height="60" rx="3" fill="#161e22" stroke="#2f4250" stroke-width="1"/>
          <rect width="3" height="60" fill="#d4a647"/>
          <text x="12" y="22" font-size="13" fill="#d8e3e8" font-weight="600">Avalon Battlecruiser</text>
          <text x="12" y="40" font-size="9.5" fill="#7a8a94">Heavy · ×1 · HP 12/12</text>
          <text x="270" y="38" font-size="11" fill="#4ad6ff" text-anchor="end">●</text>
        </g>
        <g transform="translate(8,108)">
          <rect width="284" height="60" rx="3" fill="#1a242a" stroke="#d4a647"/>
          <rect width="3" height="60" fill="#d4a647"/>
          <text x="12" y="22" font-size="13" fill="#d8e3e8" font-weight="600">Toulon Frigates</text>
          <text x="12" y="40" font-size="9.5" fill="#d4a647">SELECTED · ×3 · HP 8/8</text>
        </g>
        <g transform="translate(8,176)" opacity="0.5">
          <rect width="284" height="56" rx="3" fill="#161e22" stroke="#233038"/>
          <rect width="3" height="56" fill="#7a5e1f"/>
          <text x="12" y="22" font-size="13" fill="#7a8a94" font-weight="600">New Cairo Cruisers</text>
          <text x="12" y="40" font-size="9.5" fill="#4a5862">ACTIVATED ·  ×3</text>
        </g>
        <!-- enemy fleet header -->
        <text x="14" y="270" font-size="12" letter-spacing="2.5" fill="#4ad6ff" font-family="'Oswald',sans-serif" font-weight="600">FLEET <tspan fill="#4a5862" font-size="10">· SHALTARI · 7/8</tspan></text>
        <g transform="translate(8,282)">
          <rect width="284" height="56" rx="3" fill="#161e22" stroke="#233038"/>
          <rect width="3" height="56" fill="#1f6e8c"/>
          <text x="12" y="22" font-size="13" fill="#d8e3e8" font-weight="600">Diamond Grav-cruisers</text>
          <text x="12" y="40" font-size="9.5" fill="#7a8a94">Medium · ×2 · HP 6/6</text>
        </g>
      </g>

      <!-- top bar with FLEET active -->
      <rect width="360" height="48" fill="url(#topbar)"/>
      <line x1="0" y1="48" x2="360" y2="48" stroke="#2f4250"/>
      <text x="12" y="30" font-size="15" letter-spacing="1.5" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700"><tspan fill="#d4a647">UCMF</tspan><tspan fill="#4a5862" font-size="10"> VS </tspan><tspan fill="#4ad6ff">SHAL</tspan></text>
      <g transform="translate(178,12)">
        <rect width="78" height="26" rx="3" fill="#3a2e15" stroke="#d4a647"/>
        <text x="39" y="17" font-size="10" letter-spacing="1" fill="#d4a647" text-anchor="middle">☰ FLEET</text>
      </g>
      <g transform="translate(262,12)">
        <rect width="86" height="26" rx="3" fill="#11181c" stroke="#2f4250"/>
        <text x="43" y="17" font-size="10" letter-spacing="1" fill="#d8e3e8" text-anchor="middle">▤ DETAIL</text>
      </g>
      <rect x="120" y="784" width="120" height="5" rx="2.5" fill="#2f4250"/>
    </g>
    <text x="174" y="846" font-size="13" fill="#7a8a94" text-anchor="middle" font-family="'Oswald',sans-serif" letter-spacing="2">2 · FLEET DRAWER</text>
  </g>

  <!-- ======================= PHONE 3 : ATTACK SHEET ======================= -->
  <g transform="translate(920,92)">
    <rect x="-12" y="-12" width="384" height="824" rx="40" fill="#000" stroke="#1a2228" stroke-width="2"/>
    <g clip-path="url(#scrC)">
      <rect width="360" height="800" fill="url(#page)"/>
      <rect y="48" width="360" height="722" fill="#08100f"/>
      <rect y="48" width="360" height="722" fill="url(#grid)"/>
      <circle cx="180" cy="200" r="70" fill="none" stroke="#ff5252" stroke-opacity="0.3" stroke-dasharray="3 4"/>
      <g transform="translate(120,250)"><path d="M0 -13 L11 11 L0 5 L-11 11 Z" fill="#d4a647" stroke="#161e22"/></g>
      <g transform="translate(220,150)"><path d="M0 -12 L10 10 L0 5 L-10 10 Z" fill="#4ad6ff" stroke="#ff5252" stroke-width="1.5"/></g>

      <!-- BOTTOM SHEET : ATTACK -->
      <g transform="translate(0,386)">
        <rect width="360" height="414" rx="12" fill="#0a0f0e" fill-opacity="0.98" stroke="#2f4250"/>
        <!-- handle -->
        <rect x="156" y="9" width="48" height="5" rx="2.5" fill="#3a4a54"/>
        <text x="16" y="44" font-size="12" letter-spacing="2" fill="#ff5252" font-family="'Oswald',sans-serif" font-weight="700">ATTACK</text>
        <line x1="14" y1="54" x2="346" y2="54" stroke="#ff5252" stroke-opacity="0.3"/>
        <text x="16" y="78" font-size="11" fill="#d8e3e8">Toulon Frigates  →  Diamond Grav-cruiser</text>
        <text x="16" y="98" font-size="10" fill="#7a8a94">Mass Driver · 4 shots · Lock 3+ · range 18&quot;</text>

        <!-- hit dice -->
        <text x="16" y="128" font-size="9.5" letter-spacing="1" fill="#7a8a94">TO HIT (3+)</text>
        <g transform="translate(16,138)" font-size="14" font-weight="700">
          <g><rect width="30" height="30" rx="4" fill="#161e22" stroke="#4ad6ff"/><text x="15" y="21" fill="#4ad6ff" text-anchor="middle">5</text></g>
          <g transform="translate(38,0)"><rect width="30" height="30" rx="4" fill="#161e22" stroke="#4ad6ff"/><text x="15" y="21" fill="#4ad6ff" text-anchor="middle">3</text></g>
          <g transform="translate(76,0)"><rect width="30" height="30" rx="4" fill="#161e22" stroke="#4ad6ff"/><text x="15" y="21" fill="#4ad6ff" text-anchor="middle">6</text></g>
          <g transform="translate(114,0)"><rect width="30" height="30" rx="4" fill="#11171a" stroke="#233038"/><text x="15" y="21" fill="#4a5862" text-anchor="middle">1</text></g>
        </g>
        <text x="300" y="159" font-size="11" fill="#d8e3e8" text-anchor="end">3 hits</text>

        <!-- save dice -->
        <text x="16" y="196" font-size="9.5" letter-spacing="1" fill="#7a8a94">SAVES (5+)</text>
        <g transform="translate(16,206)" font-size="14" font-weight="700">
          <g><rect width="30" height="30" rx="4" fill="#161e22" stroke="#ffb547"/><text x="15" y="21" fill="#ffb547" text-anchor="middle">6</text></g>
          <g transform="translate(38,0)"><rect width="30" height="30" rx="4" fill="#11171a" stroke="#233038"/><text x="15" y="21" fill="#4a5862" text-anchor="middle">2</text></g>
          <g transform="translate(76,0)"><rect width="30" height="30" rx="4" fill="#11171a" stroke="#233038"/><text x="15" y="21" fill="#4a5862" text-anchor="middle">4</text></g>
        </g>
        <text x="344" y="227" font-size="12" fill="#ff5252" text-anchor="end" font-weight="700">2 DMG</text>

        <!-- reroll stepper -->
        <g transform="translate(16,256)">
          <text x="0" y="20" font-size="10" fill="#7a8a94">Re-rolls</text>
          <g transform="translate(86,0)"><rect width="34" height="28" rx="3" fill="#11171a" stroke="#233038"/><text x="17" y="19" font-size="17" fill="#d8e3e8" text-anchor="middle">−</text></g>
          <text x="143" y="20" font-size="13" fill="#d8e3e8" text-anchor="middle" font-weight="700">1</text>
          <g transform="translate(160,0)"><rect width="34" height="28" rx="3" fill="#11171a" stroke="#233038"/><text x="17" y="19" font-size="17" fill="#d8e3e8" text-anchor="middle">+</text></g>
        </g>

        <!-- footer -->
        <line x1="14" y1="306" x2="346" y2="306" stroke="#233038"/>
        <g transform="translate(14,320)">
          <rect width="150" height="44" rx="4" fill="#11181c" stroke="#2f4250"/>
          <text x="75" y="28" font-size="12" letter-spacing="1" fill="#d8e3e8" text-anchor="middle">CANCEL</text>
        </g>
        <g transform="translate(182,320)">
          <rect width="164" height="44" rx="4" fill="#d4a647"/>
          <text x="82" y="28" font-size="12" letter-spacing="1" fill="#1a1108" text-anchor="middle" font-weight="700">CONFIRM HITS</text>
        </g>
      </g>

      <!-- top bar -->
      <rect width="360" height="48" fill="url(#topbar)"/>
      <line x1="0" y1="48" x2="360" y2="48" stroke="#2f4250"/>
      <text x="12" y="30" font-size="15" letter-spacing="1.5" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700"><tspan fill="#d4a647">UCMF</tspan><tspan fill="#4a5862" font-size="10"> VS </tspan><tspan fill="#4ad6ff">SHAL</tspan></text>
      <g transform="translate(178,12)"><rect width="78" height="26" rx="3" fill="#11181c" stroke="#2f4250"/><text x="39" y="17" font-size="10" letter-spacing="1" fill="#d8e3e8" text-anchor="middle">☰ FLEET</text></g>
      <g transform="translate(262,12)"><rect width="86" height="26" rx="3" fill="#11181c" stroke="#2f4250"/><text x="43" y="17" font-size="10" letter-spacing="1" fill="#d8e3e8" text-anchor="middle">▤ DETAIL</text></g>
      <rect x="120" y="784" width="120" height="5" rx="2.5" fill="#2f4250"/>
    </g>
    <text x="174" y="846" font-size="13" fill="#7a8a94" text-anchor="middle" font-family="'Oswald',sans-serif" letter-spacing="2">3 · ATTACK SHEET</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,902)" font-size="12" fill="#7a8a94">
    <text x="0" y="0" fill="#d8e3e8" font-weight="700">Key interactions:</text>
    <text x="0" y="22">• Top bar ☰ FLEET / ▤ DETAIL slide the side panels in over the board (scrim closes them). Active toggle is highlighted gold.</text>
    <text x="0" y="42">• Tapping a unit in the FLEET drawer auto-switches to the DETAIL drawer (orders + weapons). Bottom sheets replace the desktop floating modals; ~44px tap targets throughout.</text>
  </g>
</svg>
