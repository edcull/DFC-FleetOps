      // Gather this ship's trail points (previous positions), in order, then current.
      const pts = trail.filter(t => t.si === si).map(t => ({ x: t.x, y: t.y }));
      if (!pts.length) return;
      pts.push({ x: ship.x, y: ship.y });
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
      html += `<path d="${d}" fill="none" stroke="${traceCol}" stroke-width="1" opacity="0.55"/>`;
      // Small origin marker at the start point.
      html += `<circle cx="${pts[0].x}" cy="${pts[0].y}" r="2" fill="${traceCol}" opacity="0.55"/>`;
    });
  });

  allDefs().forEach(def => {
    const grp = getGroup(def.id);
    const oof = outOfFormationSet(def);
    grp.ships.forEach((ship, si) => {
      if (ship.destroyed || ship.offTable) return;
      if (payloadAttached(ship)) return; // attached payloads ride inside their Porter
      const isSel = state.selectedGroupId === def.id && state.selectedShipIdx === si;
      const isInSelGroup = state.selectedGroupId === def.id;
      html += renderShipMarker(def, ship, false, true, isSel, isInSelGroup, si);
      const r = shipBaseRadiusPx(def);
      // Lead-ship marker — small ✦ above the base (not for Open Network).
      if (!noFormation(def) && (grp.leadShipIdx || 0) === si && grp.ships.filter(s => !s.destroyed && !s.offTable).length > 1) {
        html += `<text x="${ship.x}" y="${ship.y - r - 4}" font-family="var(--mono)" font-size="9"
                  font-weight="700" fill="${def.side === 'player1' ? 'var(--ucm)' : 'var(--shal)'}"
                  text-anchor="middle" pointer-events="none">✦</text>`;
      }
      // Out-of-formation marker — red dashed ring + tag.
      if (oof.has(si)) {
        html += `<circle cx="${ship.x}" cy="${ship.y}" r="${r + 3}" fill="none"
                  stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="2 2"/>`;
        html += `<text x="${ship.x}" y="${ship.y + r + 11}" font-family="var(--mono)" font-size="7"
                  font-weight="700" fill="var(--hull-crit)" text-anchor="middle"
                  stroke="var(--bg)" stroke-width="2" paint-order="stroke"
                  pointer-events="none">OUT OF FORM.</text>`;
      }
      // Atmosphere layer badge — small "ATMO" pill below the base.
      if ((ship.layer || 'orbit') === 'atmosphere') {
        html += `<text x="${ship.x}" y="${ship.y + r + (oof.has(si) ? 19 : 11)}" font-family="var(--mono)" font-size="6.5"
                  font-weight="700" fill="var(--hull-warn)" text-anchor="middle"
                  stroke="var(--bg)" stroke-width="2" paint-order="stroke"
                  pointer-events="none">ATMO</text>`;
      }
    });
  });

  // Dropsite-origin launch aura (Activate Dropsites step).
  if (state.launching && state.launching.fromDropsite) {
    const L = state.launching;
    const auraPx = L.auraIn * INCH;
    const acol = L.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
    html += `<circle cx="${L.x}" cy="${L.y}" r="${auraPx}"
      fill="${sideRgba(L.side,0.06)}"
      stroke="${acol}" stroke-width="1" stroke-dasharray="5 3"/>`;
    html += `<text x="${L.x}" y="${L.y - auraPx - 4}" font-family="var(--mono)" font-size="8"
      font-weight="700" fill="${acol}" text-anchor="middle" stroke="var(--bg)" stroke-width="2"
      paint-order="stroke" pointer-events="none">${L.name.toUpperCase()} ${L.auraIn}"</text>`;
  }

  // Dropsite Feature WEAPON scan radius (while targeting a feature attack).
  if (state.featureAttack) {
    const fa = state.featureAttack;
    const ds = state.scenarioData && state.scenarioData.dropsites.find(d => d.id === fa.dsId);
    const f = ds && FEATURES[ds.features[fa.fi]];
    if (ds && f && f.weapon) {
      const scanPx = (parseInt(f.weapon.scan) || 6) * INCH;
      const dsx = inchToPx(ds.x), dsy = inchToPx(ds.y);
      const isCA = /Close Action/i.test(f.weapon.special || '');
      html += `<circle cx="${dsx}" cy="${dsy}" r="${scanPx}"
        fill="rgba(255,82,82,0.05)" stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="4 3"/>`;
      html += `<text x="${dsx}" y="${dsy - scanPx - 4}" font-family="var(--mono)" font-size="8"
        font-weight="700" fill="var(--hull-crit)" text-anchor="middle" stroke="var(--bg)" stroke-width="2"
        paint-order="stroke" pointer-events="none">${f.weapon.name.toUpperCase()} ${parseInt(f.weapon.scan)||6}"</text>`;
      // Highlight each valid enemy ship target with a red dotted ring
      const enemySide = fa.side === 'player1' ? 'player2' : 'player1';
      Object.keys(state.groups).forEach(gid => {
        const def = getDef(gid);
        if (!def || def.side !== enemySide) return;
        state.groups[gid].ships.forEach((s) => {
          if (s.destroyed || s.offTable) return;
          const sigBonusIn = isCA ? 0 : ((s.sigSilent ? 0 : (def.sig || 0)) + ((state.groups[gid].spikes||0)+(s.spikes||0)) * 3);
          const reach = scanPx + sigBonusIn * INCH;
          if (Math.hypot(s.x - dsx, s.y - dsy) <= reach) {
            html += `<circle cx="${s.x}" cy="${s.y}" r="9" fill="none" stroke="var(--hull-crit)" stroke-width="1.5" stroke-dasharray="2 2"/>`;
          }
        });
      });
    }
  }

  // Extract range aura: ship in extract-targeting mode shows its 6" reach to Dropsites.
  if (state.extracting) {
    const eg = state.groups[state.extracting.gid];
    const es = eg && eg.ships[state.extracting.si];
    if (es && !es.destroyed && !es.offTable) {
      const rPx = 6 * INCH;
      html += `<circle cx="${es.x}" cy="${es.y}" r="${rPx}" fill="rgba(181,154,214,0.06)" stroke="#b59ad6" stroke-width="1" stroke-dasharray="5 3"/>
        <text x="${es.x}" y="${es.y - rPx - 4}" font-family="var(--mono)" font-size="8" font-weight="700" fill="#b59ad6" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke" pointer-events="none">EXTRACT 6"</text>`;
    }
  }

  // Explosion radius aura: while an Explosion is pending/resolving in the attack modal,
  // show its blast radius so the player sees which ships are caught.
  if (state.attackModal && state.attackModal.step === 'explosion' && state.attackModal.explodeQueue && state.attackModal.explodeQueue[0]) {
    const ex = state.attackModal.explodeQueue[0];
    const mult = (ex.rolled && ex.effKind === 'spike2x') ? 2 : 1;
    const rPx = ex.rangeIn * INCH * mult;
    html += `<circle cx="${ex.x}" cy="${ex.y}" r="${rPx}" fill="rgba(255,82,82,0.10)" stroke="var(--hull-crit)" stroke-width="1.5" stroke-dasharray="6 4">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="1.1s" repeatCount="indefinite"/></circle>
    <text x="${ex.x}" y="${ex.y - rPx - 5}" font-family="var(--mono)" font-size="9" font-weight="700" fill="var(--hull-crit)" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke" pointer-events="none">💥 ${ex.rangeIn * mult}"</text>`;
  }

  // Enemy signature auras during Dropsite Activation (and while targeting a feature
  // weapon): weapon range = Scan + (effective Signature + 3"/Spike), so show each
  // enemy ship's detection bubble around its base.
  if ((state.dropsiteActivation && state.dropsiteActivation.dsId) || state.featureAttack) {
    const actSide = state.featureAttack ? state.featureAttack.side
      : (state.dropsiteActivation ? state.dropsiteActivation.side : null);
    // Sig/Spikes only extend range for NON-Close-Action weapons. Skip the auras when the
    // weapon being targeted is Close Action, or (in general activation) when the dropsite
    // has no non-Close-Action weapon feature.
    let showSigAuras = true;
    if (state.featureAttack) {
      const fads = state.scenarioData && state.scenarioData.dropsites.find(d => d.id === state.featureAttack.dsId);
      const faf = fads && FEATURES[fads.features[state.featureAttack.fi]];
      showSigAuras = !!(faf && faf.weapon && !/Close Action/i.test(faf.weapon.special || ''));
    } else if (state.dropsiteActivation && state.dropsiteActivation.dsId) {
      const ads = state.scenarioData && state.scenarioData.dropsites.find(d => d.id === state.dropsiteActivation.dsId);
      showSigAuras = !!(ads && (ads.features || []).some((fk, fi) => !(ads.destroyedFeatures||[]).includes(fi) && FEATURES[fk] && FEATURES[fk].weapon && !/Close Action/i.test(FEATURES[fk].weapon.special || '')));
    }
    if (actSide && showSigAuras) {
      const enemySide = actSide === 'player1' ? 'player2' : 'player1';
      fleetForSide(enemySide).forEach(edef => {
        const eg = getGroup(edef.id);
        if (!eg) return;
        const spikes = eg.spikes || 0;
        eg.ships.forEach(es => {
          if (es.destroyed || es.offTable) return;
          const sig = es.sigSilent ? 0 : (edef.sig || 0);
          const sigPx = (sig + 3 * (spikes + (es.spikes || 0))) * INCH;
          if (sigPx <= 0) return;
          html += `<circle cx="${es.x}" cy="${es.y}" r="${sigPx}" fill="rgba(255,82,82,0.04)"
                    stroke="var(--hull-crit)" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" pointer-events="none"/>`;
        });
      });
    }
  }

  // Auto-show a Dropsite's Scan (weapon) and Launch auras while it is being activated
  // (not while actively targeting — those more specific circles above take over).
  if (state.dropsiteActivation && state.dropsiteActivation.dsId && !state.featureAttack &&
      !(state.launching && state.launching.fromDropsite)) {
    const da = state.dropsiteActivation;
    const ds = state.scenarioData && state.scenarioData.dropsites.find(d => d.id === da.dsId);
    if (ds) {
      const dsx = inchToPx(ds.x), dsy = inchToPx(ds.y);
      const acol = da.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
      // Scan range: best weapon scan among weapon features, else base Scan, else 6".
      let scanIn = 0;
      (ds.features || []).forEach((fk, fi) => {
        if ((ds.destroyedFeatures || []).includes(fi)) return;
        const f = FEATURES[fk];
        if (f && f.weapon) scanIn = Math.max(scanIn, parseInt(f.weapon.scan) || 6);
      });
      if (!scanIn && ds.base && ds.base.scan) scanIn = parseInt(ds.base.scan) || 0;
      // Launch aura: 6" (Fighters/Bombers/Fire Ships/Torpedoes from a Dropsite feature).
      const hasLaunch = (ds.features || []).some((fk, fi) => !(ds.destroyedFeatures||[]).includes(fi) && FEATURES[fk] && FEATURES[fk].launch && FEATURES[fk].launch.length);
      const launchIn = hasLaunch ? 6 : 0;
      if (scanIn > 0) {
        const sPx = scanIn * INCH;
        html += `<circle cx="${dsx}" cy="${dsy}" r="${sPx}" fill="none" stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>`;
        html += `<text x="${dsx}" y="${dsy - sPx - 4}" font-family="var(--mono)" font-size="8" font-weight="700" fill="var(--hull-crit)" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke" pointer-events="none">SCAN ${scanIn}"</text>`;
      }
      if (launchIn > 0 && launchIn !== scanIn) {
        const lPx = launchIn * INCH;
        html += `<circle cx="${dsx}" cy="${dsy}" r="${lPx}" fill="none" stroke="${acol}" stroke-width="1" stroke-dasharray="5 3" opacity="0.7"/>`;
        html += `<text x="${dsx}" y="${dsy + lPx + 11}" font-family="var(--mono)" font-size="8" font-weight="700" fill="${acol}" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke" pointer-events="none">LAUNCH ${launchIn}"</text>`;
      } else if (launchIn > 0 && launchIn === scanIn) {
        // Same radius — label the single ring as both.
        const lPx = launchIn * INCH;
        html += `<text x="${dsx}" y="${dsy + lPx + 11}" font-family="var(--mono)" font-size="8" font-weight="700" fill="${acol}" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke" pointer-events="none">LAUNCH ${launchIn}"</text>`;
      }
    }
  }

  // Launched fighter/bomber/fireship asset markers.
  const assetMoveMode = state.assetPhase && state.assetPhase.step === 'assets';
  (state.launchedAssets || []).forEach((a, ai) => {
    const col = a.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
    const s = 6;
    const lbl = a.kind === 'bomber' ? 'BMR' : a.kind === 'fighter' ? 'FTR' : a.kind === 'fireship' ? 'FIRE' : a.kind === 'torpedo' ? 'TORP' : a.kind === 'mine' ? 'MINE' : 'F/B';
    const cnt = a.count || 1;
    const isSel = state.assetMove && state.assetMove.id === a.id;
    // In Asset Combat, show the selected asset's move range.
    if (assetMoveMode && isSel) {
      const thrPx = (a._t2tRange ? a._t2tRange : assetThrust(a)) * INCH;
      html += `<circle cx="${a.x}" cy="${a.y}" r="${thrPx}" fill="rgba(255,255,255,0.03)"
                stroke="${col}" stroke-width="1" stroke-dasharray="5 4"/>`;
    }
    // Compute facing rotation if launched from a dropsite (direction: dropsite → asset).
    let _assetFromDs = null, _assetRotDeg = 0;
    if (a.fromDropsite) {
      const _dss = state.scenarioData && state.scenarioData.dropsites;
      _assetFromDs = _dss && _dss.find(d => d.id === a.fromDropsite);
      if (_assetFromDs) {
        const _dsx = inchToPx(_assetFromDs.x), _dsy = inchToPx(_assetFromDs.y);
        const _ddx = a.x - _dsx, _ddy = a.y - _dsy;
        if (Math.abs(_ddx) > 0.5 || Math.abs(_ddy) > 0.5)
          _assetRotDeg = Math.atan2(_ddy, _ddx) * 180 / Math.PI + 90;
      }
    }
    html += `<g data-asset="${ai}" data-asset-id="${a.id}" style="cursor:pointer;">
      <polygon points="${a.x},${a.y-s} ${a.x+s},${a.y} ${a.x},${a.y+s} ${a.x-s},${a.y}"
        fill="${a.side==='player1'?'rgba(74,214,255,0.15)':'rgba(212,166,71,0.15)'}" stroke="${col}" stroke-width="${isSel?2:1}"
        ${a.moved && assetMoveMode ? 'opacity="0.5"' : ''}${_assetRotDeg ? ` transform="rotate(${_assetRotDeg.toFixed(1)},${a.x},${a.y})"` : ''}/>
      <text x="${a.x}" y="${a.y+1.5}" font-family="var(--mono)" font-size="7" font-weight="700"
        fill="${col}" text-anchor="middle" dominant-baseline="middle" pointer-events="none">${cnt}</text>
      <text x="${a.x}" y="${a.y+s+9}" font-family="var(--mono)" font-size="6.5" font-weight="700"
        fill="${col}" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke"
        pointer-events="none">${lbl}</text>
    </g>`;
    // Locked bomber-attack line to its target ship.
    if (a.bomberTarget) {
      const tg = state.groups[a.bomberTarget.gid];
      const ts = tg && tg.ships[a.bomberTarget.si];
      if (ts && !ts.destroyed && !ts.offTable) {
        html += `<line x1="${a.x}" y1="${a.y}" x2="${ts.x}" y2="${ts.y}" stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
          <circle cx="${ts.x}" cy="${ts.y}" r="9" fill="none" stroke="var(--hull-crit)" stroke-width="1.2" opacity="0.85"/>`;
      }
    }
    // Launch line from launching ship to deployed asset.
    if (a.fromGid) {
      const fromGrp = state.groups[a.fromGid];
      const fromShip = fromGrp && fromGrp.ships[a.fromSi];
      if (fromShip && !fromShip.destroyed && !fromShip.offTable) {
        html += `<line x1="${fromShip.x}" y1="${fromShip.y}" x2="${a.x}" y2="${a.y}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`;
      }
    }
    // Dotted movement line from launching dropsite to deployed asset.
    if (_assetFromDs) {
      const _dsx = inchToPx(_assetFromDs.x), _dsy = inchToPx(_assetFromDs.y);
      html += `<line x1="${_dsx}" y1="${_dsy}" x2="${a.x}" y2="${a.y}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`;
    }
  });

  // Ground-launch lines — dashed lines from launching ships to target dropsites.
  // pendingGroundLaunch: local pre-intent line (only this client, before location is chosen).
  if (state.pendingGroundLaunch) {
    const pg = state.pendingGroundLaunch;
    const pgGrp = state.groups[pg.gid];
    const pgShip = pgGrp && pgGrp.ships[pg.si];
    const pgDs = state.scenarioData && state.scenarioData.dropsites && state.scenarioData.dropsites.find(d => d.id === pg.dsId);
    if (pgShip && !pgShip.destroyed && !pgShip.offTable && pgDs) {
      const pgDef = getDef(pg.gid);
      const pgCol = pgDef && pgDef.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
      const pgDx = inchToPx(pgDs.x), pgDy = inchToPx(pgDs.y);
      if (pg.gateSel) {
        html += `<line x1="${pgShip.x}" y1="${pgShip.y}" x2="${pg.gateSel.x}" y2="${pg.gateSel.y}" stroke="${pgCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
          <line x1="${pg.gateSel.x}" y1="${pg.gateSel.y}" x2="${pgDx}" y2="${pgDy}" stroke="${pgCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
          <circle cx="${pgDx}" cy="${pgDy}" r="9" fill="none" stroke="${pgCol}" stroke-width="1.2" opacity="0.7"/>`;
      } else {
        html += `<line x1="${pgShip.x}" y1="${pgShip.y}" x2="${pgDx}" y2="${pgDy}" stroke="${pgCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
          <circle cx="${pgDx}" cy="${pgDy}" r="9" fill="none" stroke="${pgCol}" stroke-width="1.2" opacity="0.7"/>`;
      }
    }
  }
  // groundLaunchLines: persistent server-broadcast lines after intent is confirmed.
  (state.groundLaunchLines || []).forEach(gl => {
    const glGrp = state.groups[gl.fromGid];
    const glShip = glGrp && glGrp.ships[gl.fromSi];
    const glDs = state.scenarioData && state.scenarioData.dropsites && state.scenarioData.dropsites.find(d => d.id === gl.dsId);
    if (glShip && !glShip.destroyed && !glShip.offTable && glDs) {
      const glCol = gl.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
      const glDx = inchToPx(glDs.x), glDy = inchToPx(glDs.y);
      if (gl.gateGid != null) {
        const glGateGrp = state.groups[gl.gateGid];
        const glGate = glGateGrp && glGateGrp.ships[gl.gateSi];
        if (glGate && !glGate.destroyed && !glGate.offTable) {
          html += `<line x1="${glShip.x}" y1="${glShip.y}" x2="${glGate.x}" y2="${glGate.y}" stroke="${glCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
            <line x1="${glGate.x}" y1="${glGate.y}" x2="${glDx}" y2="${glDy}" stroke="${glCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
            <circle cx="${glDx}" cy="${glDy}" r="9" fill="none" stroke="${glCol}" stroke-width="1.2" opacity="0.7"/>`;
        } else {
          html += `<line x1="${glShip.x}" y1="${glShip.y}" x2="${glDx}" y2="${glDy}" stroke="${glCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
            <circle cx="${glDx}" cy="${glDy}" r="9" fill="none" stroke="${glCol}" stroke-width="1.2" opacity="0.7"/>`;
        }
      } else {
        html += `<line x1="${glShip.x}" y1="${glShip.y}" x2="${glDx}" y2="${glDy}" stroke="${glCol}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
          <circle cx="${glDx}" cy="${glDy}" r="9" fill="none" stroke="${glCol}" stroke-width="1.2" opacity="0.7"/>`;
      }
    }
  });

  // Weapon target lines — red dotted lines from a ship to its locked targets.
  Object.keys(state.groups).forEach(gid => {
    const grp = state.groups[gid];
    grp.ships.forEach(s => {
      if (s.destroyed || s.offTable || !s.weaponTargets) return;
      Object.keys(s.weaponTargets).forEach(wi => {
        const t = s.weaponTargets[wi];
        if (t.dsId) {
          const _dss = state.scenarioData && state.scenarioData.dropsites;
          const _ds = _dss && _dss.find(d => d.id === t.dsId);
          if (!_ds) return;
          const _dx = inchToPx(_ds.x), _dy = inchToPx(_ds.y);
          html += `<line x1="${s.x}" y1="${s.y}" x2="${_dx}" y2="${_dy}" stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="3 3" opacity="0.75"/>
            <circle cx="${_dx}" cy="${_dy}" r="11" fill="none" stroke="var(--hull-crit)" stroke-width="1.5" opacity="0.8"/>`;
          return;
        }
        const tg = state.groups[t.gid];
        const ts = tg && tg.ships[t.si];
        if (!ts || ts.destroyed || ts.offTable) return;
        html += `<line x1="${s.x}" y1="${s.y}" x2="${ts.x}" y2="${ts.y}" stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="3 3" opacity="0.75"/>
          <circle cx="${ts.x}" cy="${ts.y}" r="8" fill="none" stroke="var(--hull-crit)" stroke-width="1.2" opacity="0.8"/>`;
      });
    });
  });
  // Active targeting: highlight valid enemy targets for the chosen weapon.
  if (state.targeting) {
    const t = state.targeting;
    const aGrp = state.groups[t.gid];
    const aShip = aGrp && aGrp.ships[t.si];
    const aDef = getDef(t.gid);
    const w = aDef && aDef.weapons[t.wi];
    if (aShip && w) {
      const originShip = firingOriginShip(aDef, aGrp, t.si);
      if (originShip && originShip !== aShip) {
        html += `<circle cx="${originShip.x}" cy="${originShip.y}" r="${shipBaseRadiusPx(aDef)+3}" fill="none" stroke="var(--hull-crit)" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>`;
      }
      if (/Bombardment/i.test(w.special || '')) {
        // Highlight dropsites in arc + scan range.
        const scanRangePx = (aDef.scan || 0) * INCH;
        ((state.scenarioData && state.scenarioData.dropsites) || []).forEach(ds => {
          const dx = inchToPx(ds.x), dy = inchToPx(ds.y);
          const inArc = pointInWeaponArc(originShip, w, dx, dy);
          const inRange = Math.hypot(dx - originShip.x, dy - originShip.y) <= scanRangePx;
          if (inArc && inRange) {
            html += `<circle cx="${dx}" cy="${dy}" r="13" fill="none" stroke="var(--hull-crit)" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.9"/>`;
          }
        });
      } else {
        Object.keys(state.groups).forEach(gid => {
          const def = getDef(gid);
          if (!def || def.side === aDef.side) return;
          const tGrp = state.groups[gid];
          tGrp.ships.forEach((s, si) => {
            if (s.destroyed || s.offTable || s.attachedTo) return;
            const eff = sceneryAttackEffects(originShip.x, originShip.y, s.x, s.y, originShip, s);
            const sig = s.sigSilent ? 0 : (def.sig || 0);
            const spikes = (tGrp.spikes || 0) + (s.spikes || 0);
            const sigPx      = sig * INCH;
            const sigSpikePx = (sig + 3 * spikes) * INCH;
            if (eff.ignoreSpikes && spikes > 0) {
              // Path crosses a planetary ring: spikes are ignored. Show full sig+spike aura
              // in grey to indicate it doesn't count, and base sig aura in red.
              if (sigSpikePx > 0) {
                html += `<circle cx="${s.x}" cy="${s.y}" r="${sigSpikePx}" fill="rgba(100,100,100,0.03)" stroke="#555" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" pointer-events="none"/>`;
              }
              if (sigPx > 0) {
                html += `<circle cx="${s.x}" cy="${s.y}" r="${sigPx}" fill="rgba(255,82,82,0.04)" stroke="var(--hull-crit)" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" pointer-events="none"/>`;
              }
            } else if (sigSpikePx > 0) {
              html += `<circle cx="${s.x}" cy="${s.y}" r="${sigSpikePx}" fill="rgba(255,82,82,0.04)" stroke="var(--hull-crit)" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" pointer-events="none"/>`;
            }
            if (weaponCanTarget(state, aDef, originShip, w, def, s, tGrp)) {
              html += `<circle cx="${s.x}" cy="${s.y}" r="9" fill="none" stroke="var(--hull-crit)" stroke-width="1.5" stroke-dasharray="2 2"/>`;
            }
          });
        });
      }
    }
  }

  // Payload DETACH: 3" placement aura around the Porter + ghost ship at cursor.
  if (state.payloadDetach) {
    const pd = state.payloadDetach;
    const porter = state.groups[pd.porterGid] && state.groups[pd.porterGid].ships[pd.porterSi];
    const payDef = getDef(pd.gid);
    if (porter) {
      const r = 3 * INCH;
      html += `<circle cx="${porter.x}" cy="${porter.y}" r="${r}" fill="${ucmRgba(0.06)}" stroke="var(--ucm)" stroke-width="1" stroke-dasharray="4 3"/>`;
      if (state.hoverPoint) {
        const within = Math.hypot(state.hoverPoint.x - porter.x, state.hoverPoint.y - porter.y) <= r + 2;
        const gcol = within ? (payDef.side==='player1'?'var(--ucm)':'var(--shal)') : 'var(--hull-crit)';
        html += `<circle cx="${state.hoverPoint.x}" cy="${state.hoverPoint.y}" r="5" fill="none" stroke="${gcol}" stroke-width="1.5" opacity="0.85"/>`;
        html += `<line x1="${porter.x}" y1="${porter.y}" x2="${state.hoverPoint.x}" y2="${state.hoverPoint.y}" stroke="${gcol}" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>`;
      }
    }
  }
  // Payload REATTACH: 3" aura + highlight eligible detached payloads.
  if (state.payloadReattach) {
    const pr = state.payloadReattach;
    const porter = state.groups[pr.porterGid] && state.groups[pr.porterGid].ships[pr.porterSi];
    const pdef = getDef(pr.porterGid);
    if (porter) {
      const r = 3 * INCH;
      html += `<circle cx="${porter.x}" cy="${porter.y}" r="${r}" fill="${shalRgba(0.06)}" stroke="var(--shal)" stroke-width="1" stroke-dasharray="4 3"/>`;
      detachedReattachCandidates(pdef.side, porter, pdef.porter.size).forEach(c => {
        html += `<circle cx="${c.ship.x}" cy="${c.ship.y}" r="7" fill="none" stroke="var(--shal)" stroke-width="1.5"/>`;
      });
    }
  }

  // Clip everything to the playable 48"×48" board so arcs/auras/lines that
  // extend past the edge are not drawn outside the map area.
  svg.innerHTML = `<defs><clipPath id="board-clip"><rect x="0" y="0" width="${BOARD_PX}" height="${BOARD_PX}"/></clipPath></defs>`
    + `<g clip-path="url(#board-clip)">${html}</g>`;
}

/* Render scan range + arcs for a ship (called for selected group ships).
   arcOrigin overrides the ship used for weapon arc drawing (lead ship when nominated). */
function renderShipOverlays(def, ship, isSelected, arcOrigin) {
  const baseScanR = def.scan * INCH;
  const opacity = isSelected ? 0.6 : 0.2;
  const color = def.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
  let html = `<g class="ship-overlays" pointer-events="none">`;
  // Scan range — dashed circle centred on this ship
  html += `<circle cx="${ship.x}" cy="${ship.y}" r="${baseScanR}"
            fill="none" stroke="${color}" stroke-width="0.5"
            stroke-dasharray="3 4" opacity="${opacity * 0.7}"/>`;
  if (!isSelected) return html + '</g>';

  // Weapon arcs — draw from arcOrigin (lead ship) or this ship if no lead.
  const origin = arcOrigin || ship;
  if (def.weapons) {
    def.weapons.forEach(w => {
      if (w.arc === 'LoS' || w.arc === '—' || !w.arc) return;
      html += renderWeaponArc(origin, def, w);
    });
  }
  html += `</g>`;
  return html;
}

/* Render a single weapon arc as a translucent wedge.
   Arc range = Scan (we don't know target Sig, so show base Scan).
   F = 90° front, S = 90° each side, R = 90° rear,
   FN = 22° narrow front, RN = 22° narrow rear, B = side left+right combined.
   For F/S, F/S/R combos: draw each component as a separate wedge. */
function renderWeaponArc(ship, def, w) {
  const r = def.scan * INCH;
  const cx = ship.x, cy = ship.y;
  const h = ship.heading;
  let html = '';
  // Parse arc — could be "F", "F/S", "F/S/R", "FN", "RN", "B", "S"
  const components = w.arc.split('/').map(s => s.trim());

  // map arc names to centre-angle relative to heading and half-width
  function wedge(centreOffset, halfWidth, fill, stroke) {
    const a1 = (h + centreOffset - halfWidth) * Math.PI / 180;
    const a2 = (h + centreOffset + halfWidth) * Math.PI / 180;
    const x1 = cx + Math.cos(a1) * r;
    const y1 = cy + Math.sin(a1) * r;
    const x2 = cx + Math.cos(a2) * r;
    const y2 = cy + Math.sin(a2) * r;
    const largeArc = (halfWidth * 2) > 180 ? 1 : 0;
    return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z"
              fill="${fill}" stroke="${stroke}" stroke-width="0.4" opacity="0.6"/>`;
  }
  components.forEach(c => {
    if (c === 'F') html += wedge(0, 45, 'rgba(74,214,255,0.18)', 'var(--ucm-dim)');
    else if (c === 'R') html += wedge(180, 45, 'rgba(122,138,148,0.12)', 'var(--text-mute)');
    else if (c === 'S') {
      // both sides
      html += wedge(90, 45, 'rgba(122,138,148,0.15)', 'var(--text-mute)');
      html += wedge(-90, 45, 'rgba(122,138,148,0.15)', 'var(--text-mute)');
    }
    else if (c === 'FN') html += wedge(0, 11, 'rgba(255,181,71,0.30)', 'var(--hull-warn)');
    else if (c === 'RN') html += wedge(180, 11, 'rgba(255,181,71,0.30)', 'var(--hull-warn)');
    else if (c === 'B') {
      html += wedge(90, 45, 'rgba(122,138,148,0.15)', 'var(--text-mute)');
      html += wedge(-90, 45, 'rgba(122,138,148,0.15)', 'var(--text-mute)');
    }
  });
  return html;
}


/* Return eligible Shield Booster groups for a given target ship.
   A group qualifies when: it has Shield Booster in its def, it is friendly to the
   target, it has < 4 spikes, it is NOT the target's own group, and at least one alive
   on-table ship is within 6" of the target ship. */
function findShieldBoosters(targetGid, targetSi) {
  const tDef = getDef(targetGid);
  const tGrp = state.groups[targetGid];
  const tShip = tGrp && tGrp.ships[targetSi];
  if (!tShip || tShip.destroyed) return [];
  const sv = shieldSaveVal(tDef);
  if (!sv || sv <= 3) return []; // already 3+ or no shield — can't improve further
  const out = [];
  Object.keys(state.groups).forEach(gid => {
    if (gid === targetGid) return; // "Ships with this rule are unaffected"
    const grp = state.groups[gid];
    const def = getDef(gid);
    if (!def || def.side !== tDef.side) return;
    if (!/Shield Booster/i.test(def.special || '')) return;
    if ((grp.spikes || 0) >= 4) return;
    const inRange = grp.ships.some(s =>
      !s.destroyed && !s.offTable &&
      Math.hypot(s.x - tShip.x, s.y - tShip.y) <= 6 * INCH
    );
    if (!inRange) return;
    out.push({ gid, name: def.name, spikes: grp.spikes || 0, boostedSv: Math.max(3, sv - 1) });
  });
  return out;
}

/* Build the attack from the firing ship's locked weapons, grouped by target. */
function openAttackModal(gid, si) {
  const aDef = getDef(gid);
  const grp = state.groups[gid];
  if (!grp) return;
  // Gather locked weapons from EVERY ship in the Group (the whole group fires together).
  // Combine identical weapon systems firing at the same target into one pooled-Att shot.
  const combined = {}; // key: weaponName|targetGid|targetSi → shot
  grp.ships.forEach((ship, sIdx) => {
    if (ship.destroyed || ship.offTable || !ship.weaponTargets) return;
    const shipEO = effectiveOrder(aDef, grp, sIdx); // this ship's effective Order
    Object.keys(ship.weaponTargets).forEach(wi => {
      const t = ship.weaponTargets[wi];
      const tg = state.groups[t.gid];
      const ts = tg && tg.ships[t.si];
      if (!ts || ts.destroyed || ts.offTable) return;
      const w = aDef.weapons[parseInt(wi)];
      const sp = parseWeaponSpecials(w);
      // Fusillade-X: +X Attack for THIS ship while it is on Weapons Free. Applied per
      // contributing ship so pooled group fire sums each ship's boosted Attack.
      const shipAtt = w.att + ((sp.fusillade && shipEO === 'WF') ? sp.fusillade : 0);
      const reps = sp.volley > 1 ? sp.volley : 1;
      for (let r = 0; r < reps; r++) {
        const key = w.name + '|' + t.gid + '|' + t.si + (reps > 1 ? '|v' + r : '');
        if (combined[key]) {
          combined[key].w = { ...combined[key].w, att: combined[key].w.att + shipAtt }; // pool Att
        } else {
          combined[key] = { wi: parseInt(wi), w: { ...w, att: shipAtt }, targetGid: t.gid, targetSi: t.si,
            volleyIdx: reps > 1 ? r + 1 : 0, volleyOf: reps, fusilladeBaked: true };
        }
      }
    });
  });
  const shots = Object.values(combined);
  if (!shots.length) { flashLaunchMsg('No valid targets'); return; }
  const totalLocks = grp.ships.reduce((n, s) => n + (s.weaponTargets ? Object.keys(s.weaponTargets).length : 0), 0);
  // Group fire is measured from the LEAD ship — use it as the attacker origin so the
  // hit step's range/scenery/layer effects measure from the correct point.
  const individual = aDef.openNetwork || onIndividualOrders(aDef, grp);
  let originSi = si;
  if (!individual) {
    const li = grp.leadShipIdx || 0;
    const lead = grp.ships[li];
    if (lead && !lead.destroyed && !lead.offTable) originSi = li;
  }
  state.attackModal = {
    attackerGid: gid, attackerSi: originSi,
    groupFire: true,
    shots, totalLocks,
    step: 'intro',       // intro → hit → save → crippling → explosion → done
    shotIdx: 0,
    shieldsUp: {},        // {targetKey: bool}
    log: [],
    pendingDamage: {},    // {targetKey: damage} accumulated
    hitResult: null, saveResult: null, crippleQueue: [], explodeQueue: []
  };
  renderAll();
}


/* Open the attack modal for an asset attack (bomber / fireship / torpedo).
   Bombers & Fire Ships in `assetIds` combine into ONE roll; a Torpedo attacks alone.
   Uses the side's faction profile for that asset kind. */
function openBomberAttackModal(assetIds, targetGid, targetSi, side, kind) {
  kind = kind || 'bomber';
  dispatch({ type: 'beginBomberAttack', assetIds, targetGid, targetSi, side, kind });
}

/* Any launched assets currently locked onto a ship target (awaiting pooled attack)?
   Optionally restricted to a side and a stage type. */
function anyPendingBomberAttacks(side, type) {
  const kinds = type ? kindsForAssetType(type) : null;
  return (state.launchedAssets || []).some(a => a.bomberTarget && (!side || a.side === side) && (!kinds || kinds.includes(a.kind)));
}

/* Resolve the NEXT pending pooled attack (optionally scoped to a side + stage type).
   All assets of the SAME kind & side locked onto the SAME target ship combine into one
   attack. Chains via finishAttack → resolvePendingBomberAttacks until none remain for
   the scope. When a stage-scoped run finishes, the asset stage advances. */
function resolvePendingBomberAttacks(side, type) {
  // Remember the scope so finishAttack can continue / hand back to the stage machine.
  state._bomberResolveSide = side || null;
  state._bomberResolveType = type || null;
  const kinds = type ? kindsForAssetType(type) : null;
  const inScope = a => a.bomberTarget && (!side || a.side === side) && (!kinds || kinds.includes(a.kind));
  const locked = (state.launchedAssets || []).filter(inScope);
  if (!locked.length) {
    state._bomberResolveSide = null; state._bomberResolveType = null;
    return false;
  }
  const first = locked[0];
  const key = a => `${a.kind}|${a.side}|${a.bomberTarget.gid}|${a.bomberTarget.si}`;
  const k0 = key(first);
  const pool = locked.filter(a => key(a) === k0);
  const tg = state.groups[first.bomberTarget.gid];
  const ts = tg && tg.ships[first.bomberTarget.si];
  if (!ts || ts.destroyed || ts.offTable) {
    pool.forEach(a => { a.bomberTarget = null; });
    return resolvePendingBomberAttacks(side, type);
  }
  openBomberAttackModal(pool.map(a => a.id), first.bomberTarget.gid, first.bomberTarget.si, first.side, first.kind);
  return true;
}

/* Open the attack modal for a Dropsite Feature weapon (Missile Halo, Orbital Gun).
   Treated like a bomber-style single-weapon attack from the dropsite. */
function openFeatureAttackModal(ds, fi, targetGid, targetSi, side) {
  const f = FEATURES[ds.features[fi]];
  const wp = f.weapon;
  const w = { name: `${f.name}: ${wp.name}`, arc: '—', att: wp.att, lock: wp.lock, dmg: wp.dmg, type: wp.type, special: wp.special || '' };
  state.attackModal = {
    bomber: true, bomberKind: 'feature', bomberAssetIds: [], bomberSide: side, saturation: 0, cripplingFire: 0,
    attackerName: `${f.name}: ${wp.name}`,
    attackerGid: null, attackerSi: null,
    shots: [{ wi: 0, w, targetGid, targetSi }],
    step: 'intro', shotIdx: 0, shieldsUp: {}, log: [], pendingDamage: {},
    hitResult: null, saveResult: null, crippleQueue: [], explodeQueue: []
  };
  renderAll();
}

// ── Dice rolling animation ────────────────────────────────────────────────
// renderAll() rebuilds dice markup from scratch on every state change. To make
// dice tumble only when they are genuinely (re-)rolled — not on every unrelated
// re-render — we remember the last face+colour each die showed under a stable
// key and add the `.rolling` class only to dice whose value changed.
const _diceAnim = {};
/* dice: array of { text, cls, title? }. cls ∈ '', 'hit', 'crit', 'miss'. */
function diceHtml(key, dice) {
  const prev = _diceAnim[key] || [];
  const sigs = dice.map(d => `${d.text}:${d.cls || ''}`);
  const html = dice.map((d, i) => {
    const roll = prev[i] !== sigs[i];
    return `<span class="am-die ${d.cls || ''}${roll ? ' rolling' : ''}"`
      + `${roll ? ` style="animation-delay:${i * 45}ms"` : ''}`
      + `${d.title ? ` title="${d.title}"` : ''}>${d.text}</span>`;
  }).join('');
  _diceAnim[key] = sigs;
  return html;
}
/* Forget remembered dice so the next render re-tumbles them. Pass a key prefix
   to clear a family (e.g. 'attack:') or nothing to clear all. */
function resetDiceAnim(prefix) {
  for (const k in _diceAnim) {
    if (!prefix || k.startsWith(prefix)) delete _diceAnim[k];
  }
}

function renderAttackModal() {
  let overlay = document.getElementById('attack-overlay');
  if (overlay) overlay.remove();
  const M = state.attackModal;
  if (!M) return;
  // A fresh attack: forget previous attack dice so its first rolls re-tumble.
  if (M.step === 'intro') resetDiceAnim('attack:');
  // Explosion step is handled by renderDetail (board-view panel), not the overlay.
  if (M.step === 'explosion') return;
  const aDef = M.bomber ? { name: M.attackerName || 'Bombers', side: M.bomberSide } : getDef(M.attackerGid);
  const aShip = M.bomber ? null : state.groups[M.attackerGid].ships[M.attackerSi];
  const sideClass = sideCssKey(aDef.side);
  // Online side gating: attacker drives advances; defender drives defensive choices.
  const isAttacker = !_netSide || _netSide === aDef.side;
  const isDefender = !_netSide || _netSide !== aDef.side;

  let body = '';
  let footer = '';

  if (M.step === 'select') {
    const resolved = M.resolvedShots || [];
    const remaining = M.shots.filter((_, i) => !resolved.includes(i)).length;
    body = `<div style="font-size:10px;color:var(--text-mute);margin-bottom:8px;">${remaining} weapon system${remaining !== 1 ? 's' : ''} to resolve — choose one:</div>`;
    M.shots.forEach((s, i) => {
      const isDone = resolved.includes(i);
      const inactive = isDone || !isAttacker;
      const td = s.dsId ? null : getDef(s.targetGid);
      const tName = s.dsId
        ? (state.scenarioData?.dropsites?.find(d => d.id === s.dsId)?.base.name || s.dsId)
        : (td ? td.name + (state.groups[s.targetGid]?.ships?.length > 1 ? ` #${s.targetSi + 1}` : '') : '?');
      const volLabel = s.volleyOf > 1 ? ` · Volley ${s.volleyIdx}/${s.volleyOf}` : '';
      if (isDone) {
        body += `<div style="margin-bottom:4px;padding:4px 8px;font-family:var(--mono);font-size:10px;color:var(--text-mute);opacity:0.4;">
          <span style="color:var(--hull-good)">✓</span> ${s.w.name}${volLabel}</div>`;
      } else {
        body += `<button ${inactive ? 'disabled' : `data-am-select="${i}"`}
          style="display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 8px;
                 background:${inactive ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.07)'};
                 border:1px solid ${inactive ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.18)'};
                 border-radius:3px;color:${inactive ? 'var(--text-mute)' : 'var(--text)'};cursor:${inactive ? 'default' : 'pointer'};
                 font-family:var(--mono);font-size:10px;">
          <b>${s.w.name}</b>${volLabel}
          <span style="color:var(--hull-crit)"> ▶ ${tName}</span>
          <span style="float:right;color:var(--text-mute);">Att ${s.w.att} · Lock ${s.w.lock}+</span>
        </button>`;
      }
    });
    footer = isAttacker ? `<button class="btn" data-am-cancel="1">Abort</button>` : '';
  }

  else if (M.step === 'intro') {
    // When coming from the 'select' step (shotIdx is set), scope to the selected shot only.
    const fromSelect = M.shotIdx != null && M.shots.length > 1;
    const introShots = fromSelect ? [M.shots[M.shotIdx]] : M.shots;
    const introShotIndices = fromSelect ? [M.shotIdx] : M.shots.map((_, i) => i);
    // Collect shield-eligible targets with weapon types + save info for the label.
    const targetsWithShields = [];
    introShots.forEach(s => {
      if (s.dsId) return; // bombardment targets dropsites — no shields
      const td = getDef(s.targetGid);
      const ts = state.groups[s.targetGid] && state.groups[s.targetGid].ships[s.targetSi];
      const k = targetKey(s.targetGid, s.targetSi);
      if (!hasShields(td) || targetsWithShields.find(x => x.k === k)) return;
      const sv = shieldSaveVal(td);
      const weapTypes = [...new Set(introShots.filter(x => x.targetGid === s.targetGid && x.targetSi === s.targetSi).map(x => x.w.type).filter(Boolean))];
      const saveParts = weapTypes.map(t => {
        const base = ts ? baseSaveForType(td, ts, t, false) : null;
        const baseStr = base != null ? `${base}+` : '—';
        return `${t}: ${baseStr}→${sv}+S`;
      }).join(' · ');
      targetsWithShields.push({ k, name: td.name, sv, saveParts });
    });
    if (fromSelect) {
      const s = M.shots[M.shotIdx];
      const td = s.dsId ? null : getDef(s.targetGid);
      const tName = s.dsId
        ? (state.scenarioData?.dropsites?.find(d => d.id === s.dsId)?.base.name || s.dsId)
        : (td ? td.name : '?');
      body = `<div class="am-line"><b>${s.w.name}</b> ▶ <b>${tName}</b> <span style="color:var(--text-mute);font-size:10px;">(Att ${s.w.att}, Lock ${s.w.lock}+, Dmg ${s.w.dmg}, ${s.w.type})</span></div>`;
    } else {
      const _tl = M.totalLocks ?? M.shots.length;
      body = `<div class="am-line">Firing <b>${aDef.name}</b> — ${_tl} weapon${_tl>1?'s':''} locked.</div>`;
    }
    introShots.forEach(s => {
      if (fromSelect) return; // header already rendered above for single-shot intro
      if (s.dsId) {
        const _bds = state.scenarioData && state.scenarioData.dropsites && state.scenarioData.dropsites.find(d => d.id === s.dsId);
        const _bdsName = _bds ? _bds.base.name : s.dsId;
        body += `<div class="am-shot">${s.w.name} <span style="color:var(--text-mute)">(${s.w.arc}, Att ${s.w.att}, Lock ${s.w.lock}, Dmg ${s.w.dmg})</span> ▶ <b>${_bdsName}</b> <span style="color:var(--hull-warn);font-size:9px;">Bombardment — city saves apply</span></div>`;
        return;
      }
      const td = getDef(s.targetGid);
      let scNote = '';
      if (!M.bomber && M.attackerGid) {
        const ash = state.groups[M.attackerGid].ships[M.attackerSi];
        const ts = state.groups[s.targetGid].ships[s.targetSi];
        if (ash && ts) {
          const eff = sceneryAttackEffects(ash.x, ash.y, ts.x, ts.y, ash, ts);
          const tags = [eff.ignoreSig ? 'ignore Sig+Spikes' : eff.ignoreSpikes ? 'ignore Spikes' : ''].filter(Boolean);
          if (tags.length) scNote = ` <span style="color:var(--hull-warn);font-size:9px;">⌖ ${tags.join(', ')} (scenery)</span>`;
        }
      }
      body += `<div class="am-shot">${s.w.name} <span style="color:var(--text-mute)">(${s.w.arc}, Att ${s.w.att}, Lock ${s.w.lock}, Dmg ${s.w.dmg}, ${s.w.type})</span> ▶ <b>${td.name}</b>${scNote}</div>`;
    });
    if (targetsWithShields.length) {
      body += `<div class="am-line" style="margin-top:8px;"><b>Shields:</b></div>`;

        // Shield Booster: show eligible Opal groups that can improve this target's shield save.
        const [_bGid, _bSi] = t.k.split('#');
        const boosters = findShieldBoosters(_bGid, parseInt(_bSi));
        boosters.forEach(b => {
          const shieldRaised = !!M.shieldsUp[t.k];
          const boosting = M.shieldBooster && M.shieldBooster[t.k] === b.gid;
          const bdis = (isDefender && shieldRaised) ? '' : ' disabled';
          const bop = (isDefender && shieldRaised) ? '' : ' style="opacity:0.45;"';
          body += `<label class="am-toggle" style="margin-left:14px;color:var(--shal)"${bop}><input type="checkbox" data-booster-toggle="${t.k}|${b.gid}" ${boosting?'checked':''}${bdis}/> Shield Booster (${b.name}) — save ${t.sv}+→${b.boostedSv}+S; +1 Spike to ${b.name}</label>`;
        });
      });
    }
    // Escort (§15.6): a friendly H/C target within 6" of a coherent Escort Group may
    // have non-Focused hits redirected to the Escort. Offer per eligible shot.
    if (!M.bomber) {
      introShotIndices.forEach(idx => {
        const s = M.shots[idx];
        const sp = parseWeaponSpecials(s.w);
        if (sp.focused) return; // Focused weapons can't be Escorted
        if (s.escortedTo) {
          body += `<div class="am-line" style="color:#7fd6a0;font-size:10px;">↪ ${s.w.name} redirected to Escort: ${getDef(s.escortedTo.gid).name}</div>`;
          return;
        }
        const esc = eligibleEscort(s.targetGid, s.targetSi);
        if (esc) {
          body += `<div class="am-line" style="margin-top:4px;"><button class="btn" data-escort="${idx}" style="font-size:10px;color:#7fd6a0;border-color:#7fd6a0;">🛡 Escort ${s.w.name} → ${esc.name}</button></div>`;
        }
      });
    }
    if (!M.bomber) {
      const ocWeapons = [];
      introShots.forEach(s => { const sp = parseWeaponSpecials(s.w); if (sp.overcharge && !ocWeapons.find(x=>x.wi===s.wi)) ocWeapons.push({ wi: s.wi, name: s.w.name }); });
      if (ocWeapons.length) {
        // Overcharge requires a spare weapon slot: ship must be firing fewer weapons
        // than its order allows. Also only the attacker may toggle it.
        const _ocGrp = state.groups[M.attackerGid];
        const _ocEo  = effectiveOrder(aDef, _ocGrp, M.attackerSi);
        const _ocLim  = fireLimit(_ocEo, aDef);
        const _ocUsed = lockedWeaponCost(aDef, aShip, _ocEo);
        const _ocAtMax = _ocUsed >= _ocLim;
        const _ocEnabled = isAttacker && !_ocAtMax;
        const ocDis = _ocEnabled ? '' : ' disabled';
        const ocOp  = _ocEnabled ? '' : ' style="opacity:0.5;"';
        const ocHint = !isAttacker ? ' (defender cannot toggle)' : _ocAtMax ? ' (all weapon slots in use)' : '';
        body += `<div class="am-line" style="margin-top:8px;"><b>Overcharge:</b></div>`;

        <button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="hit">Roll to Hit ▸</button>` : '';
    }

  else if (M.step === 'hit') {
    const s = M.shots[M.shotIdx];

      // Bombardment vs dropsite: no saves, show simplified hit step.

      const _bdsName = _bds ? _bds.base.name : s.dsId;

        <div class="am-dice">${diceHtml(`attack:bhit:${M.shotIdx}`, hr.dice.map(d => ({ text: d.r, cls: d.isHit?'hit':'miss' })))}</div>
        <div class="am-line"><b>${hr.hits}</b> hit${hr.hits!==1?'s':''}</div>`;
      footer = isAttacker ? `<button class="btn" data-am-cancel="1">Abort</button>
        <button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="save">${hr.hits>0?'Roll City Saves ▸':'No hits — Continue ▸'}</button>` : '';
    } else {
      const td = getDef(s.targetGid);
      const ts = state.groups[s.targetGid].ships[s.targetSi];
      const sp = parseWeaponSpecials(s.w);
      const effNote = [
        sp.mauler ? `Mauler (Lock=${hr.lock}+)` : '',
        sp.calibre && sp.calibre.toUpperCase().includes(td.tonnage) ? 'Calibre +1' : '',
        sp.scald ? `Scald-${sp.scald}` : '', sp.reave ? `Reave-${sp.reave}` : '',
        sp.burnthrough ? `Burnthrough-${sp.burnthrough}` : '', sp.penetrator ? 'Penetrator' : '',
        sp.critical ? `Critical-${sp.critical}` : ''
      ].filter(Boolean).join(' · ');
      body = `<div class="am-step-head">Shot ${M.shotIdx+1}/${M.shots.length} · Roll to Hit</div>
        <div class="am-line"><b>${s.w.name}</b>${s.volleyOf>1?` <span style="color:var(--hull-warn);font-size:9px;">Volley ${s.volleyIdx}/${s.volleyOf}</span>`:''} ▶ ${td.name} · ${hr.forceSix?'<span style="color:var(--hull-warn)">Atmosphere: hits 6+ only, no crit</span>':`Lock ${hr.lock}+ (${s.w.type})`}</div>
        ${effNote?`<div class="am-line" style="font-size:9px;color:var(--text-mute)">${effNote}</div>`:''}
        <div class="am-dice">${diceHtml(`attack:hit:${M.shotIdx}`, hr.dice.map(d => ({ text: d.r, cls: d.isCrit?'crit':d.isHit?'hit':'miss' })))}</div>
        <div class="am-line"><b>${hr.hits}</b> hit${hr.hits!==1?'s':''}${hr.crits?` · <span style="color:var(--hull-warn)">${hr.crits} critical</span>`:''}</div>`;
      if (isAttacker) {
        const atkSide = M.bomber ? M.bomberSide : (M.attackerGid ? getDef(M.attackerGid).side : null);
        const missCount = hr.dice.filter(d => !d.isHit).length;
        if (!hr.rerolled && atkSide && state.planning && state.planning.ap[atkSide] >= 1 && missCount > 0) {
          const maxRR = Math.min(missCount, state.planning.ap[atkSide]);
          const n = Math.min(M.rerollN || maxRR, maxRR);
          body += `<div class="am-line" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-size:10px;">Re-roll</span>
            <button class="btn" data-rr-adj="-1" style="font-size:11px;padding:1px 7px;">−</button>
            <b style="font-size:11px;">${n}</b>
            <button class="btn" data-rr-adj="1" style="font-size:11px;padding:1px 7px;">+</button>
            <span style="font-size:9px;color:var(--text-mute);">of ${missCount} miss${missCount>1?'es':''} · max ${maxRR} AP</span>
            <button class="btn" data-am-reroll="hit" style="font-size:10px;">↻ Re-roll ${n} (${n} AP)</button>
          </div>`;
        }
      }
      footer = isAttacker ? `<button class="btn" data-am-cancel="1">Abort</button>
        <button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="save">${hr.hits>0?'Roll Saves ▸':'No hits — Continue ▸'}</button>` : '';
    }
  }

  else if (M.step === 'save') {
    const s = M.shots[M.shotIdx];
    const sr = M.saveResult;
    // Bombardment vs dropsite: show simplified save step.
    if (s.dsId) {
      const _bds = state.scenarioData && state.scenarioData.dropsites && state.scenarioData.dropsites.find(d => d.id === s.dsId);
      const _bdsName = _bds ? _bds.base.name : s.dsId;
      const _svStr = sr.hitsList.length > 0 && sr.hitsList[0].sv != null ? `${sr.hitsList[0].sv}+` : '—';
      const _svType = s.w.type === 'K' ? 'KS' : s.w.type === 'E' ? 'ES' : 'Save';
      body = `<div class="am-step-head">Shot ${M.shotIdx+1}/${M.shots.length} · Bombardment Saves</div>
        <div class="am-line"><b>${_bdsName}</b> — ${sr.hitsList.length} hit${sr.hitsList.length!==1?'s':''} · ${_svType} ${_svStr}</div>
        ${sr.primDice.length ? `<div class="am-line" style="font-size:9px;color:var(--text-mute)">City saves (${_svStr} each):</div>
          <div class="am-dice">${diceHtml(`attack:bsave:${M.shotIdx}`, sr.primDice.map(d=>({ text: d.r, cls: d.ok?'hit':'miss', title: `vs ${d.sv}+` })))}</div>` : `<div class="am-line" style="font-size:9px;color:var(--text-mute)">No saves (${_svType} —)</div>`}
        ${sr.bsDice && sr.bsDice.length ? `<div class="am-line" style="font-size:9px;color:rgba(255,220,80,0.85)">Station BS (${sr.bsVal}+ while city has Power Plant):</div>
          <div class="am-dice">${diceHtml(`attack:bbs:${M.shotIdx}`, sr.bsDice.map(d=>({ text: d.r, cls: d.ok?'hit':'miss' })))}</div>` : ''}
        <div class="am-line"><b>${sr.unsaved}</b> unsaved → <b style="color:var(--hull-crit)">${sr.dmg} hull damage</b> · 1 battalion per hull point (collateral)</div>`;
      footer = isAttacker ? `<button class="btn" data-am-cancel="1">Abort</button>
        <button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="apply">Apply Bombardment Damage ▸</button>` : '';
    } else {
    const td = getDef(s.targetGid);
    const ts = state.groups[s.targetGid].ships[s.targetSi];
    const sp = parseWeaponSpecials(s.w);
    const typeLabel = (t) => t === 'E' ? 'ES' : t === 'K' ? 'KS' : 'Shield/Core';
    const primFailedNow = sr.hitsList.filter(h => !h.saved && h.sv != null && !h.noSaveDie).length;
    // Damage type, base save, and modified save info for the header/label.
    const _wtype = s.w.type;
    const _tKey = targetKey(s.targetGid, s.targetSi);
    const _shieldUp = M.shieldsUp && !!M.shieldsUp[_tKey];
    const _saveTypeHdr = _shieldUp ? 'Shield Saves' : (_wtype === 'E' ? 'E Saves' : _wtype === 'K' ? 'K Saves' : 'Core Saves');
    const _baseSvStr = _wtype === 'E' ? td.es : _wtype === 'K' ? td.ks : null;
    const _baseSv = (_baseSvStr && _baseSvStr !== '—') ? parseInt(_baseSvStr) : null;
    const _firstWithSv = sr.hitsList.find(h => h.sv != null);
    const _modSv = _firstWithSv ? _firstWithSv.sv : null;
    const _savesVary = sr.hitsList.some(h => h.sv != null && h.sv !== _modSv);
    const _mods = [sp.scald ? `Scald-${sp.scald}` : '', sp.reave ? `Reave-${sp.reave}` : '',
      sp.burnthrough && M.hitResult && M.hitResult.crits > 0 ? `Burnthrough-${sp.burnthrough}` : ''].filter(Boolean);
    let _saveInfo = '';
    if (_shieldUp) {
      const _rawShieldSv = shieldSaveVal(td);
      _saveInfo = `Shield ${_rawShieldSv}+`;
      if (_modSv != null && _rawShieldSv != null && _modSv !== _rawShieldSv) {
        _saveInfo += ` → ${_modSv}+ (Boosted)`;
      }
    } else if (_baseSv != null) {
      const _lbl = _wtype === 'E' ? 'ES' : 'KS';
      _saveInfo = `${_lbl} ${_baseSvStr}`;
      if (_modSv != null && _modSv !== _baseSv) {
        _saveInfo += ` → ${_savesVary ? 'varies' : _modSv + '+'}`;
        if (_mods.length) _saveInfo += ` (${_mods.join(', ')})`;
      }
    }
    const _primSavesLabel = _saveInfo ? `Primary saves · ${_saveInfo}` : `Primary saves (vs each hit's modified save)`;
    // Pool primDice by save target. Critical-X weapons split crits into their own
    // labelled group (same sv but different damage) so normal and crit saves are
    // visually distinct. Reave/Penetrator already produce different sv values so
    // they separate naturally without this flag.
    const _hasCritSplit = sp.critical > 0;
    const _poolByKey = {}, _poolArr = [];
    sr.primDice.forEach(d => {
      const k = _hasCritSplit ? `${d.sv}:${d.crit?1:0}` : String(d.sv);
      if (!_poolByKey[k]) { _poolByKey[k] = { sv: d.sv, dice: [], crits: 0 }; _poolArr.push(_poolByKey[k]); }
      _poolByKey[k].dice.push(d);
      if (d.crit) _poolByKey[k].crits++;
    });
    // Normal saves before crit saves.
    if (_hasCritSplit) _poolArr.sort((a, b) => (a.crits === a.dice.length ? 1 : 0) - (b.crits === b.dice.length ? 1 : 0));
    const _multiPools = _poolArr.length > 1;
    const _primDiceHtml = _poolArr.map(p => {
      const allCrit = p.crits === p.dice.length;
      const critDmgNote = allCrit && sp.critical > 0 ? ` · +${sp.critical} dmg each` : '';
      const plbl = _multiPools
        ? `<div class="am-line" style="font-size:9px;color:var(--text-mute)">${allCrit ? 'Crit saves' : 'Normal saves'} vs ${p.sv}+${critDmgNote}:</div>`
        : (_hasCritSplit && p.crits > 0
            ? `<div class="am-line" style="font-size:9px;color:var(--text-mute)">${allCrit ? 'Crit saves' : 'Saves'} vs ${p.sv}+${critDmgNote}:</div>`
            : '');
      return plbl + `<div class="am-dice">${diceHtml(`attack:save:${M.shotIdx}:${p.sv}:${allCrit?'c':'n'}`, p.dice.map(d => ({ text: d.r, cls: d.ok?'hit':'miss', title: `vs ${d.sv}+${d.crit?' (crit)':''}` })))}</div>`;
    }).join('');
    body = `<div class="am-step-head">Shot ${M.shotIdx+1}/${M.shots.length} · ${sr.backupRolled ? 'Saves' : _saveTypeHdr}</div>
      <div class="am-line">${td.name} — ${sr.hitsList.length} hit${sr.hitsList.length!==1?'s':''}${sr.penetrator?' (criticals → Core)':''}</div>
      ${sr.primDice.length?`<div class="am-line" style="font-size:9px;color:var(--text-mute)">${_primSavesLabel}:</div>
        ${_primDiceHtml}`:''}
      ${sr.backupRolled && sr.backDice.length?`<div class="am-line" style="font-size:9px;color:var(--text-mute)">Backup saves (${td.bs}):</div>
        <div class="am-dice">${diceHtml(`attack:back:${M.shotIdx}`, sr.backDice.map(d=>({ text: d.r, cls: d.ok?'hit':'miss' })))}</div>`:''}
      ${sr.backupRolled && sr.aegisDice && sr.aegisDice.length?`<div class="am-line" style="font-size:9px;color:#4ad6ff">Aegis-${sr.aegisY} save dice:</div>
        <div class="am-dice">${diceHtml(`attack:aegis:${M.shotIdx}`, sr.aegisDice.map(d=>({ text: d.r, cls: d.ok?'hit':'miss' })))}</div>`:''}
      ${sr.backupRolled
        ? `<div class="am-line"><b>${sr.unsaved}</b> unsaved → <b style="color:var(--hull-crit)">${sr.dmg} damage</b>${sr.flash?` · <span style="color:var(--hull-warn)">Flash-${sr.flash} (${sr.dmg>0?'+'+sr.flash+' spike':'no dmg'})</span>`:''}${sr.crippling&&sr.critDamaged?` · <span style="color:var(--hull-warn)">Crippling!</span>`:''}</div>`
        : `<div class="am-line" style="color:var(--text-mute);font-size:10px;"><b>${primFailedNow}</b> hit${primFailedNow!==1?'s':''} unsaved so far${sr.backupVal != null ? ` — Backup (${td.bs}) still to roll` : (sr.isBomberAtk || sr.isCloseAction) ? ' — Aegis still to roll' : ''}</div>`}`;
    if (!sr.backupRolled) {
      const failed = sr.primDice.filter(d => !d.ok).length;
      if (isDefender && !sr.rerolled && !sr.fighterRerolled && td.side && state.planning && state.planning.ap[td.side] >= 1 && failed > 0) {
        const maxRR = Math.min(failed, state.planning.ap[td.side]);
        const n = Math.min(M.rerollN || maxRR, maxRR);
        body += `<div class="am-line" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-size:10px;">Re-roll</span>
          <button class="btn" data-rr-adj="-1" style="font-size:11px;padding:1px 7px;">−</button>
          <b style="font-size:11px;">${n}</b>
          <button class="btn" data-rr-adj="1" style="font-size:11px;padding:1px 7px;">+</button>
          <span style="font-size:9px;color:var(--text-mute);">of ${failed} failed · max ${maxRR} AP</span>
          <button class="btn" data-am-reroll="save" style="font-size:10px;">↻ Re-roll ${n} (${n} AP)</button>
        </div>`;
      }
      // ── CLOSE PROTECTION (Fighters) ──
      // Vs Close Action / Bomber / Fire-Ship attacks, the defender may re-roll failed
      // PRIMARY saves using friendly Fighters within Fighter Thrust range (before Backup).
      if (isDefender) {
        const isBomberAtk = M.bomber && (M.bomberKind === 'bomber' || M.bomberKind === 'fireship');
        const isCloseAction = parseWeaponSpecials(s.w).closeAction || /Close Action/i.test(s.w.special || '');
        if ((isBomberAtk || isCloseAction) && failed > 0 && td.side && !sr.fighterRerolled && !sr.rerolled) {
          const wings = friendlyFightersInRange(td.side, ts.x, ts.y);
          const avail = wings.reduce((a, w) => a + w.count, 0);
          if (avail > 0) {
            M.fighterSpend = M.fighterSpend || {};
            const spendTotal = wings.reduce((a, w) => a + (M.fighterSpend[w.id] || 0), 0);
            const cap = Math.min(failed, avail);
            body += `<div class="am-line" style="border-top:1px dashed var(--border);margin-top:6px;padding-top:6px;">
              <div style="font-size:10px;color:#7fd6a0;margin-bottom:3px;">🛡 Close Protection — re-roll failed saves with Fighters (1 fighter each, max ${cap}):</div>`;
            wings.forEach((w, i) => {
              const cur = M.fighterSpend[w.id] || 0;
              body += `<div style="display:flex;align-items:center;gap:6px;font-size:10px;margin:2px 0;">
                <span style="flex:1;">Fighter Wing ${i + 1} <span style="color:var(--text-mute)">(${w.count} craft)</span></span>
                <button class="btn" data-fp-adj="${w.id}|-1" style="font-size:11px;padding:1px 7px;">−</button>
                <b>${cur}</b>
                <button class="btn" data-fp-adj="${w.id}|1" style="font-size:11px;padding:1px 7px;">+</button>
              </div>`;
            });
            body += `<button class="btn" data-am-fighter-reroll="1" style="font-size:10px;margin-top:3px;color:#7fd6a0;border-color:#7fd6a0;" ${spendTotal>0?'':'disabled'}>↻ Re-roll ${spendTotal} save${spendTotal!==1?'s':''} (spend ${spendTotal} fighter${spendTotal!==1?'s':''})</button>
            </div>`;
          }
        }
      }
    }
    // Footer: backup saves and Apply Damage are on the DEFENDER's modal — they've rolled
    // (and optionally re-rolled) saves and choose when to apply the result.
    const needBackup = !sr.backupRolled && sr.hitsList.some(h => !h.saved && h.sv != null) &&
      (sr.backupVal != null || ((sr.isBomberAtk || sr.isCloseAction) && !M.aegisUsed && aegisValueForGroup(sr.targetGid) > 0));
    if (isDefender) {
      footer = needBackup
        ? `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="rollbackup">Roll Backup Saves ▸</button>`
        : `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="apply">Apply Damage ▸</button>`;
    }
    } // end else (non-bombardment save step)
  }

  else if (M.step === 'crippling') {
    const c = M.crippleQueue[0];
    const defSide = getDef(c.gid) ? getDef(c.gid).side : null;
    const canBrace = defSide && state.planning && state.planning.ap[defSide] >= 2 && !c.braced;
    if (!c.rolled) {
      // PRE-ROLL: declare Brace for Impact (set result to 4) BEFORE rolling.
      body = `<div class="am-step-head">Crippling Effect</div>
        <div class="am-line"><b>${c.name}</b> dropped below half Hull.</div>
        <div class="am-line" style="font-size:10px;color:var(--text-dim)">Declare Admiral abilities, then roll 2D6 for the effect.</div>
        ${canBrace?`<div class="am-line" style="margin-top:6px;"><button class="btn" data-am-brace="1" style="font-size:10px;">⚙ Brace for Impact (2 AP → set result to 4, no roll)</button></div>`
          : c.braced?`<div class="am-line" style="color:var(--hull-warn)">Bracing for Impact — result will be 4.</div>`:''}`;
      footer = `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="crippling-roll">${c.braced?'Apply (4) ▸':'Roll 2D6 ▸'}</button>`;
    } else {
      body = `<div class="am-step-head">Crippling Effect</div>
        <div class="am-line"><b>${c.name}</b> dropped below half Hull${c.braced?' · <span style="color:var(--hull-warn)">Braced</span>':''}:</div>
        <div class="am-dice">${c.d1!=null?`${diceHtml(`attack:cripple:${c.gid}:${c.si}`, [{ text: c.d1 }, { text: c.d2 }])} = `:''}<b>${c.total}</b></div>
        <div class="am-line" style="color:var(--hull-warn)"><b>${c.effectName}</b></div>
        <div class="am-line" style="font-size:10px;color:var(--text-dim)">${c.effectDesc}</div>`;
      footer = `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="crippling-next">Apply ▸</button>`;
    }
  }

  else if (M.step === 'explosion') {
    const ex = M.explodeQueue[0];
    const defSide = getDef(ex.gid) ? getDef(ex.gid).side : null;
    const canContain = defSide && state.planning && state.planning.ap[defSide] >= 2 && !ex.contained;
    if (!ex.rolled) {
      // PRE-ROLL: declare Contain Reactor (set result to 2) BEFORE rolling.
      body = `<div class="am-step-head">Explosion!</div>
        <div class="am-line"><b>${ex.name}</b> destroyed — explosion imminent (range ${ex.rangeIn}").</div>
        <div class="am-line" style="font-size:10px;color:var(--text-dim)">Declare Admiral abilities, then roll 1D6${ex.mod?` (+${ex.mod} tonnage)`:''}. The radius is shown on the map.</div>
        ${canContain?`<div class="am-line" style="margin-top:6px;"><button class="btn" data-am-contain="1" style="font-size:10px;">⚙ Contain Reactor (2 AP → set result to 2, no roll)</button></div>`
          : ex.contained?`<div class="am-line" style="color:var(--hull-crit)">Containing Reactor — result will be 2.</div>`:''}`;
      footer = `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="explosion-roll">${ex.contained?'Resolve (2) ▸':'Roll 1D6 ▸'}</button>`;
    } else {
      body = `<div class="am-step-head">Explosion!</div>
        <div class="am-line"><b>${ex.name}</b> destroyed${ex.contained?' · <span style="color:var(--hull-crit)">Contained</span>':''}:</div>
        <div class="am-dice">${ex.d1!=null?diceHtml(`attack:explode:${ex.gid}:${ex.si}`, [{ text: ex.d1 }]):''}${ex.mod?` + ${ex.mod} = <b>${ex.total}</b>`:''}</div>
        <div class="am-line" style="color:var(--hull-crit)"><b>${ex.effectName}</b> (range ${ex.rangeIn}"${ex.effKind==='spike2x'?' ×2':''})</div>
        <div class="am-line" style="font-size:10px;color:var(--text-dim)">${ex.effectDesc}</div>
        <div class="am-line" style="font-size:9px;color:var(--text-mute)">Applied to ships${ex.effAssets?' & assets':''} in range on the ${ex.layer} layer.</div>`;
      footer = `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-next="explosion-next">Resolve ▸</button>`;
    }
  }

  else if (M.step === 'impel') {
    const q = M.impelQueue[0];
    const tdef = getDef(q.gid);
    body = `<div class="am-step-head">Impel-${q.x}</div>
      <div class="am-line"><b>${tdef.name}</b> was struck by ${q.big?`≥${q.x*2}`:`≥${q.x}`} criticals. Attacker chooses:</div>
      <div class="am-line" style="margin-top:6px;">
        <button class="btn" data-impel="turn" style="font-size:10px;margin-right:6px;">↻ Turn ${q.big?'90°':'45°'}</button>
        <button class="btn" data-impel="move" style="font-size:10px;">→ Move forward up to ${q.x*2}"</button>
      </div>
      <div class="am-line" style="font-size:9px;color:var(--text-mute)">Turn rotates all ships in place; Move shifts them straight forward (auto, clamped to the table).</div>`;
    footer = '';
  }

  else if (M.step === 'bombardCollateral') {
    const q = M.bombardCollateralQueue[0];
    const _bds = state.scenarioData && state.scenarioData.dropsites && state.scenarioData.dropsites.find(d => d.id === q.dsId);
    const b = _bds ? dsBattalions(_bds) : {};
    // Features first (feat0, feat1, …), then ground.
    const locOrder = Object.keys(b).filter(k => k !== 'ground').concat(b.ground ? ['ground'] : []);
    const isActing = !_netSide || _netSide === q.side;
    const pName = q.side === 'player1' ? 'Player 1' : 'Player 2';
    // Locations where the affected player has at least one battalion
    const eligibleLocs = locOrder.filter(k => (b[k] && b[k][q.side]) > 0);
    // Auto-pick: if only one location has battalions, remove from it immediately — no picker needed
    if (isActing && eligibleLocs.length === 1) {
      setTimeout(() => dispatch({ type: 'resolveBombardCollateral', dsId: q.dsId, loc: eligibleLocs[0] }), 0);
      body = `<div class="am-step-head">Collateral Damage — ${q.dsName}</div>
        <div class="am-line" style="color:var(--text-mute);">Removing battalion from ${_bds ? locDisplayName(_bds, eligibleLocs[0]) : eligibleLocs[0]}…</div>`;
      footer = '';
    } else {
      const locBtns = eligibleLocs.map(k => {
        const cnt = (b[k] && b[k][q.side]) || 0;
        const lname = _bds ? locDisplayName(_bds, k) : k;
        return `<button class="btn" data-bombard-collateral="${k}" style="font-size:10px;margin:2px;">${lname} <span style="color:var(--hull-warn)">(${cnt})</span></button>`;
      }).join('');
      body = `<div class="am-step-head">Collateral Damage — ${q.dsName}</div>
        <div class="am-line">Hull point ${q.hullPoint} of ${q.hullTotal} · <b>${pName}</b> must remove 1 battalion</div>
        ${isActing
          ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">${locBtns || '<span style="color:var(--text-mute);font-size:10px;">No battalions present</span>'}</div>`
          : `<div class="am-line" style="color:var(--text-mute);margin-top:8px;">Waiting for ${pName} to choose…</div>`}`;
      footer = '';
    }
  }

  else if (M.step === 'done') {
    body = `<div class="am-step-head">Attack Resolved</div>
      ${M.log.map(l => `<div class="am-line" style="font-size:10px;">${l}</div>`).join('')}`;
    footer = isAttacker ? `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-am-close="1">Done</button>` : '';
  }

  overlay = document.createElement('div');
  overlay.id = 'attack-overlay';
  overlay.className = 'attack-hud';
  overlay.innerHTML = `<div class="attack-hud-title">⚔ ATTACK</div>
    <div class="attack-hud-body">${body}</div>
    ${footer ? `<div class="attack-hud-footer">${footer}</div>` : ''}`;
  (document.querySelector('.board-wrap') || document.body).appendChild(overlay);
  initPanel(overlay, 'ATTACK', 'attack-overlay', 8, 8);

  overlay.querySelectorAll('[data-shield-toggle]').forEach(cb => {
    cb.addEventListener('change', () => dispatch({ type: 'attackDeclare', what: 'shield', key: cb.dataset.shieldToggle, value: cb.checked }));
  });
  overlay.querySelectorAll('[data-booster-toggle]').forEach(cb => {
    const [key, boosterGid] = cb.dataset.boosterToggle.split('|');
    cb.addEventListener('change', () => dispatch({ type: 'attackDeclare', what: 'shieldBooster', key, boosterGid, value: cb.checked }));
  });
  overlay.querySelectorAll('[data-overcharge]').forEach(cb => {
    cb.addEventListener('change', () => dispatch({ type: 'attackDeclare', what: 'overcharge', wi: cb.dataset.overcharge, value: cb.checked }));
  });
  overlay.querySelectorAll('[data-escort]').forEach(btn => {

   state.atmoDamage); this only displays them and offers the confirm button that

function renderAtmoModal() {
  let overlay = document.getElementById('atmo-overlay');

  const ad = state.atmoDamage;

  const rows = ad.ships.map(sh => {
    const srcHtml = sh.sources.map((src, ci) => {

      const dice = src.dice.map(d => ({

        <div class="am-dice">${diceHtml(`atmo:${ad.gid}:${sh.si}:${ci}`, dice)}</div>`;

    return `<div class="am-line" style="margin-top:8px;"><b>${sh.name}</b></div>
      ${srcHtml}

  const body = `<div class="am-step-head">End of Activation</div>
    <div class="am-line" style="font-size:10px;color:var(--text-mute)">Hazard damage for ending the activation in the atmosphere (D3, 2D3 Colossal), under orbital decay, or in an expansive atmosphere.</div>
    ${rows}`;
  const footer = isOwner
    ? `<button class="btn-primary ${sideClass==='shal'?'shal':''}" data-atmo-confirm="1">Confirm ▸</button>`
    : `<div class="am-line" style="color:var(--text-mute)">Waiting for ${playerNameForSide(ad.side)}…</div>`;

  overlay = document.createElement('div');
  overlay.id = 'atmo-overlay';
  overlay.className = 'attack-hud';
  overlay.innerHTML = `<div class="attack-hud-title">⌁ END OF ACTIVATION</div>
    <div class="attack-hud-body">${body}</div>
    <div class="attack-hud-footer">${footer}</div>`;
  (document.querySelector('.board-wrap') || document.body).appendChild(overlay);
  initPanel(overlay, 'END OF ACTIVATION', 'atmo-overlay', 8, 8);

  const confirmBtn = overlay.querySelector('[data-atmo-confirm]');
  if (confirmBtn) confirmBtn.addEventListener('click', () => dispatch({ type: 'confirmEndActivation' }));
}

   server rolls the dice with the room's seeded rng); hotseat applies locally. */
function advanceAttack(to) { if (state.attackModal) dispatch({ type: 'attackStep', to }); }
function nextShotOrResolve() { _nextShotOrResolve(state, rng, state.attackModal); }

const CRIPPLE_LABEL = { energy:'Energy Surge', structural:'Struct.', fire:'Fire', defence:'Def. Offline', scanners:'Scan Offline', weapons:'Wpn Offline', navigation:'Nav Offline', decay:'Orbital Decay' };
// Crippling/explosion resolvers now live in src/engine/mutators.js (shared with
// the server). makeCrippleRoll / makeExplosionRoll are imported directly; the
// rng-driven rolls are shimmed to inject the active rng.
function rollCrippleEffect(c, forced) { return _rollCrippleEffect(rng, c, forced); }
function applyCrippling() { _applyCripplingNext(state, state.attackModal); renderAll(); }
function rollExplosionEffect(ex, forced) { return _rollExplosionEffect(rng, ex, forced); }
function applyExplosion() { _applyExplosionNext(state, rng, state.attackModal); renderAll(); }

function applyExplosionEffect(ex, M) { return _applyExplosionEffect(state, rng, ex, M); }
/* Roll Backup saves (and Aegis save dice) on hits still unsaved AFTER primary ES/KS
   saves and any re-rolls have been applied. Mutates sr in place and recomputes damage.
   Called when the player advances past the primary-save sub-step. */
function rollDeferredBackupSaves(M) { _rollDeferredBackupSaves(state, rng, M); }

/* Commit a resolved attack. Group fire goes through the server-authoritative
   intent; a bomber attack commits via the engine then runs the asset-phase
   continuation (re-opening the next pooled attack / advancing the stage) here,
   since that orchestration re-opens client modals. */
function finishAttack() {
  const M = state.attackModal;
  if (!M) return;

/* ── END-PHASE REPAIR ──
   Repairable crippling effects (Energy Surge & Structural Damage are one-shot,
   not repairable). Orbital Decay needs 6+; others 4+. DC order = 2D6 per effect. */
const REPAIRABLE = ['fire', 'defence', 'scanners', 'weapons', 'navigation', 'decay'];

/* Are there any Fire tokens or repairable crippling effects on the table? */
function anyRepairWork() {
  return Object.keys(state.groups).some(gid =>
    state.groups[gid].ships.some(s =>
      !s.destroyed && !s.offTable &&
      ((s.fireTokens > 0) || (s.crippling && s.crippling.some(c => REPAIRABLE.includes(c))))
    )
  );
}

/* Begin the End-Phase repair: first apply Fire damage, then build repair rolls. */
function openRepairPhase() {
  // Step 1: Fire tokens deal 1 damage each, before repair. Track destructions.
  const fireLog = [];
  const explosions = [];
  Object.keys(state.groups).forEach(gid => {
    const def = getDef(gid);
    state.groups[gid].ships.forEach((s, si) => {
      if (s.destroyed || s.offTable || !s.fireTokens) return;
      const dmg = s.fireTokens;
      s.hull = Math.max(0, s.hull - dmg);
      fireLog.push(`${def.name} takes ${dmg} Fire damage (${s.hull}/${s.maxHull})`);
      if (s.hull <= 0) {
        s.destroyed = true;
        if (isCapital(def)) explosions.push(makeExplosionRoll(gid, si, def, s));
      }
    });
  });
  // Resolve any Fire-death explosions' area effects (chained explosions included).
  while (explosions.length) {
    const ex = explosions.shift();
    fireLog.push(`${ex.name} exploded: ${ex.effectName}`);
    applyExplosionEffect(ex, { explodeQueue: explosions });
  }
  // Step 2: build repair targets — ships with repairable crippling effects.
  const targets = [];
  Object.keys(state.groups).forEach(gid => {
    const def = getDef(gid);
    state.groups[gid].ships.forEach((s, si) => {
      if (s.destroyed || s.offTable || !s.crippling) return;
      const eff = s.crippling.filter(c => REPAIRABLE.includes(c));
      if (eff.length) targets.push({ gid, si, name: def.name, effects: eff.slice(), dc: !!s.dcThisRound, rolled: null });
    });
  });
  state.repairPhase = { step: fireLog.length ? 'fire' : 'repair', fireLog, explosions: [], targets, idx: 0, log: [] };
  renderAll();
}
