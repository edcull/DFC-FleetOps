      dropsiteActivation:state.dropsiteActivation?.dsId || null,
    };
    console.warn('%c[relay:legacy] play', 'background:#4a0000;color:#ff8888;font-weight:bold;padding:2px 6px;border-radius:3px;', _ctx);
    console.trace('[relay:legacy] call stack ↑');
  } else {
    console.log('%c[relay:legacy]', 'color:#ff4444;font-weight:bold', state.phase);
  }
  // ─────────────────────────────────────────────────────────────────────────────

  try { _netWs.send(JSON.stringify({ type: 'state', state: stateToSend })); }
  catch(e) { console.error('[relay] send failed:', e); }
}

function _netApplyRemote(remoteState) {
  _netPendingIntent = false; // server responded — intent cycle complete
  _pendingDeploy = null;     // any local pending placement is superseded by the authoritative state
  _netReceiving = true;
  // Preserve local view state so each client can browse independently.
  const localView = {
    selectedGroupId:   state.selectedGroupId,
    selectedShipIdx:   state.selectedShipIdx,
    selectedDropsiteId: state.selectedDropsiteId,
    layerToggle:       state.layerToggle,
    hoverPoint:        state.hoverPoint,
    pendingGroundLaunch: state.pendingGroundLaunch, // local-only, never in server state
    targeting:         state.targeting,             // local-only weapon targeting cursor
    antiWing:          state.antiWing,              // local-only anti-wing targeting cursor
    detector:          state.detector,              // local-only detector targeting cursor
    extracting:        state.extracting,            // local-only extract targeting cursor
    featureAttack:     state.featureAttack,          // local-only dropsite weapon targeting
    peerView:          state.peerView,               // preserve opponent's view state through intent broadcasts
    // Preserve fromDropsite launches — committed via intent, must survive relay responses.
    // But drop gate_dropship launching if the Mothership group has since been activated.
    launching:         (() => {
      const l = state.launching;
      if (!l) return remoteState.launching || null;
      if (l.fromDropsite) return l;
      if (l.type === 'gate_dropship') {
        const launchGrp = remoteState.groups && l.gid && remoteState.groups[l.gid];
        if (launchGrp && launchGrp.activated) return null; // group finished — clear
        return l;
      }
      return remoteState.launching || null;
    })(),
    // Preserve the locally-selected dsId inside dropsiteActivation — it's UI-only
    _daDsId:           state.dropsiteActivation && state.dropsiteActivation.dsId,
    _daDaSide:         state.dropsiteActivation && state.dropsiteActivation.side,
  };
  // Replace the contents of the shared state object in-place so all existing
  // references (imports, closures) still point to the same object.
  Object.keys(state).forEach(k => { if (!(k in remoteState)) delete state[k]; });
  Object.assign(state, remoteState, localView);
  // Restore the locally-selected dsId only if it hasn't been finished (added to done[])
  if (state.dropsiteActivation && localView._daDsId
      && !(state.dropsiteActivation.done || []).includes(localView._daDsId)
      && state.dropsiteActivation.side === localView._daDaSide) {
    state.dropsiteActivation.dsId = localView._daDsId;
  }
  delete localView._daDsId; delete localView._daDaSide;
  // Keep _netReceiving true through the renderAll() so netAfterRender() does
  // not echo the received state back to the server (which would cause a loop).
  // try/catch ensures _netReceiving is always reset — if renderAll() throws,
  // a stuck _netReceiving=true would permanently silence all future sends.
  try { renderAll(); } catch(e) { console.error('[net] renderAll error during remote apply:', e); }
  autoAdvanceShipSelection(state.selectedGroupId);
  _netReceiving = false;
  if (_isSpectator) _maybeHideSpectatorLoading();
}

function _netUpdateBadge() {
  const dot = _netConnected ? '#4ad66d' : '#ff5252';

// ── Spectator loading overlay ─────────────────────────────────────────────────
// Shown while connecting to a spectated game so the user doesn't stare at an empty
// board. For AI-vs-AI we keep it up until the battle actually starts (the server
// computes the whole game), then reveal the live spectator view.
let _specLoadingEl = null;
let _specLoadingTimer = null;
function _showSpectatorLoading(isAi) {
  if (_specLoadingEl) return;
  const el = document.createElement('div');
  el.id = 'spec-loading';
  el.innerHTML = `
    <div class="sl-spinner"></div>

      : 'Connecting to the game…'}</div>

  _specLoadingTimer = setTimeout(_hideSpectatorLoading, 45000);
}
function _hideSpectatorLoading() {
  if (_specLoadingTimer) { clearTimeout(_specLoadingTimer); _specLoadingTimer = null; }
  if (_specLoadingEl) { _specLoadingEl.remove(); _specLoadingEl = null; }
}
// Hide once the spectated game is actually underway. AI-vs-AI: wait for the play phase
// (or game over) so we skip the instant setup/deploy flicker; other games: as soon as
// we have any live state.
function _maybeHideSpectatorLoading() {
  if (!_specLoadingEl) return;
  const PREGAME = ['setup', 'scenery', 'nominations', 'protect', 'deploy'];
  const live = state.aiVsAi
    ? (!PREGAME.includes(state.phase) || !!state.gameOver)   // AI-vs-AI: wait for the battle
    : (state.phase && state.phase !== 'setup');              // others: any live game state
  if (live) _hideSpectatorLoading();
}

function _netConnect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url   = `${proto}//${location.host}/ws?room=${_netRoom}&side=${_netSide}`;
  _netWs = new WebSocket(url);

  _netWs.onopen = () => {
    _netConnected = true;
    _netUpdateBadge();
    console.log(`[net] Connected to room ${_netRoom} as ${_netSide}`);
  };

  _netWs.onclose = () => {
    _netConnected = false;
    _netPendingIntent = false;
    _aiThinking = false;
    _netWs = null;
    _netUpdateBadge();
    console.log('[net] Disconnected — reconnecting in 2 s…');
    setTimeout(_netConnect, 2000);
  };

  _netWs.onerror = err => console.error('[net] WebSocket error', err);

  _netWs.onmessage = ({ data }) => {
    let msg;
    try { msg = JSON.parse(data); } catch { return; }

    switch (msg.type) {
      case 'joined': {
        // Server sends the current authoritative state on connect.
        _netApplyRemote(msg.state);
        // Pre-fill our player name from the logged-in account if it's still the default.
        if (currentUser?.username && _netSide && !_isSpectator && state.phase === 'setup') {
          const slot = _netSide === 'player1' ? 'f1' : 'f2';
          const defaultName = _netSide === 'player1' ? 'Player 1' : 'Player 2';
          if (!state.playerNames) state.playerNames = { f1: 'Player 1', f2: 'Player 2' };
          if (state.playerNames[slot] === defaultName) {
            state.playerNames[slot] = currentUser.username;
            netRelaySetup();
          }
        }
        break;
      }
      case 'full':
        // Broadcast from the server after the other player acted.
        _endRoundVotes = new Set();
        _advanceRoundVotes = new Set();
        _assetPhaseVotes = new Set(); _assetPhaseVoteType = null;
        _pendingAssetTarget = null;
        _netApplyRemote(msg.state);
        break;
      case 'peerJoined': {
        const peerName = playerNameForSide(msg.side);
        logEvent(`${peerName} connected`);
        renderAll();
        break;
      }
      case 'opponentLeft':
        logEvent(`Opponent disconnected`);
        renderAll();
        break;
      case 'peerView':
        // Lightweight selection update from the other player — update our view of
        // their selection and re-render the board overlays (no full state change).
        state.peerView = msg.peerView;
        renderAll(true);
        break;
      case 'endRoundVotes':
        _endRoundVotes = new Set(msg.votes || []);
        renderAll(true);
        break;
      case 'advanceRoundVotes':
        _advanceRoundVotes = new Set(msg.votes || []);
        renderAll(true);
        break;
      case 'assetPhaseVotes':
        _assetPhaseVotes = new Set(msg.votes || []);
        _assetPhaseVoteType = msg.voteType || null;
        renderAll(true);
        break;
      case 'chatHistory': {
        _chatMessages = msg.messages;
        renderEventLog();
        if (_activeLogTab === 'chat') _scrollChatToBottom();
        break;
      }
      case 'chat': {
        _chatMessages.push(msg);
        if (_activeLogTab !== 'chat') _chatUnread++;
        renderEventLog();
        if (_activeLogTab === 'chat') _scrollChatToBottom();
        break;
      }
      case 'spectators':
        _spectators = msg.list || [];
        renderSpectatorChip();
        break;
      case 'aiThinking':
        _aiThinking = !!msg.thinking;
        renderEventLog();
        break;
      case 'error':
        console.warn('[net] Server:', msg.reason);
        break;
    }
  };
}

// Send the local selection to the opponent so they see movement cones / overlays.
function netSendPeerView() {
  if (!_netWs || !_netConnected || !_netSide || _isSpectator) return;
  _netWs.send(JSON.stringify({
    type: 'peerView',
    peerView: { gid: state.selectedGroupId, si: state.selectedShipIdx, layerToggle: state.layerToggle },
  }));
}

// ---------------------------------------------------------------------------
// Side gating helpers (used by event handlers to block opponent's actions)
// ---------------------------------------------------------------------------

// True when the local player is allowed to act. In local/hotseat mode always
// true. In online mode: true during setup/scenery/deploy (both players manage
// their own side), and during play only when it is this client's activeSide.
function netIsMyTurn() {
  if (_isSpectator) return false;
  if (!_netSide) return true;                                    // hotseat
  if (state.phase !== 'play') return true;                       // pre-play phases
  if (!state.activeSide) return true;                            // no active side yet
  return _gs() === state.activeSide;
}

// True when a given board side ('player1'|'player2') belongs to this client.
function netIsMySide(side) {
  if (_isSpectator) return false;
  if (!_netSide) return true;
  return _gs() === side;
}

// ---------------------------------------------------------------------------
// Intent dispatch — the migration path toward server authority.
// ---------------------------------------------------------------------------
// Perform a game action as an intent (see src/engine/gating.js + apply()).
//   Hotseat: validate, mutate the shared state locally, re-render.
//   Online : the server is authoritative — emit the intent and wait for the
//            broadcast of the new state (we do NOT mutate locally here).
// Handlers not yet migrated to dispatch() still mutate state directly and rely
// on netAfterRender()'s full-state relay.
function dispatch(intent) {
  if (_isSpectator) return;
  const side = (_netSide ? _gs() : null) || _intentSide(intent);
  if (!_isLegal(state, intent, side)) return;
  if (_netSide) {
    // Apply targeting-UI intents locally even in online mode so two-click flows
    // (voidgate select → dropsite select) work without waiting for the server round-trip.
    const _optimisticLocal = ['selectGate', 'cancelLaunch', 'beginLaunch', 'openDAFeatureAttack'];
    if (_optimisticLocal.includes(intent.type)) { _apply(state, intent, rng); renderAll(); }
    if (_netWs && _netConnected) {
      console.log('%c[intent]', 'color:#4caf50;font-weight:bold', intent.type, intent);
      _netPendingIntent = true;
      _netWs.send(JSON.stringify({ type: 'intent', intent }));
      // Tell the opponent which ship we're acting on so they see movement cones.
      netSendPeerView();
    }
  } else {
    _apply(state, intent, rng);
    renderAll();
    // Generate a hotseat room ID the first time the game moves past setup.
    if (!_hotseatRoomId && state.phase !== 'setup') _hotseatRoomId = _genId();
    // On first transition to play: switch to a seeded RNG and capture the start state for replay.
    if (!_hotseatPlayStartState && state.phase === 'play') {
      _hotseatSeed = Math.floor(Math.random() * 2147483647);
      rng = _makeRng(_hotseatSeed);
      _hotseatPlayStartState    = structuredClone(state);
      _hotseatPlayStartRngState = rng.getState();
    } else if (_hotseatPlayStartState && state.phase === 'play') {
      // Record intent for replay (skip the commitScenario that triggered the transition).
      _hotseatIntentLog.push({ ts: Date.now(), side: _intentSide(intent) || 'player1', intent });
    }
    _hotseatSave();
    // Bug 4: after a ship action, auto-finish the activation if all ships have acted.
    const autoFinishTriggers = ['moveShip', 'holdPosition', 'endVectoredMove', 'fireWeapons', 'launchAsset', 'surveySite'];
    if (autoFinishTriggers.includes(intent.type)) maybeAutoFinish(intent.gid);
    // Auto-advance to next unmoved ship after a move resolves (runs after maybeAutoFinish
    // so grp.activated is already set if the group finished, making autoAdvance a no-op).
    const moveAdvanceTriggers = ['moveShip', 'holdPosition', 'endVectoredMove'];
    if (moveAdvanceTriggers.includes(intent.type)) autoAdvanceShipSelection(intent.gid);
  }
}

// Auto-finish a group's activation when every alive on-table ship has both moved
// and either fired or operates on an order that doesn't allow firing.
function maybeAutoFinish(gid) {
  if (!gid) return;
  const grp = state.groups[gid];
  const def = getDef(gid);
  if (!grp || !def || grp.activated || !grp.order) return;
  if (state.attackModal || state.launching || state.aiming) return;
  const aliveOnTable = grp.ships.filter(s => !s.destroyed && !s.offTable);
  if (!aliveOnTable.length) return;
  const allActed = aliveOnTable.every(ship => {
    if (!ship.movedThisRound) return false;
    if (ship.firedThisActivation) return true;
    const si = grp.ships.indexOf(ship);
    const eo = effectiveOrder(def, grp, si);
    return fireLimit(eo, def) <= 0;
  });
  if (allActed) {
    const side = def.side;
    if (_isLegal(state, { type: 'finishActivation', gid }, side)) {
      dispatch({ type: 'finishActivation', gid });
    }
  }
}

// After a move resolves, advance selectedShipIdx to the next unmoved alive ship in the group.
function autoAdvanceShipSelection(gid) {
  if (!gid || state.selectedGroupId !== gid) return;
  const grp = state.groups[gid];
  if (!grp || grp.activated) return;
  const si = state.selectedShipIdx;
  const curShip = si !== null ? grp.ships[si] : null;
  if (!curShip || !curShip.movedThisRound) return;
  const next = grp.ships.findIndex(s => !s.destroyed && !s.offTable && !s.movedThisRound);
  if (next < 0 || next === si) return;
  state.selectedShipIdx = next;
  renderAll();
}

// The side performing an intent. Online, the server uses the connection's side;
// locally (hotseat) the operator acts for whichever side the intent concerns —
// an intent targeting a Group belongs to that Group's owner, otherwise it is an
// active-side action (pass / endRound).
// The side performing an intent. Online, the server uses the connection's side;
// locally (hotseat) the operator acts for whichever side the intent concerns —
// an intent targeting a Group belongs to that Group's owner; combat defensive
// decisions belong to the defender (opponent of the attacker); everything else is
// an active-side / attacker action.
function _intentSide(intent) {
  if (intent && intent.gid) { const d = getDef(intent.gid); if (d) return d.side; }
  if (intent && (intent.type === 'deployDone' || intent.type === 'commitScenery' ||
      intent.type === 'confirmNominations' || intent.type === 'confirmProtectNom' ||
      intent.type === 'readySetup' || intent.type === 'unreadySetup')) return intent.side;
  if (intent && intent.type === 'resolveBombardCollateral') {
    const M = state.attackModal;
    const q = M && M.bombardCollateralQueue && M.bombardCollateralQueue[0];
    if (q) return q.side; // the defender removes their own battalions
  }
  if (intent && intent.assetId) {
    const a = (state.launchedAssets || []).find(x => x.id === intent.assetId);
    if (a) return a.side;
  }
  const atk = state.assetActiveSide || state.activeSide;
  const defensive = state.attackModal && intent && (
    intent.type === 'attackFighterReroll' ||
    (intent.type === 'attackReroll' && intent.which === 'save') ||
    (intent.type === 'attackStep' && (intent.to === 'apply' || intent.to === 'rollbackup')) ||
    (intent.type === 'attackDeclare' && (intent.what === 'shield' || intent.what === 'shieldBooster' || intent.what === 'brace' || intent.what === 'contain'))
  );
  if (defensive) {
    if (atk) return atk === 'player1' ? 'player2' : 'player1';
    // activeSide is null but attackModal is still open — derive defender from target ship
    const M = state.attackModal;
    const firstShot = M && M.shots && M.shots[0];
    if (firstShot && firstShot.targetGid) {
      const tDef = getDef(firstShot.targetGid);
      if (tDef) return tDef.side === 'player1' ? 'player1' : 'player2';
    }
    return atk;
  }
  return atk;
}

          </div>

            <input id="auth-password" type="password" maxlength="128" autocomplete="${isReg ? 'new-password' : 'current-password'}"
              style="width:100%;box-sizing:border-box;padding:9px 10px;background:var(--bg-card,#0e1a20);border:1px solid var(--border-bright);color:var(--text);font-family:var(--mono);font-size:12px;border-radius:3px;"/>
          </div>
          ${isReg ? `<div>
            <div style="font-size:9px;letter-spacing:0.12em;color:var(--text-mute);margin-bottom:4px;">CONFIRM PASSWORD</div>
            <input id="auth-confirm" type="password" maxlength="128" autocomplete="new-password"
              style="width:100%;box-sizing:border-box;padding:9px 10px;background:var(--bg-card,#0e1a20);border:1px solid var(--border-bright);color:var(--text);font-family:var(--mono);font-size:12px;border-radius:3px;"/>

          </button>
        </div>
      </div>`;

    overlay.querySelector('#auth-switch').addEventListener('click', () => {
      mode = isReg ? 'login' : 'register';
      render();
    });

    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function fmtSave(s) {
    const p1 = (s.playerNames && s.playerNames.f1) || 'P1';
    const p2 = (s.playerNames && s.playerNames.f2) || 'P2';
    const f1 = (s.factions && s.factions.player1) || '';
    const f2 = (s.factions && s.factions.player2) || '';
    const rnd = s.round ? `Rnd ${s.round}` : '';
    const detail = [p1 + ' vs ' + p2, f1 + '/' + f2, rnd, fmtDate(s.savedAt)].filter(Boolean).join(' · ');
    return `<span style="color:var(--text);font-weight:700;margin-right:6px;">${s.roomId}</span>${detail}`;
  }

        </div>
      </div>`;
    } else if (view === 'hosting') {
      html = `<div class="setup-card" style="max-width:360px;">
        <div class="setup-header"><h2 class="setup-title">CREATING ROOM…</h2></div>
        <div class="setup-body" style="padding:24px;text-align:center;">

    } else if (view === 'resuming') {

    contentArea.innerHTML = html;
    wire(view);
  }

  function dismiss() {
    overlay.remove();
  }

  function wire(view) {
    if (view === 'main') {
      overlay.querySelector('#ms-hotseat').onclick = () => {
        if (_netSide || _netParams.get('room') || _netParams.get('replay')) {
          sessionStorage.setItem('startHotseat', '1');
          location.href = location.pathname;
          return;
        }
        dismiss();
        _hotseatRoomId           = null;
        _hotseatSeed             = null;
        _hotseatPlayStartState   = null;
        _hotseatPlayStartRngState = null;
        _hotseatIntentLog        = [];
        rng = _rng;
        Object.assign(state, createState());
        rebuildFleets();
        renderAll();
      };
      overlay.querySelector('#ms-host').onclick    = () => render('host-config');
      overlay.querySelector('#ms-join').onclick    = () => render('join');
      overlay.querySelector('#ms-spectate').onclick = () => render('spectate');
      const aiTestBtn = overlay.querySelector('#ms-ai-test');
      if (aiTestBtn) aiTestBtn.onclick = async () => {
        aiTestBtn.disabled = true;
        aiTestBtn.innerHTML = '🤖 AI vs AI<div style="font-size:10px;font-weight:400;color:var(--text-mute);margin-top:3px;">Generating fleets…</div>';
        // Show the full-screen loading spinner immediately so the user gets instant feedback
        // while the room is created (and bridges the page reload into the spectator view).
        _showSpectatorLoading(true);
        try {
          const r = await fetch('/api/rooms', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ aiVsAi: true }) });
          const d = await r.json();
          if (d.roomId) { location.href = `${location.pathname}?room=${d.roomId}&side=spectator&ai=1`; return; }
          throw new Error('no room');
        } catch {
          _hideSpectatorLoading();
          aiTestBtn.disabled = false;
          aiTestBtn.innerHTML = '🤖 AI vs AI<div style="font-size:10px;font-weight:400;color:var(--hull-crit);margin-top:3px;">Failed — try again</div>';
        }
      };
      const soloBtn = overlay.querySelector('#ms-solo');
      if (soloBtn) soloBtn.onclick = async () => {
        soloBtn.disabled = true;
        try {
          const res  = await fetch('/api/rooms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ aiOpponent: true, aiSide: 'player2' }),
          });
          const data = await res.json();
          if (data.error) { alert(data.error); return; }
          location.href = `${location.pathname}?room=${data.roomId}&side=player1`;
        } catch { alert('Could not reach server.'); } finally { soloBtn.disabled = false; }
      };
      const savesBtn = overlay.querySelector('#ms-saves');
      if (savesBtn) savesBtn.onclick = () => render('saves');
    }
    if (view === 'saves') {
      overlay.querySelectorAll('[data-ms-resume]').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.msResume;
          const meta = saves.find(s => s.roomId === id);
          if (meta && meta.isHotseat) {
            // Hotseat resume: restore state locally, no WebSocket needed.
            btn.disabled = true; btn.textContent = '…';
            try {
              const save = await fetch(`/api/saves/${id}`).then(r => r.json());
              _hotseatRoomId           = id;
              _hotseatSeed             = save.seed ?? null;
              _hotseatPlayStartState   = save.playStartState   ?? null;
              _hotseatPlayStartRngState = save.playStartRngState ?? null;
              _hotseatIntentLog        = save.intentLog        ?? [];
              if (save.seed != null) {
                rng = _makeRng(save.seed);
                if (save.currentRngState != null) rng.setState(save.currentRngState);
              } else {
                rng = _rng;
              }
              dismiss();
              Object.assign(state, save.currentState);
              // Don't rebuildFleets() here — it wipes state.groups and re-lays every
              // ship at its default deploy position, losing the saved deployment.
              // The restored state already carries activeFleets + groups (matches the
              // online full-state path). Only rebuild defs if they're somehow missing.
              if (!state.activeFleets || !Object.keys(state.activeFleets).length) rebuildFleets();
              renderAll();
            } catch (err) { alert('Could not load save: ' + err.message); btn.disabled = false; btn.textContent = '▶ RESUME'; }
            return;
          }
          btn.disabled = true; btn.textContent = '…';
          doResume(id);
        };
      });
      overlay.querySelectorAll('[data-ms-replay]').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.msReplay;
          btn.disabled = true; btn.textContent = '…';
          try {
            const data = await fetch(`/api/rooms/${id}/replay`).then(r => r.json());
            if (data.error) { alert(data.error); btn.disabled = false; btn.textContent = '↺ REPLAY'; return; }
            dismiss();
            loadReplay(data);
          } catch (err) {
            alert('Could not load replay: ' + err.message);
            btn.disabled = false; btn.textContent = '↺ REPLAY';
          }
        };
      });
      overlay.querySelectorAll('[data-ms-report]').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.msReport;
          btn.disabled = true; btn.textContent = '…';
          try {
            const save = await fetch(`/api/saves/${id}`).then(r => r.json());
            if (save.error || !save.currentState) { alert(save.error || 'No game data for this save.'); btn.disabled = false; btn.textContent = '📋 REPORT'; return; }
            _reportRound = 1;
            openGameReport(save.currentState);
          } catch (err) {
            alert('Could not load report: ' + err.message);
          } finally {
            btn.disabled = false; btn.textContent = '📋 REPORT';
          }
        };
      });
      overlay.querySelectorAll('[data-ms-delete]').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.msDelete;
          if (!confirm(`Delete save ${id}? This cannot be undone.`)) return;
          btn.disabled = true;
          try {
            const res = await fetch(`/api/saves/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (!data.ok) { alert(data.error || 'Delete failed.'); btn.disabled = false; return; }
            saves = saves.filter(s => s.roomId !== id);
            if (saves.length) render('saves'); else { savesTab = 'all'; render('main'); }
          } catch (err) {
            alert('Could not reach server: ' + err.message);
            btn.disabled = false;
          }
        };
      });
      overlay.querySelectorAll('[data-saves-tab]').forEach(btn => {
        btn.onclick = () => { savesTab = btn.dataset.savesTab; render('saves'); };
      });
      overlay.querySelector('#ms-back').onclick = () => { savesTab = 'all'; render('main'); };
    }
    if (view === 'solo') {
      // Keep the two secondary pickers mutually exclusive.
      const _secSelIds = ['#solo-sec1', '#solo-sec2'];
      const updateSecMutex = () => {
        const vals = _secSelIds.map(id => overlay.querySelector(id)?.value || '');
        _secSelIds.forEach((id, i) => {
          const sel = overlay.querySelector(id);
          if (!sel) return;
          const other = vals[1 - i];
          sel.querySelectorAll('option').forEach(o => { o.disabled = !!(o.value && o.value !== 'random' && o.value === other); });
        });
      };
      _secSelIds.forEach(id => {
        const el = overlay.querySelector(id);
        if (el) el.addEventListener('change', updateSecMutex);
      });
      const llmToggle = overlay.querySelector('#solo-use-llm');
      if (llmToggle) {
        llmToggle.addEventListener('change', () => {
          const track = overlay.querySelector('#solo-llm-track');
          const thumb = overlay.querySelector('#solo-llm-thumb');
          if (track) track.style.background = llmToggle.checked ? 'var(--accent, #4a9eff)' : 'var(--border)';
          if (thumb) thumb.style.transform  = llmToggle.checked ? 'translateX(16px)' : '';
        });
      }
      overlay.querySelector('#solo-start').addEventListener('click', async () => {
        const personality = overlay.querySelector('#solo-personality')?.value || 'balanced';
        const faction     = overlay.querySelector('#solo-faction')?.value   || '';
        const _aiSecPool  = Object.entries(SECONDARY_OBJECTIVES).filter(([,v])=>!v.nominate).map(([k])=>k);
        const _pickSec    = (excl=[]) => { const p=_aiSecPool.filter(k=>!excl.includes(k)); return p[Math.floor(Math.random()*p.length)]||null; };
        const sec1raw     = overlay.querySelector('#solo-sec1')?.value || 'random';
        const sec2raw     = overlay.querySelector('#solo-sec2')?.value || 'random';
        const sec1        = sec1raw === 'random' ? _pickSec()              : sec1raw;
        const sec2        = sec2raw === 'random' ? _pickSec(sec1?[sec1]:[]) : sec2raw;
        const targetPts   = parseInt(overlay.querySelector('#solo-pts')?.value || '1500', 10) || 1500;
        const useLlm      = !!(overlay.querySelector('#solo-use-llm')?.checked);
        const msgEl       = overlay.querySelector('#solo-msg');
        if (!faction) { if (msgEl) msgEl.textContent = 'Select a faction for the AI first.'; return; }
        if (msgEl) msgEl.textContent = '';
        overlay.querySelector('#solo-start').disabled = true;
        await doSoloVsAi({ personality, faction, secondaries: [sec1, sec2].filter(Boolean), targetPts, useLlm });
        const startBtn = overlay.querySelector('#solo-start');
        if (startBtn) startBtn.disabled = false;
      });
      overlay.querySelector('#ms-back').onclick = () => render('main');
    }
    if (view === 'join') {
      const codeEl = overlay.querySelector('#ms-code');
      const goBtn  = overlay.querySelector('#ms-join-go');
      const errEl  = overlay.querySelector('#ms-join-err');
      codeEl.oninput = () => { codeEl.value = codeEl.value.toUpperCase(); goBtn.disabled = codeEl.value.length !== 4; };
      goBtn.onclick = () => {
        const code = codeEl.value.trim();
        errEl.style.display = 'none';
        fetch(`/api/rooms/${code}`)
          .then(r => r.json())
          .then(d => {
            if (d.error) { errEl.textContent = d.error; errEl.style.display = 'block'; return; }
            if (d.sides.player2) { errEl.textContent = 'Game full.'; errEl.style.display = 'block'; return; }
            location.href = `${location.pathname}?room=${code}&side=player2`;
          })
          .catch(() => { errEl.textContent = 'Could not reach server.'; errEl.style.display = 'block'; });
      };
      overlay.querySelector('#ms-back').onclick = () => render('main');
    }
    if (view === 'host-config') {
      const createBtn = overlay.querySelector('#hc-create');
      const msgEl     = overlay.querySelector('#hc-msg');
      createBtn.onclick = async () => {
        createBtn.disabled = true;
        if (msgEl) msgEl.textContent = 'Contacting server…';
        const allowSpectators = overlay.querySelector('#hc-allow-spectators')?.checked !== false;
        await doHost({ allowSpectators });
        createBtn.disabled = false;
        if (msgEl) msgEl.textContent = '';
      };
      overlay.querySelector('#ms-back').onclick = () => render('main');
    }
    if (view === 'spectate') {
      fetch('/api/rooms')
        .then(r => r.json())
        .then(rooms => {
          const listEl = overlay.querySelector('#spectate-list');
          if (!listEl) return;
          if (!rooms.length) {
            listEl.innerHTML = `<div style="color:var(--text-mute);font-size:11px;text-align:center;padding:20px 0;">No live games available to watch right now.</div>`;
            return;
          }
          listEl.innerHTML = rooms.map(r => {
            const p1 = r.playerNames?.f1 || 'Player 1';
            const p2 = r.playerNames?.f2 || 'Player 2';
            const f1 = r.factions?.player1 || '';
            const f2 = r.factions?.player2 || '';
            const rnd = r.round ? `Round ${r.round}` : r.phase || '';
            const spec = r.spectators > 0 ? `<span style="color:var(--text-mute);">${r.spectators} watching</span>` : '';
            return `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:11px;font-weight:700;color:var(--text);font-family:var(--mono);">${r.roomId}</div>
                <div style="font-size:10px;color:var(--text-dim);margin-top:2px;">${p1}${f1 ? ` (${f1})` : ''} vs ${p2}${f2 ? ` (${f2})` : ''}</div>
                <div style="font-size:9px;color:var(--text-mute);margin-top:2px;display:flex;gap:8px;">${rnd ? `<span>${rnd}</span>` : ''}${spec}</div>
              </div>
              <button class="btn" data-spectate="${r.roomId}" style="padding:7px 14px;font-size:11px;white-space:nowrap;">👁 WATCH</button>
            </div>`;
          }).join('');
          listEl.querySelectorAll('[data-spectate]').forEach(btn => {
            btn.onclick = () => {
              location.href = `${location.pathname}?room=${btn.dataset.spectate}&side=spectator`;
            };
          });
        })
        .catch(() => {
          const listEl = overlay.querySelector('#spectate-list');
          if (listEl) listEl.innerHTML = `<div style="color:var(--hull-crit);font-size:11px;text-align:center;padding:20px 0;">Could not reach server.</div>`;
        });
      overlay.querySelector('#ms-back').onclick = () => render('main');
    }
  }

  async function doResume(saveId) {
    try {
      const res = await fetch('/api/rooms/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ saveId }),
      });
      const data = await res.json();
      if (data.error) { render('saves'); alert(data.error); return; }
      location.href = `${location.pathname}?room=${data.roomId}&side=${data.userSide || 'player1'}`;
    } catch (err) {
      render('saves');
      alert('Could not reach server: ' + err.message);
    }
  }

  async function doHost({ allowSpectators = true } = {}) {
    try {
      const res  = await fetch('/api/rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ allowSpectators }),
      });
      const data = await res.json();
      location.href = `${location.pathname}?room=${data.roomId}&side=player1`;
    } catch {
      const msgEl = overlay.querySelector('#hc-msg');
      if (msgEl) msgEl.textContent = 'Could not reach server. Is it running on port 3000?';
    }
  }

  async function doSoloVsAi({ personality, faction, secondaries, targetPts = 1500, useLlm = false }) {
    const msgEl = () => overlay.querySelector('#solo-msg');
    try {
      const res  = await fetch('/api/rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ aiOpponent: true, aiSide: 'player2', aiPersonality: personality, aiFaction: faction, aiSecondaries: secondaries, targetPts, aiUseLlm: useLlm }),
      });
      const data = await res.json();
      if (data.error) { if (msgEl()) msgEl().textContent = data.error; return; }
      location.href = `${location.pathname}?room=${data.roomId}&side=player1`;
    } catch {
      if (msgEl()) msgEl().textContent = 'Could not reach server. Is it running on port 3000?';
    }
  }

  // Show with no saves first so there is no async gap between old and new overlay.
  let saves = [];
  render('main');
  wire('main');
  document.body.appendChild(overlay);

  // Wire menu topbar buttons.
  const wireMenuBar = () => {
    const userBtn   = overlay.querySelector('#ms-user-btn');
    const logoutBtn = overlay.querySelector('#ms-logout-btn');

    if (userBtn && !userBtn._wired) {
      userBtn._wired = true;
      userBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const btnContainer = userBtn.closest('div[style*="position:relative"]') || menuBar;
        const existing = btnContainer.querySelector('#ms-user-modal');
        if (existing) { existing.remove(); return; }

        if (currentUser?.role === 'admin') {
          openAdminPanel(userBtn, false);
        } else {
          _openUserModal(btnContainer, userBtn);
        }
      });
    }

    if (logoutBtn && !logoutBtn._wired) {
      logoutBtn._wired = true;
      logoutBtn.addEventListener('click', async () => { await fetch('/api/auth/logout', { method: 'POST' }); currentUser = null; location.reload(); });
    }
  };

  function _openUserModal(container, anchor) {
    const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    const modal = document.createElement('div');
    modal.id = 'ms-user-modal';
    modal.style.cssText = `position:absolute;top:calc(100% + 4px);right:0;background:var(--bg-elev);border:1px solid var(--border-bright);border-radius:5px;padding:16px 18px;min-width:210px;font-family:var(--mono);font-size:10px;color:var(--text-dim);box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:10;`;
    modal.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--ucm);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;">${currentUser.username[0].toUpperCase()}</div>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--text);">${currentUser.username}</div>
          <div style="font-size:9px;color:var(--text-mute);margin-top:2px;">User #${currentUser.userId}</div>
        </div>
      </div>
      ${currentUser.createdAt ? `<div style="margin-bottom:14px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:3px;border:1px solid var(--border);"><div style="font-size:8px;letter-spacing:0.1em;color:var(--text-mute);margin-bottom:3px;">MEMBER SINCE</div><div>${fmtDate(currentUser.createdAt)}</div></div>` : ''}
      <button id="ms-modal-logout" class="btn" style="width:100%;padding:8px;font-size:10px;color:var(--hull-crit);border-color:var(--hull-crit);">⏏ SIGN OUT</button>`;
    container.appendChild(modal);
    modal.querySelector('#ms-modal-logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' }); currentUser = null; location.reload();
    });
    const dismiss = (ev) => { if (!modal.contains(ev.target) && ev.target !== anchor) { modal.remove(); document.removeEventListener('click', dismiss); } };
    setTimeout(() => document.addEventListener('click', dismiss), 0);
  }

  wireMenuBar();

  // Fetch saves in background and refresh if any are found.
  try {
    const r = await fetch('/api/saves');
    if (r.ok) {
      const fetched = (await r.json()).sort((a, b) => b.savedAt - a.savedAt);
      if (fetched.length) { saves = fetched; render('main'); wire('main'); wireMenuBar(); }
    }
  } catch {}
}

document.getElementById('btn-3d-toggle').addEventListener('click', toggle3d);

// ---------------------------------------------------------------------------
// Admin panel — opened from mode selector menu OR in-game topbar chip
// ---------------------------------------------------------------------------

async function openAdminPanel(anchor, inGame = false) {
  const existing = document.getElementById('admin-panel-backdrop');
  if (existing) { existing.remove(); return; }

  const backdrop = document.createElement('div');
  backdrop.id = 'admin-panel-backdrop';
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:9998;';
  document.body.appendChild(backdrop);

  const closePanel = () => { backdrop.remove(); };
  backdrop.addEventListener('click', closePanel);

  const rect = anchor.getBoundingClientRect();
  const modal = document.createElement('div');
  modal.id = 'admin-panel-modal';
  modal.style.cssText = `position:fixed;top:${rect.bottom + 6}px;right:${window.innerWidth - rect.right}px;background:var(--bg-elev,#11171a);border:1px solid var(--border-bright);border-radius:5px;padding:0;min-width:480px;max-width:90vw;font-family:var(--mono);font-size:10px;color:var(--text-dim);box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9999;overflow:hidden;`;

  const tabBtn = (id, label, active) => `<button data-tab="${id}" style="flex:1;padding:9px 6px;background:none;border:none;border-bottom:2px solid ${active?'var(--ucm)':'transparent'};color:${active?'var(--ucm)':'var(--text-mute)'};font-family:var(--mono);font-size:9px;letter-spacing:0.1em;cursor:pointer;">${label}</button>`;

  modal.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--ucm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;">${currentUser.username[0].toUpperCase()}</div>
        <div><div style="font-size:11px;font-weight:700;color:var(--text);">${currentUser.username}</div><div style="font-size:8px;color:var(--hull-warn);letter-spacing:0.12em;">⬡ ADMIN</div></div>
      </div>
      <div style="display:flex;gap:6px;">
        ${inGame ? `<button id="adm-exit-game" class="btn" style="padding:5px 10px;font-size:9px;">← EXIT GAME</button>` : ''}
        <button id="adm-logout" class="btn" style="padding:5px 10px;font-size:9px;color:var(--hull-crit);border-color:var(--hull-crit);">⏏ SIGN OUT</button>
      </div>
    </div>
    <div style="display:flex;border-bottom:1px solid var(--border);">
      ${tabBtn('users','👤 USERS',true)}${tabBtn('rooms','⚡ LIVE GAMES',false)}${tabBtn('saves','💾 SAVES',false)}
    </div>
    <div id="adm-body" style="padding:12px 14px;max-height:360px;overflow-y:auto;">
      <div style="color:var(--text-mute);text-align:center;padding:20px;">Loading…</div>
    </div>`;
  document.body.appendChild(modal);

  if (inGame) modal.querySelector('#adm-exit-game').addEventListener('click', () => {
    backdrop.remove();
    location.href = location.pathname;
  });
  modal.querySelector('#adm-logout').addEventListener('click', async () => {
    backdrop.remove();
    await fetch('/api/auth/logout', { method: 'POST' }); currentUser = null; location.reload();
  });

  const body = modal.querySelector('#adm-body');

  const loadTab = async (tab) => {
    modal.querySelectorAll('[data-tab]').forEach(b => {
      const active = b.dataset.tab === tab;
      b.style.borderBottomColor = active ? 'var(--ucm)' : 'transparent';
      b.style.color = active ? 'var(--ucm)' : 'var(--text-mute)';
    });
    body.innerHTML = `<div style="color:var(--text-mute);text-align:center;padding:20px;">Loading…</div>`;
    try {
      if (tab === 'users') {
        const users = await fetch('/api/admin/users').then(r => r.json());
        body.innerHTML = users.map(u => `
          <div data-uid="${u.id}" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="flex:1;min-width:0;">
              <span style="color:var(--text);font-weight:700;">${u.username}</span>
              <span style="margin-left:6px;font-size:8px;color:${u.role==='admin'?'var(--hull-warn)':'var(--text-mute)'};">${u.role.toUpperCase()}</span>
              ${u.aiAccess ? '<span style="margin-left:4px;font-size:8px;color:var(--shal);">🤖 AI</span>' : ''}
              <div style="font-size:8px;color:var(--text-mute);">User #${u.id}</div>
            </div>
            ${u.id !== currentUser.userId ? `
              <button class="btn adm-reset-pw" data-uid="${u.id}" data-uname="${u.username}" style="padding:3px 7px;font-size:8px;">🔑 RESET PW</button>
              <button class="btn adm-toggle-ai" data-uid="${u.id}" data-ai="${u.aiAccess}" style="padding:3px 7px;font-size:8px;${u.aiAccess?'color:var(--shal);border-color:var(--shal);':''}">${u.aiAccess?'🤖 AI ON':'🤖 AI OFF'}</button>
              <button class="btn adm-toggle-role" data-uid="${u.id}" data-role="${u.role}" style="padding:3px 7px;font-size:8px;">${u.role==='admin'?'▽ PLAYER':'▲ ADMIN'}</button>
              <button class="btn adm-del-user" data-uid="${u.id}" data-uname="${u.username}" style="padding:3px 7px;font-size:8px;color:var(--hull-crit);border-color:var(--hull-crit);">✕</button>
            ` : '<span style="font-size:8px;color:var(--text-mute);">(you)</span>'}
          </div>`).join('');
        body.querySelectorAll('.adm-reset-pw').forEach(btn => {
          btn.addEventListener('click', async () => {
            const pw = prompt(`New password for ${btn.dataset.uname} (min 8 chars):`);
            if (!pw || pw.length < 8) return;
            const r = await fetch(`/api/admin/users/${btn.dataset.uid}/reset-password`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ newPassword: pw }) });
            const d = await r.json();
            if (d.ok) btn.textContent = '✓'; else alert(d.error);
          });
        });
        body.querySelectorAll('.adm-toggle-ai').forEach(btn => {
          btn.addEventListener('click', async () => {
            const newVal = btn.dataset.ai === 'true' ? false : true;
            await fetch(`/api/admin/users/${btn.dataset.uid}/ai-access`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ aiAccess: newVal }) });
            loadTab('users');
          });
        });
        body.querySelectorAll('.adm-toggle-role').forEach(btn => {
          btn.addEventListener('click', async () => {
            const newRole = btn.dataset.role === 'admin' ? 'player' : 'admin';
            await fetch(`/api/admin/users/${btn.dataset.uid}/role`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ role: newRole }) });
            loadTab('users');
          });
        });
        body.querySelectorAll('.adm-del-user').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm(`Delete user ${btn.dataset.uname}? This cannot be undone.`)) return;
            await fetch(`/api/admin/users/${btn.dataset.uid}`, { method:'DELETE' });
            loadTab('users');
          });
        });

      } else if (tab === 'rooms') {
        const rooms = await fetch('/api/admin/rooms').then(r => r.json());
        if (!rooms.length) { body.innerHTML = '<div style="color:var(--text-mute);text-align:center;padding:20px;">No live rooms.</div>'; return; }
        const ago = ms => { const s = Math.floor((Date.now()-ms)/1000); return s < 60 ? `${s}s ago` : `${Math.floor(s/60)}m ago`; };
        body.innerHTML = rooms.map(r => `
          <div style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text);font-weight:700;">${r.id}</span>
              <span style="font-size:8px;color:var(--text-mute);">${ago(r.lastActivity)}</span>
            </div>
            <div style="font-size:8px;color:var(--text-mute);margin-top:2px;">
              ${r.phase?.toUpperCase()} · Rnd ${r.round??'—'} · P1:${r.p1?'✓':'✗'} P2:${r.p2?'✓':'✗'} · ${r.spectators} spec
            </div>
          </div>`).join('');

      } else if (tab === 'saves') {
        const saves = await fetch('/api/admin/saves').then(r => r.json());
        if (!saves.length) { body.innerHTML = '<div style="color:var(--text-mute);text-align:center;padding:20px;">No saves.</div>'; return; }
        const fmtTs = ts => ts ? new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
        body.innerHTML = saves.map(s => `
          <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;">
                <span style="color:var(--text);font-weight:700;">${s.roomId}</span>
                <span style="font-size:8px;color:var(--text-mute);">${fmtTs(s.savedAt)}</span>
              </div>
              <div style="font-size:8px;color:var(--text-mute);margin-top:2px;">
                ${(s.playerNames?.f1||'P1')} vs ${(s.playerNames?.f2||'P2')} · ${s.phase?.toUpperCase()} Rnd ${s.round??'—'} · ${s.isHotseat?'HOTSEAT':'ONLINE'}${s.hasReplay?' · ↺':''}
              </div>
            </div>
            <button class="btn adm-del-save" data-rid="${s.roomId}" style="padding:3px 7px;font-size:8px;color:var(--hull-crit);border-color:var(--hull-crit);flex-shrink:0;">✕</button>
          </div>`).join('');
        body.querySelectorAll('.adm-del-save').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm(`Delete save ${btn.dataset.rid}? This cannot be undone.`)) return;
            const r = await fetch(`/api/admin/saves/${btn.dataset.rid}`, { method: 'DELETE' });
            const d = await r.json();
            if (d.ok) loadTab('saves'); else alert(d.error);
          });
        });
      }
    } catch(err) {
      body.innerHTML = `<div style="color:var(--hull-crit);padding:12px;">Error: ${err.message}</div>`;
    }
  };

  modal.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => loadTab(b.dataset.tab)));
  modal.addEventListener('click', e => e.stopPropagation());
  backdrop.appendChild(modal);
  loadTab('users');
}

function renderSpectatorChip() {
  // Delegate to renderUserChip so the spectator button is always inside #topbar-user,
  // directly left of the user profile button.
  renderUserChip();
}

function _wireSpectatorChipBtn() {
  const btn = document.getElementById('btn-spectator-chip');
  if (!btn) return;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const existing = document.getElementById('spectator-list-popup');
    if (existing) { existing.remove(); return; }
    const rect = btn.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.id = 'spectator-list-popup';
    popup.style.cssText = `position:fixed;top:${rect.bottom+6}px;right:${window.innerWidth-rect.right}px;background:#0d1a1f;border:1px solid var(--border-bright);border-radius:6px;padding:10px 14px;min-width:150px;font-family:var(--mono);font-size:10px;box-shadow:0 12px 40px rgba(0,0,0,0.85);z-index:9999;`;
    popup.innerHTML = `
      <div style="font-size:8px;letter-spacing:0.12em;color:var(--text-mute);margin-bottom:8px;">SPECTATORS</div>
      ${_spectators.map(u => `<div style="color:var(--text-dim);padding:2px 0;">👁 ${u.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('')}`;
    document.body.appendChild(popup);
    const dismiss = ev => { if (!popup.contains(ev.target) && ev.target !== btn) { popup.remove(); document.removeEventListener('click', dismiss); } };
    setTimeout(() => document.addEventListener('click', dismiss), 0);
  });
}

function _spectatorBtnHtml() {
  if (!_netRoom || _spectators.length === 0) return '';
  return `<button id="btn-spectator-chip" style="
    display:flex;align-items:center;gap:5px;
    background:none;border:1px solid rgba(255,181,71,0.4);border-radius:3px;
    color:var(--hull-warn);font-family:var(--mono);font-size:9px;letter-spacing:0.06em;
    padding:3px 8px;cursor:pointer;">👁 ${_spectators.length}</button>`;
}

function renderUserChip() {
  const chip = document.getElementById('topbar-user');
  if (!chip) return;

  if (_isSpectator) {
    chip.style.cssText = 'display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;font-family:var(--mono);font-size:9px;color:var(--text-mute);white-space:nowrap;position:relative;';
    chip.innerHTML = `
      ${_spectatorBtnHtml()}
      <span style="background:rgba(0,188,212,0.12);border:1px solid rgba(0,188,212,0.35);border-radius:3px;padding:3px 8px;color:var(--ucm);letter-spacing:0.1em;font-size:9px;">
        👁 SPECTATING
      </span>
      ${currentUser?.loggedIn ? `
        <button id="btn-user-chip" style="
          display:flex;align-items:center;gap:5px;
          background:none;border:1px solid rgba(74,214,255,0.35);border-radius:3px;
          color:var(--shal);font-family:var(--mono);font-size:9px;letter-spacing:0.06em;
          padding:3px 8px;cursor:pointer;">
          <span style="opacity:0.6;">⬡</span> ${currentUser.username}
        </button>` : ''}`;
    _wireSpectatorChipBtn();
    const chipBtn = chip.querySelector('#btn-user-chip');
    if (chipBtn) {
      chipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentUser?.role === 'admin') { openAdminPanel(chipBtn, true); return; }
        const existing = document.getElementById('user-chip-popup');
        if (existing) { existing.remove(); return; }
        const rect = chipBtn.getBoundingClientRect();
        const popup = document.createElement('div');
        popup.id = 'user-chip-popup';
        popup.style.cssText = `position:fixed;top:${rect.bottom+6}px;right:${window.innerWidth-rect.right}px;background:#0d1a1f;border:1px solid var(--border-bright);border-radius:6px;padding:12px;min-width:170px;font-family:var(--mono);font-size:10px;box-shadow:0 12px 40px rgba(0,0,0,0.85);z-index:9999;`;
        popup.innerHTML = `
          <div style="font-size:11px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);">${currentUser.username}</div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button id="chip-leave" class="btn" style="width:100%;padding:9px 10px;font-size:10px;text-align:left;box-sizing:border-box;">← LEAVE GAME</button>
            <button id="chip-logout" class="btn" style="width:100%;padding:9px 10px;font-size:10px;text-align:left;box-sizing:border-box;color:var(--hull-crit);border-color:var(--hull-crit);">⏏ SIGN OUT</button>
          </div>`;
        document.body.appendChild(popup);
        popup.querySelector('#chip-leave').addEventListener('click', () => { location.href = location.pathname; });
        popup.querySelector('#chip-logout').addEventListener('click', async () => { await fetch('/api/auth/logout', { method: 'POST' }); currentUser = null; location.reload(); });
        const dismiss = ev => { if (!popup.contains(ev.target) && ev.target !== chipBtn) { popup.remove(); document.removeEventListener('click', dismiss); } };
        setTimeout(() => document.addEventListener('click', dismiss), 0);
      });
    }
    return;
  }

  if (!currentUser?.loggedIn) { chip.innerHTML = ''; return; }

  chip.style.cssText = 'display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;font-family:var(--mono);font-size:9px;color:var(--text-mute);white-space:nowrap;position:relative;';
  chip.innerHTML = `
    ${_spectatorBtnHtml()}
    <button id="btn-user-chip" style="
      display:flex;align-items:center;gap:5px;
      background:none;border:1px solid rgba(126,200,227,0.4);border-radius:3px;
      color:#7ec8e3;font-family:var(--mono);font-size:9px;letter-spacing:0.06em;
      padding:3px 8px;cursor:pointer;">
      <span style="opacity:0.6;">⬡</span> ${currentUser.username}
    </button>`;

  _wireSpectatorChipBtn();
  const chipBtn = chip.querySelector('#btn-user-chip');
  chipBtn.addEventListener('click', (e) => {
    e.stopPropagation();

    if (currentUser?.role === 'admin') {
      openAdminPanel(chipBtn, true);
      return;
    }

    const existing = document.getElementById('user-chip-popup');
    if (existing) { existing.remove(); return; }

    const rect = chipBtn.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.id = 'user-chip-popup';
    popup.style.cssText = `
      position:fixed;top:${rect.bottom + 6}px;right:${window.innerWidth - rect.right}px;
      background:#0d1a1f;border:1px solid var(--border-bright);border-radius:6px;
      padding:12px;min-width:170px;
      font-family:var(--mono);font-size:10px;
      box-shadow:0 12px 40px rgba(0,0,0,0.85);z-index:9999;
    `;
    popup.innerHTML = `
      <div style="font-size:11px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);">
        ${currentUser.username}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button id="chip-exit-game" class="btn" style="width:100%;padding:9px 10px;font-size:10px;text-align:left;box-sizing:border-box;">
          ← EXIT GAME
        </button>
        <button id="chip-logout" class="btn" style="width:100%;padding:9px 10px;font-size:10px;text-align:left;box-sizing:border-box;color:var(--hull-crit);border-color:var(--hull-crit);">
          ⏏ SIGN OUT
        </button>
      </div>`;
    document.body.appendChild(popup);

    popup.querySelector('#chip-exit-game').addEventListener('click', () => {
      popup.remove();
      location.href = location.pathname;
    });
    popup.querySelector('#chip-logout').addEventListener('click', async () => {
      popup.remove();
      await fetch('/api/auth/logout', { method: 'POST' });
      currentUser = null;
      location.reload();
    });

    const dismiss = (ev) => {
      if (!popup.contains(ev.target) && ev.target !== chipBtn) {
        popup.remove();
        document.removeEventListener('click', dismiss);
      }
    };
    setTimeout(() => document.addEventListener('click', dismiss), 0);
  });
}

// ---------------------------------------------------------------------------
// Initialise: check auth, then connect or show mode selector
// ---------------------------------------------------------------------------

// Check authentication status before anything else.
try {
  const meRes = await fetch('/api/auth/me');
  currentUser = await meRes.json();
} catch {
  currentUser = { loggedIn: false };
}
renderUserChip();

if (_netRoom && (_netSide === 'player1' || _netSide === 'player2')) {
  // Online mode: connect — auth check already done above.
  if (!currentUser?.loggedIn) {
    // Show auth screen; after login the page will reload via the URL params.
    showAuthScreen();
  } else {
    _netConnect();
  }
} else if (_netRoom && _isSpectator) {
  if (!currentUser?.loggedIn) {
    showAuthScreen();
  } else {
    _showSpectatorLoading(_netParams.get('ai') === '1');
    renderAll();
    _netConnect();
  }
} else if (!_netRoom) {
  if (sessionStorage.getItem('startHotseat')) {
    sessionStorage.removeItem('startHotseat');
    if (!currentUser?.loggedIn) { showAuthScreen(); }
    else { renderAll(); }
  } else {
    renderAll(); // render board behind overlay
    if (!currentUser?.loggedIn) {
      showAuthScreen();
    } else {
      showModeSelector();
    }
  }
}

</script>
