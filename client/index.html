          const mySide = _netSide;
          const myReady = mySide === 'player1' ? p1Ready : p2Ready;
          if (myReady) {
            return `<button class="btn" data-unready-setup="${mySide}" style="color:var(--hull-good);border-color:var(--hull-good);">✓ READY [${readyCount}/2] — cancel</button>`;
          }
          if (state.aiOpponent) {
            return `<button class="btn-primary" data-ready-setup="${mySide}" ${scenarioComplete ? '' : 'disabled'}>▶ BEGIN vs AI</button>`;
          }
          const countLabel = readyCount > 0 ? ` [${readyCount}/2]` : '';
          return `<button class="btn-primary" data-ready-setup="${mySide}" ${scenarioComplete ? '' : 'disabled'}>✓ CONFIRM READY${countLabel}</button>`;
        })()}
      </div>
    </div>
  `;
  board.appendChild(overlay);

  // Mobile setup tabs: click a tab, or swipe horizontally across the body, to move
  // between Player 1 / Player 2 / Scenario. Pure view state — no relay/re-render.
  overlay.querySelectorAll('.setup-mtabs [data-mtab]').forEach(b => {
    b.addEventListener('click', () => _setSetupMtab(b.dataset.mtab));
  });
  {
    const _mtOrder = ['p1', 'p2', 'scen'];
    const _sbody = overlay.querySelector('.setup-body');
    let _swx = 0, _swy = 0;
    _sbody.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) { _swx = e.touches[0].clientX; _swy = e.touches[0].clientY; }
    }, { passive: true });
    _sbody.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0]; if (!t) return;
      const dx = t.clientX - _swx, dy = t.clientY - _swy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        let i = _mtOrder.indexOf(_setupMtab);
        i = dx < 0 ? Math.min(_mtOrder.length - 1, i + 1) : Math.max(0, i - 1);
        _setSetupMtab(_mtOrder[i]);
      }
    }, { passive: true });
  }

  // Switching tabs resets the scenario selections (keeps each mode simple) and
  // relays — so the opponent follows to the same tab with a cleared scenario.
  overlay.querySelectorAll('[data-setup-tab]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.setupTab = ['custom','expansion'].includes(btn.dataset.setupTab) ? btn.dataset.setupTab : 'standard';
      state.scenario = { deployment: null, approach: null, layout: null, variant: null, objective: null };
      renderAll(); // relays in setup phase → opponent's view follows
    });
  });

  // Reroll buttons: 'all' randomises every row; a single key randomises just that row.
  const SCEN_TABLES = { deployment: DEPLOYMENTS, approach: APPROACHES, layout: LAYOUTS, variant: VARIANTS, objective: OBJECTIVES };
  overlay.querySelectorAll('[data-reroll]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.reroll;
      if (key === 'all') {
        state.scenario = generateScenario(); // fresh object — clears any asymmetric objectives
      } else {
        // Exclude bespoke standard-scenario-only entries from generator rerolls.
        const keys = Object.keys(SCEN_TABLES[key]).filter(k => !SCEN_TABLES[key][k].bespoke);
        const next = { ...state.scenario, [key]: keys[Math.floor(Math.random() * keys.length)] };
        if (key === 'objective') delete next.objectives; // rerolling the shared objective drops asymmetric mode
        state.scenario = next;
      }
      renderAll(); // relays to the other player via netRelaySetup() (still in setup phase)
    });
  });
  // Standard-scenario presets (defined at module scope above renderSetupOverlay).
  const applyPreset = (key) => {
    const preset = SCEN_PRESETS[key];
    if (!preset) return;
    const next = { ...state.scenario, ...preset };
    if (!preset.objectives) delete next.objectives; // presets without asymmetric scoring clear it
    state.scenario = next;
    renderAll(); // relays to the other player via netRelaySetup() (still in setup phase)
  };
  // Dropdown: pick a named standard scenario.
  overlay.querySelectorAll('[data-preset-select]').forEach(sel => {
    sel.addEventListener('change', (e) => { e.stopPropagation(); applyPreset(sel.value); });
  });
  // Button: apply a random standard scenario.
  overlay.querySelectorAll('[data-preset="random"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const keys = Object.keys(SCEN_PRESETS);
      applyPreset(keys[Math.floor(Math.random() * keys.length)]);
    });
  });
  // Scenario Expansion 1 presets — set every scenario row at once (no asymmetric objectives).
  const EXPANSION_PRESETS = {
    ready_salted_earth:      { deployment:'line',             approach:'all_imminent',           layout:'se1_ready_salted_earth',     variant:'none', objective:'demolish'     },
    erupting_quarters:       { deployment:'from_corners',     approach:'all_imminent',           layout:'se1_erupting_quarters',      variant:'none', objective:'kill_points'  },
    latitudinal_lanes:       { deployment:'line',             approach:'all_staggered',          layout:'se1_latitudinal_lanes',      variant:'none', objective:'assess'       },
    lagrange_points:         { deployment:'midboard',         approach:'close_enough',           layout:'se1_lagrange_points',        variant:'none', objective:'kill_points'  },
    when_backfields_meet:    { deployment:'table_corners',    approach:'all_backline',           layout:'se1_when_backfields_meet',   variant:'none', objective:'normal'       },
    very_important_moon:     { deployment:'table_corners',    approach:'all_imminent',           layout:'se1_very_important_moon',    variant:'none', objective:'normal'       },
    moonshot:                { deployment:'table_corners',    approach:'close_enough',           layout:'se1_moonshot',               variant:'none', objective:'kill_points'  },
    moonwreck:               { deployment:'line',             approach:'column',                 layout:'se1_moonwreck',              variant:'none', objective:'normal'       },
    moonbreaker:             { deployment:'attacker_defender',approach:'exp_attacker_staggered', layout:'se1_moonbreaker',            variant:'none', objective:'normal'       },
    moonguard:               { deployment:'defender_edge',    approach:'exp_defender_imminent',  layout:'se1_moonguard',              variant:'none', objective:'normal'       },
    moonswipe:               { deployment:'diagonal_corners', approach:'standoff',               layout:'se1_moonswipe',              variant:'none', objective:'normal'       },
    moonskipper:             { deployment:'table_corners',    approach:'all_staggered',          layout:'se1_moonskipper',            variant:'none', objective:'normal'       },
    one_with_almost_nothing: { deployment:'line',             approach:'all_staggered',          layout:'se1_one_with_almost_nothing',variant:'none', objective:'kill_points'  },
    almost_nothing_at_all:   { deployment:'table_corners',    approach:'all_staggered',          layout:'se1_almost_nothing_at_all',  variant:'none', objective:'focal_points' }
  };
  const applyExpansionPreset = (key) => {
    const preset = EXPANSION_PRESETS[key];
    if (!preset) return;
    const next = { ...state.scenario, ...preset };
    delete next.objectives; // expansion presets use a single shared objective
    state.scenario = next;
    renderAll(); // relays to the other player via netRelaySetup() (still in setup phase)
  };
  overlay.querySelectorAll('[data-exp-preset-select]').forEach(sel => {
    sel.addEventListener('change', (e) => { e.stopPropagation(); applyExpansionPreset(sel.value); });
  });
  overlay.querySelectorAll('[data-exp-preset="random"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const keys = Object.keys(EXPANSION_PRESETS);
      applyExpansionPreset(keys[Math.floor(Math.random() * keys.length)]);
    });
  });
  // Picker dropdown — change (or clear) the chosen option for a scenario row.
  overlay.querySelectorAll('[data-scen-select]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const key = sel.dataset.scenSelect;
      state.scenario = { ...state.scenario, [key]: sel.value || null };
      renderAll();
    });
  });
  // Asymmetric-scoring toggle: switch between a single shared objective and per-side ones.
  overlay.querySelectorAll('[data-asym-toggle]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      if (cb.checked) {
        // Seed both sides from the current shared objective.
        const seed = state.scenario.objective || null;
        state.scenario = { ...state.scenario, objectives: { player1: seed, player2: seed } };
      } else {
        const next = { ...state.scenario };
        // Collapse back to a single shared objective (keep player1's pick).
        next.objective = (next.objectives && (next.objectives.player1 || next.objectives.player2)) || next.objective || null;
        delete next.objectives;
        state.scenario = next;
      }
      renderAll();
    });
  });
  // Per-side objective pickers (asymmetric mode).
  overlay.querySelectorAll('[data-asym-obj]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const side = sel.dataset.asymObj; // 'player1' | 'player2'
      const objectives = { ...(state.scenario.objectives || {}), [side]: sel.value || null };
      // Keep the shared `objective` as a representative fallback for legacy reads.
      state.scenario = { ...state.scenario, objectives, objective: objectives.player1 || objectives.player2 || state.scenario.objective || null };
      renderAll();
    });
  });
  // Fleet selection (dropdowns).
  overlay.querySelectorAll('[data-fleet-choice]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const which = sel.dataset.fleetChoice; // 'f1' | 'f2'
      state.fleetChoices[which] = sel.value || null;
      state.payloadLinks[which] = {};
      // Parse the quickplay fleet into importedFleets so the opponent can view it
      // via the same fleet-view path as an imported list (admiral assignments etc. persist).
      state.importedFleets = state.importedFleets || { f1: null, f2: null };
      if (sel.value && FASTPLAY_LISTS[sel.value]) {
        const qp = parseNewRecruit(FASTPLAY_LISTS[sel.value]);
        if (qp && qp.valid) {
          state.importedFleets[which] = { faction: qp.faction, groups: qp.groups, admirals: qp.admirals, admiralLevel: qp.admiralLevel, secondaries: qp.secondaries };
        } else {
          state.importedFleets[which] = null;
        }
      } else {
        state.importedFleets[which] = null;
      }
      // Rebuild fleets so groups and activeFleets reflect the new faction immediately.
      rebuildFleets();
      // Auto-set colour to faction default when a fleet is chosen; pick random free colour if default is taken.
      if (sel.value && FACTION_COLORS[sel.value]) {
        state.playerColors = state.playerColors || { f1: null, f2: null };
        const other = which === 'f1' ? 'f2' : 'f1';
        const preferred = FACTION_COLORS[sel.value];
        const otherCol = state.playerColors[other];
        if (preferred !== otherCol) {
          state.playerColors[which] = preferred;
        } else {
          const free = Object.keys(PLAYER_COLORS).filter(k => k !== otherCol);
          state.playerColors[which] = free[Math.floor(Math.random() * free.length)];
        }
      }
      renderAll();
      netRelaySetup(); // explicit relay after render (guards against renderAll errors)
    });
  });
  // Player colour selects.
  overlay.querySelectorAll('[data-color-choice]').forEach(sel => {
    sel.addEventListener('change', () => {
      state.playerColors = state.playerColors || { f1: null, f2: null };
      state.playerColors[sel.dataset.colorChoice] = sel.value || null;
      renderAll();
      netRelaySetup();
    });
  });
  overlay.querySelectorAll('[data-secondary]').forEach(sel => {
    sel.addEventListener('change', () => {
      const [slot, idx] = sel.dataset.secondary.split('|');
      state.secondaryChoice[slot] = state.secondaryChoice[slot] || [];
      state.secondaryChoice[slot][parseInt(idx)] = sel.value || undefined;
      state.secondaryChoice[slot] = state.secondaryChoice[slot].filter(Boolean);
      renderAll();
      netRelaySetup();
    });
  });
  // Moonguard bonus secondary pickers.
  overlay.querySelectorAll('[data-moonguard-sec]').forEach(sel => {
    sel.addEventListener('change', () => {
      state.moonguardSecondaryChoice = state.moonguardSecondaryChoice || { f1: null, f2: null };
      state.moonguardSecondaryChoice[sel.dataset.moonguardSec] = sel.value || null;
      renderAll();
      netRelaySetup();
    });
  });
  // Moonswipe pass button.
  const _msPassBtn = overlay.querySelector('#moonswipe-pass');
  if (_msPassBtn) {
    _msPassBtn.addEventListener('click', () => {
      if (!state.moonswipe || state.moonswipe.done) return;
      const ms = state.moonswipe;
      // Find the next unmoved object and mark it as "moved in place" (no move).
      const nextUnmoved = ms.positions.findIndex((_, i) => !ms.moved.includes(i));
      if (nextUnmoved >= 0) ms.moved.push(nextUnmoved);
      ms.selected = null;
      if (ms.moved.length >= ms.positions.length) ms.done = true;
      else ms.turn = ms.turn === 'f1' ? 'f2' : 'f1';
      renderAll();
      netRelaySetup();
    });
  }
  // Editable player name inputs.
  overlay.querySelectorAll('[data-player-name]').forEach(inp => {
    inp.addEventListener('input', () => {
      state.playerNames = state.playerNames || { f1: 'Player 1', f2: 'Player 2' };
      state.playerNames[inp.dataset.playerName] = inp.value || (inp.dataset.playerName === 'f1' ? 'Player 1' : 'Player 2');
      netRelaySetup(); // relay without re-render to avoid focus loss
    });
  });
  // Open the Payload→Porter assignment modal for a fleet slot.
  overlay.querySelectorAll('[data-payload-open]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.payloadAssign = { slot: btn.dataset.payloadOpen };
      renderPayloadAssign();
    });
  });
  overlay.querySelectorAll('[data-import-fleet]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.aiOpponent && btn.dataset.importFleet === 'f2') return;
      openFleetImport(btn.dataset.importFleet);
    });
  });
  overlay.querySelectorAll('[data-view-fleet]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openFleetView(btn.dataset.viewFleet, btn);
    });
  });
  // Hotseat: single button fires both readySetup intents.
  const hsReadyBtn = overlay.querySelector('#btn-hotseat-ready');
  if (hsReadyBtn) {
    hsReadyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.fleetChoices.f1 || !state.fleetChoices.f2) { flashLaunchMsg('Select both fleets first'); return; }
      if (!state.scenario || ['deployment','approach','layout','variant','objective'].some(k => !state.scenario[k])) {
        flashLaunchMsg('Select all scenario options first'); return;
      }
      dispatch({ type: 'readySetup', side: 'player1' });
      dispatch({ type: 'readySetup', side: 'player2' });
    });
  }
  // Online: per-side ready buttons.
  overlay.querySelectorAll('[data-ready-setup]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const side = btn.dataset.readySetup;
      const slot = side === 'player1' ? 'f1' : 'f2';
      if (!state.aiOpponent && !state.fleetChoices[slot]) { flashLaunchMsg('Select your fleet first'); return; }
      if (!state.scenario || ['deployment','approach','layout','variant','objective'].some(k => !state.scenario[k])) {
        flashLaunchMsg('Select all scenario options first'); return;
      }
      // For AI games: build the fleet with current settings before committing.
      if (state.aiOpponent && _netRoom) {
        const mode = _aiFleetMode;
        const resolvedPersonality = _aiPersonality === 'random'
          ? ['balanced','aggressive','positional','defensive','opportunist'][Math.floor(Math.random()*5)]
          : _aiPersonality;
        const secVals = [_aiSec1, _aiSec2].filter(s => s && s !== 'random');

        const skipBuild = (mode === 'generate' && _aiFleetBuilt) || (mode === 'import' && !!_aiImportFaction);

        if (!skipBuild) {
          if (mode === 'fastplay' && !state.fleetChoices.f2) { flashLaunchMsg('Select an AI faction first'); return; }
          if (mode === 'import' && !_aiImportFaction) { flashLaunchMsg('Import a fleet list first'); return; }

          btn.disabled = true;
          const body = { mode, personality: resolvedPersonality, useLlm: _aiUseLlm, secondaries: secVals };
          if (mode === 'fastplay') body.faction = state.fleetChoices.f2;
          else if (mode === 'generate') { body.faction = _aiGenFaction || 'random'; body.targetPts = _aiTargetPts; }
          try {
            const res = await fetch(`/api/rooms/${_netRoom}/build-ai`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!data.ok) { flashLaunchMsg(data.error || 'Fleet build failed'); btn.disabled = false; return; }
            if (mode !== 'fastplay' && data.faction && FACTION_COLORS[data.faction]) {
              state.playerColors = state.playerColors || { f1: null, f2: null };
              const preferred = FACTION_COLORS[data.faction];
              const taken = state.playerColors.f1;
              state.playerColors.f2 = (preferred !== taken) ? preferred : (Object.keys(PLAYER_COLORS).find(k => k !== taken) || preferred);
              netRelaySetup();
            }
          } catch { flashLaunchMsg('Could not reach server'); btn.disabled = false; return; }
          btn.disabled = false;
        } else {
          // Set personality/useLlm without rebuilding fleet
          try {
            await fetch(`/api/rooms/${_netRoom}/configure-ai`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ personality: resolvedPersonality, useLlm: _aiUseLlm, secondaries: secVals }) });
          } catch { /* non-fatal */ }
        }
      }
      dispatch({ type: 'readySetup', side });
    });
  });
  const readyBothBtn = overlay.querySelector('[data-ready-setup-both]');
  if (readyBothBtn) {
    readyBothBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.fleetChoices.f1 || !state.fleetChoices.f2) { flashLaunchMsg('Select both fleets first'); return; }
      if (!scenarioComplete) { flashLaunchMsg('Select all scenario options first'); return; }
      dispatch({ type: 'readySetup', side: 'player1' });
      dispatch({ type: 'readySetup', side: 'player2' });
    });
  }
  overlay.querySelectorAll('[data-unready-setup]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      dispatch({ type: 'unreadySetup', side: btn.dataset.unreadySetup });
    });
  });
  const unreadyBothBtn = overlay.querySelector('[data-unready-setup-both]');
  if (unreadyBothBtn) {
    unreadyBothBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dispatch({ type: 'unreadySetup', side: 'player1' });
      dispatch({ type: 'unreadySetup', side: 'player2' });
    });
  }
  // Wire AI config controls — persist to module vars so they survive re-renders.
  if (state.aiOpponent) {
    // Helper: auto-apply faction colour to f2
    const applyAiColour = (faction) => {
      if (!faction || !FACTION_COLORS[faction]) return;
      state.playerColors = state.playerColors || { f1: null, f2: null };
      const preferred = FACTION_COLORS[faction];
      const takenCol  = state.playerColors.f1;
      const free = Object.keys(PLAYER_COLORS).filter(k => k !== takenCol);
      state.playerColors.f2 = (preferred !== takenCol) ? preferred : (free[Math.floor(Math.random() * free.length)] || preferred);
      renderAll(); netRelaySetup();
    };

    // Mode dropdown
    overlay.querySelector('#ai-fleet-mode')?.addEventListener('change', e => {
      _aiFleetMode = e.target.value; _aiFleetBuilt = false; renderSetupOverlay();
    });

    // Generate-mode faction
    overlay.querySelector('#ai-gen-faction')?.addEventListener('change', e => {
      _aiGenFaction = e.target.value;
      _aiFleetBuilt = false;
      if (_aiGenFaction !== 'random') applyAiColour(_aiGenFaction);
    });

    // Points
    overlay.querySelector('#ai-pts')?.addEventListener('input', e => {
      _aiTargetPts = parseInt(e.target.value, 10) || 1500; _aiFleetBuilt = false;
    });

    // Generate button
    overlay.querySelector('#ai-generate-btn')?.addEventListener('click', async (btn_e) => {
      const btn = overlay.querySelector('#ai-generate-btn');
      btn.disabled = true; btn.textContent = '…';
      try {
        const res = await fetch(`/api/rooms/${_netRoom}/build-ai`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'generate', faction: _aiGenFaction || 'random',
            targetPts: _aiTargetPts, personality: _aiPersonality === 'random' ? null : _aiPersonality }),
        });
        const data = await res.json();
        if (!data.ok) { flashLaunchMsg(data.error || 'Build failed'); }
        else {
          _aiFleetBuilt = true;
          if (data.secondaries?.[0]) _aiSec1 = data.secondaries[0];
          if (data.secondaries?.[1]) _aiSec2 = data.secondaries[1];
          if (data.faction && _aiGenFaction === 'random') applyAiColour(data.faction);
          renderSetupOverlay();
        }
      } catch { flashLaunchMsg('Could not reach server'); }
      const b2 = overlay.querySelector('#ai-generate-btn');
      if (b2) { b2.disabled = false; b2.textContent = _aiFleetBuilt ? '✓ Fleet Generated' : '⚙ Generate Fleet'; }
    });

    // Secondary pickers
    overlay.querySelector('#ai-sec-0')?.addEventListener('change', e => { _aiSec1 = e.target.value; });
    overlay.querySelector('#ai-sec-1')?.addEventListener('change', e => { _aiSec2 = e.target.value; });

    // Personality
    overlay.querySelector('#ai-personality')?.addEventListener('change', e => { _aiPersonality = e.target.value; });

    // LLM toggle
    overlay.querySelector('#ai-use-llm')?.addEventListener('change', e => { _aiUseLlm = e.target.checked; });

    // Import button for AI
    overlay.querySelector('[data-import-fleet="f2"]')?.addEventListener('click', () => {
      openFleetImport('f2', (parsed) => {
        _aiImportFaction = parsed.faction;
        if (parsed.secondaries?.[0]) _aiSec1 = parsed.secondaries[0];
        if (parsed.secondaries?.[1]) _aiSec2 = parsed.secondaries[1];
        renderSetupOverlay();
      });
    });
  }

  const exitBtn = overlay.querySelector('#exit-to-menu');
  if (exitBtn) exitBtn.addEventListener('click', () => {
    showModeSelector(); // appends mode selector overlay first
    overlay.remove();   // then removes setup overlay — no visible gap
  });
}

/* Explosion HUD: shown on the board instead of the right panel. */
function renderExplosionHUD() {
  const board = document.querySelector('.board-wrap');
  let hud = document.getElementById('explosion-hud');
  if (hud) hud.remove();

  if (!(state.attackModal && state.attackModal.step === 'explosion' &&
        state.attackModal.explodeQueue && state.attackModal.explodeQueue[0])) return;

  const M  = state.attackModal;
  const ex = M.explodeQueue[0];
  const defSide    = getDef(ex.gid)?.side;
  const canContain = defSide && state.planning && state.planning.ap[defSide] >= 2 && !ex.contained;
  const isAttacker = !_netSide || (_netSide && defSide && _netSide !== defSide);

  let inner = `
    <div class="act-hud-title" style="color:var(--hull-crit);">💥 EXPLOSION</div>
    <div style="font-weight:600;font-size:11px;margin-bottom:2px;">${ex.name}</div>
    <div style="font-size:9px;color:var(--text-dim);margin-bottom:6px;">Blast ${ex.rangeIn}" · ${ex.layer}${ex.mod ? ` · +${ex.mod}` : ''}</div>`;

  if (!ex.rolled) {
    if (ex.contained) {
      inner += `<div style="font-size:9px;color:var(--hull-crit);margin-bottom:6px;">Containing — result 2.</div>`;
    } else if (canContain) {
      inner += `<button class="btn" id="expl-contain-btn" style="font-size:9px;width:100%;margin-bottom:6px;">⚙ Contain Reactor (2 AP)</button>`;
    }
    inner += `<div style="font-size:9px;color:var(--text-mute);margin-bottom:6px;">Declare Admiral abilities, then roll.</div>
      <button class="btn-primary" id="expl-roll-btn" style="width:100%;">${ex.contained ? 'Resolve (2) ▸' : 'ROLL 1D6 ▸'}</button>`;
  } else {
    if (ex.d1 != null) inner += `<div style="margin-bottom:4px;">${diceHtml(`explode:${ex.gid}:${ex.si}`, [{ text: ex.d1 }])}${ex.mod ? ` +${ex.mod} = <b>${ex.total}</b>` : ''}</div>`;
    inner += `<div style="color:var(--hull-crit);font-weight:600;margin-bottom:2px;font-size:10px;">${ex.effectName}</div>
      <div style="font-size:9px;color:var(--text-dim);margin-bottom:8px;">${ex.effectDesc}</div>`;
    if (ex.effKind !== 'none') {
      const mult   = ex.effKind === 'spike2x' ? 2 : 1;
      const rangePx = ex.rangeIn * INCH * mult;
      const hit = [];
      Object.keys(state.groups).forEach(agid => {
        const adef = getDef(agid);
        state.groups[agid].ships.forEach(s => {
          if (s.destroyed || s.offTable || s.attachedTo) return;
          if ((s.layer || 'orbit') !== ex.layer) return;
          if (Math.hypot(s.x - ex.x, s.y - ex.y) > rangePx) return;
          if (!hit.find(h => h.gid === agid)) hit.push({ gid: agid, name: adef.name, side: adef.side });
        });
      });
      if (hit.length) {
        inner += `<div style="font-size:9px;color:var(--text-mute);margin-bottom:3px;font-weight:600;">AFFECTED:</div>`;
        hit.forEach(h => {
          const sc = h.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
          inner += `<div style="font-size:9px;color:${sc};">${h.name}</div>`;
        });
        inner += `<div style="margin-top:4px;"></div>`;
      }
    }
    inner += `<button class="btn-primary" id="expl-resolve-btn" style="width:100%;margin-top:4px;">Resolve Effects ▸</button>`;
  }

  hud = document.createElement('div');
  hud.id = 'explosion-hud';
  hud.className = 'act-hud';
  hud.style.cssText = 'max-width:200px;border-color:rgba(255,60,60,0.5);';
  hud.innerHTML = inner;
  document.body.appendChild(hud);
  initPanel(hud, 'EXPLOSION', 'explosion-hud', 8, 56);

  const containBtn = hud.querySelector('#expl-contain-btn');
  if (containBtn) containBtn.addEventListener('click', () => dispatch({ type: 'attackDeclare', what: 'contain' }));
  const rollBtn = hud.querySelector('#expl-roll-btn');
  if (rollBtn) rollBtn.addEventListener('click', () => advanceAttack('explosion-roll'));
  const resolveBtn = hud.querySelector('#expl-resolve-btn');
  if (resolveBtn) resolveBtn.addEventListener('click', () => advanceAttack('explosion-next'));
}

/* Ascend/Descend (layer) toggle button HTML for a ship — '' when not applicable.
   Shared by the detail panel and the mobile activation HUD. */
function _layerToggleBtnHTML(def, grp, si, sideClass) {
  if (si === null || si === undefined) return '';
  const ltShip = grp.ships[si];
  const ltOrder = effectiveOrder(def, grp, si);
  const ltO = ltOrder && ORDERS[ltOrder];
  if (!(ltShip && !ltShip.destroyed && !ltShip.offTable && !ltShip.movedThisRound && ltO && ltO.moveMax > 0)) return '';
  const ltCurLayer = ltShip.layer || 'orbit';
  const ltDecayed = ltShip.crippling && ltShip.crippling.includes('decay');
  if (ltCurLayer === 'atmosphere' && ltDecayed) {
    return `<button class="btn" disabled style="width:100%;opacity:0.45;cursor:not-allowed;">↑ Ascend to Orbit — Orbital Decay</button>`;
  }
  const ltToggleLabel = ltCurLayer === 'orbit'
    ? (state.layerToggle ? '↓ Descending → Atmosphere' : '↓ Descend to Atmosphere')
    : (state.layerToggle ? '↑ Ascending → Orbit (−4")' : '↑ Ascend to Orbit (−4")');
  return `<button class="btn ${state.layerToggle ? sideClass : ''}" data-layer-toggle="1"
      style="width:100%;${state.layerToggle ? 'border-color:var(--'+sideClass+');color:var(--'+sideClass+');' : ''}">
      ${ltToggleLabel}${state.layerToggle ? ' ✓' : ''}</button>`;
}

/* Activation HUD: Undo Move · Finish Activation · Undo Deploy

// Collapsed state for the mobile activation bottom-sheet (tap the title bar to toggle).
let _actHudCollapsed = false;   // current collapse state (manual + targeting transitions)
let _actHudGid = null;          // group the HUD last rendered for
let _actHudPrevAiming = false;  // previous "tap a target" state, to detect transitions
// "Tap a target" cursors — entering one collapses the HUD; leaving it expands again.
function _actHudAiming() {
  return !!(state.targeting || state.detector || state.extracting || state.antiWing || state.featureAttack);
}
function _wireActHudCollapse(hud, gid) {
  if (!_isMobileLayout()) return;
  const handle = hud.querySelector('.dfc-panel-handle');
  if (!handle) return;
  // When just watching (replay / spectator) the movement/action HUD isn't needed —
  // default it collapsed (attack / battalion / repair / scoring panels are separate
  // and still shown). Otherwise a new group activating starts expanded.
  const watching = _replayMode || _isSpectator;
  if (gid !== _actHudGid) { _actHudGid = gid; _actHudCollapsed = watching; _actHudPrevAiming = false; }
  // Targeting transitions nudge the collapse state (but not while just watching, where
  // it should stay collapsed); the user can still toggle the bar manually.
  const aiming = _actHudAiming();
  if (!watching) {
    if (aiming && !_actHudPrevAiming) _actHudCollapsed = true;   // entered targeting → collapse
    else if (!aiming && _actHudPrevAiming) _actHudCollapsed = false; // target locked/cancelled → expand
  }
  _actHudPrevAiming = aiming;
  let chev = handle.querySelector('.act-collapse-chev');
  if (!chev) { chev = document.createElement('span'); chev.className = 'act-collapse-chev'; handle.appendChild(chev); }
  const apply = () => {
    hud.classList.toggle('collapsed', _actHudCollapsed);
    chev.textContent = _actHudCollapsed ? '▲' : '▼';
  };
  handle.style.cursor = 'pointer';
  handle.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    _actHudCollapsed = !_actHudCollapsed;
    apply();

}

  // Status text varies depending on selection.
  let status = '';
  if (state.selectedGroupId) {
    const def = getDef(state.selectedGroupId);
    const grp = state.groups[state.selectedGroupId];
    if (!canDeployNow(def)) {
      const app = approachFor(def.side);
      status = `<b>${def.name}</b> · <span style="color:var(--text-mute)">Reserve (${app === 'close' ? 'Close' : 'Distant'}) — arrives via off-table activation in play</span>`;
    } else if (!deploySideAllowed(def.side)) {
      status = `<b>${def.name}</b> · <span style="color:var(--hull-warn)">${playerNameForSide('player1')} deploys first — finish all Direct/Vanguard Groups before ${playerNameForSide('player2')} can deploy</span>`;
    } else {
      const undeployedIdx = nextUndeployedShipIdx(state.selectedGroupId);
      const total = grp.ships.filter(s => !s.destroyed).length;
      const placed = total - (grp.ships.filter(s => !s.destroyed && s.offTable).length);
      const rdp = state.redeployingShip;
      if (rdp && rdp.gid === state.selectedGroupId) {
        const rdpShip = grp.ships[rdp.si];
        const rdpName = rdpShip ? `ship ${rdp.si + 1}` : 'ship';
        status = `<b>${def.name}</b> · <span style="color:var(--hull-warn)">redeploying ${rdpName} — click in zone to place</span>`;
      } else if (undeployedIdx >= 0) {
        status = `<b>${def.name}</b> · click in zone to place ship <b>${placed + 1}</b> of <b>${total}</b>`;
      } else {
        status = `<b>${def.name}</b> · all ships placed · click a ship to redeploy it`;
      }
    }
  } else {
    // Show Direct-deployment progress per side.
    const ucmStat = directDeploymentStatus('player1');
    const shalStat = directDeploymentStatus('player2');
    const parts = [];
    if (ucmStat)  parts.push(`<span style="color:var(--ucm)">${playerNameForSide('player1')} ${ucmStat.placed}/${ucmStat.required} req</span>`);
    if (shalStat) parts.push(`<span style="color:var(--shal)">${playerNameForSide('player2')} ${shalStat.placed}/${shalStat.required} req</span>`);
    const p1Needs = sideNeedsDeployPhase('player1'), p2Needs = sideNeedsDeployPhase('player2');
    let order;
    if (p1Needs && p2Needs) {
      if (!state.deployDone.player1) order = `<span style="color:var(--ucm)">${playerNameForSide('player1')} deploys first</span>`;
      else if (!state.deployDone.player2) order = `<span style="color:var(--shal)">${playerNameForSide('player2')} deploying</span>`;
      else order = `Both sides ready`;
    } else if (p1Needs) {
      order = state.deployDone.player1 ? `${playerNameForSide('player1')} done` : `<span style="color:var(--ucm)">${playerNameForSide('player1')} deploying</span>`;
    } else if (p2Needs) {
      order = state.deployDone.player2 ? `${playerNameForSide('player2')} done` : `<span style="color:var(--shal)">${playerNameForSide('player2')} deploying</span>`;
    } else {
      order = `Ready to begin play`;
    }
    status = parts.length ? `Direct minimums: ${parts.join(' · ')} · ${order}` : order;
  }

  // Helper: builds the "Deployment Complete" button for a side, disabled with hint if minimum not met.
  const _deployDoneBtn = (id, side) => {
    const _dds = directDeploymentStatus(side);
    const _blocked = _dds && _dds.placed < _dds.required;
    const _hint = _blocked
      ? `<div style="font-size:9px;color:var(--hull-warn);margin-bottom:3px;text-align:center;">${_dds.placed} / ${_dds.required} groups required</div>`
      : '';
    return `${_hint}<button class="btn-finish-act" id="${id}" ${_blocked ? 'disabled' : ''} style="width:100%;padding:6px 10px;margin-top:0;${_blocked ? 'opacity:0.45;cursor:not-allowed;' : ''}">✓ DEPLOYMENT COMPLETE ▸</button>`;
  };

  // Footer button.
  let footerBtn;
  if (state.aiming) {
    footerBtn = '';
  } else if (state.selectedGroupId) {
    const _fDef = getDef(state.selectedGroupId);
    const _fGrp = state.groups[state.selectedGroupId];
    if (_fDef && canDeployNow(_fDef) && deploySideAllowed(_fDef.side) && netIsMySide(_fDef.side)) {
      const _allPlaced = _fGrp && nextUndeployedShipIdx(state.selectedGroupId) < 0;
      const _anyPlaced = _fGrp && _fGrp.ships.some(s => !s.destroyed && !s.offTable);
      footerBtn = `${_anyPlaced ? `<button class="btn" data-undo-deploy="${state.selectedGroupId}" style="width:100%;margin-bottom:4px;">↩ UNDO DEPLOY</button>` : ''}
        <button class="btn-finish-act" id="deploy-group-confirm" ${_allPlaced ? '' : 'disabled'} style="width:100%;padding:6px 10px;margin-top:0;${_allPlaced ? '' : 'opacity:0.45;cursor:not-allowed;'}">✓ CONFIRM DEPLOYMENT</button>`;
    } else if (!state.deployDone.player1 && netIsMySide('player1') && sideNeedsDeployPhase('player1')) {
      footerBtn = _deployDoneBtn('deploy-done-red', 'player1');
    } else if (!state.deployDone.player2 && netIsMySide('player2') && sideNeedsDeployPhase('player2')) {
      footerBtn = _deployDoneBtn('deploy-done-blue', 'player2');
    } else if (state.deployDone.player1 && state.deployDone.player2) {
      footerBtn = `<button class="btn-primary" id="commit-deploy" style="width:100%;padding:5px 10px;font-size:11px;">BEGIN PLAY →</button>`;
    } else {
      footerBtn = '';
    }
  } else if (!state.deployDone.player1 && netIsMySide('player1') && sideNeedsDeployPhase('player1')) {
    footerBtn = _deployDoneBtn('deploy-done-red', 'player1');
  } else if (!state.deployDone.player2 && netIsMySide('player2') && sideNeedsDeployPhase('player2')) {
    footerBtn = _deployDoneBtn('deploy-done-blue', 'player2');
  } else if (state.deployDone.player1 && state.deployDone.player2) {
    footerBtn = `<button class="btn-primary" id="commit-deploy" style="width:100%;padding:5px 10px;font-size:11px;">BEGIN PLAY →</button>`;
  } else {
    footerBtn = '';
  }

  hint.innerHTML = `
    <div style="font-family:var(--display);font-size:10px;letter-spacing:1px;color:var(--text);margin-bottom:2px;">DEPLOYMENT</div>
    <div style="font-size:9px;color:var(--text-mute);margin-bottom:6px;">Deploy Vanguard &amp; Direct Approach Groups</div>
    <div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;line-height:1.4;">${status}</div>
    ${footerBtn ? `<div style="margin-top:2px;">${footerBtn}</div>` : ''}
  `;
  document.querySelector('.board-hud').appendChild(hint);

  const dgc = hint.querySelector('#deploy-group-confirm');
  if (dgc) dgc.addEventListener('click', () => {
    state.selectedGroupId = null;
    state.selectedShipIdx = null;
    renderAll(true);
  });

  const cd = hint.querySelector('#commit-deploy');
  if (cd) cd.addEventListener('click', commitDeployment);
  const ddr = hint.querySelector('#deploy-done-red');
  if (ddr) ddr.addEventListener('click', () => {
    const left = undeployedDeployableCount('player1');
    const stat = directDeploymentStatus('player1');
    if (stat && stat.placed < stat.required) { flashLaunchMsg(`${playerNameForSide('player1')} must place their Direct minimum first`); return; }
    dispatch({ type: 'deployDone', side: 'player1' });
  });
  const ddb = hint.querySelector('#deploy-done-blue');
  if (ddb) ddb.addEventListener('click', () => {
    const left = undeployedDeployableCount('player2');
    const stat = directDeploymentStatus('player2');
    if (stat && stat.placed < stat.required) { flashLaunchMsg(`${playerNameForSide('player2')} must place their Direct minimum first`); return; }
    dispatch({ type: 'deployDone', side: 'player2' });
  });
}

function renderScenBanner() {
  const board = document.querySelector('.board-wrap');
  let bn = document.getElementById('scen-banner');
  if (bn) bn.remove();
  if (state.phase !== 'play' || !state.scenario) return;
  const _bnAsym = !!state.scenario.objectives;
  const obj = OBJECTIVES[state.scenario.objective];
  // In online mode show only this player's info; in hotseat show both sides.
  const sides = _netSide ? [_netSide] : ['player1', 'player2'];
  const lines = sides.map(side => {
    const fName = FACTIONS[state.factions?.[side]]?.name || playerNameForSide(side);
    const col   = side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
    const sideObj = _bnAsym ? OBJECTIVES[objectiveForSide(side)] : null;
    const secKeys = (state.secondaries && state.secondaries[side]) || [];
    const secText = secKeys.map(k => SECONDARY_OBJECTIVES[k]?.name).filter(Boolean).join(', ');
    return `<div style="margin-bottom:1px;">
      <span style="font-size:9px;font-weight:700;color:${col};">${fName}${sideObj ? ` · ${sideObj.name}` : ''}</span>
      ${secText ? `<div style="font-size:8px;color:${col};opacity:0.8;">${secText}</div>` : ''}
    </div>`;
  }).join('');
  bn = document.createElement('div');
  bn.id = 'scen-banner';
  bn.className = 'scen-banner';

  const flActive  = !!document.getElementById('fleet-view-overlay');
  const btnStyle  = (active) => `display:inline-block;margin:0 2px 0 0;padding:2px 6px;font-family:var(--mono);font-size:9px;letter-spacing:0.08em;cursor:pointer;border-radius:2px;border:1px solid ${active ? 'var(--border-bright)' : 'var(--border)'};background:rgba(8,16,15,0.85);color:${active ? 'var(--text)' : 'var(--text-mute)'};`;
  bn.innerHTML = `<div class="scen-banner-text"><b>${_bnAsym ? 'Asymmetric' : (obj ? obj.name : '')}</b>${lines}</div>
    <div class="scen-banner-btns" style="margin-top:5px;border-top:1px solid rgba(255,255,255,0.07);padding-top:5px;">
      <button id="btn-view-toggle" class="mobile-only" style="${btnStyle(!!_view3d)}" title="Toggle 2D / 3D view">3D</button>
      <button class="mobile-only" data-arcview="1" style="${btnStyle(arcViewMode===1)}" title="Arcs + Scan">⚙</button>
      <button class="mobile-only" data-arcview="2" style="${btnStyle(arcViewMode===2)}" title="Signatures">◎</button>
      <button class="mobile-only" data-trails-toggle style="${btnStyle(_view3dTrails)}" title="Movement trails">↝</button>
      <button id="btn-vp-toggle" style="${btnStyle(vpActive)}" title="Toggle VP breakdown">VP</button>
      <button id="btn-ap-toggle" style="${btnStyle(apActive)}" title="Toggle Ability Points">AP</button>
      <button id="btn-fleet-toggle" style="${btnStyle(flActive)}" title="Toggle Fleet View">FL</button>
    </div>`;
  board.appendChild(bn);
}

  if (state.phase === 'setup') {
    const f1 = state.fleetChoices?.f1 && FACTIONS[state.fleetChoices.f1];
    const f2 = state.fleetChoices?.f2 && FACTIONS[state.fleetChoices.f2];
    if (f1 || f2) {
      const c1 = PLAYER_COLORS[state.playerColors?.f1 || FACTION_COLORS[state.fleetChoices?.f1] || 'blue']?.hex || '#4ad6ff';
      const c2 = PLAYER_COLORS[state.playerColors?.f2 || FACTION_COLORS[state.fleetChoices?.f2] || 'red']?.hex || '#ff5252';
      const n1 = f1 ? f1.name.toUpperCase() : 'DFC';
      const n2 = f2 ? f2.name.toUpperCase() : 'FLEET OPS';
      brandEl.innerHTML = `<span id="brand-red" style="color:${c1}">${n1}</span><span class="vs">VS</span><span id="brand-blue" style="color:${c2}">${n2}</span>`;

      brandEl.innerHTML = `<span id="brand-red">DFC</span><span class="vs">VS</span><span class="shal-name" id="brand-blue">FLEET OPS</span>`;

      state.vpBreakdownOpen = true;
      state.vpAnchor = { top: r.bottom, left: r.left };

    };
    if (_isMobileLayout()) {
      // Condensed top bar: just "p1vp – p2vp" in player colours.
      brandEl.innerHTML = `<button id="brand-vp-btn" title="Victory Point breakdown"
        style="display:flex;align-items:center;gap:7px;background:none;border:none;padding:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px;line-height:1;">
        <span style="color:var(--ucm);">${u.vp}</span>
        <span style="color:var(--text-mute);font-size:15px;">–</span>
        <span style="color:var(--shal);">${s.vp}</span>
      </button>`;
      brandEl.querySelector('#brand-vp-btn').addEventListener('click', openVp);
      return;
    }
    brandEl.innerHTML = `<button id="brand-vp-btn" title="Click for Victory Point breakdown"
      style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;font-family:var(--display);">
      <span style="color:var(--ucm);font-size:11px;letter-spacing:0.1em;font-weight:700;">${factionName('player1').toUpperCase()}</span>
      <span style="color:var(--ucm);font-weight:700;font-size:17px;line-height:1;">${u.vp}</span>
      <span style="color:var(--text-dim);font-size:9px;letter-spacing:0.06em;">${playerNameForSide('player1').toUpperCase()}</span>
      <span class="vs">VS</span>
      <span style="color:var(--text-dim);font-size:9px;letter-spacing:0.06em;">${playerNameForSide('player2').toUpperCase()}</span>
      <span style="color:var(--shal);font-weight:700;font-size:17px;line-height:1;">${s.vp}</span>
      <span style="color:var(--shal);font-size:11px;letter-spacing:0.1em;font-weight:700;">${factionName('player2').toUpperCase()}</span>
    </button>`;
    brandEl.querySelector('#brand-vp-btn').addEventListener('click', openVp);
    return;
  }
  brandEl.innerHTML = `<span id="brand-red">${factionName('player1').toUpperCase()}</span><span class="vs">VS</span><span class="shal-name" id="brand-blue">${factionName('player2').toUpperCase()}</span>`;
}

function currentPlaySubPhase() {
  if (state.repairPhase)        return 'END PHASE';
  if (state.assetPhase)         return 'ASSET';
  if (state.dropsiteActivation) return 'DROPSITE';
  if (state.activeSide)         return 'ACTIVATION';
  if (state.initiative)         return 'PLANNING';
  return null;
}

function renderPhaseNav() {
  const nav = document.getElementById('phase-nav');
  if (nav && state.phase === 'play') {
    const sub = currentPlaySubPhase();
    nav.style.display = sub ? '' : 'none';
    if (sub) {
      const pName = state.activeSide ? playerNameForSide(state.activeSide).toUpperCase() : null;
      const pCol  = state.activeSide ? `var(--${sideCssKey(state.activeSide)})` : null;
      const label = pName
        ? `RND <b>${state.round}</b> / 6: <span style="color:${pCol};">${pName}</span> – ${sub}`
        : `RND <b>${state.round}</b> / 6: ${sub}`;
      nav.innerHTML = `<span style="font-family:var(--display);font-size:12px;letter-spacing:0.14em;color:var(--text);">${label}</span>`;
    }
    return;
  }
  // Restore the phase-step breadcrumb if it was replaced.
  if (nav && !nav.querySelector('.phase-step')) {
    nav.innerHTML = `<span class="phase-step" data-phase="setup">1 · SETUP</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="scenery">2 · SCENERY</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="nominations">3 · SECONDARIES</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="deploy">4 · DEPLOY</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="play">5 · PLAY</span>`;
  }
  document.querySelectorAll('.phase-step').forEach(el => {
    el.classList.toggle('active', el.dataset.phase === state.phase);
    const phases = ['setup','scenery','nominations','deploy','play'];
    const curIdx = phases.indexOf(state.phase);
    const elIdx = phases.indexOf(el.dataset.phase);
    el.classList.toggle('done', elIdx < curIdx);
  });
}

/* ── Mobile drawers ─────────────────────────────────────────────────────────
   At ≤860px the two side panels are off-screen slide-overs; the top bar exposes
   a toggle for each. Tapping the scrim, selecting a unit, or confirming an
   action closes them. */
function _isMobileLayout() {
  return window.matchMedia && window.matchMedia('(max-width: 860px)').matches;
}
function _syncDrawerToggles() {
  const lp = document.getElementById('panel-left');
  const rp = document.getElementById('panel-right');
  const l = document.getElementById('m-toggle-left');
  const r = document.getElementById('m-toggle-right');
  if (l) l.classList.toggle('active', !!(lp && lp.classList.contains('mobile-open')));
  if (r) r.classList.toggle('active', !!(rp && rp.classList.contains('mobile-open')));
}
function closeMobileDrawers() {
  document.querySelectorAll('.panel.mobile-open').forEach(p => p.classList.remove('mobile-open'));
  const sc = document.getElementById('mobile-scrim');
  if (sc) sc.classList.remove('show');
  _syncDrawerToggles();
}
function toggleMobileDrawer(which) {
  const el = document.getElementById(which === 'left' ? 'panel-left' : 'panel-right');
  if (!el) return;
  const willOpen = !el.classList.contains('mobile-open');
  closeMobileDrawers();
  if (willOpen) {
    el.classList.add('mobile-open');
    const sc = document.getElementById('mobile-scrim');
    if (sc) sc.classList.add('show');
  }
  _syncDrawerToggles();
}
// On mobile, reserve space at the bottom of the board for the scenery-placement
// and deployment panels only (so the board stays clear while placing). The
// in-game popups (initiative, VP/AP/Fleet, activation, attack, asset, end phase)
// float OVER the map and do not resize it.
function _syncBoardBottomInset() {
  const wrap = document.querySelector('.board-wrap');
  if (!wrap) return;
  if (!_isMobileLayout()) { wrap.style.paddingBottom = ''; return; }
  const vh = window.innerHeight;
  let inset = 0;
  document.querySelectorAll('#scenery-banner, #deploy-hint').forEach(p => {
    const r = p.getBoundingClientRect();
    // Bottom panels sit flush with the bottom of the viewport.
    if (r.height > 0 && r.bottom >= vh - 2) inset = Math.max(inset, r.height);
  });
  wrap.style.paddingBottom = inset ? inset + 'px' : '';
}
// Close the Fleet View overlay + its backdrop (used to keep VP/AP/Fleet mutually exclusive).
function _closeFleetViewPanels() {
  document.getElementById('fleet-view-backdrop')?.remove();
  document.getElementById('fleet-view-overlay')?.remove();
}
// On mobile, auto-open the Fleet drawer when it becomes the player's turn to pick a
// group to activate. Keyed per activation context so it opens once and won't fight a
// manual close.
let _lastAutoFleetKey = null;
function _maybeAutoOpenFleet() {
  if (!_isMobileLayout() || state.phase !== 'play' || _replayMode) { _lastAutoFleetKey = null; return; }
  const myTurn = _isSpectator ? false : (!_netSide ? !!state.activeSide : (state.activeSide === _netSide));
  if (!myTurn) return;
  const activated = Object.values(state.groups).filter(g => g.activated).length;
  const key = `${state.round}:${state.activeSide}:${activated}`;
  if (key === _lastAutoFleetKey) return;
  _lastAutoFleetKey = key;
  const el = document.getElementById('panel-left');
  if (el && !el.classList.contains('mobile-open')) {
    closeMobileDrawers();
    el.classList.add('mobile-open');
    const sc = document.getElementById('mobile-scrim'); if (sc) sc.classList.add('show');
    _syncDrawerToggles();
  }
}
{
  const _sc = document.getElementById('mobile-scrim');
  if (_sc) _sc.addEventListener('click', closeMobileDrawers);
  // Drop the drawer state if the viewport grows back to desktop width.
  window.addEventListener('resize', () => {
    if (!_isMobileLayout()) closeMobileDrawers();
    _syncBoardBottomInset();
    if (!_view3d) _applyViewBox();
    try { renderBrand(); } catch (e) {} // swap condensed/full brand across the breakpoint
  });
}

function renderTopbarControls() {
  const ctrl = document.getElementById('topbar-controls');
  if (!ctrl) return;
  // The only top-bar controls are the mobile drawer toggles; hidden on desktop
  // via .mobile-only, and suppressed entirely during pre-game setup.
  if (state.phase === 'setup') { ctrl.innerHTML = ``; return; }
  ctrl.innerHTML =
    `<button class="btn mobile-only" id="m-toggle-left" title="Fleet">‹ FLEET</button>` +
    `<button class="btn mobile-only" id="m-toggle-right" title="Detail">DETAIL ›</button>`;
  const l = document.getElementById('m-toggle-left');
  const r = document.getElementById('m-toggle-right');
  if (l) l.onclick = () => toggleMobileDrawer('left');
  if (r) r.onclick = () => toggleMobileDrawer('right');
  _syncDrawerToggles(); // keep the active highlight after a re-render
}



function renderAll(localOnly = false) {
  // Remove the startup cover on the first render — by now the setup overlay
  // is already in the DOM, so nothing flashes underneath.
  const _cover = document.getElementById('app-cover');
  if (_cover) _cover.remove();
  // Wrap ALL rendering in try/catch so the relay always fires even if a render
  // function throws — a stuck _netReceiving=true would silence all relay.
  try {
    applyThemeColors();
    syncPayloads();
    updateArcViewHud();
    renderBrand();
    renderPhaseNav();
    renderTopbarControls();
    renderUserChip();
    renderPanels();
    renderDetail();
    renderBoard();
    // 2D↔3D auto-switching:
    // → 3D on entering deploy or play (first planning phase)
    // → 2D on entering nominations or protect nomination
    const _to3d = (state.phase === 'deploy' && _prevPhase !== 'deploy') ||
                  (state.phase === 'play'   && _prevPhase !== 'play');
    const _to2d = (state.phase === 'nominations' && _prevPhase !== 'nominations') ||
                  (state.phase === 'protect' && _prevPhase !== 'protect');
    _prevPhase = state.phase;
    if (_to3d && !_view3d) toggle3d();
    if (_to2d && _view3d) toggle3d();
    if (_view3d && _3d) sync3d();
    renderSetupOverlay();
    renderNominationModal();
    renderProtectNomModal();
    renderDropsiteActivation();
    renderPayloadAssign();
    renderAttackModal();
    renderAtmoModal();
    renderRepairPhase();
    renderBattalionDeployModal();
    renderDogfightModal();
    renderScoreboard();
    renderEventLog();
    renderApEditModal();
    renderScoringModal();
    renderVPBreakdown();
    renderDetonationModal();
    renderGameOver();
    renderSceneryPlacement();
    renderAssetPhase();
    renderInitiative();
    renderDeployHint();
    renderActivationHUD();
    renderExplosionHUD();
    renderFeatureAttackHUD();
    renderScenBanner();
    updateHUD();
    renderAimHint();
  } catch(e) {
    console.error('[renderAll]', e);
  }
  // Keep the board clear of the bottom-docked popup on mobile.
  try { _syncBoardBottomInset(); } catch(e) {}
  // Auto-open the fleet drawer when it's the player's turn to activate (mobile).
  try { _maybeAutoOpenFleet(); } catch(e) {}
  // Selection-only renders skip the relay — both clients manage their own view state.
  // Replay mode never relays — we're rendering a historical state copy.
  if (!localOnly && !_replayMode) {
    if (state.phase === 'setup' || state.phase === 'scenery' || state.phase === 'nominations') netRelaySetup();
  }
  // Hotseat only: auto-activate ineligible off-table groups. In online mode the
  // server pre-activates them inside rollInitiative so no client dispatch needed.
  if (state.phase === 'play' && !_replayMode && !_netSide) setTimeout(_autoSkipIneligible, 0);
  renderReplayControls();
  // Cursor: crosshair when targeting / placing / aiming on either board.
  const _cursorCrosshair = (() => {
    if (state.targeting || state.detector || state.extracting || state.payloadDetach) return true;
    if (state.aiming || state.vectoredSecondMove || state.launching || (state.assetPhase && state.assetPhase.step === 'assets') || (state.phase === 'scenery' && state.sceneryPlace)) return true;
    if (!state.selectedGroupId) return false;
    const _ccDef = getDef(state.selectedGroupId);
    const _ccGrp = state.groups[state.selectedGroupId];
    const _ccUd  = nextUndeployedShipIdx(state.selectedGroupId);
    if (_ccDef && state.phase === 'deploy' && canDeployNow(_ccDef) && deploySideAllowed(_ccDef.side)) {
      if (_ccUd >= 0 || state.redeployingShip) return true;
    } else if (_ccDef && state.phase === 'play' && _ccGrp) {
      if (_ccUd >= 0 && !_ccGrp.activated && canActivateOffTable(_ccDef).eligible) return true;
      if (state.selectedShipIdx !== null && !_ccGrp.activated) {
        const _ccShip = _ccGrp.ships[state.selectedShipIdx];
        const _ccOrd  = effectiveOrder(_ccDef, _ccGrp, state.selectedShipIdx);
        if (_ccShip && !_ccShip.destroyed && !_ccShip.offTable && !_ccShip.movedThisRound && _ccOrd && ORDERS[_ccOrd] && ORDERS[_ccOrd].moveMax > 0) return true;
      }
    }
    return false;
  })();
  const board = document.getElementById('board');
  if (board) board.style.cursor = _cursorCrosshair ? 'crosshair' : 'default';
  const _canvas3d = document.getElementById('board3d');
  if (_canvas3d) _canvas3d.style.cursor = _cursorCrosshair ? 'crosshair' : '';
}

function renderReplayControls() {
  const bar = document.getElementById('replay-bar');
  if (!bar) return;
  if (!_replayMode) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const total = _replayData.intentLog.length - 1; // max step index
  const counter = document.getElementById('replay-counter');
  const roundLabel = document.getElementById('replay-round-label');
  if (counter) counter.innerHTML = `<span class="rlbl">Step </span>${_replayStep + 1} / ${_replayData.intentLog.length}`;
  if (roundLabel) {
    const r = state.round || 1;
    roundLabel.innerHTML = `<span class="rlbl">— Round </span><span class="rl-short">R</span>${r}`;
  }
  const playPause = document.getElementById('replay-play-pause');
  if (playPause) {
    const playing = !!_replayInterval;
    const icon = playPause.querySelector('.rl-icon');
    const lbl  = playPause.querySelector('.rlbl');
    if (icon) icon.textContent = playing ? '⏸' : '▶';
    if (lbl)  lbl.textContent  = playing ? ' PAUSE' : ' PLAY';
  }
  const prevBtn = document.getElementById('replay-prev');
  if (prevBtn) prevBtn.disabled = _replayStep < 0;
  const nextBtn = document.getElementById('replay-next');
  if (nextBtn) nextBtn.disabled = _replayStep >= total;
  const prevRndBtn = document.getElementById('replay-round-prev');
  if (prevRndBtn) prevRndBtn.disabled = _replayStep < 0;
  const nextRndBtn = document.getElementById('replay-round-next');
  if (nextRndBtn) nextRndBtn.disabled = _replayStep >= total;
}

/* Compress the raw intent log before replaying.
   Two passes:
   1. Mark undone intent pairs for removal:
      - undoDeploy{gid} cancels all preceding deployShip{gid} in this activation.
      - undoMove{gid,si} cancels the preceding moveShip{gid,si} + any aimShip after it.
   2. Bundle surviving intents within each activation chunk:
      - All deployShip for the same group → one replay step (ships appear at final positions).
      - All moveShip/aimShip for the group → one replay step (ships arrive at final positions).
      - Everything else (applyOrder, fireWeapons, finishActivation…) stays as individual steps. */
function compressReplayLog(intentLog) {
  // ── Pass 1: mark undo pairs for removal ──────────────────────────────────
  const removed = new Set();
  const deployStacks = {};   // gid → [intentLog idx] of pending deployShip
  const shipHist     = {};   // `gid:si` → [{idx, type:'move'|'aim'}]
  const lastMovedSi  = {};   // gid → si (aimShip has gid but not si)

  intentLog.forEach((entry, i) => {
    const { type, gid, si } = entry.intent;
    if (type === 'deployShip' || type === 'arriveShip') {
      (deployStacks[gid] = deployStacks[gid] || []).push(i);
    } else if (type === 'undoDeploy') {
      (deployStacks[gid] || []).forEach(idx => removed.add(idx));
      delete deployStacks[gid];
      removed.add(i);
    } else if (type === 'moveShip') {
      const key = `${gid}:${si}`;
      (shipHist[key] = shipHist[key] || []).push({ idx: i, type: 'move' });
      lastMovedSi[gid] = si;
    } else if (type === 'aimShip') {
      const resolvedSi = lastMovedSi[gid];
      if (resolvedSi !== undefined)
        (shipHist[`${gid}:${resolvedSi}`] = shipHist[`${gid}:${resolvedSi}`] || []).push({ idx: i, type: 'aim' });
    } else if (type === 'undoMove') {
      removed.add(i);
      const hist = shipHist[`${gid}:${si}`] || [];
      while (hist.length > 0) { const top = hist.pop(); removed.add(top.idx); if (top.type === 'move') break; }
      shipHist[`${gid}:${si}`] = hist;
      if (!hist.some(h => h.type === 'move')) delete lastMovedSi[gid];
    } else if (type === 'finishActivation') {
      delete deployStacks[gid];
      Object.keys(shipHist).filter(k => k.startsWith(gid + ':')).forEach(k => delete shipHist[k]);
      delete lastMovedSi[gid];
    }
  });

  // ── Pass 2: bundle and emit ───────────────────────────────────────────────
  const result = [];
  let chunk = []; // surviving entries since last finishActivation

  const flushChunk = () => {
    if (!chunk.length) return;
    // Collect deploy and move/aim entries; everything else emits individually.
    const deployEntries = [], moveEntries = [];
    chunk.forEach(e => {
      const t = e.intent.type;
      if (t === 'deployShip' || t === 'arriveShip') deployEntries.push(e);
      else if (t === 'moveShip' || t === 'aimShip') moveEntries.push(e);
    });
    const mkBundle = (entries) =>
      entries.length === 1 ? entries[0] : { ...entries[0], intents: entries.map(e => e.intent) };

    let deployDone = false, moveDone = false;
    chunk.forEach(e => {
      const t = e.intent.type;
      if (t === 'deployShip' || t === 'arriveShip') {
        if (!deployDone) { result.push(mkBundle(deployEntries)); deployDone = true; }
      } else if (t === 'moveShip' || t === 'aimShip') {
        if (!moveDone) { result.push(mkBundle(moveEntries)); moveDone = true; }
      } else {
        result.push(e);
      }
    });
    chunk = [];
  };

  intentLog.forEach((entry, i) => {
    if (removed.has(i)) return;
    if (entry.intent.type === 'finishActivation') {
      flushChunk();
      result.push(entry);
    } else {
      chunk.push(entry);
    }
  });
  flushChunk();

  return result;
}

/* Return the primary intent type from a (possibly bundled) replay log entry. */
function _replayEntryType(entry) {
  return entry.intents ? entry.intents[0].type : entry.intent.type;
}

function loadReplay(data) {
  if (!data || !data.playStartState) {
    alert('No replay data available for this game yet (play must have started).');
    return;
  }
  clearInterval(_replayInterval);
  _replayInterval = null;
  _liveState  = state;
  _replayMode = true;
  _replayData = { ...data, intentLog: compressReplayLog(data.intentLog) };
  _replayStep = -1;
  _replayRng  = _makeRng(data.seed);
  _replayRng.setState(data.playStartRngState);
  state = structuredClone(data.playStartState);
  if (data.roomId) history.pushState({}, '', `${location.pathname}?replay=${data.roomId}`);
  renderAll(true);
}

// ── Replay movement animation ─────────────────────────────────────────────────
let _replayAnim = null; // { rafId, ships:[{gid,si,x0,y0,h0,x1,y1,h1}] }

function _animLerpAngle(a, b, t) {
  const d = ((b - a + 540) % 360) - 180;
  return (a + d * t + 360) % 360;
}

function _cancelReplayAnim() {
  if (!_replayAnim) return;
  cancelAnimationFrame(_replayAnim.rafId);
  // Snap every ship to its final position.
  _replayAnim.ships.forEach(({ gid, si, x1, y1, h1 }) => {
    const ship = state.groups[gid]?.ships[si];
    if (ship) { ship.x = x1; ship.y = y1; ship.heading = h1; }
  });
  _replayAnim = null;
}

function _startReplayMoveAnim(ships) {
  _cancelReplayAnim();
  const DURATION = 700;
  const t0 = performance.now();
  const anim = { rafId: null, ships };
  _replayAnim = anim;

  const tick = (now) => {
    if (_replayAnim !== anim) return; // superseded
    const raw = Math.min(1, (now - t0) / DURATION);
    // Ease-in-out quadratic
    const ease = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
    ships.forEach(({ gid, si, x0, y0, h0, x1, y1, h1 }) => {
      const ship = state.groups[gid]?.ships[si];
      if (!ship) return;
      ship.x = x0 + (x1 - x0) * ease;
      ship.y = y0 + (y1 - y0) * ease;
      ship.heading = _animLerpAngle(h0, h1, ease);
    });
    renderAll(true);
    if (raw < 1) {
      anim.rafId = requestAnimationFrame(tick);
    } else {
      // Snap to exact end and clear
      ships.forEach(({ gid, si, x1, y1, h1 }) => {
        const ship = state.groups[gid]?.ships[si];
        if (ship) { ship.x = x1; ship.y = y1; ship.heading = h1; }
      });
      _replayAnim = null;
      renderAll(true);
    }
  };
  anim.rafId = requestAnimationFrame(tick);
}

function replayGoTo(targetStep) {
  if (!_replayMode || !_replayData) return;
  _cancelReplayAnim();
  const log = _replayData.intentLog;
  const clampedStep = Math.max(-1, Math.min(targetStep, log.length - 1));
  // If seeking backward, reset to playStartState
  if (clampedStep < _replayStep) {
    _replayRng.setState(_replayData.playStartRngState);
    state = structuredClone(_replayData.playStartState);
    _replayStep = -1;
  }
  // Fast-forward to target — each entry may be a single intent or a bundle.
  // The final step animates if it contains moveShip intents.
  while (_replayStep < clampedStep) {
    _replayStep++;
    const entry = log[_replayStep];
    const intents = entry.intents || [entry.intent];
    const isLast = _replayStep === clampedStep;
    const moveIntents = isLast ? intents.filter(i => i.type === 'moveShip') : [];

    if (moveIntents.length > 0) {
      // Capture start positions before applying.
      const ships = moveIntents.map(i => {
        const ship = state.groups[i.gid]?.ships[i.si];
        return ship ? { gid: i.gid, si: i.si, x0: ship.x, y0: ship.y, h0: ship.heading } : null;
      }).filter(Boolean);

      // Apply the full bundle (moveShip + aimShip → sets final x/y/heading).
      intents.forEach(intent => {
        try { _apply(state, intent, _replayRng); } catch(e) { console.warn('[replay]', e); }
      });

      // Record end positions, then rewind ships to start so animation plays forward.
      ships.forEach(s => {
        const ship = state.groups[s.gid]?.ships[s.si];
        if (!ship) return;
        s.x1 = ship.x; s.y1 = ship.y; s.h1 = ship.heading;
        ship.x = s.x0; ship.y = s.y0; ship.heading = s.h0;
      });

      renderAll(true); // draw ships at start positions with trail from moveTrail
      _startReplayMoveAnim(ships);
      return; // animation drives the rest
    }

    intents.forEach(intent => {
      try { _apply(state, intent, _replayRng); } catch(e) { console.warn('[replay] step', _replayStep, e); }
    });
  }
  renderAll(true);
}

function exitReplay() {
  _cancelReplayAnim();
  clearInterval(_replayInterval);
  _replayInterval = null;
  // Navigate to the root — full page reload returns to the mode selector.
  location.href = location.pathname;
}

function _replayRoundStart(round) {
  if (!_replayMode || !_replayData) return -1;
  const log = _replayData.intentLog;
  for (let i = 0; i < log.length; i++) {
    if (_replayEntryType(log[i]) === 'advanceRound') {
      replayGoTo(i);
      return i;
    }
  }
  return -1;
}

function _3dShipRotY(headingDeg) {
  const r = headingDeg * Math.PI / 180;
  return Math.atan2(-Math.cos(r), -Math.sin(r));
}

// ─── 3D INTERACTION HELPERS ──────────────────────────────────────────────────

// Convert a pointer event to normalised device coords (-1..1) for the 3D canvas.
function _3dNDC(e) {
  const canvas = _3d.renderer.domElement;
  const rect = canvas.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width)  *  2 - 1,
    ((e.clientY - rect.top)  / rect.height) * -2 + 1
  );
}

// Project a pointer event onto a horizontal plane at world Y = planeY.
// Returns board coords {x, y} (0-576) or null if the ray misses the plane.
function _3dProjectToPlane(e, planeY) {
  if (!_3d) return null;
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(_3dNDC(e), _3d.camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -planeY);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, hit)) return null;
  return { x: Math.max(0, Math.min(576, hit.x + 288)), y: Math.max(0, Math.min(576, hit.z + 288)) };
}

// Raycast against all ship meshes; return hit info or null.
// Optional filterFn({gid, si, mesh}) can restrict candidates.
function _3dHitShip(e, filterFn) {
  if (!_3d || !_3dShipMeshes.length) return null;
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(_3dNDC(e), _3d.camera);
  // Increase mesh/line thresholds so small ship models are easier to click,
  // especially at distance or oblique angles.
  raycaster.params.Mesh.threshold = 3;
  raycaster.params.Line = raycaster.params.Line || {};
  raycaster.params.Line.threshold = 4;
  const candidates = filterFn ? _3dShipMeshes.filter(filterFn) : _3dShipMeshes;
  const meshes = candidates.map(m => m.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  if (!hits.length) return null;
  // Walk up to the tagged ancestor
  let obj = hits[0].object;
  while (obj && !obj.userData.gid) obj = obj.parent;
  if (!obj) return null;
  const { gid, si: siStr } = obj.userData;
  const si = parseInt(siStr);
  const grp = state.groups[gid];
  if (!grp) return null;
  const ship = grp.ships[si];
  if (!ship || ship.destroyed || ship.offTable) return null;
  return { gid, si, ship, grp, def: getDef(gid) };
}

// Find the nearest dropsite to a 3D click, checking both orbit (station) and
// ground (city) planes. Returns { ds, pt } where pt is board-pixel coords, or null.
function _3dNearestDropsite(e, hitRadiusPx) {
  const dss = (state.scenarioData && state.scenarioData.dropsites) || [];
  if (!dss.length) return null;
  const rad = hitRadiusPx ?? (4 * INCH);
  let best = null, bestD = Infinity;
  const check = (pt, ds) => {
    if (!pt) return;
    const d = Math.hypot(inchToPx(ds.x) - pt.x, inchToPx(ds.y) - pt.y);
    if (d < rad && d < bestD) { bestD = d; best = { ds, pt: { x: inchToPx(ds.x), y: inchToPx(ds.y) } }; }
  };
  const ptOrbit  = _3dProjectToPlane(e, _3D_LAYER_Y.orbit);
  const ptGround = _3dProjectToPlane(e, 0);
  dss.forEach(ds => {
    const isStation = DROPSITE_BASE[ds.type]?.category === 'station';
    check(isStation ? ptOrbit : ptGround, ds);
  });
  return best;
}

// ─── 3D CLICK HANDLER ────────────────────────────────────────────────────────

function _handle3dClick(e) {
  if (state.phase === 'setup') return;

  // Scenery placement — two-click flow: first click sets position, second sets angle.
  if (state.phase === 'scenery' && state.sceneryPlace) {
    const _sp = state.sceneryPlace;
    const _scY = (_3D_LAYER_Y.orbit + _3D_LAYER_Y.atmosphere) / 2; // cloud mid-layer Y=90
    const _scPt = _3dProjectToPlane(e, _scY);
    if (!_scPt) return;
    if (!_sp.pending) {
      // First click: validate position and lock it in.
      const _scValid = sceneryValid(_sp.type, _scPt.x / INCH, _scPt.y / INCH);
      if (!_scValid.ok) { flashLaunchMsg(_scValid.reason || 'Invalid placement'); return; }
      _sp.pending = { x: _scPt.x, y: _scPt.y };
      _sp.angle = 0;
      state.hoverPoint = null;
      renderAll(true);
    } else {
      // Second click: dispatch server-authoritative placement.
      const _scAngle = headingToward(_sp.pending.x, _sp.pending.y, _scPt.x, _scPt.y);
      const _scX = _sp.pending.x / INCH, _scY = _sp.pending.y / INCH, _scType = _sp.type;
      _sp.pending = null; _sp.angle = 0; state.hoverPoint = null;
      // Advance local type display immediately for responsive UI.
      const _scPlaced = (state.scenarioData.placedScenery || []).filter(s => s.type === _scType).length + 1;
      if (_scPlaced >= ((state.scenarioData.sceneryTargets || {})[_scType] || 0))
        _sp.type = _scType === 'micrometeor' ? 'dense' : 'micrometeor';
      dispatch({ type: 'placeScenery', sceneryType: _scType, x: _scX, y: _scY, angle: _scAngle });
      renderAll();
    }
    return;
  }
