<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0d">
<title>DFC FLEET OPS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e0d; --bg-elev: #11171a; --bg-card: #161e22;
    --bg-card-2: #1a242a;
    --border: #233038; --border-bright: #2f4250;
    --text: #d8e3e8; --text-dim: #7a8a94; --text-mute: #4a5862;
    --ucm: #d4a647; --ucm-dim: #7a5e1f; --ucm-glow: rgba(212,166,71,0.30);
    --shal: #4ad6ff; --shal-dim: #1f6e8c; --shal-glow: rgba(74,214,255,0.25);
    --hull-good: #4ad6ff; --hull-warn: #ffb547; --hull-crit: #ff5252;
    --grid-line: rgba(212,166,71,0.07);
    --grid-line-shal: rgba(74,214,255,0.07);
    --table-bg: #08100f;
    --mono: 'Roboto Mono', ui-monospace, monospace;
    --display: 'Oswald', 'Impact', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Remove the 300ms tap delay / double-tap-zoom on controls (app-like feel). */
  button, .btn, .group-card, .weapon-row, .order-btn, .faction-btn, .hud-btn, .hud-icon-btn { touch-action: manipulation; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  * { font-feature-settings: "zero" 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 12px; line-height: 1.4;
    background-image:
      radial-gradient(ellipse at top, rgba(74,214,255,0.04), transparent 60%),
      linear-gradient(to bottom, var(--bg), #060a0c);
    user-select: none;
  }

  /* ============== LAYOUT ============== */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    grid-template-rows: 48px auto 1fr;
    height: 100vh;
    height: 100dvh; /* track the dynamic viewport so mobile browser chrome doesn't clip the bottom row */
    gap: 0;
  }
  /* Pin panels and board to row 3 so they always occupy the 1fr row even when
     #replay-bar (display:none) is absent from the grid and the auto row collapses. */
  .panel, .board-wrap { grid-row: 3; }
  /* During Setup the side panels are hidden; collapse their columns so the board
     area (and the centred scenario overlay) spans the full width. Panels keep
     visibility:hidden (not display:none) so the board stays in its centre track. */
  .app.panels-hidden { grid-template-columns: 0 1fr 0; }
  .app.panels-hidden .panel { visibility: hidden; }
  .topbar {
    grid-column: 1 / -1;
    background: linear-gradient(180deg, #0e1518 0%, #0a1014 100%);
    border-bottom: 1px solid var(--border-bright);
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .brand {
    font-family: var(--display); font-weight: 700;
    font-size: 18px; letter-spacing: 0.15em;
    color: var(--ucm); text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .brand .vs { color: var(--text-mute); font-size: 11px; }
  .brand .shal-name { color: var(--shal); }
  .topbar-controls { display: flex; align-items: center; gap: 10px; }
  .btn {
    background: linear-gradient(180deg, #1a242a 0%, #11181c 100%);
    border: 1px solid var(--border-bright);
    color: var(--text); padding: 6px 12px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--ucm-dim); color: var(--ucm); }
  .btn.active { border-color: var(--ucm-dim); color: var(--ucm); background: var(--ucm-glow); }
  .btn:active { transform: scale(0.96); }
  .btn.shal:hover { border-color: var(--shal-dim); color: var(--shal); }
  .btn-icon {
    width: 28px; height: 28px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: grid; place-items: center;
    cursor: pointer; border-radius: 3px;
    font-size: 14px;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--border-bright); }
  .round-display {
    font-family: var(--display); font-size: 14px;
    color: var(--text-dim); letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .round-display b { color: var(--text); font-weight: 700; }

  /* ============== PHASE NAV ============== */
  .phase-nav {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--display); font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .phase-step {
    color: var(--text-mute);
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .phase-step.active {
    color: var(--ucm);
    border-color: var(--ucm-dim);
    background: var(--ucm-glow);
  }
  .phase-step.done { color: var(--text-dim); }
  .phase-arrow { color: var(--text-mute); font-size: 10px; }
  @media (max-width: 1100px) {
    .phase-nav { font-size: 10px; gap: 4px; }
    .phase-step { padding: 3px 5px; }
  }
  @media (max-width: 860px) {
    .phase-nav { display: none; }
  }

  /* ============== SETUP OVERLAY ============== */
  .setup-overlay {
    position: absolute; inset: 0;
    background: var(--bg);
    backdrop-filter: none;
    display: flex; align-items: center; justify-content: center;
    z-index: 50; overflow-y: auto; padding: 20px;
  }
  .setup-card {
    width: 100%; max-width: 760px;
    background: var(--bg-elev);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
    margin: auto;
  }
  .setup-header {
    padding: 12px 18px;
    background: linear-gradient(180deg, #142028 0%, #0d171c 100%);
    border-bottom: 1px solid var(--border-bright);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .setup-title {
    font-family: var(--display); font-weight: 700;
    font-size: 18px; letter-spacing: 0.15em;
    color: var(--ucm); text-transform: uppercase;
    margin: 0;
  }
  .setup-sub {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .setup-body { padding: 14px 18px; }
  .setup-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .faction-select {
    display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  @media (min-width: 600px) { .faction-select { grid-template-columns: 1fr 1fr; } }
  .faction-slot .faction-lbl { font-family: var(--display); font-size: 10px; letter-spacing: 2px; margin-bottom: 5px; }
  .faction-opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .faction-btn {
    flex: 1 1 auto; padding: 6px 8px; font-size: 10px; font-family: var(--mono);
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; border-radius: 3px; letter-spacing: 1px;
  }
  .faction-btn:hover { color: var(--text); border-color: var(--border-bright); }
  .faction-btn.sel.ucm { color: var(--ucm); border-color: var(--ucm); background: rgba(212,166,71,0.08); }
  .faction-btn.sel.shal { color: var(--shal); border-color: var(--shal); background: rgba(74,214,255,0.08); }
  .fleet-dropdown {
    width: 100%; padding: 8px 10px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border-bright); border-radius: 4px; font-family: var(--mono);
    font-size: 12px; cursor: pointer;
    color-scheme: dark;
  }
  .fleet-dropdown:hover { border-color: var(--text); }
  /* Theme the native popup list (the selectable items) to match the dark UI. */
  .fleet-dropdown option, .scen-dropdown option {
    background: var(--bg-elev); color: var(--text);
    font-family: var(--mono); font-size: 12px;
  }
  .fleet-dropdown option:checked, .scen-dropdown option:checked {
    background: var(--ucm-dim); color: var(--text);
  }
  .fleet-dropdown option:disabled, .scen-dropdown option:disabled {
    color: var(--text-mute);
  }
  .pl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .pl-row .pl-name { flex: 0 0 45%; font-size: 11px; }
  .pl-row .pl-select { flex: 1 1 55%; }
  .ap-section { margin-bottom: 10px; }
  .ap-title { font-family: var(--display); font-size: 11px; letter-spacing: 1px; margin-bottom: 5px; color: var(--text); }
  .ap-ds { margin-bottom: 6px; }
  .ap-ds-name { font-size: 10px; color: var(--text-dim); font-weight: 700; }
  .ap-loc { display: flex; justify-content: space-between; font-size: 10px; padding: 1px 0 1px 8px; font-family: var(--mono); }
  .ap-log { font-size: 10px; color: var(--text-dim); padding: 2px 0; font-family: var(--mono); }
  .init-grid { display: flex; align-items: flex-start; justify-content: center; gap: 16px; margin: 8px 0 14px; }
  .init-slot { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 130px; }
  .init-name { font-family: var(--display); font-size: 11px; letter-spacing: 1px; }
  .init-die { width: 68px; height: 68px; border: 2px solid; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-family: var(--mono); font-size: 36px; font-weight: 700;
    background: var(--bg-elev); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .init-vs { color: var(--text-mute); font-size: 11px; font-family: var(--display); letter-spacing: 1px; padding-top: 28px; }
  .init-result { text-align: center; font-family: var(--display); font-size: 14px; letter-spacing: 1px; font-weight: 700; }
  .init-choice { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .init-choice-lbl { font-size: 10px; color: var(--text-dim); text-align: center; margin-bottom: 6px; }
  .init-choice-btns { display: flex; gap: 6px; }
  .init-choice-btns .btn { flex: 1; font-size: 10px; }
  @media (min-width: 600px) {
    .setup-grid { grid-template-columns: 1fr 1fr; }
    .setup-grid .full-width { grid-column: 1 / -1; }
  }
  .scen-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--ucm-dim);
    border-radius: 2px;
    padding: 9px 11px 9px 12px;
    position: relative;
    min-height: 96px;
  }
  .scen-row .scen-label {
    font-family: var(--display);
    font-size: 9px; letter-spacing: 0.18em;
    color: var(--text-mute); text-transform: uppercase;
    margin-bottom: 3px;
  }
  .scen-row .scen-helper {
    font-size: 9px; color: var(--text-mute);
    line-height: 1.35; margin-bottom: 6px; font-style: italic;
  }
  .scen-row .scen-name {
    font-family: var(--display);
    font-size: 15px; font-weight: 600;
    color: var(--text); letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.1;
    padding-right: 38px;
  }
  .scen-row .scen-short {
    font-size: 10px; color: var(--text-dim);
    margin-top: 4px; line-height: 1.4;
  }
  .scen-row .scen-roll {
    position: absolute; top: 8px; right: 10px;
    font-family: var(--display); font-weight: 700;
    font-size: 16px; color: var(--ucm);
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 1px solid var(--ucm-dim);
    border-radius: 50%;
    background: rgba(212,166,71,0.07);
  }
  .scen-row .scen-roll.none { color: var(--text-mute); border-color: var(--border); background: transparent; }
  .scen-row .reroll-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mute);
    font-size: 9px; padding: 3px 8px;
    cursor: pointer; border-radius: 2px;
    letter-spacing: 0.12em;
    margin-top: 8px;
    text-transform: uppercase;
    transition: all 0.1s;
  }
  .scen-row .reroll-btn:hover { color: var(--ucm); border-color: var(--ucm-dim); }
  .scen-row .scen-controls {
    display: flex; gap: 6px;
    margin-top: 8px;
    align-items: stretch;
  }
  .scen-row .scen-controls .scen-dropdown { flex: 0 0 75%; }
  .scen-row .scen-controls .reroll-btn { flex: 1 1 25%; margin-top: 0; }
  .scen-dropdown {
    background: var(--panel); border: 1px solid var(--border-bright);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 8px 10px; border-radius: 4px; cursor: pointer; width: 100%;
    color-scheme: dark;
  }
  .scen-dropdown:hover { border-color: var(--text); }
  .scen-row .picker-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mute);
    font-size: 9px; padding: 3px 8px;
    cursor: pointer; border-radius: 2px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: all 0.1s;
  }
  .scen-row .picker-btn:hover { color: var(--ucm); border-color: var(--ucm-dim); }
  .scen-row .picker-btn.expanded { color: var(--ucm); border-color: var(--ucm-dim); background: var(--ucm-glow); }

  .scen-picker {
    margin-top: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border-bright);
    border-radius: 2px;
    overflow: hidden;
    max-height: 320px;
    overflow-y: auto;
  }
  .scen-pick-opt {
    padding: 8px 11px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    transition: background 0.08s;
  }
  .scen-pick-opt:last-child { border-bottom: none; }
  .scen-pick-opt:hover { background: var(--bg-card-2); }
  .scen-pick-opt.selected { background: var(--ucm-glow); }
  .scen-pick-opt .pick-d6 {
    font-family: var(--display); font-weight: 700;
    font-size: 13px; color: var(--text-dim);
    width: 20px; text-align: center;
    flex-shrink: 0;
  }
  .scen-pick-opt.selected .pick-d6 { color: var(--ucm); }
  .scen-pick-opt .pick-d6.none { color: var(--text-mute); }
  .scen-pick-opt .pick-body { flex: 1; min-width: 0; }
  .scen-pick-opt .pick-name {
    font-family: var(--display);
    font-size: 12px; font-weight: 600;
    color: var(--text); letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.15;
  }
  .scen-pick-opt.selected .pick-name { color: var(--ucm); }
  .scen-pick-opt .pick-desc {
    font-size: 9.5px; color: var(--text-dim);
    margin-top: 3px; line-height: 1.4;
  }

  .setup-footer {
    padding: 12px 18px;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 8px;
    flex-wrap: wrap;
  }
  .btn-primary {
    background: linear-gradient(180deg, var(--ucm) 0%, var(--ucm-dim) 100%);
    border: 1px solid var(--ucm);
    color: #021018;
    padding: 8px 20px;
    font-family: var(--display); font-weight: 700;
    font-size: 12px; letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: all 0.12s;
  }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-finish-act {
    width: 100%; margin-top: 6px;
    background: linear-gradient(180deg, var(--hull-warn) 0%, #b87d1f 100%);
    border: 1px solid var(--hull-warn);
    color: #1a1108;
    padding: 6px 14px;
    font-family: var(--display); font-weight: 700;
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: all 0.12s;
  }
  .btn-finish-act:hover { filter: brightness(1.12); }
  .btn-finish-act:active { transform: scale(0.99); }
  .am-line { font-size: 12px; margin: 6px 0; line-height: 1.4; }
  .am-shot { font-size: 10px; color: var(--text-dim); margin: 3px 0; padding-left: 6px; border-left: 2px solid var(--hull-crit); }
  .am-step-head { font-family: var(--display); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hull-crit); margin-bottom: 6px; }
  .am-toggle { display: block; font-size: 11px; margin: 4px 0; cursor: pointer; }
  .am-dice { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 6px 0; font-size: 13px; }
  .am-die {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 4px; font-family: var(--mono);
    font-weight: 700; font-size: 12px; border: 1px solid var(--border-bright);
    background: var(--bg-card); color: var(--text-mute);
  }
  .am-die.hit { background: rgba(212,166,71,0.18); border-color: var(--ucm); color: var(--ucm); }
  .am-die.crit { background: rgba(255,181,71,0.22); border-color: var(--hull-warn); color: var(--hull-warn); }
  .am-die.miss { opacity: 0.5; }

  /* In-place dice tumble: spins in with an overshoot bounce and settles on its
     final face. Applied (via the .rolling class) only to dice that changed since
     the last render, so a re-roll visibly re-tumbles just the affected dice.
     Colour coding (hit/crit/miss, saved/unsaved) is carried by the die's own
     class and is preserved throughout. */
  /* Spectator loading overlay — shown until a spectated (esp. AI-vs-AI) game is live. */
  #spec-loading {
    position: fixed; inset: 0; z-index: 100000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: radial-gradient(circle at 50% 38%, var(--bg-elev) 0%, var(--bg) 72%);
    text-align: center; padding: 24px;
  }
  #spec-loading .sl-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.10); border-top-color: var(--ucm); border-right-color: var(--shal);
    animation: specSpin 0.9s linear infinite;
  }
  @keyframes specSpin { to { transform: rotate(360deg); } }
  #spec-loading .sl-title { font-family: var(--display); font-weight: 700; letter-spacing: 2px; font-size: 17px; color: var(--text); }
  #spec-loading .sl-sub { font-size: 11px; letter-spacing: 0.5px; color: var(--text-mute); max-width: 280px; line-height: 1.5; }
  #spec-loading .sl-room { font-family: var(--mono, monospace); font-size: 12px; letter-spacing: 0.1em; color: var(--shal); }
  @media (prefers-reduced-motion: reduce) { #spec-loading .sl-spinner { animation: none; } }

  /* End-game report modal */
  #report-overlay { position: fixed; inset: 0; z-index: 100001; display: flex; align-items: center;
    justify-content: center; padding: 16px; background: rgba(2,6,10,0.78); backdrop-filter: blur(4px); }
  #report-overlay .rep-card { display: flex; flex-direction: column; width: 100%; max-width: 720px;
    max-height: calc(100% - 16px); background: var(--bg-elev, #0d1722); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,0.6); }
  #report-overlay .rep-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #report-overlay .rep-tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 10px 0;
    border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
  #report-overlay .rep-tab { padding: 6px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em;
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-mute); cursor: pointer; }
  #report-overlay .rep-tab.active { color: var(--text); border-bottom-color: var(--accent, #4ad6ff); }
  #report-overlay .rep-body { padding: 12px 16px; overflow-y: auto; }
  #report-overlay .rep-sec { margin-bottom: 14px; }
  #report-overlay .rep-sec-title { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 5px; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
  #report-overlay .rep-line { font-size: 11px; color: var(--text-dim); padding: 2px 0; line-height: 1.4; }
  #report-overlay .rep-line.detail { color: var(--text-mute); font-size: 10px; padding-left: 12px; }
  #report-overlay .rep-empty { font-size: 11px; color: var(--text-mute); text-align: center; padding: 24px 0; }
  #report-overlay .rep-act { margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  #report-overlay .rep-act-hdr { font-size: 11px; padding: 3px 0 4px; letter-spacing: 0.02em; }
  #report-overlay .rep-act-line { font-size: 11px; color: var(--text-dim); padding: 2px 0; line-height: 1.4; }
  #report-overlay .rep-act-line.detail { color: var(--text-mute); font-size: 10px; padding-left: 10px; }
  #report-overlay .rep-act-line[data-rep-exp]:hover { color: var(--text); }
  #report-overlay .rep-exp-body { font-size: 10px; }

  @keyframes dieRoll {
    0%   { transform: rotate(-220deg) scale(0.35); opacity: 0.15; filter: blur(1.4px); }
    45%  { transform: rotate(18deg)   scale(1.22); opacity: 1;    filter: blur(0); }
    68%  { transform: rotate(-9deg)   scale(0.92); }
    84%  { transform: rotate(4deg)    scale(1.04); }
    100% { transform: rotate(0)       scale(1); }
  }
  .am-die.rolling, .init-die.rolling { animation: dieRoll 0.52s cubic-bezier(0.2,0.85,0.3,1.15) both; }
  @media (prefers-reduced-motion: reduce) {
    .am-die.rolling, .init-die.rolling { animation: none; }
  }

  /* ── UNIFIED PANEL BASE ─────────────────────────────────────────────────────
     All in-game floating popups inherit from .dfc-panel.
     The .dfc-panel-handle child becomes the drag target.              */
  .dfc-panel {
    position: absolute;
    background: rgba(8,16,15,0.95);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    z-index: 40;
    pointer-events: auto;
    overflow: hidden;
    max-height: calc(100% - 16px);
    overflow-y: auto;
  }
  .dfc-panel-handle {
    padding: 5px 10px 4px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    cursor: grab;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dfc-panel-handle:active { cursor: grabbing; }
  .dfc-panel-handle::before { content: '⠿'; font-size: 10px; opacity: 0.35; }

  .fleet-view-panel { width: 720px; max-width: calc(100vw - 16px); max-height: calc(100% - 16px); display: flex; flex-direction: column; overflow: hidden; }

  .attack-hud {
    width: 400px;
    padding: 12px 14px;
    font-size: 12px;
  }
  .attack-hud-title {
    font-family: var(--display); font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--hull-crit);
    margin-bottom: 10px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(220,50,50,0.3);
  }
  .attack-hud-footer {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary.shal {
    background: linear-gradient(180deg, var(--shal) 0%, var(--shal-dim) 100%);
    border-color: var(--shal); color: #1a1108;
  }
  .scen-extra-note {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(255,181,71,0.05);
    border-left: 2px solid var(--hull-warn);
    color: var(--hull-warn);
    font-size: 10px;
    border-radius: 0 2px 2px 0;
  }

  /* ============== DEPLOY HINT BAR ============== */
  .deploy-hint {
    position: absolute; bottom: 12px;
    left: 50%; transform: translateX(-50%);
    background: rgba(8,16,15,0.92);
    border: 1px solid var(--border-bright);
    padding: 8px 14px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-align: center;
    backdrop-filter: blur(4px);
    z-index: 10;
    display: flex; align-items: center; gap: 12px;
  }
  .deploy-hint b { color: var(--text); }

  /* Activation / repair / dogfight HUDs — all floating panels on .board-wrap */
  .act-hud { min-width: 160px; max-width: 220px; padding: 8px 10px; font-size: 10px; }
  .act-hud-title { font-family: var(--display); font-size: 10px; letter-spacing: 0.8px; color: var(--text-mute); margin-bottom: 5px; }
  .act-hud-name  { font-size: 11px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

  /* ============== SCENARIO MINI-BANNER (PLAY phase) ============== */
  /* Nomination panel — floats over the left edge of the board, leaves the map accessible */
  .nom-panel { width: 220px; padding: 10px 10px 8px; font-size: 10px; }
  .nom-panel h3 { font-family: var(--display); font-size: 11px; letter-spacing: 1px; color: var(--text); margin: 0 0 4px; }
  .nom-row-btn {
    width: 100%; text-align: left; background: none;
    border: 1px solid var(--border); border-radius: 3px;
    padding: 5px 7px; margin-top: 5px; cursor: pointer;
    font-family: var(--mono); font-size: 9px; color: var(--text-dim);
    transition: border-color 0.15s, background 0.15s;
  }
  .nom-row-btn:hover { border-color: var(--border-bright); background: rgba(255,255,255,0.03); }
  .nom-row-btn.active { border-color: var(--hull-warn); background: rgba(232,204,64,0.07); color: var(--text); }
  .nom-row-btn .nom-side { font-size: 8px; font-weight: 700; letter-spacing: 0.5px; }
  .nom-row-btn .nom-obj  { font-size: 9.5px; font-weight: 600; }
  .nom-row-btn .nom-sel  { font-size: 8.5px; color: var(--hull-warn); margin-top: 2px; }
  .nom-row-btn .nom-hint { font-size: 8px; color: var(--text-mute); margin-top: 1px; }

  .scen-banner {
    position: absolute; top: 8px; right: 8px;
    background: rgba(8,16,15,0.78);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 2px;
    font-size: 9.5px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    backdrop-filter: blur(4px);
    max-width: 240px;
    line-height: 1.5;
  }
  .scen-banner b { color: var(--text); }
  .scen-banner .scen-title-mini {
    font-family: var(--display); font-size: 11px;
    color: var(--ucm); letter-spacing: 0.14em;
    text-transform: uppercase;
    display: block; margin-bottom: 2px;
  }

  /* ============== SIDE PANELS ============== */
  .panel {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 8px 0;
  }
  .panel.right {
    border-right: none; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; padding: 0;
  }
  .panel.right #detail-panel {
    flex: 1 1 auto; overflow-y: auto; min-height: 0; padding: 8px 0;
  }
  #event-log-dock {
    flex: 0 0 auto;
    border-top: 1px solid var(--border-bright);
    background: rgba(8,12,11,0.6);
  }
  #event-log-dock.chat-dock-float {
    position: fixed; bottom: 0; right: 0; width: 280px;
    visibility: visible; z-index: 55;
    border-left: 1px solid var(--border-bright);
    background: var(--bg-elev);
    max-height: 44vh;
    display: flex; flex-direction: column;
  }
  .log-tab-bar {
    display: flex; align-items: stretch; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.25);
  }
  .log-tab-btn {
    flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
    padding: 5px 8px; cursor: pointer; font-family: var(--mono);
    font-size: 8.5px; letter-spacing: 0.12em; color: var(--text-mute);
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .log-tab-btn.active { color: var(--text); border-bottom-color: var(--ucm); }
  .log-tab-btn:hover:not(.active) { color: var(--text-dim); }
  .chat-unread {
    background: var(--ucm); color: #000; font-size: 7.5px; font-weight: 700;
    border-radius: 8px; padding: 1px 5px; line-height: 1.4;
  }
  .chat-body {
    flex: 1; overflow-y: auto; padding: 4px 0; min-height: 48px;
  }
  .chat-msg {
    padding: 3px 11px; display: flex; flex-direction: column; gap: 1px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .chat-msg-header { display: flex; gap: 6px; align-items: baseline; }
  .chat-msg-user { font-size: 8px; font-family: var(--mono); font-weight: 700; color: var(--text-dim); }
  .chat-msg-user.player1 { color: var(--ucm); }
  .chat-msg-user.player2 { color: var(--shal); }
  .chat-msg-user.spectator { color: var(--text-mute); }
  .chat-msg-time { font-size: 7.5px; font-family: var(--mono); color: var(--text-mute); }
  .chat-msg-text { font-size: 10px; color: var(--text); line-height: 1.4; word-break: break-word; }
  .chat-input-row {
    display: flex; gap: 4px; padding: 6px 8px; flex-shrink: 0;
    border-top: 1px solid var(--border); background: rgba(0,0,0,0.2);
  }
  .chat-input {
    flex: 1; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 10px;
    padding: 5px 7px; border-radius: 3px; min-width: 0;
  }
  .chat-input:focus { outline: none; border-color: var(--ucm); }
  .chat-send-btn {
    padding: 5px 9px; font-size: 10px; background: var(--ucm);
    color: #000; border: none; border-radius: 3px; cursor: pointer; font-weight: 700;
  }
  .chat-send-btn:hover { filter: brightness(1.15); }
  .chat-empty { padding: 8px 11px; font-size: 9.5px; font-family: var(--mono); color: var(--text-mute); }
  .panel-section {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: var(--display);
    font-size: 11px; letter-spacing: 0.18em;
    color: var(--text-dim); font-weight: 600;
    text-transform: uppercase;
    margin: 0 0 8px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-title .count {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-mute);
  }
  .panel-title.ucm { color: var(--ucm); }
  .panel-title.shal { color: var(--shal); }

  /* Group cards in the side panels */
  .ap-chip {
    display: flex; align-items: center; gap: 6px;
    width: calc(100% - 16px);
    margin: 0 8px 8px 8px;
    padding: 6px 10px;
    background: rgba(10,14,13,0.6);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--mono);
    transition: all 0.1s;
  }
  .ap-chip:hover { border-color: var(--text); background: var(--bg-card-2); }
  .group-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    padding: 7px 9px;
    margin: 0 8px 6px 8px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
  }
  .group-card.ucm { border-left-color: var(--ucm-dim); }
  .group-card.shal { border-left-color: var(--shal-dim); }
  .group-card:hover { background: var(--bg-card-2); }
  .group-card.active { background: #1f2d35; }
  .group-card.active.ucm { border-left-color: var(--ucm); box-shadow: inset 4px 0 12px -8px var(--ucm-glow); }
  .group-card.active.shal { border-left-color: var(--shal); box-shadow: inset 4px 0 12px -8px var(--shal-glow); }
  .group-card.activated { opacity: 0.5; }
  .group-card.off-turn { opacity: 0.4; }
  .group-card.off-turn::after { content: 'WAIT'; position: absolute; top: 4px; right: 6px; font-size: 7px; letter-spacing: 1px; color: var(--text-mute); font-family: var(--mono); }
  .group-card.activation-locked { opacity: 0.35; pointer-events: none; }
  .group-card.activation-locked::after { content: 'LOCKED'; position: absolute; top: 4px; right: 6px; font-size: 7px; letter-spacing: 1px; color: var(--hull-warn); font-family: var(--mono); }
  .group-card.activated::after {
    content: "✓ ACTIVATED";
    display: block;
    font-size: 8px; letter-spacing: 0.15em;
    color: var(--text-mute);
    margin-top: 4px;
  }
  .gc-name {
    font-family: var(--display); font-weight: 600;
    font-size: 13px; letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .gc-role {
    font-size: 9.5px; color: var(--text-dim);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-top: 2px;
  }
  .gc-stats {
    display: flex; gap: 8px; margin-top: 4px;
    font-size: 9.5px; color: var(--text-mute);
  }
  .gc-stats b { color: var(--text-dim); font-weight: 600; }

  .gc-badges {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 4px;
  }
  .gc-badge {
    font-family: var(--mono);
    font-size: 8.5px; font-weight: 700;
    letter-spacing: 0.1em;
    padding: 1px 5px;
    border-radius: 2px;
    border: 1px solid currentColor;
    line-height: 1.2;
  }
  .gc-badge.vanguard { color: var(--hull-crit); background: rgba(255,82,82,0.08); }
  .gc-badge.direct   { color: var(--hull-warn); background: rgba(255,181,71,0.08); }
  .gc-badge.reserve  { color: var(--text-mute); background: rgba(122,138,148,0.08); }
  .gc-badge.undeployed { color: var(--text-dim); background: rgba(122,138,148,0.08); }
  .gc-badge.ready    { color: #6eca7a; background: rgba(110,202,122,0.10); border-color: #6eca7a; }

  /* ============== BOARD ============== */
  .board-wrap {
    position: relative;
    background: var(--table-bg);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .board-wrap::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  #board {
    width: 100%; height: 100%;
    display: block;
    cursor: default;
  }
  #board.targeting { cursor: crosshair; }

  /* Board overlay HUD */
  .board-hud {
    position: absolute; top: 8px; left: 8px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
    font-size: 10px;
  }
  .hud-item {
    background: rgba(8,16,15,0.75);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 2px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    backdrop-filter: blur(4px);
  }
  .hud-item b { color: var(--text); }
  .hud-item.warn { color: var(--hull-warn); border-color: var(--hull-warn); }
  #board3d {
    display: none; position: absolute; inset: 0;
    width: 100%; height: 100%;
    cursor: grab;
    touch-action: none; /* let OrbitControls + tap-detection own all touch gestures */
  }
  #board3d:active { cursor: grabbing; }
  .hud-btn {
    pointer-events: auto; cursor: pointer;
    background: rgba(8,16,15,0.85); border: 1px solid var(--border);
    color: var(--text-dim); font-family: var(--mono); font-size: 10px;
    padding: 4px 8px; border-radius: 2px; letter-spacing: 0.08em;
    backdrop-filter: blur(4px); text-align: left;
  }
  .hud-btn:hover { color: var(--text); border-color: var(--border-bright); }
  .hud-btn.active { color: var(--shal); border-color: var(--shal-dim); }
  .hud-row { display: flex; gap: 4px; align-items: center; pointer-events: auto; }
  .hud-icon-btn {
    pointer-events: auto; cursor: pointer;
    background: rgba(8,16,15,0.85); border: 1px solid var(--border);
    color: var(--text-mute); font-family: var(--mono); font-size: 13px;
    width: 24px; height: 24px; padding: 0; border-radius: 2px;
    backdrop-filter: blur(4px); text-align: center; line-height: 22px;
    transition: color 0.1s, border-color 0.1s;
  }
  .hud-icon-btn:hover { color: var(--text-dim); border-color: var(--border-bright); }
  #btn-arc-toggle.active { color: var(--ucm); border-color: var(--ucm-dim); }
  #btn-sig-toggle.active { color: var(--hull-crit); border-color: rgba(255,82,82,0.45); }
  #btn-trails-toggle.active { color: var(--shal); border-color: var(--shal-dim); }

  .board-legend {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(8,16,15,0.75);
    border: 1px solid var(--border);
    padding: 6px 8px;
    border-radius: 2px;
    font-size: 9.5px;
    backdrop-filter: blur(4px);
    pointer-events: none;
    max-width: 340px;
  }
  .legend-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; color: var(--text-dim); }
  .legend-swatch {
    width: 12px; height: 12px; border-radius: 2px;
    background: var(--ucm); opacity: 0.4;
  }
  .legend-swatch.scan { background: transparent; border: 1px dashed var(--text-dim); }
  .legend-swatch.arcF { background: rgba(212,166,71,0.25); border: 1px solid var(--ucm-dim); }
  .legend-swatch.arcS { background: rgba(122,138,148,0.20); border: 1px solid var(--text-mute); }
  .legend-swatch.arcFN { background: rgba(255,181,71,0.30); border: 1px solid var(--hull-warn); }

  /* ============== RIGHT PANEL — Selected Group Detail ============== */
  .detail-name {
    font-family: var(--display); font-weight: 700;
    font-size: 18px; letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 2px 0; line-height: 1;
  }
  .detail-name.ucm { color: var(--ucm); }
  .detail-name.shal { color: var(--shal); }
  .detail-role {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .stat-cell {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 4px 6px;
    border-radius: 2px;
    text-align: center;
  }
  .stat-cell .lbl {
    font-size: 8px; letter-spacing: 0.14em;
    color: var(--text-mute); text-transform: uppercase;
  }
  .stat-cell .val {
    font-family: var(--display); font-weight: 600;
    font-size: 14px; color: var(--text);
    line-height: 1.2;
  }
  .weapons-list { margin-top: 6px; }
  .weapon-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 5px 7px;
    border-radius: 2px;
    margin-bottom: 4px;
    font-size: 10px;
  }
  .weapon-row[data-weapon-target]:hover,
  .weapon-row[data-da-fire]:hover { border-color: var(--hull-crit); background: var(--bg-card-2); }
  .weapon-row.weapon-locked { border-color: var(--hull-crit); background: rgba(255,82,82,0.07); }
  .weapon-row.weapon-aiming { border-color: var(--hull-crit); box-shadow: 0 0 0 1px var(--hull-crit); }
  .weapon-name {
    font-weight: 600; color: var(--text);
    letter-spacing: 0.03em;
  }
  .weapon-stats {
    color: var(--text-dim); font-size: 9.5px;
    margin-top: 1px;
  }
  .weapon-special {
    color: var(--text-mute); font-size: 9px;
    font-style: italic; margin-top: 1px;
  }

  /* Order selector */
  .orders {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 6px;
  }
  .order-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 4px;
    font-family: var(--mono); font-size: 10px;
    cursor: pointer; border-radius: 2px;
    letter-spacing: 0.05em;
    transition: all 0.1s;
    text-align: center;
  }
  .order-btn:hover { border-color: var(--border-bright); color: var(--text); }
  .order-btn.active {
    background: linear-gradient(180deg, #1f3a47 0%, #143040 100%);
    border-color: var(--ucm-dim);
    color: var(--ucm);
  }
  .order-btn.active.shal {
    background: linear-gradient(180deg, #3a2e15 0%, #2a200c 100%);
    border-color: var(--shal-dim);
    color: var(--shal);
  }
  .order-info {
    background: var(--bg-card);
    border-left: 2px solid var(--border-bright);
    padding: 6px 8px;
    margin-top: 6px;
    font-size: 9.5px;
    color: var(--text-dim);
    border-radius: 0 2px 2px 0;
  }
  .order-info b { color: var(--text); }
  .order-info .neg { color: var(--hull-crit); }
  .order-info .spk { color: var(--hull-warn); }

  /* Ship sub-list inside group card */
  .ship-list { margin-top: 6px; }
  .ship-row {
    display: flex; align-items: center;
    gap: 6px;
    padding: 4px 0;
    border-top: 1px dashed var(--border);
    font-size: 10px;
  }
  .ship-row:first-child { border-top: none; }
  .ship-row .ship-idx {
    font-size: 9px; color: var(--text-mute);
    width: 16px;
  }
  .ship-row .ship-nm { flex: 1; }
  .ship-row .ship-hp {
    font-family: var(--display);
    font-size: 11px; font-weight: 600;
    color: var(--hull-good);
    min-width: 36px; text-align: right;
  }
  .ship-row .ship-hp.warn { color: var(--hull-warn); }
  .ship-row .ship-hp.crit { color: var(--hull-crit); }
  .ship-row .ship-hp.dead { color: var(--text-mute); text-decoration: line-through; }
  .ship-row .hp-btns { display: flex; gap: 2px; }
  .ship-row .hp-btn {
    width: 20px; height: 20px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer; border-radius: 2px;
    font-size: 12px; line-height: 1;
  }
  .ship-row .hp-btn:hover { color: var(--text); }

  /* Generic hp-btn (used outside ship rows, e.g. launch counters) */
  .hp-btn {
    width: 20px; height: 20px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer; border-radius: 2px;
    font-size: 12px; line-height: 1;
  }
  .hp-btn:hover:not(:disabled) { color: var(--text); }
  .hp-btn:disabled { opacity: 0.35; cursor: default; }
  .launch-counter { margin-top: 6px; padding: 6px; background: var(--bg-elev); border-radius: 3px; }
  .launch-counter .lc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .launch-counter .lc-lbl { flex: 1; font-size: 10px; color: var(--text-dim); }
  .launch-counter .lc-val { min-width: 18px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 12px; }
  .bat-counts { display: flex; gap: 10px; margin-top: 4px; }
  .bat-loc-label { font-size: 9px; letter-spacing: 1px; color: var(--text-mute); text-transform: uppercase; }
  .bat-side { display: flex; align-items: center; gap: 4px; font-size: 8.5px; color: var(--text-mute); letter-spacing: 1px; }
  .bat-side b { font-family: var(--mono); font-size: 12px; min-width: 12px; text-align: center; }

  .empty-state {
    padding: 16px;
    text-align: center;
    color: var(--text-mute);
    font-size: 10.5px;
    font-style: italic;
  }

  /* Spike control */
  .spike-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 2px;
  }
  .spike-row .label {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .spike-row .spike-controls {
    display: flex; align-items: center; gap: 4px;
  }
  .spike-val {
    font-family: var(--display); font-weight: 700;
    font-size: 16px;
    min-width: 18px; text-align: center;
    color: var(--text);
  }
  .spike-val.warn { color: var(--hull-warn); }
  .spike-val.max { color: var(--hull-crit); }
  .spike-btn {
    width: 22px; height: 22px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer; border-radius: 2px;
    font-size: 13px; line-height: 1;
  }
  .spike-btn:hover { color: var(--text); }

  /* Move/turn controls */
  .move-controls {
    display: flex; flex-direction: column; gap: 4px;
    margin-top: 6px;
  }
  .move-status {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 5px 8px;
    border-radius: 2px;
    font-size: 10px;
    display: flex; justify-content: space-between;
    color: var(--text-dim);
  }
  .move-status b { color: var(--text); font-weight: 600; }
  .move-status.ok b { color: var(--hull-good); }
  .move-status.warn b { color: var(--hull-warn); }
  .move-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  .turn-controls {
    display: flex; gap: 4px;
  }
  .turn-btn {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 4px;
    cursor: pointer; border-radius: 2px;
    font-size: 11px;
    font-family: var(--mono);
  }
  .turn-btn:hover { color: var(--text); border-color: var(--border-bright); }
  .turn-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Selected ship marker */
  .help-tip {
    background: var(--bg-card);
    border-left: 2px solid var(--ucm-dim);
    padding: 6px 8px;
    margin-top: 6px;
    font-size: 9.5px;
    color: var(--text-dim);
    font-style: italic;
  }
  .help-tip.shal { border-left-color: var(--shal-dim); }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

  /* Order buttons inside the activation HUD — desktop uses the detail panel, so
     this 3×2 grid is shown only on mobile. */
  .act-orders { display: none; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 4px 0 6px; }
  .act-atmo { display: none; margin: 0 0 6px; }
  .act-actions { display: none; }
  .act-collapse-chev { margin-left: auto; padding-left: 8px; font-size: 12px; color: var(--text-dim); }
  /* Action cards reused from the detail panel render fine in the activation HUD;
     trim the panel-section chrome so they sit flush in the bottom sheet. */
  .act-actions .panel-section { padding: 6px 0; border-bottom: none; }

  /* Setup mobile tab bar (Player 1 / Player 2 / Scenario) — shown only ≤860px. */
  .setup-mtabs { display: none; gap: 5px; margin-bottom: 12px; }
  .setup-mtabs button {
    flex: 1; padding: 11px 4px; background: var(--bg-card);
    border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--display); font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; border-radius: 3px; cursor: pointer;
  }
  .setup-mtabs button.active { color: var(--ucm); border-color: var(--ucm-dim); background: var(--ucm-glow); }

  /* ============== MOBILE / TOUCH ============== */
  /* Mobile-only chrome (drawer toggles, scrim) — hidden on desktop. */
  .mobile-only { display: none !important; }
  #mobile-scrim {
    display: none; position: fixed; inset: 48px 0 0 0;
    background: rgba(0,0,0,0.5); z-index: 135;
  }
  #mobile-scrim.show { display: block; }

  /* Small screens */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px 1fr 240px; }
  }
  /* Replay bar: full text labels on desktop; the short ("R") round token is mobile-only. */
  #replay-bar .rl-short { display: none; }
  @media (max-width: 860px) {
    /* Replay bar must stay on ONE line on narrow screens (else it pushes DETAIL off the
       top bar). Collapse every button to its icon glyph, drop button text, shrink gaps. */
    #replay-bar { padding: 5px 8px; gap: 4px; font-size: 11px; overflow: hidden; min-width: 0; }
    #replay-bar .rlbl { display: none; }
    #replay-bar .rl-short { display: inline; }
    #replay-bar .btn { padding: 4px 7px !important; flex: 0 0 auto; }
    #replay-bar #replay-counter { margin-left: 4px; font-size: 10px; }
    #replay-bar #replay-round-label { margin-left: 2px; font-size: 10px; }
    /* Single column — the board fills the screen; the two side panels become
       slide-over drawers toggled from the top bar. */
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; }
    /* During setup, .app.panels-hidden forces a 0/1fr/0 grid. With the panels
       removed from flow (position:fixed) the board would auto-place into the
       0-width first column and the setup overlay would render invisibly — keep
       a single full-width column instead. */
    .app.panels-hidden { grid-template-columns: 1fr; }
    .mobile-only { display: inline-flex !important; align-items: center; }
    /* Honour the notch / rounded-corner safe areas on the fixed top bar. */
    .topbar { padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); gap: 6px; }
    .brand { font-size: 14px; letter-spacing: 0.08em; gap: 5px; }
    /* Top bar: FLEET (left) · VP (centred) · user-chip · DETAIL (right). display:contents lets
       the two toggle buttons become direct flex items so order can position them. */
    .topbar #topbar-controls { display: contents; }
    .topbar .brand { order: 1; flex: 1 1 auto; min-width: 0; justify-content: center; }
    #m-toggle-left  { order: 0; }
    #topbar-user    { order: 2; padding: 0 2px !important; }
    #m-toggle-right { order: 3; }

    .panel {
      display: block;
      position: fixed; top: 48px; bottom: 0;
      width: min(86vw, 360px); max-width: 360px;
      z-index: 140; /* sit above in-game bottom sheets (z 130) when open */
      box-shadow: 0 0 40px rgba(0,0,0,0.65);
      transition: transform 0.22s ease;
      will-change: transform;
      overscroll-behavior: contain;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .panel.left  { left: 0; right: auto; transform: translateX(-103%); border-right: 1px solid var(--border-bright); }
    .panel.right { right: 0; left: auto; transform: translateX(103%); border-left: 1px solid var(--border-bright); }
    .panel.left.mobile-open, .panel.right.mobile-open { transform: translateX(0); }
    /* During setup the board overlay covers everything — keep drawers parked. */
    .app.panels-hidden .panel { visibility: hidden; }
    /* The docked chat/log lives inside the right drawer here — undo desktop float. */
    #event-log-dock.chat-dock-float { position: static; width: auto; max-height: 40vh; }

    /* Floating in-game popups → full-width bottom sheets (drag is a no-op on touch).
       z-index !important so it beats the per-panel inline z (which climbs from 100),
       keeping the slide-over drawers (z 140) reliably on top when both are open. */
    .dfc-panel {
      position: fixed !important;
      left: 0 !important; right: 0 !important; bottom: 0 !important; top: auto !important;
      width: 100% !important; max-width: 100% !important;
      max-height: 80vh; max-height: 80dvh;
      border-radius: 10px 10px 0 0;
      border-left: none; border-right: none; border-bottom: none;
      z-index: 130 !important;
      overscroll-behavior: contain;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .dfc-panel-handle { cursor: default; padding: 9px 12px; }
    .dfc-panel-handle::before { content: '▬'; opacity: 0.5; }
    .attack-hud, .fleet-view-panel, .nom-panel {
      width: 100% !important; max-width: 100% !important; min-width: 0 !important;
      font-size: 13px;
    }
    /* Re-assert bottom padding for the panels that set it via the padding shorthand,
       adding the home-indicator inset so footer buttons stay tappable. */
    .attack-hud { padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)) !important; }
    .nom-panel  { padding: 10px 10px calc(8px + env(safe-area-inset-bottom, 0px)) !important; }
    .act-hud    { padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
    /* VP / AP / Fleet panels sit in front of every other element. */
    #vpbreak-overlay, #ap-edit-overlay, #fleet-view-overlay { z-index: 200 !important; }

    /* Keep the centre of the board clear: hide the colour-key legend, and show the
       scenario/VP banner top-right with ONLY the VP / AP / FL buttons (no text). */
    #scen-banner.scen-banner {
      top: 8px !important; bottom: auto !important; right: 6px; left: auto;
      max-width: none; padding: 0; background: transparent; border: none; backdrop-filter: none;
    }
    #scen-banner .scen-banner-text { display: none; }
    #scen-banner .scen-banner-btns {
      margin-top: 0 !important; border-top: none !important; padding-top: 0 !important;
      display: flex; gap: 4px; flex-wrap: nowrap;
    }
    #scen-banner .scen-banner-btns button { padding: 8px 8px !important; font-size: 12px !important; margin: 0 !important; line-height: 1; }
    /* The top-left HUD text (player-to-activate / selected ship) is hidden on mobile;
       the board toggles live in the scenario banner row instead. */
    #hud-active, #hud-turn-info { display: none !important; }
    .act-orders { display: grid; }
    .act-atmo { display: block; }
    .act-actions { display: block; }
    /* Tap the activation title bar to collapse the sheet to just that bar. */
    .act-hud.collapsed { padding: 0 !important; max-height: none; }
    .act-hud.collapsed > *:not(.dfc-panel-handle) { display: none !important; }
    .act-hud.collapsed .dfc-panel-handle { border-bottom: none; padding-bottom: calc(9px + env(safe-area-inset-bottom, 0px)); }
    .board-legend { display: none; }

    /* The scenery-placement and deployment phase HUDs live in the top-left board
       HUD on desktop; on mobile dock them to the bottom like the other popups so
       they don't cover the map. (_syncBoardBottomInset reserves space for them.) */
    #scenery-banner, #deploy-hint {
      position: fixed !important;
      left: 0 !important; right: 0 !important; bottom: 0 !important; top: auto !important;
      width: 100% !important; max-width: 100% !important; min-width: 0 !important;
      z-index: 130;
      background: rgba(8,16,15,0.98);
      border: 1px solid var(--border-bright); border-bottom: none;
      border-radius: 10px 10px 0 0;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)) !important;
    }

    /* Mobile stays in 2D (pinch-zoom + pan); hide the 3D toggle and declutter the
       board by removing the arc / signature / trails / zoom-reset toggles. */
    #btn-3d-toggle, #btn-arc-toggle, #btn-sig-toggle, #btn-trails-toggle, #btn-zoom-reset { display: none; }
    /* Let our JS own all board touch gestures (drag-pan + pinch-zoom). */
    #board { touch-action: none; }

    /* Bigger tap targets (~44px) and readable text. */
    body { font-size: 13px; }
    .btn { padding: 9px 12px; font-size: 12px; }
    .btn-icon { width: 38px; height: 38px; font-size: 16px; }
    .hud-icon-btn { width: 38px; height: 38px; font-size: 18px; line-height: 36px; }
    .hud-btn { padding: 8px 10px; font-size: 12px; }
    .ship-row .hp-btn, .hp-btn { width: 34px; height: 34px; font-size: 17px; }
    .spike-btn { width: 34px; height: 34px; font-size: 17px; }
    .order-btn { padding: 11px 4px; font-size: 12px; }
    .faction-btn { padding: 10px 8px; font-size: 12px; }
    .log-tab-btn { padding: 9px 8px; font-size: 11px; }
    .chat-send-btn { padding: 9px 14px; font-size: 12px; }
    .chat-input { padding: 9px 8px; font-size: 13px; }
    .nom-row-btn { padding: 9px 9px; }
    .nom-row-btn .nom-obj { font-size: 12px; }
    .weapon-row { padding: 9px 8px; }
    .group-card { padding: 10px 10px; }
    .am-die { width: 30px; height: 30px; }

    /* Setup overlay fits a phone. */
    .setup-overlay { padding: 8px 8px 0; }
    .setup-card { max-width: 100%; }
    .fleet-dropdown, .scen-dropdown { font-size: 14px; padding: 10px; }

    /* Setup as swipeable tabs: Player 1 / Player 2 / Scenario — show only the
       active pane (panes live at different nesting levels). */
    .setup-mtabs { display: flex !important; }
    .setup-card[data-mtab="p1"]   .setup-pane:not([data-pane="p1"]),
    .setup-card[data-mtab="p2"]   .setup-pane:not([data-pane="p2"]),
    .setup-card[data-mtab="scen"] .setup-pane:not([data-pane="scen"]) { display: none !important; }
    .setup-body { padding-bottom: 84px; } /* clear the fixed footer */

    /* Back / Ready fixed to the bottom of the screen. */
    .setup-footer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; margin: 0;
      background: var(--bg-elev); border-top: 1px solid var(--border-bright);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex; gap: 8px;
    }
    .setup-footer .btn, .setup-footer .btn-primary { flex: 1; }

    /* Show the account chip in the top bar during setup. */
    .app.panels-hidden #topbar-user { display: flex !important; }

    /* The admin account panel fits the screen width. */
    #admin-panel-modal {
      left: 6px !important; right: 6px !important; top: 54px !important;
      min-width: 0 !important; max-width: none !important; width: auto !important;
    }
  }

  /* On touch devices neutralise hover-only feedback so a tapped element doesn't
     stick in its hover appearance — tap/selected (.active/.sel) states drive feedback. */
  @media (hover: none) {
    .group-card:hover { background: var(--bg-card); }
    .weapon-row[data-weapon-target]:hover,
    .weapon-row[data-da-fire]:hover { border-color: var(--border); background: var(--bg-card); }
    .nom-row-btn:hover { border-color: var(--border); background: none; }
    .order-btn:hover { border-color: var(--border); color: var(--text-dim); }
  }
</style>
</head>
<body>
<div id="app-cover" style="position:fixed;inset:0;background:var(--bg);z-index:9999;pointer-events:none;"></div>
<div id="mobile-scrim"></div>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span id="brand-red">UCMF</span>
      <span class="vs">VS</span>
      <span class="shal-name" id="brand-blue">SHALTARI</span>
    </div>
    <nav class="phase-nav" id="phase-nav">
      <span class="phase-step active" data-phase="setup">1 · SETUP</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="scenery">2 · SCENERY</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="nominations">3 · SECONDARIES</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="protect">4 · PROTECT</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="deploy">5 · DEPLOY</span>
      <span class="phase-arrow">→</span>
      <span class="phase-step" data-phase="play">6 · PLAY</span>
    </nav>
    <div class="topbar-controls" id="topbar-controls">
      <!-- populated by renderTopbarControls() -->
    </div>
    <div id="topbar-user" style="display:flex;align-items:center;gap:6px;padding:0 10px;font-family:var(--mono);font-size:9px;color:var(--text-mute);white-space:nowrap;"></div>
  </header>

  <div id="replay-bar" style="display:none;grid-column:1/-1;z-index:9999;background:#0d1a1f;border-bottom:2px solid #2a7fff;padding:6px 14px;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:#ccc;flex-wrap:nowrap;">
    <span class="rl-title" style="color:#2a7fff;font-weight:bold;letter-spacing:1px;">↺<span class="rlbl"> REPLAY</span></span>
    <button class="btn" id="replay-round-prev" title="Previous round" style="padding:3px 8px;">⟨⟨<span class="rlbl"> RND</span></button>
    <button class="btn" id="replay-prev" title="Previous step" style="padding:3px 8px;">◀<span class="rlbl"> PREV</span></button>
    <button class="btn" id="replay-play-pause" title="Play / pause" style="padding:3px 10px;"><span class="rl-icon">▶</span><span class="rlbl"> PLAY</span></button>
    <button class="btn" id="replay-next" title="Next step" style="padding:3px 8px;"><span class="rlbl">NEXT </span>▶</button>
    <button class="btn" id="replay-round-next" title="Next round" style="padding:3px 8px;"><span class="rlbl">RND </span>⟩⟩</button>
    <span id="replay-counter" style="color:#8ab;margin-left:6px;white-space:nowrap;">Step 0 / 0</span>
    <span id="replay-round-label" style="color:#8ab;margin-left:2px;white-space:nowrap;"></span>
    <span style="flex:1;"></span>
    <button class="btn" id="exit-replay" title="Exit replay" style="padding:3px 10px;color:#f66;border-color:#f66;">✕<span class="rlbl"> EXIT REPLAY</span></button>
  </div>

  <aside class="panel left" id="panel-left">
    <div class="panel-section">
      <div class="panel-title shal" id="shal-title">FLEET <span class="count" id="shal-count"></span></div>
      <div id="shal-groups"></div>
    </div>
    <div class="panel-section" style="margin-top:14px;">
      <div class="panel-title ucm" id="ucm-title">FLEET <span class="count" id="ucm-count"></span></div>
      <div id="ucm-groups"></div>
    </div>
  </aside>

  <main class="board-wrap">
    <svg id="board" viewBox="0 0 576 576" preserveAspectRatio="xMidYMid meet" overflow="visible"></svg>
    <canvas id="board3d"></canvas>
    <div class="board-hud">
      <div class="hud-item" id="hud-active">SELECT A GROUP →</div>
      <div class="hud-item" id="hud-turn-info" style="display:none;"></div>
      <div class="hud-row">
        <button class="hud-btn" id="btn-3d-toggle" style="padding:4px 7px;" title="Toggle 3D view">3D</button>
        <button class="hud-icon-btn" id="btn-zoom-reset" title="Reset zoom (double-click to fit board)">⤢</button>
        <button class="hud-icon-btn" id="btn-arc-toggle" data-arcview="1" title="Arcs+Scan: show weapon arcs &amp; scan range / enemy signatures">⚙</button>
        <button class="hud-icon-btn" id="btn-sig-toggle" data-arcview="2" title="Sig: show own signature aura / enemy arcs &amp; scan ranges">◎</button>
        <button class="hud-icon-btn" id="btn-trails-toggle" title="Toggle movement trail lines">↝</button>
      </div>
    </div>
    <div class="board-legend">
      <div class="legend-row">
        <div class="legend-item"><span class="legend-swatch scan"></span>Scan</div>
        <div class="legend-item"><span class="legend-swatch arcF"></span>F arc (90°)</div>
        <div class="legend-item"><span class="legend-swatch arcS"></span>S arc</div>
        <div class="legend-item"><span class="legend-swatch arcFN"></span>FN/RN (22°)</div>
      </div>
    </div>
  </main>

  <aside class="panel right" id="panel-right">
    <div id="detail-panel">
      <div class="empty-state">
        Click a Group in the left panel,<br>
        then click a Ship on the board<br>
        to issue movement orders.
      </div>
    </div>
    <div id="event-log-dock"></div>
  </aside>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
  }
}
</script>
<script type="module">
// ─── ENGINE IMPORTS ──────────────────────────────────────────────────────────
import { APP_VERSION, RULEBOOK_VERSION, ERRATA_VERSION } from '../src/engine/version.js';
import {
  FACTIONS, ORDERS, INCH, BOARD_IN, BOARD_PX,
  DROPSITE_BASE, FEATURES, ds, LAYOUTS, DEPLOYMENTS,
  APPROACH_BEHAVIOURS, APPROACHES, VARIANTS,
  SECONDARY_OBJECTIVES, OBJECTIVES, ASSET_PROFILES
} from '../src/engine/constants.js';

import { localRng as _rng, rollD6 as _rollD6, rollDie as _rollDie, makeRng as _makeRng } from '../src/engine/rng.js';
import { parseNewRecruit } from '../src/fleet/parser.js';
import { FASTPLAY_LISTS } from '../src/fleet/fastplay/index.js';
import { findShipDef, ADMIRAL_FACTION_ABILITIES, FAMOUS_ADMIRAL_ABILITIES, FACTION_ADMIRAL_TITLES, FACTION_ADMIRAL_PERSONAL, SHIP_SPECIAL_RULES } from '../src/fleet/db.js';

// Resolve the live colour objects for each side from state.sideColors.
function player1Color() { return PLAYER_COLORS[(state.sideColors && state.sideColors.player1) || 'blue']; }
function player2Color() { return PLAYER_COLORS[(state.sideColors && state.sideColors.player2) || 'red'];  }

function ucmColor()  { return player1Color(); }

// Inline rgba helpers used in JS template strings.
function ucmRgba(a)        { const c = player1Color(); return `rgba(${c.rgb},${a})`; }
function shalRgba(a)       { const c = player2Color(); return `rgba(${c.rgb},${a})`; }
function sideRgba(side, a) { return side === 'player1' ? ucmRgba(a) : shalRgba(a); }
// Map a side identifier ('player1'|'player2') to its CSS custom-property key ('ucm'|'shal').
function sideCssKey(side) { return side === 'player1' ? 'ucm' : 'shal'; }

// Push colour choices into the CSS custom properties so all var(--ucm) / var(--shal)
// references in CSS classes pick up the current player colours automatically.
// Lighten a hex colour by mixing it toward white by `amount` (0–1).
function _lightenHex(hex, amount) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lr = Math.round(r + (255 - r) * amount);
  const lg = Math.round(g + (255 - g) * amount);
  const lb = Math.round(b + (255 - b) * amount);
  return `#${lr.toString(16).padStart(2,'0')}${lg.toString(16).padStart(2,'0')}${lb.toString(16).padStart(2,'0')}`;
}

function applyThemeColors() {
  const root = document.documentElement;
  const uc = ucmColor(), sh = shalColor();
  // If both players chose the same colour, brighten player2's colour so they remain distinct.
  const clashFix = (state.sideColors?.player1 === state.sideColors?.player2)
    && state.sideColors?.player1;
  const shHex = clashFix ? _lightenHex(sh.hex, 0.45) : sh.hex;
  const shRgb = clashFix ? (() => {
    const r = parseInt(shHex.slice(1,3),16), g = parseInt(shHex.slice(3,5),16), b = parseInt(shHex.slice(5,7),16);
    return `${r},${g},${b}`;
  })() : sh.rgb;
  root.style.setProperty('--ucm',      uc.hex);
  root.style.setProperty('--ucm-dim',  uc.dim);
  root.style.setProperty('--ucm-glow', `rgba(${uc.rgb},${uc.glowA})`);
  root.style.setProperty('--shal',      shHex);
  root.style.setProperty('--shal-dim',  clashFix ? _lightenHex(sh.dim, 0.3) : sh.dim);
  root.style.setProperty('--shal-glow', `rgba(${shRgb},${sh.glowA})`);
  root.style.setProperty('--grid-line',      `rgba(${uc.rgb},0.07)`);
  root.style.setProperty('--grid-line-shal', `rgba(${shRgb},0.07)`);
}

function renderEventLog() {
  const dock = document.getElementById('event-log-dock');
  if (!dock) return;
  const isOnline = !!_netRoom;

  // Float above the setup overlay during non-play phases (setup overlay covers the panel)
  if (isOnline && state.phase !== 'play') {
    dock.classList.add('chat-dock-float');
  } else {
    dock.classList.remove('chat-dock-float');
  }

  dock.style.display = '';

  // Non-online, non-play: minimal header only
  if (!isOnline && state.phase !== 'play') {
    dock.innerHTML = `<div style="display:flex;align-items:center;gap:6px;padding:6px 11px;font-family:var(--mono);">
      <span style="font-size:8px;letter-spacing:0.14em;color:var(--text-mute);">EVENT LOG</span>
    </div>`;
    return;
  }

  const netDot = isOnline
    ? (_aiThinking
        ? `<span style="font-size:9px;font-family:var(--mono);color:var(--text-mute);letter-spacing:0.05em;animation:pulse 1s infinite;">⏳ AI thinking…</span>`
        : `<span style="width:6px;height:6px;border-radius:50%;background:${_netConnected ? '#4ad66d' : '#ff5252'};display:inline-block;flex-shrink:0;"></span>
           <span style="font-size:8px;font-family:var(--mono);color:var(--text-mute);letter-spacing:0.06em;">${_netRoom}</span>`)
    : '';

  const badge = _chatUnread > 0 ? `<span class="chat-unread">${_chatUnread}</span>` : '';
  const inSetup = state.phase !== 'play';
  // During setup (online only), force chat tab; in hotseat always use log tab.
  if (!isOnline && _activeLogTab === 'chat') _activeLogTab = 'log';
  if (isOnline && inSetup && _activeLogTab === 'log') _activeLogTab = 'chat';
  const expanded = inSetup ? _setupChatExpanded : _logExpanded;
  const tabBar = `<div class="log-tab-bar">
    ${netDot ? `<div style="display:flex;align-items:center;gap:4px;padding:0 7px;border-right:1px solid var(--border);">${netDot}</div>` : ''}
    ${isOnline ? `<button class="log-tab-btn${_activeLogTab === 'chat' ? ' active' : ''}" id="log-tab-chat">CHAT ${badge}</button>` : ''}
    ${inSetup ? '' : `<button class="log-tab-btn${_activeLogTab === 'log' ? ' active' : ''}" id="log-tab-log">EVENT LOG <span style="font-size:7.5px;color:var(--text-mute);">${(state.eventLog||[]).length}</span></button>`}
    <button class="log-tab-btn" id="log-expand" style="flex:0 0 auto;padding:4px 9px;margin-left:auto;" title="${expanded ? 'Collapse' : 'Expand'}">${expanded ? '▾' : '▴'}</button>
  </div>`;

  let content = '';
  if (_activeLogTab === 'log') {
    if (state.phase !== 'play') {
      content = `<div class="chat-empty">Game not started.</div>`;
    } else {
      const log = state.eventLog || [];
      const shown = expanded ? log.slice().reverse() : log.slice(-3).reverse();
      const rows = shown.length
        ? shown.map(e => `<div style="padding:3px 11px;border-top:1px solid rgba(255,255,255,0.04);display:flex;gap:7px;font-size:9.5px;font-family:var(--mono);">
            <span style="color:var(--text-mute);flex-shrink:0;">R${e.round}</span>
            <span style="color:var(--text-dim);">${e.text}</span></div>`).join('')
        : `<div class="chat-empty">No events yet.</div>`;
      content = `<div id="event-log-body" style="max-height:${expanded ? '280px' : '72px'};overflow-y:auto;">${rows}</div>`;
    }
  } else {
    // Chat tab
    const msgs = _chatMessages.length
      ? _chatMessages.map(m => {
          const t = new Date(m.ts);
          const time = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
          const escaped = m.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          return `<div class="chat-msg">
            <div class="chat-msg-header">
              <span class="chat-msg-user ${m.side}">${m.username.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>
              <span class="chat-msg-time">${time}</span>
            </div>
            <div class="chat-msg-text">${escaped}</div>
          </div>`;
        }).join('')
      : `<div class="chat-empty">No messages yet.</div>`;

    const inputRow = canSend
      ? `<div class="chat-input-row">
           <input class="chat-input" id="chat-input" type="text" maxlength="500" placeholder="Message…" autocomplete="off"/>
