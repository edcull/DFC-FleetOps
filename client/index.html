  const placed = state.scenarioData.placedScenery || [];
  const placedCount = (type) => placed.filter(s => s.type === type).length;
  const totalLeft = Object.keys(t).reduce((n, k) => n + Math.max(0, (t[k]||0) - placedCount(k)), 0);

  // Multiplayer: only the active placer may use the buttons; also locked after committing.
  const myCommitted = _netSide && (state.sceneryReady || {})[_netSide];

      : `<button class="btn-primary" id="commit-scenery-both" style="width:100%;margin-top:6px;padding:4px 8px;font-size:10px;">✓ SCENERY DONE</button>`;

    ${hintText}
    ${doneBtn}

function renderDropsiteActivation() {
  const board = document.querySelector('.board-wrap');
  // Always remove legacy separate elements
  ['da-overlay','da-launch-banner'].forEach(id => { const b = document.getElementById(id); if (b) b.remove(); });
  if (!state.dropsiteActivation) {
    const b = document.getElementById('da-ds-banner'); if (b) b.remove();
    return;
  }

  const da = state.dropsiteActivation;
  const sideName = (s) => FACTIONS[state.factions[s]] ? FACTIONS[state.factions[s]].name : s.toUpperCase();
  const otherSide = da.side === 'player1' ? 'player2' : 'player1';
  const sideKey = da.side === 'player1' ? 'ucm' : 'shal';
  const isMyTurn = !_netSide || _gs() === da.side;

  // Dropsites this side Controls (not contested) and hasn't activated yet.
  const controlled = (state.scenarioData ? state.scenarioData.dropsites : [])
    .filter(d => dropsiteController(d) === da.side && !da.done.includes(d.id));
  const otherControlled = (state.scenarioData ? state.scenarioData.dropsites : [])
    .filter(d => dropsiteController(d) === otherSide && !da.done.includes(d.id));

  // Auto-advance: if the active side has no controlled dropsites and nothing is activating,
  // silently pass to the other side (or end the phase) after a brief paint.
  if (!da.dsId && controlled.length === 0 && isMyTurn) {
    setTimeout(() => {
      if (!state.dropsiteActivation || state.dropsiteActivation.dsId) return;
      if (otherControlled.length > 0) dispatch({ type: 'daSwitchSide' });
      else dispatch({ type: 'daEnd' });
    }, 0);
  }

  // Build HUD panel (act-hud card, matches activation/scoring/dogfight panels)
  let dsBan = document.getElementById('da-ds-banner');
  if (!dsBan) {
    dsBan = document.createElement('div');
    dsBan.id = 'da-ds-banner';
    dsBan.className = 'act-hud';
    document.body.appendChild(dsBan);
    initPanel(dsBan, 'DROPSITE ACTIVATION', 'da-ds-banner', 8, 200);
  }

  const ds = da.dsId ? (state.scenarioData && state.scenarioData.dropsites.find(d => d.id === da.dsId)) : null;

  // Launch-targeting mode: show fighter/bomber ±/+ controls
  if (state.launching && state.launching.fromDropsite && ds) {
    const L = state.launching;
    const lSideKey = L.side === 'player1' ? 'ucm' : 'shal';
    if (L.type === 'fighter_bomber') {
      const f = L.fighters||0, b = L.bombers||0;
      dsBan.innerHTML = `
        <div class="act-hud-title">LAUNCH</div>
        <div class="act-hud-name">${L.name}</div>
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;font-size:10px;">
          <span style="color:var(--text-dim);">Ftr</span>
          <button class="hp-btn" data-da-fb="fighters|-1" ${b>0||f<=0?'disabled':''}>−</button>
          <b style="color:var(--${lSideKey})">${f}</b>
          <button class="hp-btn" data-da-fb="fighters|1" ${b>0?'disabled':''}>+</button>
          <span style="color:var(--text-dim);margin-left:4px;">Bmr</span>
          <button class="hp-btn" data-da-fb="bombers|-1" ${f>0||b<=0?'disabled':''}>−</button>
          <b style="color:var(--${lSideKey})">${b}</b>
          <button class="hp-btn" data-da-fb="bombers|1" ${f>0?'disabled':''}>+</button>
        </div>
        <div style="font-size:9px;color:var(--text-mute);margin-bottom:6px;">Click ≤${L.auraIn}" to place</div>
        <button class="btn" id="da-launch-cancel" style="width:100%;">CANCEL</button>`;
    } else {
      const cnt = L.type === 'fireship' ? (L.fireships||0) : (L.assetCount||1);
      const cntCtl = L.type === 'fireship'
        ? `<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
             <button class="hp-btn" data-da-fb="fireships|-1" ${cnt<=0?'disabled':''}>−</button>
             <b style="color:var(--${lSideKey})">${cnt}</b>
             <button class="hp-btn" data-da-fb="fireships|1">+</button>
           </div>`
        : `<div style="font-size:11px;font-weight:700;color:var(--${lSideKey});margin-bottom:4px;">${cnt}</div>`;
      dsBan.innerHTML = `
        <div class="act-hud-title">LAUNCH</div>
        <div class="act-hud-name">${L.name}</div>
        ${cntCtl}
        <div style="font-size:9px;color:var(--text-mute);margin-bottom:6px;">Click ≤${L.auraIn}" to place</div>
        <button class="btn" id="da-launch-cancel" style="width:100%;">CANCEL</button>`;
    }
  } else if (ds) {
    // A dropsite is selected — confirm / skip
    dsBan.innerHTML = `
      <div class="act-hud-title">DROPSITE ACTIVATION</div>
      <div class="act-hud-name" style="color:var(--${sideKey})">${ds.base.name}</div>
      <div style="font-size:9px;color:var(--text-dim);margin-bottom:6px;">Fire weapons / launch assets in right panel.</div>
      ${isMyTurn ? `
        <button class="btn-finish-act" id="da-confirm-finish" style="width:100%;margin-bottom:4px;">CONFIRM END ACTIVATION ▸</button>
        <button class="btn" id="da-skip-all" style="width:100%;">SKIP ALL ACTIVATIONS</button>
      ` : ''}`;
  } else if (controlled.length > 0) {
    // Picking phase — controlled dropsites are highlighted on the map; click one to activate
    dsBan.innerHTML = `
      <div class="act-hud-title">DROPSITE ACTIVATION</div>
      <div class="act-hud-name" style="color:var(--${sideKey})">${sideName(da.side)}</div>
      <div style="font-size:9px;color:var(--text-dim);margin-bottom:6px;">Click a highlighted dropsite to activate it.</div>
      ${isMyTurn ? `<button class="btn" id="da-skip-all" style="width:100%;">SKIP ALL ACTIVATIONS</button>` : ''}`;
  } else {
    // No dropsites left for this side
    dsBan.innerHTML = `
      <div class="act-hud-title">DROPSITE ACTIVATION</div>
      <div class="act-hud-name" style="color:var(--${sideKey})">${sideName(da.side)}</div>
      <div style="font-size:9px;color:var(--text-dim);margin-bottom:6px;">No more Dropsites to activate.</div>
      ${isMyTurn && otherControlled.length > 0
        ? `<button class="btn-primary" id="da-next-side" style="width:100%;">${sideName(otherSide).toUpperCase()}'S TURN →</button>`
        : ''}`;
  }

  // "Confirm End Activation" — finish this dropsite and pass to the opponent
  const confirmFinishBtn = dsBan.querySelector('#da-confirm-finish');
  if (confirmFinishBtn) confirmFinishBtn.addEventListener('click', () => dispatch({ type: 'daFinishDropsite', dsId: da.dsId }));
  // "Skip All Activations" — dispatch daSwitchSide; mutator marks this side's dropsites done
  const skipAll = dsBan.querySelector('#da-skip-all');
  if (skipAll) skipAll.addEventListener('click', () => dispatch({ type: 'daSwitchSide' }));
  const nextBtn = dsBan.querySelector('#da-next-side');
  if (nextBtn) nextBtn.addEventListener('click', () => dispatch({ type: 'daSwitchSide' }));
  const doneBtn = dsBan.querySelector('#da-done');
  if (doneBtn) doneBtn.addEventListener('click', () => dispatch({ type: 'daEnd' }));
}

      <div class="act-hud-title" style="color:var(--hull-good);">⊕ END PHASE · ROUND ${M.round} SCORING</div>
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <div style="flex:1;text-align:center;">
          <div style="font-size:9px;color:var(--ucm);">${playerNameForSide('player1')}</div>

          <div style="font-size:9px;color:var(--shal);">${playerNameForSide('player2')}</div>
          <div style="font-size:18px;font-weight:700;color:var(--shal);">${M.player2>=0?'+':''}${M.player2}</div>
          <div style="font-size:8px;color:var(--text-mute);">${state.score.player2.vp} total</div>
        </div>
      </div>
      <div style="font-size:8px;color:var(--text-mute);margin-bottom:3px;">DROPSITES (${playerNameForSide('player1')} / ${playerNameForSide('player2')})</div>
      <div style="margin-bottom:6px;">${rows || '<div style="font-size:9px;color:var(--text-mute);">No dropsites scored.</div>'}</div>
      <button class="btn-primary" id="scoring-ok" style="width:100%;margin-top:4px;">CONTINUE →</button>
    `;
    board.appendChild(hud);
    initPanel(hud, 'END PHASE · SCORING', 'scoring-overlay', 120, 80);
    hud.querySelector('#scoring-ok').addEventListener('click', () => {
      state.scoringModal = null;
      _scoringHudDismissedRound = currentRound;
      renderAll();
    });
  } else {
    // General round scoring — just the log lines
    const lines = (log || []).map(l => `<div style="font-size:9px;color:var(--text-dim);padding:2px 0;">${l}</div>`).join('');
    hud.innerHTML = `
      <div class="act-hud-title" style="color:var(--hull-good);">⊕ END PHASE · VICTORY POINTS</div>
      <div style="margin-bottom:6px;">${lines || '<div style="font-size:9px;color:var(--text-mute);">No VP scored this round.</div>'}</div>
      <div style="display:flex;gap:6px;margin-bottom:6px;font-size:9px;">
        <span style="color:var(--ucm);">${playerNameForSide('player1')} ${state.score.player1.vp} VP</span>
        <span style="color:var(--text-mute);">·</span>
        <span style="color:var(--shal);">${playerNameForSide('player2')} ${state.score.player2.vp} VP</span>

    initPanel(hud, 'END PHASE · VICTORY POINTS', 'scoring-overlay', 120, 80);
    hud.querySelector('#scoring-ok').addEventListener('click', () => {
      _scoringHudDismissedRound = currentRound;
      renderAll();
    });
  }
}

/* AP adjuster modal — opened from a fleet's AP chip.
   Shows the current AP, +/- controls (own side only in online), and a reference
   list of admiral abilities available to this side. */
function renderApEditModal() {
  let overlay = document.getElementById('ap-edit-overlay');
  if (overlay) overlay.remove();
  const side = state.apEditOpen;
  if (!side || !state.planning) return;
  const P = state.planning;
  const ownSide = _netSide ? _gs() : null; // null in hotseat = can adjust either
  const canAdjust = !ownSide || ownSide === side;

  // ── Build ability reference list ──────────────────────────────────────────
  const CORE = [
    { cost: '1/die', name: 'AP Re-roll',        desc: 'After any roll, re-roll any dice (once per activation).' },
    { cost: '2 AP',  name: 'Brace for Impact',  desc: 'Declare before Crippling roll. Set result to 4.' },
    { cost: '2 AP',  name: 'Contain Reactor',   desc: 'Declare before Explosion roll. Set result to 2.' },
    { cost: '2 AP',  name: 'Time to Target',    desc: 'Move a Fighter/Bomber Wing a second time up to 6".' },
  ];
  const abilityRow = (a) =>
    `<tr><td style="padding:3px 6px;color:var(--hull-warn);font-size:9px;white-space:nowrap;font-weight:600;">${a.cost}</td>
     <td style="padding:3px 6px;font-size:10px;font-weight:600;">${a.name}</td>
     <td style="padding:3px 6px;font-size:9px;color:var(--text-dim);">${a.desc}</td></tr>`;
  const sectionHdr = (lbl) =>
    `<tr><td colspan="3" style="padding:5px 6px 2px;font-size:8px;letter-spacing:0.1em;color:var(--text-mute);background:rgba(255,255,255,0.03);border-top:1px solid rgba(255,255,255,0.08);">${lbl}</td></tr>`;

  // Famous admiral abilities for this side
  const slot = state.slotForSide && state.slotForSide[side];
  const imp = slot && state.importedFleets && state.importedFleets[slot];
  const asns = imp && imp.admiralAssignments ? imp.admiralAssignments : [];
  let extraRows = '';
  // Famous admirals
  asns.filter(a => a.isFamous).forEach(a => {
    const grp = imp && imp.groups && imp.groups[a.groupIdx];
    if (!grp) return;
    const faAbs = (FAMOUS_ADMIRAL_ABILITIES && FAMOUS_ADMIRAL_ABILITIES[grp.name]) || [];
    if (faAbs.length) {
      extraRows += sectionHdr(`★ ${grp.name.toUpperCase()} ABILITIES`);
      faAbs.forEach(ab => { extraRows += abilityRow(ab); });
    }
  });
  // Non-famous admiral abilities (personal + chosen faction pick)
  asns.filter(a => !a.isFamous).forEach(a => {
    const admEntry = imp && imp.admirals && imp.admirals[a.admiralIdx];
    const title = admEntry ? admEntry.title : '';
    // Personal abilities for named faction admirals (Captain, Rear Admiral, etc.)
    const factionPersonal = FACTION_ADMIRAL_PERSONAL && FACTION_ADMIRAL_PERSONAL[imp && imp.faction] || {};
    const titleKey = Object.keys(factionPersonal).find(k => (title || '').toLowerCase().includes(k));
    if (titleKey) {
      const personal = factionPersonal[titleKey] || [];
      if (personal.length) {
        extraRows += sectionHdr(`${title.toUpperCase()} ABILITIES`);
        personal.forEach(ab => { extraRows += abilityRow({ cost: `${ab.cost} AP`, name: ab.name, desc: ab.desc }); });
      }
    }
    // Chosen faction pool ability
    const abs = a.abilities || [];

  if (overlay) overlay.remove();
  if (!state.vpBreakdownOpen || !state.score) return;
  const sideBlock = (side) => {
    const col = `var(--${sideCssKey(side)})`;

      <div style="font-size:9px;color:var(--text-mute);margin-bottom:6px;">${state.score[side].kp} Kill Points</div>

    </div>`;
  };
  const _scAsym = !!(state.scenario && state.scenario.objectives);
  const obj = state.scenario && state.scenario.objective ? OBJECTIVES[state.scenario.objective] : null;
  const objExpanded = !!state.vpObjOpen;
  const objTitle = _scAsym
    ? `${OBJECTIVES[state.scenario.objectives.player1]?.name || '—'} / ${OBJECTIVES[state.scenario.objectives.player2]?.name || '—'}`
    : (obj ? obj.name : '');
  const objDetail = _scAsym
    ? ['player1','player2'].map(s => { const o = OBJECTIVES[state.scenario.objectives[s]]; const col = s==='player1'?'var(--ucm)':'var(--shal)'; return o ? `<div style="margin-bottom:6px;"><b style="color:${col};">${factionName(s)} — ${o.name}:</b> ${o.desc}${o.bonus ? `<div style="margin-top:3px;color:var(--hull-good,#6ec97a);">▸ ${o.bonus}</div>` : ''}</div>` : ''; }).join('')
    : (obj ? `${obj.desc}${obj.bonus ? `<div style="margin-top:6px;color:var(--hull-good,#6ec97a);">▸ ${obj.bonus}</div>` : ''}` : '');
  const objBlock = (obj || _scAsym) ? `<button id="vp-obj-toggle" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:${ucmRgba(0.06)};border:1px solid var(--ucm);border-radius:5px;padding:7px 11px;cursor:pointer;margin-bottom:12px;">
      <span style="font-size:9px;letter-spacing:0.12em;color:var(--text-mute);">OBJECTIVE${_scAsym?' (PER SIDE)':''}</span>

      <span style="color:var(--text-mute);font-size:11px;">${objExpanded ? '▾' : '▸'}</span>
    </button>

      ${objDetail}
    </div>` : ''}` : '';

  // Secondary objectives block
  const secExpanded = !!state.vpSecOpen;

  const _secSides = ['player1', 'player2'];
  const secRows = _secSides.flatMap(side => {
    const keys = (state.secondaries && state.secondaries[side]) || [];
    return keys.map(k => {
      const sd = SECONDARY_OBJECTIVES[k];

  // Kill Points preview block
  let kpBlock = '';
  if (objAny('kill_points')) {
    const kpRow = (side) => {
      const kp = state.score[side].kp;
      const proj = Math.floor(kp / 500) * 2;
      const col = `var(--${sideCssKey(side)})`;
      return `<div style="display:flex;gap:8px;align-items:baseline;font-size:10px;padding:2px 0;">
        <span style="color:${col};min-width:70px;font-weight:700;">${factionName(side)}</span>
        <span style="flex:1;color:var(--text-dim);">${kp} Kill Points</span>
        <b style="color:${col};">+${proj} VP projected</b>
      </div>`;
    };
    kpBlock = `<div style="background:rgba(110,201,122,0.06);border:1px solid rgba(110,201,122,0.2);border-radius:5px;padding:7px 11px;margin-bottom:12px;">
      <div style="font-size:9px;letter-spacing:0.12em;color:var(--text-mute);margin-bottom:4px;">KILL POINTS (game end)</div>
      ${kpRow('player1')}${kpRow('player2')}
      <div style="font-size:9px;color:var(--text-mute);margin-top:3px;">+2 VP per 500 Kill Points at game end.</div>
    </div>`;
  }
  // Assess status block
  let assessBlock = '';
  if (objAny('assess')) {
    const dss = (state.scenarioData && state.scenarioData.dropsites) || [];
    const assessRow = (side) => {
      const assessed = (state.assessedDropsites && state.assessedDropsites[side]) || [];
      const col = `var(--${sideCssKey(side)})`;
      const names = assessed.map(id => { const d = dss.find(x => x.id === id); return d ? d.base.name : id; });
      return `<div style="font-size:10px;padding:2px 0;">
        <span style="color:${col};font-weight:700;">${factionName(side)}:</span>
        <span style="color:var(--text-dim);">${names.length ? names.join(', ') : 'none yet'}</span>
        <b style="color:${col};float:right;">${assessed.length} VP</b>
      </div>`;
    };
    assessBlock = `<div style="background:rgba(90,58,138,0.08);border:1px solid rgba(122,90,170,0.3);border-radius:5px;padding:7px 11px;margin-bottom:12px;">
      <div style="font-size:9px;letter-spacing:0.12em;color:var(--text-mute);margin-bottom:4px;">ASSESS (dropsites assessed this game)</div>
      ${assessRow('player1')}${assessRow('player2')}
    </div>`;
  }
  // Focal Points live preview
  let focalBlock = '';
  const _fps = state.scenarioData && state.scenarioData.focalPoints;
  if (_fps && _fps.length) {
    const _FOCAL_HIGH = {L:1,M:4,H:7,C:11}, _FOCAL_LOW = {L:0,M:1,H:3,C:5};
    const fpRows = _fps.map((fp, fi) => {
      const special = fp.special || [];
      const totals = {player1:0, player2:0};
      Object.keys(state.groups).forEach(gid => {
        const def = getDef(gid);
        if (!def) return;
        state.groups[gid].ships.forEach(ship => {
          if (ship.destroyed || ship.offTable) return;
          const zone = state.deployZone && state.deployZone[def.side];
          if (zone && (special.includes('north') || special.includes('south')) && !special.includes(zone)) return;
          const isCrippled = ship.hull <= ship.maxHull / 2;
          const useLow = (special.includes('low_crippled') && isCrippled)
                      || (zone && special.includes(`low_${zone}`))
                      || (zone && special.includes(`low_${zone}_crippled`) && isCrippled);
          const t = def.tonnage || 'L';
          totals[def.side] += useLow ? (_FOCAL_LOW[t]||0) : (_FOCAL_HIGH[t]||1);
        });
      });
      const label = fp.label || `Focal Point ${fi+1}`;
      const max = Math.max(totals.player1, totals.player2);
      const p1vp = totals.player1===max&&max>0?3:(totals.player1>0&&max>0&&totals.player1>=max/2?1:0);
      const p2vp = totals.player2===max&&max>0?3:(totals.player2>0&&max>0&&totals.player2>=max/2?1:0);
      return `<div style="font-size:10px;padding:2px 0;border-bottom:1px solid var(--border);margin-bottom:2px;">
        <b style="color:var(--text-dim);">${label}</b>
        <span style="float:right;color:var(--text-mute);">if scored now:</span>
        <div style="display:flex;gap:12px;margin-top:2px;">
          <span style="color:var(--ucm);">${factionName('player1')}: <b>${totals.player1}</b> val &#8594; <b>${p1vp} VP</b></span>
          <span style="color:var(--shal);">${factionName('player2')}: <b>${totals.player2}</b> val &#8594; <b>${p2vp} VP</b></span>
        </div>
      </div>`;
    }).join('');
    focalBlock = `<div style="background:rgba(232,184,79,0.06);border:1px solid rgba(232,184,79,0.2);border-radius:5px;padding:7px 11px;margin-bottom:12px;">
      <div style="font-size:9px;letter-spacing:0.12em;color:var(--text-mute);margin-bottom:4px;">FOCAL POINTS (live ship values — scored R4 &amp; R6)</div>
      ${fpRows}
    </div>`;
  }
  overlay.innerHTML = `
    <div class="setup-header"><h2 class="setup-title">VICTORY POINTS</h2>
      <div class="setup-sub">Round ${state.round} / 6 · VP decides the game (Kill Points break ties)</div></div>
    <div class="setup-body" style="overflow-y:auto;flex:1;">
      ${objBlock}
      ${secBlock}
      ${kpBlock}${assessBlock}${focalBlock}
      <div style="display:flex;gap:18px;">${sideBlock('player1')}${sideBlock('player2')}</div>
    </div>
    </div>`;

  document.body.appendChild(overlay);
  const closeVP = () => { state.vpBreakdownOpen = false; state.vpObjOpen = false; state.vpSecOpen = false; renderAll(true); };
  initPanel(overlay, 'VICTORY POINTS', 'vpbreak-overlay', 80, 40, closeVP, true);
  const objToggle = overlay.querySelector('#vp-obj-toggle');
  if (objToggle) objToggle.addEventListener('click', () => { state.vpObjOpen = !state.vpObjOpen; renderAll(true); });
  const secToggle = overlay.querySelector('#vp-sec-toggle');
  if (secToggle) secToggle.addEventListener('click', () => { state.vpSecOpen = !state.vpSecOpen; renderAll(true); });
}

/* Trigger a client-side download of `obj` as a pretty-printed JSON file. */
function _downloadJson(filename, obj) {
  try {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) {
    alert('Could not download file: ' + err.message);
  }
}

/* ── End-game report ──────────────────────────────────────────────────────────
   A turn-by-turn (tab per round) breakdown of a game, built purely from the
   categorised state.eventLog. Works for the live game (pass `state`) and for a
   completed saved game (pass the fetched save's currentState). */
let _reportRound = 1;
const _REP_BLUE = '#4ad6ff', _REP_RED = 'var(--hull-crit, #ff5252)', _REP_ORANGE = 'var(--hull-warn, #ffb547)';
const _REPORT_SECTIONS = [
  { cat: 'vp',        title: 'Victory Points',        color: '#6ec97a' },
  { cat: 'attack',    title: 'Attacks & Casualties',  color: _REP_RED },
  { cat: 'bomber',    title: 'Bomber & Asset Attacks', color: _REP_BLUE },
  { cat: 'launch',    title: 'Launches & Assets',     color: _REP_BLUE },
  { cat: 'ground',    title: 'Ground Assault',        color: '#6ec97a' },
  { cat: 'battalion', title: 'Battalion Combat',      color: _REP_ORANGE },
  { cat: 'repair',    title: 'Repairs',               color: _REP_ORANGE },
];
// Per-line colour: launches/bomber runs are blue, a ship destroyed/captured is red,
// crippling and battalion-combat results are orange. Else inherit the section's dim colour.
function _repLineColor(e) {
  if (e.cat === 'launch' || e.cat === 'bomber') return _REP_BLUE;
  if (e.cat === 'battalion' || /crippled/i.test(e.text)) return _REP_ORANGE;
  if (/\b(destroyed|captured)\b/i.test(e.text)) return _REP_RED;
  return '';
}
// Per-side D6 distribution panel: every to-hit die (attacker) and save die (defender),
// re-rolls included, tallied as state.diceStats[side] = [#1,#2,#3,#4,#5,#6].
function _repDiceHtml(R, p1, p2) {
  const ds = R.diceStats || {};
  const a1 = ds.player1 || [0, 0, 0, 0, 0, 0], a2 = ds.player2 || [0, 0, 0, 0, 0, 0];
  if (!a1.some(Boolean) && !a2.some(Boolean)) return `<div class="rep-empty">No dice were rolled.</div>`;
  const sideBlock = (arr, name, color) => {
    const total = arr.reduce((a, b) => a + b, 0);
    const max = Math.max(1, ...arr);
    const avg = total ? arr.reduce((a, b, i) => a + b * (i + 1), 0) / total : 0;
    const rows = arr.map((c, i) => {
      const pct = total ? Math.round(c / total * 100) : 0;
      const w = Math.round(c / max * 100);
      return `<div style="display:flex;align-items:center;gap:8px;margin:3px 0;">
        <span style="width:12px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--text-dim);">${i + 1}</span>
        <div style="flex:1;height:14px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;">
          <div style="width:${w}%;height:100%;background:${color};opacity:0.75;"></div></div>
        <span style="width:74px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--text-mute);">${c} · ${pct}%</span>
      </div>`;
    }).join('');
    return `<div style="flex:1;min-width:180px;">
      <div style="font-size:12px;font-weight:700;color:${color};">${name}</div>
      <div style="font-size:9px;color:var(--text-mute);margin:2px 0 8px;">${total} dice · average ${avg.toFixed(2)}</div>
      ${rows}
    </div>`;
  };
  return `<div style="font-size:10px;color:var(--text-mute);margin-bottom:12px;">All to-hit dice (attacker) and save dice (defender) rolled this game, re-rolls included.</div>
    <div style="display:flex;gap:22px;flex-wrap:wrap;">
      ${sideBlock(a1, p1, 'var(--ucm)')}
      ${sideBlock(a2, p2, 'var(--shal)')}
    </div>`;
}
function _repEsc(t) {
  return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
// ── Per-activation trace (report round view) ──────────────────────────────────
const _REP_ORDER_RE = /\s→\s(General Quarters|Silent Running|Weapons Free|Course Change|Max Thrust|Damage Control)$/;
const _REP_DIE_COL = { crit: '#ffb547', hit: '#6ec97a', miss: '#5a6b78', saved: '#4ad6ff', fail: '#ff5252' };
function _repDie(face, cls) {
  return `<span style="display:inline-block;min-width:15px;height:15px;line-height:15px;text-align:center;margin:1px;border-radius:2px;font-family:var(--mono);font-size:9px;background:${_REP_DIE_COL[cls] || '#33424d'};color:#06121a;font-weight:700;">${face}</span>`;
}
// Expanded roll trace for one weapon shot: to-hit dice (lock / atmosphere) and save dice.
function _repShot(sh) {
  const hitB = (sh.hitDice || []).map(d => _repDie(d.r, d.crit ? 'crit' : d.hit ? 'hit' : 'miss')).join('');
  const lockTxt = sh.forceSix ? 'Atmosphere — hits on 6 only, no crit' : `Lock ${sh.lock}+`;
  const sv = (sh.saveDice && sh.saveDice[0]) ? sh.saveDice[0].sv : null;
  const saveB = (sh.saveDice || []).map(d => _repDie(d.r, d.ok ? 'saved' : 'fail')).join('');
  const backB = (sh.backupDice || []).map(d => _repDie(d.r, d.ok ? 'saved' : 'fail')).join('');
  const aegB  = (sh.aegisDice  || []).map(d => _repDie(d.r, d.ok ? 'saved' : 'fail')).join('');
  const typeTxt = { K: 'Kinetic', E: 'Energy', C: 'Core' }[sh.type] || sh.type || '';
  return `<div style="padding:5px 0;border-top:1px solid rgba(255,255,255,0.05);">
    <div style="font-size:10px;color:var(--text-dim);"><b>${_repEsc(sh.weapon)}</b> ▶ ${_repEsc(sh.target)}</div>
    <div style="font-size:9px;color:var(--text-mute);margin:2px 0;">To-hit · ${lockTxt}</div>
    <div>${hitB || '<span style="font-size:9px;color:var(--text-mute);">no dice</span>'} <span style="font-size:9px;color:var(--text-mute);">→ ${sh.hits} hit${sh.crits ? ` · ${sh.crits} crit` : ''}</span></div>
    ${saveB ? `<div style="font-size:9px;color:var(--text-mute);margin:4px 0 2px;">${typeTxt} saves · ${sv ? sv + '+' : '—'}${sh.backupVal ? ` · backup ${sh.backupVal}+` : ''}</div>
      <div>${saveB}${backB ? ` <span style="font-size:9px;color:var(--text-mute);">bk</span> ${backB}` : ''}${aegB ? ` <span style="font-size:9px;color:var(--text-mute);">ae</span> ${aegB}` : ''} <span style="font-size:9px;color:var(--text-mute);">→ ${sh.unsaved} unsaved · ${sh.dmg} dmg</span></div>` : ''}
  </div>`;
}
// Group a round's events into activations (order → moves → attacks/launches) for the trace.
function _repActivations(R, round) {
  const ev = (R.eventLog || []).filter(e => (e.round || 1) === round);
  const acts = []; const tail = [];
  let cur = null, expId = 0;
  for (const e of ev) {
    const m = e.text.match(_REP_ORDER_RE);
    if (m) {
      const name = e.text.replace(_REP_ORDER_RE, '').replace(/\s#\d+$/, '').trim();
      if (cur && cur.group === name && cur.order === m[1]) continue; // same group, individual-order spam
      cur = { group: name, order: m[1], moveIn: 0, events: [] }; acts.push(cur);
      continue;
    }
    if (e.cat === 'vp' || e.cat === 'round') { tail.push(e); continue; }
    const mv = e.text.match(/ moved ([\d.]+)"/);
    if (mv && cur) { cur.moveIn += parseFloat(mv[1]); continue; }
    (cur ? cur.events : tail).push(e);
  }
  const ORDER_SHORT = { 'General Quarters': 'GQ', 'Silent Running': 'SR', 'Weapons Free': 'WF', 'Course Change': 'CC', 'Max Thrust': 'MT', 'Damage Control': 'DC' };
  const lineHtml = (e) => {
    const col = _repLineColor(e);
    const detail = /^[·•]/.test(e.text.trim());
    if (e.detail && e.detail.shots && e.detail.shots.length) {
      const id = `exp${round}_${expId++}`;
      const body = e.detail.shots.map(_repShot).join('');
      return `<div class="rep-act-line" data-rep-exp="${id}" style="cursor:pointer;${col ? `color:${col};` : ''}">▸ ${_repEsc(e.text)}</div>
        <div id="${id}" class="rep-exp-body" style="display:none;margin:2px 0 6px 10px;padding-left:8px;border-left:2px solid var(--border);">${body}</div>`;
    }
    return `<div class="rep-act-line${detail ? ' detail' : ''}"${col ? ` style="color:${col};"` : ''}>${_repEsc(e.text)}</div>`;
  };
  let html = acts.map(a => {
    const side = a.events[0] || {};
    return `<div class="rep-act">
      <div class="rep-act-hdr"><b>${_repEsc(a.group)}</b> <span style="color:var(--text-mute);">· ${ORDER_SHORT[a.order] || a.order}${a.moveIn ? ` · moved ${a.moveIn.toFixed(1)}"` : ''}</span></div>
      ${a.events.length ? a.events.map(lineHtml).join('') : '<div class="rep-act-line detail">(no attacks or launches)</div>'}
    </div>`;
  }).join('');
  const tailLines = tail.filter(e => e.cat === 'vp');
  if (tailLines.length) html += `<div class="rep-act"><div class="rep-act-hdr" style="color:#6ec97a;">⊕ End Phase · Scoring</div>${tailLines.map(lineHtml).join('')}</div>`;
  return html || `<div class="rep-empty">No recorded activations for Round ${round}.</div>`;
}
function _repName(R, side) {
  const slot = side === 'player1' ? 'f1' : 'f2';
  return (R.playerNames && R.playerNames[slot]) || (side === 'player1' ? 'Player 1' : 'Player 2');
}
function openGameReport(R) {
  if (!R) return;
  const log = (R.eventLog || []).filter(e => e && e.cat !== 'misc');
  const maxRound = Math.max(1, R.round || 1, ...((R.eventLog || []).map(e => e.round || 1)));
  const rounds = [];
  for (let r = 1; r <= maxRound; r++) rounds.push(r);
  if (!rounds.includes(_reportRound)) _reportRound = rounds[0] || 1;

  const old = document.getElementById('report-overlay');
  if (old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'report-overlay';

  const G = R.gameOver;
  const sc = R.score || { player1: { vp: 0, kp: 0 }, player2: { vp: 0, kp: 0 } };
  const p1 = _repEsc(_repName(R, 'player1')), p2 = _repEsc(_repName(R, 'player2'));
  const resultLine = G
    ? (G.winner === 'draw' ? 'DRAW' : `${_repEsc(_repName(R, G.winner))} WINS`)
    : `In progress — Round ${R.round || 1}`;
  const resultCol = (G && G.winner !== 'draw') ? `var(--${sideCssKey(G.winner)})` : 'var(--text)';

  const renderBody = () => {
    if (_reportRound === 'dice') return _repDiceHtml(R, p1, p2);
    // Per-activation trace: each group's activation (order · move) with its attacks and
    // launches; attack lines expand to show the to-hit and save rolls (one open at a time).
    return _repActivations(R, _reportRound);
  };
  // Accordion: clicking an attack line toggles its roll detail; only one open at a time.
  const wireExpanders = () => {
    overlay.querySelectorAll('[data-rep-exp]').forEach(line => {
      line.addEventListener('click', () => {
        const id = line.dataset.repExp;
        const body = overlay.querySelector('#' + id);
        const open = body && body.style.display !== 'none';
        overlay.querySelectorAll('.rep-exp-body').forEach(b => { b.style.display = 'none'; });
        if (body && !open) body.style.display = 'block';
      });
    });
  };

  overlay.innerHTML = `
    <div class="rep-card">
      <div class="rep-head">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="font-family:var(--display);font-weight:700;letter-spacing:0.1em;font-size:14px;flex:1;">📋 GAME REPORT</div>
          <button class="btn" id="rep-close" style="padding:4px 10px;font-size:11px;">✕ CLOSE</button>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;">
          <div style="text-align:right;flex:1;"><span style="color:var(--ucm);font-size:11px;">${p1}</span>
            <b style="color:var(--ucm);font-size:16px;margin-left:6px;">${sc.player1.vp}</b>
            <span style="color:var(--text-mute);font-size:9px;"> VP · ${sc.player1.kp} KP</span></div>
          <div style="color:${resultCol};font-size:11px;font-weight:700;white-space:nowrap;">${resultLine}</div>
          <div style="text-align:left;flex:1;"><b style="color:var(--shal);font-size:16px;margin-right:6px;">${sc.player2.vp}</b>
            <span style="color:var(--shal);font-size:11px;">${p2}</span>
            <span style="color:var(--text-mute);font-size:9px;"> VP · ${sc.player2.kp} KP</span></div>
        </div>
      </div>
      <div class="rep-tabs" id="rep-tabs">
        ${rounds.map(r => `<button class="rep-tab${r === _reportRound ? ' active' : ''}" data-rep-round="${r}">ROUND ${r}</button>`).join('')}
        ${(R.diceStats ? `<button class="rep-tab${_reportRound === 'dice' ? ' active' : ''}" data-rep-round="dice">🎲 DICE</button>` : '')}
      </div>
      <div class="rep-body" id="rep-body">${renderBody()}</div>
    </div>`;
  document.body.appendChild(overlay);
  wireExpanders();

  const close = () => overlay.remove();
  overlay.querySelector('#rep-close').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelectorAll('[data-rep-round]').forEach(btn => {
    btn.addEventListener('click', () => {
      _reportRound = btn.dataset.repRound === 'dice' ? 'dice' : parseInt(btn.dataset.repRound, 10);
      overlay.querySelectorAll('.rep-tab').forEach(t => t.classList.toggle('active', t === btn));
      overlay.querySelector('#rep-body').innerHTML = renderBody();
      wireExpanders();
    });
  });
}

/* Initiative roll modal — shown at the start of each round. */
function renderInitiative() {
  const board = document.querySelector('.board-wrap');
  let overlay = document.getElementById('init-overlay');
  if (overlay) overlay.remove();
  if (!state.initiative) return;
  const I = state.initiative;
  const redName = playerNameForSide('player1');
  const blueName = playerNameForSide('player2');
  const winName = I.winner === 'player1' ? redName : blueName;
  const holderName = I.holder === 'player1' ? redName : blueName;
  // Tumble both initiative dice once, when this round's result first appears.
  const _initSig = `${I.round}:${I.rRaw}:${I.bRaw}`;
  const _initRoll = _diceAnim['init'] !== _initSig;
  _diceAnim['init'] = _initSig;
  const die = (raw, bonus, col) => `<div class="init-die${_initRoll?' rolling':''}" style="border-color:${col};color:${col}">${raw}${bonus?`<span style="font-size:9px;"> +${bonus}</span>`:''}</div>`;
  const P = state.planning || { ap:{player1:1,player2:1}, passTokens:{player1:0,player2:0}, apBreakdown:null };
  const apDetail = (side) => {
    const col = side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
    const bd = P.apBreakdown && P.apBreakdown[side];
    if (!bd) return `<span style="font-size:14px;font-weight:700;color:${col};">AP ${P.ap[side]}</span>`;
    const parts = [`1 base`];
    if (bd.admiralChosen > 0) {
      if (bd.admiral > 0) parts.push(`+${bd.admiral} admiral`);
      else parts.push(`<span style="text-decoration:line-through;opacity:0.4;">+${bd.admiralChosen} admiral</span> (${bd.admiralOffTable ? 'undeployed' : 'dead'})`);
    }
    if (bd.cmd > 0) parts.push(`+${bd.cmd} cmd ship`);
    if (bd.comms > 0) parts.push(`+1 comms`);
    return `<span style="font-size:14px;font-weight:700;color:${col};">AP ${P.ap[side]}</span><br><span style="font-size:8px;opacity:0.65;">${parts.join(' ')}</span>`;
  };
  const passDetail = (side) => {
    const pt = P.passTokens[side];
    if (!pt) return '';
    return `<span style="font-size:8px;color:var(--hull-warn);">${pt} Pass token${pt>1?'s':''}</span>`;
  };
  const handed = I.holder !== I.winner; // winner gave initiative away
  const isWinner  = !_netSide || _gs() === I.winner;  // this client is the initiative winner
  const isHolder  = !_netSide || _gs() === I.holder;  // this client holds initiative now
  const loserSide = I.winner === 'player1' ? 'player2' : 'player1';

  // Build the choice section — only shown to the winner before they hand over
  let choiceHtml;
  if (handed) {
    // After handover: show outcome to everyone
    choiceHtml = `<div class="init-choice">
      <div class="init-choice-lbl" style="color:var(--${sideCssKey(I.holder)})">${winName} gave initiative to ${holderName}</div>
    </div>`;
  } else if (isWinner) {
    // Winner sees the two option buttons
    choiceHtml = `<div class="init-choice">
      <div class="init-choice-lbl">Take 1st initiative or give it to the opponent (reverse order):</div>
      <div class="init-choice-btns">
        <button class="btn btn-primary" data-init-give="${I.winner}">Take Initiative</button>
        <button class="btn" data-init-give="${loserSide}">Give to ${I.winner==='player1'?blueName:redName}</button>
      </div>
    </div>`;
  } else {
    // Loser (online) sees a waiting message
    choiceHtml = `<div class="init-choice">
      <div class="init-choice-lbl" style="color:var(--text-mute)">${winName} is choosing who activates first…</div>
    </div>`;
  }

  // Footer: only the current holder sees BEGIN ACTIVATION
  const footerHtml = isHolder
    ? `<button class="btn-primary" id="init-confirm" style="width:100%;">BEGIN ACTIVATION →</button>`
    : handed
      ? `<div style="font-size:10px;color:var(--text-mute);text-align:center;padding:6px 0;">Waiting for ${holderName} to begin…</div>`
      : `<div style="font-size:10px;color:var(--text-mute);text-align:center;padding:6px 0;">Waiting for ${winName} to decide…</div>`;

  overlay = document.createElement('div');
  overlay.id = 'init-overlay';
  overlay.innerHTML = `
    <div style="padding:12px 16px;">
      <div style="font-family:var(--display);font-size:11px;letter-spacing:1.5px;color:var(--text-mute);text-align:center;margin-bottom:14px;">PLANNING · ROUND ${I.round}</div>
      <div style="display:flex;align-items:flex-start;gap:0;margin-bottom:14px;">
        <div style="flex:1;text-align:center;">
          <div style="font-size:12px;font-weight:700;color:var(--ucm);margin-bottom:8px;letter-spacing:0.5px;">${redName}</div>
          <div style="display:flex;justify-content:center;margin-bottom:8px;">
            ${die(I.rRaw, I.redBonus, 'var(--ucm)')}
          </div>
          <div style="margin-bottom:4px;">${apDetail('player1')}</div>
          <div style="min-height:14px;">${passDetail('player1')}</div>
        </div>
        <div style="padding-top:32px;font-size:10px;font-family:var(--display);letter-spacing:1px;color:var(--text-mute);padding-left:8px;padding-right:8px;">VS</div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:12px;font-weight:700;color:var(--shal);margin-bottom:8px;letter-spacing:0.5px;">${blueName}</div>
          <div style="display:flex;justify-content:center;margin-bottom:8px;">
            ${die(I.bRaw, I.blueBonus, 'var(--shal)')}
          </div>
          <div style="margin-bottom:4px;">${apDetail('player2')}</div>
          <div style="min-height:14px;">${passDetail('player2')}</div>
        </div>
      </div>
      <div style="text-align:center;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--${sideCssKey(I.winner)});margin-bottom:10px;">${winName} WON THE ROLL</div>
      ${choiceHtml}
      <div style="margin-top:10px;text-align:center;">${footerHtml}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  initPanel(overlay, 'INITIATIVE', 'init-overlay', 8, 8);
  overlay.querySelectorAll('[data-init-give]').forEach(btn => {
    btn.addEventListener('click', () => { dispatch({ type: 'giveInitiative', to: btn.dataset.initGive }); renderAll(); });
  });
  const confirmBtn = overlay.querySelector('#init-confirm');
  if (confirmBtn) confirmBtn.addEventListener('click', () => {
    dispatch({ type: 'beginActivation' });
    renderAll();
  });
}

/* Two dropdowns to choose up to 2 Secondary Objectives for a fleet slot. */
function secondaryPickers(slot, showLabels = false) {
  // f1 belongs to player1, f2 to player2. In online mode only own slot is editable.
  const owner = slot === 'f1' ? 'player1' : 'player2';
  const isDisabled = _netSide && _netSide !== owner;
  const chosen = state.secondaryChoice[slot] || [];
  const lbl = `font-size:9px;letter-spacing:0.08em;color:var(--text-mute);font-family:var(--mono);margin:6px 0 3px;`;
  const opt = (idx) => {
    const cur = chosen[idx] || '';
    const others = chosen.filter((_, i) => i !== idx);
    return (showLabels ? `<div style="${lbl}">SECONDARY ${idx + 1}</div>` : '') +
      `<select class="fleet-dropdown" data-secondary="${slot}|${idx}" style="margin-top:${showLabels ? '0' : '4'}px;font-size:9.5px;"${isDisabled ? ' disabled' : ''}>
      <option value="">— Secondary ${idx+1} —</option>
      ${Object.keys(SECONDARY_OBJECTIVES).map(k => `<option value="${k}" ${cur===k?'selected':''} ${others.includes(k)?'disabled':''}>${SECONDARY_OBJECTIVES[k].name}</option>`).join('')}
    </select>`;
  };
  return opt(0) + opt(1);
}

/* Nomination editor — side panel over the board so the map stays visible and clickable.
   Dropsite-based objectives (key_site, priority_target, long_shot) let the player click
   the map to pick; objectives_beyond uses an inline dropdown. */
function renderNominationModal() {
  const board = document.querySelector('.board-wrap');
  let panel = document.getElementById('nomination-overlay');
  if (panel) panel.remove();
  if (state.phase !== 'nominations') { _nomPicking = null; return; }

  // Build the list of (side, key) rows that need nominations.
  const rows = [];
  ['player1','player2'].forEach(side => {
    (state.secondaries[side] || []).forEach(key => {
      const def = SECONDARY_OBJECTIVES[key];
      if (!def || !def.nominate) return;
      const cands = secondaryCandidates(side, key);
      if (!cands.length) return;
      rows.push({ side, key, def, cands });
    });
  });
  if (!rows.length) { _nomPicking = null; return; }

  // In online mode the player can only pick their own rows.
  const myRows  = _netSide ? rows.filter(r => r.side === _netSide) : rows;
  const oppRows = _netSide ? rows.filter(r => r.side !== _netSide) : [];

  // Default active pick to the player's own first unresolved row.
  if (!_nomPicking || (_netSide && _nomPicking.side !== _netSide)) {
    const first = myRows[0] || rows[0];
    _nomPicking = first ? { side: first.side, key: first.key } : null;
  }

  const renderRow = ({ side, key, def, cands }, interactive) => {
    const cur = state.secondaryNominations[side][key];
    const curStr = JSON.stringify(cur);
    const curLabel = cur ? (cands.find(c => JSON.stringify(c.nom) === curStr) || {}).label : null;
    const isActive = interactive && _nomPicking && _nomPicking.side === side && _nomPicking.key === key;
    const mapBased = key === 'key_site' || key === 'priority_target' || key === 'long_shot';
    if (!interactive) {
      // Opponent row — read-only, dimmed
      return `<div class="nom-row-btn" style="opacity:0.4;cursor:default;pointer-events:none;">
        <div class="nom-side" style="color:var(--${sideCssKey(side)});">${playerNameForSide(side)}</div>
        <div class="nom-obj">${def.name}</div>
        ${curLabel ? `<div class="nom-sel">✓ ${curLabel}</div>` : `<div class="nom-sel" style="color:var(--text-mute);">Pending opponent</div>`}
      </div>`;
    }
    return `<button class="nom-row-btn${isActive ? ' active' : ''}" data-nom-pick="${side}|${key}">
      <div class="nom-side" style="color:var(--${sideCssKey(side)});">${playerNameForSide(side)}</div>
      <div class="nom-obj">${def.name}</div>
      ${curLabel ? `<div class="nom-sel">✓ ${curLabel}</div>` : `<div class="nom-sel" style="color:var(--text-mute);">Not selected</div>`}
      <div class="nom-hint">${isActive ? (mapBased ? '← Click a site on the map' : 'Choose below') : 'Click to activate'}</div>
      ${(!mapBased && isActive) ? `<select class="fleet-dropdown" data-nom-sel="${side}|${key}" style="margin-top:5px;font-size:9px;width:100%;">
        ${cands.map(c => `<option value='${JSON.stringify(c.nom)}' ${JSON.stringify(c.nom)===curStr?'selected':''}>${c.label}</option>`).join('')}
      </select>` : ''}
    </button>`;
  };

  const rowsHTML = [
    ...myRows.map(r => renderRow(r, true)),
    ...oppRows.map(r => renderRow(r, false)),
  ].join('');

  // Build confirm button — show waiting/done state per side.
  const nomReady = state.nominationsReady || {};
  let confirmBtnHtml;
  if (!_netSide) {
    const p1Done = nomReady.player1;
    const p2Done = nomReady.player2;
    confirmBtnHtml = `
      ${p1Done
        ? `<span class="btn" style="width:100%;margin-top:4px;padding:5px;font-size:10px;opacity:0.5;cursor:default;display:block;">✓ ${playerNameForSide('player1')}</span>`
        : `<button class="btn-primary" data-nom-confirm="player1" style="width:100%;margin-top:4px;padding:5px;font-size:10px;">✓ ${playerNameForSide('player1')} CONFIRM</button>`}
      ${p2Done
        ? `<span class="btn" style="width:100%;margin-top:4px;padding:5px;font-size:10px;opacity:0.5;cursor:default;display:block;">✓ ${playerNameForSide('player2')}</span>`
        : `<button class="btn-primary" data-nom-confirm="player2" style="width:100%;margin-top:4px;padding:5px;font-size:10px;">✓ ${playerNameForSide('player2')} CONFIRM</button>`}`;
  } else {
    const myConfirmed = nomReady[_netSide];
    confirmBtnHtml = myConfirmed
      ? `<button class="btn-primary" style="width:100%;margin-top:8px;padding:5px;font-size:10px;opacity:0.5;cursor:not-allowed;" disabled>⏳ Waiting for opponent…</button>`
      : `<button class="btn-primary" id="nom-confirm" style="width:100%;margin-top:8px;padding:5px;font-size:10px;">CONFIRM →</button>`;
  }

  panel = document.createElement('div');
  panel.id = 'nomination-overlay';
  panel.innerHTML = `
    <div style="padding:10px 14px;">
      <div style="font-size:8px;color:var(--text-mute);margin-bottom:6px;">Click a row then select a site on the map.</div>
      ${rowsHTML}
      ${confirmBtnHtml}
    </div>
  `;
  document.body.appendChild(panel);
  initPanel(panel, 'NOMINATE SECONDARIES', 'nomination-overlay', 12, 80);

  // Row click → activate that row for picking (own rows only).
  panel.querySelectorAll('[data-nom-pick]').forEach(btn => {
    btn.addEventListener('click', e => {
      if (e.target.closest('select')) return;
      const [side, key] = btn.dataset.nomPick.split('|');
      if (_netSide && side !== _netSide) return; // opponent row — ignore
      _nomPicking = { side, key };
      renderAll(true);
    });
  });
  // Inline dropdown (objectives_beyond).
  panel.querySelectorAll('[data-nom-sel]').forEach(sel => {
    sel.addEventListener('change', () => {
      const [side, key] = sel.dataset.nomSel.split('|');
      if (_netSide && side !== _netSide) return;
      try { dispatch({ type: 'setNomination', side, key, nom: JSON.parse(sel.value) }); } catch (e) {}
      renderAll(true);
    });
  });
  // Online CONFIRM — sends for this player's side.
  const nomConfirmBtn = panel.querySelector('#nom-confirm');
  if (nomConfirmBtn) nomConfirmBtn.addEventListener('click', () => {
    _nomPicking = null;
    dispatch({ type: 'confirmNominations', side: _netSide });
  });
  // Hotseat per-side CONFIRM buttons.
  panel.querySelectorAll('[data-nom-confirm]').forEach(btn => {
    btn.addEventListener('click', () => {
      _nomPicking = null;
      dispatch({ type: 'confirmNominations', side: btn.dataset.nomConfirm });
    });
  });
}

/* Protect-objective nomination panel — shown after secondaries are confirmed on round 1. */
function renderProtectNomModal() {
  const board = document.querySelector('.board-wrap');
  let panel = document.getElementById('protect-nom-overlay');
  if (panel) panel.remove();
  if (state.phase !== 'protect') return;
  const dss = (state.scenarioData && state.scenarioData.dropsites) || [];
  // Only sides whose Objective is Protect nominate (asymmetric scenarios may have just one).
  const protectSides = ['player1','player2'].filter(s => objectiveForSide(s) === 'protect');
  const renderRow = (side) => {
    if (_netSide && side !== _netSide) {
      const cur = state.protectNom && state.protectNom[side];
      const ds = cur && dss.find(d => d.id === cur);
      const col = `var(--${sideCssKey(side)})`;
      return `<div class="nom-row-btn" style="opacity:0.4;cursor:default;pointer-events:none;">
        <div class="nom-side" style="color:${col};">${playerNameForSide(side)}</div>
        <div class="nom-sel">${ds ? `🛡 ${ds.base.name}` : 'Pending opponent'}</div>
      </div>`;
    }
    const cur = state.protectNom && state.protectNom[side];
    const ds = cur && dss.find(d => d.id === cur);
    const col = `var(--${sideCssKey(side)})`;
    const isActive = !_nomPicking || (_nomPicking.side === side && _nomPicking.key === '__protect__');
    return `<button class="nom-row-btn${isActive ? ' active' : ''}" data-protect-pick="${side}">
      <div class="nom-side" style="color:${col};">${playerNameForSide(side)}</div>
      <div class="nom-obj">Protect Nomination</div>
      ${ds ? `<div class="nom-sel">🛡 ${ds.base.name}</div>` : `<div class="nom-sel" style="color:var(--text-mute);">Not selected</div>`}
      <div class="nom-hint">${isActive ? '← Click a dropsite on the map' : 'Click to activate'}</div>
    </button>`;
  };
  // Default active pick to own side (or the first Protect side in hotseat).
  if (!_nomPicking) _nomPicking = { side: _netSide || protectSides[0] || 'player1', key: '__protect__' };

  // Build confirm button — waiting state per side (only Protect sides need to confirm).
  const protReady = state.protectNomReady || {};
  let protConfirmHtml;
  if (!_netSide) {
    protConfirmHtml = protectSides.map(side => protReady[side]
      ? `<span class="btn" style="width:100%;margin-top:4px;padding:5px;font-size:10px;opacity:0.5;cursor:default;display:block;">✓ ${playerNameForSide(side)}</span>`
      : `<button class="btn-primary" data-protect-confirm="${side}" style="width:100%;margin-top:4px;padding:5px;font-size:10px;">✓ ${playerNameForSide(side)} CONFIRM</button>`).join('');
  } else if (!protectSides.includes(_netSide)) {
    // Online: this player has no Protect objective — nothing to nominate.
    protConfirmHtml = `<button class="btn-primary" style="width:100%;margin-top:8px;padding:5px;font-size:10px;opacity:0.5;cursor:not-allowed;" disabled>⏳ Waiting for opponent…</button>`;
  } else {
    const myConfirmed = protReady[_netSide];
    protConfirmHtml = myConfirmed
      ? `<button class="btn-primary" style="width:100%;margin-top:8px;padding:5px;font-size:10px;opacity:0.5;cursor:not-allowed;" disabled>⏳ Waiting for opponent…</button>`
      : `<button class="btn-primary" id="protect-nom-confirm" style="width:100%;margin-top:8px;padding:5px;font-size:10px;">CONFIRM →</button>`;
  }

  panel = document.createElement('div');
  panel.id = 'protect-nom-overlay';
  panel.innerHTML = `
    <div style="padding:10px 14px;">
      <div style="font-size:8px;color:var(--text-mute);margin-bottom:6px;">Each Protecting player nominates a Dropsite to protect. Click a site on the map.</div>
      ${protectSides.map(renderRow).join('')}
      ${protConfirmHtml}
    </div>
  `;
  document.body.appendChild(panel);
  initPanel(panel, 'PROTECT NOMINATION', 'protect-nom-overlay', 12, 80);
  panel.querySelectorAll('[data-protect-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.protectPick;
      if (_netSide && s !== _netSide) return;
      _nomPicking = { side: s, key: '__protect__' };
      renderAll(true);
    });
  });
  const protConfirmBtn = panel.querySelector('#protect-nom-confirm');
  if (protConfirmBtn) protConfirmBtn.addEventListener('click', () => {
    _nomPicking = null;
    dispatch({ type: 'confirmProtectNom', side: _netSide });
  });
  panel.querySelectorAll('[data-protect-confirm]').forEach(btn => {
    btn.addEventListener('click', () => {
      _nomPicking = null;
      dispatch({ type: 'confirmProtectNom', side: btn.dataset.protectConfirm });
    });
  });
}

// Standard-scenario presets — keyed by scenario ID, used by the Standard tab dropdown and
// the random button. Defined at module scope so other code can check preset membership.
const SCEN_PRESETS = {
  take_and_hold:        { deployment:'line',         approach:'close_enough',          layout:'take_and_hold',        variant:'guarded_sectors',      objective:'survey'    },
  erupting_battlefront: { deployment:'line',         approach:'column',                layout:'erupting_battlefront', variant:'civic_infrastructure', objective:'raze'       },
  power_grab:           { deployment:'from_corners', approach:'column',                layout:'power_grab',           variant:'guarded_sectors',      objective:'attrition' },
  shock_and_yaw:        { deployment:'table_corners',  approach:'column',                layout:'shock_and_yaw',        variant:'shock_and_yaw',        objective:'protect'   },
  orbital_support:      { deployment:'line',         approach:'column',                layout:'orbital_support',      variant:'orbital_support',      objective:'raze'      },
  // Entrapmoont: asymmetric — attacker (player2/Red) Razes, defender (player1/Blue) Protects.
  entrapmoont:          { deployment:'encirclement', approach:'home_fleet_disadvantage', layout:'entrapmoont', variant:'entrapmoont', objective:'raze', objectives:{ player1:'protect', player2:'raze' } }
};

// Mobile setup tabs (Player 1 / Player 2 / Scenario). View-only state — kept in a
// module var so it survives the setup overlay being rebuilt each render.
let _setupMtab = 'p1';
function _setSetupMtab(t) {
  _setupMtab = t;
  const card = document.querySelector('#setup-overlay .setup-card');
  if (card) card.setAttribute('data-mtab', t);
  document.querySelectorAll('#setup-overlay .setup-mtabs [data-mtab]')
    .forEach(b => b.classList.toggle('active', b.dataset.mtab === t));
}

function renderSetupOverlay() {
  const board = document.querySelector('.board-wrap');
  let overlay = document.getElementById('setup-overlay');
  if (overlay) overlay.remove();
  if (state.phase !== 'setup') return;
  ensureMoonswipe();

  // Pre-fill player name from logged-in username (only if still at the default).
  if (currentUser?.username) {
    if (!state.playerNames) state.playerNames = { f1: 'Player 1', f2: 'Player 2' };
    const slot = _netSide === 'player2' ? 'f2' : 'f1';
    const defaultName = slot === 'f1' ? 'Player 1' : 'Player 2';
    if (state.playerNames[slot] === defaultName) state.playerNames[slot] = currentUser.username;
  }

  if (!state.scenario) state.scenario = { deployment: null, approach: null, layout: null, variant: null, objective: null };
  const scen = state.scenario;
  const vrn = scen.variant ? VARIANTS[scen.variant] : null;
  const obj = scen.objective ? OBJECTIVES[scen.objective] : null;
  // Scenario setup is locked until BOTH fleets are chosen and (for Bioficer)
  // all Payloads are assigned to Porters.
  const bothFleetsSelected = !!state.fleetChoices.f1 && !!state.fleetChoices.f2;
  const payloadsLocked = !bothFleetsSelected || !(fleetAssignmentsReady('f1') && fleetAssignmentsReady('f2'));
  // Per-side ready state.
  const _sr = state.setupReady || {};
  const p1Ready = !!_sr.player1, p2Ready = !!_sr.player2;
  const anyReady = p1Ready || p2Ready;
  const readyCount = (p1Ready ? 1 : 0) + (p2Ready ? 1 : 0);
  const objectiveSet = scen.objectives ? !!(scen.objectives.player1 && scen.objectives.player2) : !!scen.objective;
  const scenarioComplete = bothFleetsSelected && !payloadsLocked && state.scenario &&
    ['deployment','approach','layout','variant'].every(k => state.scenario[k]) && objectiveSet;
  // Edit-lock: inputs/import locked for opponent (online) OR if that player has already readied.
  const f1Lock = (_netSide && _netSide !== 'player1') || p1Ready;
  const f2Lock = (_netSide && _netSide !== 'player2') || p2Ready;
  // View-lock: VIEW FLEET button only locked if that player has readied (fleet frozen) AND it's your own side.
  const f1ViewLock = (_netSide === 'player1') && p1Ready;
  const f2ViewLock = (_netSide === 'player2') && p2Ready;

  // Build a summary line per option for each table — what shows in the picker list.
  const summarisers = {
    deployment: (k, v) => v.short || v.desc,
    approach:   (k, v) => `${playerNameForSide('player2')}: ${APPROACH_BEHAVIOURS[v.blue].short} · ${playerNameForSide('player1')}: ${APPROACH_BEHAVIOURS[v.red].short}`,
    layout:     (k, v) => `${v.dropsites.length} dropsites · ${v.scenery.micrometeor} micrometeor · ${v.scenery.dense} dense${v.rings.length?' · '+v.rings.length+' ring'+(v.rings.length>1?'s':''):''}${v.largeObjects.length?' · '+v.largeObjects.length+' large obj':''}`,
    variant:    (k, v) => v.short || '',
    objective:  (k, v) => v.short || ''
  };

  // Card-summary functions (the small text shown on the card's collapsed view)
  const cardSummary = {
    deployment: () => { if (!scen.deployment) return ''; const d = DEPLOYMENTS[scen.deployment]; return d.short || d.desc; },
    approach:   () => { if (!scen.approach) return ''; const a = APPROACHES[scen.approach]; const dz = state.deployZone || { player1:'south', player2:'north' }; return `<b style="color:var(--shal)">Red:</b> ${APPROACH_BEHAVIOURS[a[dz.player2]].short} · <b style="color:var(--ucm)">Blue:</b> ${APPROACH_BEHAVIOURS[a[dz.player1]].short}`; },
    layout:     () => { if (!scen.layout) return ''; const l = LAYOUTS[scen.layout]; return summarisers.layout('', l); },
    variant:    () => vrn ? (vrn.short || '') : '',
    objective:  () => obj ? `${obj.short}${obj.bonus?'<br><span style="color:var(--text-mute)">'+obj.bonus+'</span>':''}` : ''
  };

  const HELPER_TEXT = {
    deployment: 'Where each fleet starts on the board.',
    approach:   'How each side arrives: Direct, Close, or Distant reserves.',
    layout:     'Dropsite positions and how much scenery to place.',
    variant:    'Optional battlefield twist applied to the game.',
    objective:  'How victory is scored this game.'
  };

  const makeCard = (key, label, table, currentKey, fullWidth = false) => {
    const cur = currentKey ? table[currentKey] : null;
    const d6Display = !cur ? '?' : (cur.d6 === 0 ? '—' : cur.d6);
    const d6Cls = !cur || cur.d6 === 0 ? 'none' : '';
    let html = `<div class="scen-row ${fullWidth?'full-width':''}">
      <div class="scen-roll ${d6Cls}">${d6Display}</div>
      <div class="scen-label">${label}</div>
      <div class="scen-helper">${HELPER_TEXT[key] || ''}</div>
      <div class="scen-name">${cur ? cur.name : '<span style="color:var(--text-mute)">— not selected —</span>'}</div>
      <div class="scen-short">${cardSummary[key]()}</div>
      <div class="scen-controls">
        <select class="scen-dropdown" data-scen-select="${key}">
          <option value="" ${!currentKey?'selected':''}>— select —</option>
          ${Object.keys(table).filter(optKey => !table[optKey].bespoke || optKey === currentKey).map(optKey => {
            const opt = table[optKey];
            const d6 = opt.d6 === 0 ? '—' : opt.d6;
            return `<option value="${optKey}" ${optKey===currentKey?'selected':''}>${d6==='—'?'':'['+d6+'] '}${opt.name}</option>`;
          }).join('')}
        </select>
        <button class="reroll-btn" data-reroll="${key}" title="Randomise this row">↻</button>
      </div>`;
    html += `</div>`;
    return html;
  };

  // Scoring Objective section — supports asymmetric (per-side) scoring. When
  // scen.objectives is set, each side picks its own objective (e.g. attacker
  // Raze / defender Protect); otherwise a single shared objective applies.
  const asym = !!scen.objectives;
  const objOptionList = (selKey) => `<option value="" ${!selKey?'selected':''}>— select —</option>` +
    Object.keys(OBJECTIVES).filter(k => !OBJECTIVES[k].bespoke || k === selKey).map(k => { const o = OBJECTIVES[k]; const d6 = o.d6 === 0 ? '—' : o.d6; return `<option value="${k}" ${k===selKey?'selected':''}>${d6==='—'?'':'['+d6+'] '}${o.name}</option>`; }).join('');
  const asymToggleRow = `<div class="scen-row full-width" style="grid-template-rows:auto;padding:6px 14px;">
      <label style="grid-column:1/-1;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11px;color:var(--text-dim);">
        <input type="checkbox" data-asym-toggle ${asym?'checked':''}> ⇄ Asymmetric scoring — each side has its own Objective
      </label>
    </div>`;
  const asymPickerRow = asym ? `<div class="scen-row full-width">
      <div class="scen-roll none">⇄</div>
      <div class="scen-label">Scoring Objective</div>
      <div class="scen-helper">Per-side (asymmetric) scoring.</div>
      <div class="scen-name" style="display:flex;gap:12px;width:100%;align-items:flex-end;">
        <div style="flex:1;min-width:0;"><div style="color:var(--ucm);font-size:10px;font-weight:700;margin-bottom:3px;">${playerNameForSide('player1')}</div><select class="scen-dropdown" data-asym-obj="player1">${objOptionList(scen.objectives.player1)}</select></div>
        <div style="flex:1;min-width:0;"><div style="color:var(--shal);font-size:10px;font-weight:700;margin-bottom:3px;">${playerNameForSide('player2')}</div><select class="scen-dropdown" data-asym-obj="player2">${objOptionList(scen.objectives.player2)}</select></div>
      </div>
    </div>` : '';
  const objectiveSection = (asym ? asymPickerRow : makeCard('objective', 'Scoring Objective', OBJECTIVES, scen.objective, true)) + asymToggleRow;

  // ---- Three-tab layout: Standard scenarios · Scenario Expansion 1 · Custom generation ----
  // Tab is shared (relayed) state so both clients stay on the same tab.
  const setupTab = ['custom','expansion'].includes(state.setupTab) ? state.setupTab : 'standard';
  const lockStyle = (payloadsLocked || anyReady) ? 'opacity:0.4;pointer-events:none;filter:grayscale(0.6);' : '';
  const lockAttr  = (payloadsLocked || anyReady) ? 'disabled' : '';
  const tabBtn = (key, label) => `<button data-setup-tab="${key}" style="flex:1;padding:8px 6px;font:inherit;font-size:11px;font-weight:700;letter-spacing:0.04em;cursor:pointer;background:none;border:none;border-bottom:2px solid ${setupTab===key?'var(--ucm)':'transparent'};color:${setupTab===key?'var(--ucm)':'var(--text-mute)'};">${label}</button>`;
  const tabsBar = `<div style="display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);">
      ${tabBtn('standard','⚑ STANDARD SCENARIOS')}${tabBtn('expansion','⊕ SCENARIO EXPANSION 1')}${tabBtn('custom','⚙ CUSTOM / GENERATE')}
    </div>`;

  // Standard tab: dropdown + random button + a read-only summary of the chosen scenario
  // (deployment, approach, scoring — layout & variant are bespoke and not shown here).
  const sumRow = (lbl, title, sub) => `<div style="padding:8px 11px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:${ucmRgba(0.03)};">
      <div style="font-size:9px;letter-spacing:0.1em;color:var(--text-mute);text-transform:uppercase;">${lbl}</div>
      <div style="font-size:13px;font-weight:700;margin-top:2px;">${title || '<span style="color:var(--text-mute)">— not selected —</span>'}</div>
      ${sub ? `<div style="font-size:10px;color:var(--text-dim);margin-top:3px;">${sub}</div>` : ''}
    </div>`;
  const standardSummary = () => {
    if (!scen.deployment && !scen.approach && !scen.objective && !scen.objectives) {
      return `<div class="scen-extra-note" style="text-align:center;color:var(--text-mute);">Pick a standard scenario above, or roll a random one.</div>`;
    }
    const dep = scen.deployment ? DEPLOYMENTS[scen.deployment] : null;
    const ap  = scen.approach ? APPROACHES[scen.approach] : null;
    const objTitle = asym
      ? `${OBJECTIVES[scen.objectives.player1]?.name || '—'} / ${OBJECTIVES[scen.objectives.player2]?.name || '—'}`
      : (scen.objective ? OBJECTIVES[scen.objective].name : '');
    const objSub = asym
      ? `<b style="color:var(--ucm)">${playerNameForSide('player1')}:</b> ${OBJECTIVES[scen.objectives.player1]?.short || '—'} · <b style="color:var(--shal)">${playerNameForSide('player2')}:</b> ${OBJECTIVES[scen.objectives.player2]?.short || '—'}`
      : (scen.objective ? OBJECTIVES[scen.objective].short : '');
    return sumRow('Deployment Type', dep ? dep.name : '', dep ? (dep.short || dep.desc) : '') +
           sumRow('Approach', ap ? ap.name : '', cardSummary.approach()) +
           sumRow('Scoring Objective', objTitle, objSub);
  };
  const standardTab = `<div style="${lockStyle}">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
        <select class="scen-dropdown" data-preset-select style="flex:1;" ${lockAttr} title="Apply a standard scenario">
          <option value="">⚑ Select standard scenario…</option>
          ${Object.keys(SCEN_PRESETS).map(k => `<option value="${k}"${scen.layout===k?' selected':''}>${LAYOUTS[SCEN_PRESETS[k].layout]?.name || k}</option>`).join('')}
        </select>
        <button class="btn" data-preset="random" ${lockAttr} title="Apply a random standard scenario">⚄ RANDOM</button>
      </div>
      ${standardSummary()}
    </div>`;

  // Scenario Expansion 1 tab — behaves like the Standard tab (dropdown + RANDOM +
  // read-only summary), driven by EXPANSION_PRESETS. The summary adds a Scenery row
  // and a Special Rules note (several expansion effects are adjudicated manually).
  const SE1_SCENARIOS = [
    ['ready_salted_earth','Ready Salted Earth'], ['erupting_quarters','Erupting Quarters'],
    ['latitudinal_lanes','Latitudinal Lanes'], ['lagrange_points','Lagrange Points'],
    ['when_backfields_meet','When Backfields Meet'], ['very_important_moon','Very Important Moon'],
    ['moonshot','Moonshot'], ['moonwreck','Moonwreck'], ['moonbreaker','Moonbreaker'],
    ['moonguard','Moonguard'], ['moonswipe','Moonswipe'], ['moonskipper','Moonskipper'],
    ['one_with_almost_nothing','One With (Almost) Nothing'], ['almost_nothing_at_all','(Almost) Nothing At All']
  ];
  // Special-rules briefings, keyed by layout. Shows per-scenario bespoke effects and
  // whether they are engine-scored or still adjudicated manually.
  const SE1_NOTES = {
    se1_ready_salted_earth: 'Scenario Space Stations are Focal Points (range 8"); Ships below half Hull use Low Value. A destroyed Station leaves a 4" Debris Field that becomes a Focal Point. Each Station is paired with a Small City and has 5+ BS while that City keeps a Power Plant. <i>Focal-point VP and debris placement are engine-scored. Station 5+ BS is adjudicated manually.</i>',
    se1_erupting_quarters: 'Each board quarter is a Focal Point. Friendly Crippled Ships, and friendly Ships in the board quarter containing your deployment zone, use their Low Value. <i>Focal-point VP is engine-scored at R4 &amp; R6.</i>',

            return `<button class="btn-primary" data-ready-setup-both ${scenarioComplete ? '' : 'disabled'}>✓ READY</button>`;
