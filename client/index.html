         </div>`
      : '';
    content = `<div class="chat-body" id="chat-body" style="max-height:${expanded ? '280px' : '72px'};overflow-y:auto;">${msgs}</div>${inputRow}`;
  }

  dock.innerHTML = tabBar + content;

  // Wire tabs
  const tabLog  = dock.querySelector('#log-tab-log');
  const tabChat = dock.querySelector('#log-tab-chat');
  if (tabLog)  tabLog.onclick  = () => { _activeLogTab = 'log';  renderEventLog(); };
  if (tabChat) tabChat.onclick = () => { _activeLogTab = 'chat'; _chatUnread = 0; renderEventLog(); _scrollChatToBottom(); };

  // Wire expand toggle (tab bar button)
  const expandBtn = dock.querySelector('#log-expand');
  if (expandBtn) expandBtn.onclick = () => {
    if (state.phase !== 'play') { _setupChatExpanded = !_setupChatExpanded; }
    else { _logExpanded = !_logExpanded; }
    renderEventLog(); if (_activeLogTab === 'chat') _scrollChatToBottom();
  };
  const body = dock.querySelector('#event-log-body');
  if (expanded && body) body.scrollTop = 0;

  // Wire chat send
  const input  = dock.querySelector('#chat-input');
  const sendBtn = dock.querySelector('#chat-send');
  if (input && sendBtn) {
    const doSend = () => {
      const text = input.value.trim();
      if (!text || !_netWs || !_netConnected) return;
      _netWs.send(JSON.stringify({ type: 'chat', text }));
      input.value = '';
    };
    sendBtn.onclick = doSend;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSend(); } });
    // Auto-focus the chat input on desktop only — on mobile it repeatedly pops the
    // on-screen keyboard (the dock re-renders every state change).
    if (_activeLogTab === 'chat' && !_isMobileLayout()) input.focus();
  }

  // Scroll chat to bottom when viewing chat tab
  if (_activeLogTab === 'chat') _scrollChatToBottom();
}

function _scrollChatToBottom() {
  const body = document.getElementById('chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}

/* Transient VP-award toast, stacked at top-centre of the board. */
function notifyVP(side, vp, reason) {
  const board = document.querySelector('.board-wrap');
  if (!board) return;
  let tray = document.getElementById('vp-toasts');
  if (!tray) {
    tray = document.createElement('div');
    tray.id = 'vp-toasts';
    tray.style.cssText = 'position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;';
    board.appendChild(tray);
  }
  const t = document.createElement('div');
  t.style.cssText = `background:rgba(10,14,13,0.94);border:1px solid var(--${side});border-left:4px solid var(--${side});border-radius:5px;padding:7px 13px;font-family:var(--mono);font-size:11px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,0.5);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;`;
  t.innerHTML = `<b style="color:var(--${side})">${playerNameForSide(side)}</b> <b style="color:${vp>=0?'var(--hull-good,#6ec97a)':'var(--hull-crit)'}">${vp>=0?'+':''}${vp} VP</b> <span style="color:var(--text-mute)">· ${reason}</span>`;
  tray.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(-6px)'; setTimeout(() => t.remove(), 250); }, 3400);
}

function renderDropsite(d) {
  const cx = inchToPx(d.x), cy = inchToPx(d.y);
  const base = d.base;
  const isStation = base.category === 'station';
  const stationDiaIn = { small: 30/25.4, medium: 40/25.4, large: 50/25.4 };
  const citySizeMap  = { small: INCH * 1.0, medium: INCH * 1.25, large: INCH * 1.5 };
  const r = isStation
    ? (stationDiaIn[base.size] * INCH) / 2
    : citySizeMap[base.size];
  const ringCol = isStation ? '#a8b4bc' : '#7ec8ff';
  const fillCol = isStation ? 'rgba(168,180,188,0.10)' : 'rgba(126,200,255,0.10)';
  let html = `<g class="dropsite" data-dropsite="${d.id}" style="cursor:pointer;">`;
  if (isStation) {
    html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fillCol}" stroke="${ringCol}" stroke-width="1.2"/>`;
  } else {
    html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fillCol}" stroke="${ringCol}" stroke-width="1.2"/>`;
    html += `<circle cx="${cx}" cy="${cy}" r="${r * 0.6}" fill="none" stroke="${ringCol}" stroke-width="0.6" opacity="0.6"/>`;
  }
  if (state.selectedDropsiteId === d.id) {
    html += `<circle cx="${cx}" cy="${cy}" r="${r + 4}" fill="none"
              stroke="${ringCol}" stroke-width="1.4" stroke-dasharray="3 2"/>`;
  }
  // Dropsite Activation: highlight dropsites the active player can click to activate
  const _da = state.dropsiteActivation;
  if (_da && !_da.dsId && dropsiteController(d) === _da.side && !_da.done.includes(d.id)) {
    const hlCol = _da.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
    html += `<circle cx="${cx}" cy="${cy}" r="${r + 6}" fill="none"
              stroke="${hlCol}" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.8"/>
             <circle cx="${cx}" cy="${cy}" r="${r}" fill="${_da.side === 'player1' ? 'rgba(74,214,255,0.08)' : 'rgba(212,166,71,0.08)'}"/>`;
  }
  // Show activating dropsite with solid glow
  if (_da && _da.dsId === d.id) {
    const hlCol = _da.side === 'player1' ? 'var(--ucm)' : 'var(--shal)';
    html += `<circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="none" stroke="${hlCol}" stroke-width="2"/>`;
  }
  const sizeLetter = base.size === 'small' ? 'S' : base.size === 'medium' ? 'M' : 'L';
  html += `<text x="${cx}" y="${cy + 1}" font-family="var(--display)" font-size="${r * 0.7}"
            font-weight="700" fill="${ringCol}" text-anchor="middle" dominant-baseline="middle"
            pointer-events="none">${sizeLetter}</text>`;
  // All objective/status icons stacked BELOW the circle.
  // Use a running y-offset so icons never overlap regardless of which are shown.
  {
    let iy = cy + r + 4; // start just below the circle (hull bar uses +3 to +5)
    const iline = (markup, h = 11) => { html += markup; iy += h; };

    // Hull damage bar (keep at fixed offset, then advance iy past it)
    if (d.damage > 0 && d.damage < d.maxHull) {
      const pct = (d.maxHull - d.damage) / d.maxHull;
      const barCol = pct <= 0.5 ? 'var(--hull-warn)' : 'var(--hull-good)';
      html += `<rect x="${cx - r}" y="${cy + r + 3}" width="${r*2}" height="2" fill="var(--bg)" opacity="0.6"/>`;
      html += `<rect x="${cx - r}" y="${cy + r + 3}" width="${r*2*pct}" height="2" fill="${barCol}"/>`;
      iy = cy + r + 10;
    }

    // Recon Ops ⬆N
    if (d.reconOps > 0) {
      iline(`<text x="${cx}" y="${iy}" font-family="var(--mono)" font-size="8" font-weight="700" fill="#b59ad6" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke" pointer-events="none">⬆${d.reconOps}</text>`);
    }

    // Secondary objective nomination stars ★
    if (state.secondaryNominations) {
      const nomSides = [['player1','ucm'],['player2','shal']].filter(([sd]) => {
        const noms = state.secondaryNominations[sd] || {};
        return Object.keys(noms).some(k => noms[k] && noms[k].dsId === d.id);
      });
      if (nomSides.length) {
        const starX = nomSides.map(([, cssKey], i) => `<text x="${cx - 5 + i * 10}" y="${iy}" font-size="9" fill="var(--${cssKey})" text-anchor="middle" pointer-events="none">★</text>`).join('');
        iline(starX);
      }
    }

    // Survey markers ⌖
    if (d.surveyedBy && d.surveyedBy.length) {
      const markers = d.surveyedBy.map((sd, i) => `<text x="${cx - 6 + i*12}" y="${iy}" font-size="9" fill="var(--${sd})" text-anchor="middle" pointer-events="none">⌖</text>`).join('');
      iline(markers);
    }

    // Protect nomination shield 🛡
    if (state.protectNom) {
      const shields = [['player1','ucm'],['player2','shal']].filter(([sd]) => state.protectNom[sd] === d.id);
      if (shields.length) {
        iline(shields.map(([, cssKey], i) => `<text x="${cx - 5 + i*10}" y="${iy}" font-size="10" fill="var(--${cssKey})" text-anchor="middle" pointer-events="none">🛡</text>`).join(''));
      }
    }
  }
  const daActive = state.dropsiteActivation && state.dropsiteActivation.dsId === d.id && !state.launching;
  if (d.features && d.features.length) {
    d.features.forEach((fkey, fi) => {
      const f = FEATURES[fkey];
      const angle = (Math.PI * 2 / d.features.length) * fi - Math.PI / 2;
      const fr = r + 8;
      const fx = cx + Math.cos(angle) * fr;
      const fy = cy + Math.sin(angle) * fr;
      const fcol = f.color || ringCol;
      const dead = (d.destroyedFeatures || []).includes(fi);
      const usable = daActive && !dead && (f.weapon || (f.launch && f.launch.length));
      const fired = f.weapon && (d.firedFeatures || []).includes(fi);
      if (usable) {
        html += `<circle data-da-feat="${d.id}|${fi}" cx="${fx}" cy="${fy}" r="9"
          fill="rgba(255,255,255,0.04)" stroke="${fired?'var(--text-mute)':fcol}" stroke-width="1"
          stroke-dasharray="${fired?'2 2':'none'}" style="cursor:pointer;${fired?'opacity:0.5;':''}"/>`;
        html += `<text x="${fx + 7}" y="${fy - 6}" font-size="7" fill="${f.weapon?'var(--hull-crit)':fcol}" text-anchor="middle" pointer-events="none">${f.weapon?(fired?'✓':'⚔'):'⊕'}</text>`;
      }
      html += `<text x="${fx}" y="${fy + 1}" font-family="var(--mono)" font-size="9" font-weight="700"
                fill="${dead?'var(--text-mute)':fcol}" text-anchor="middle" dominant-baseline="middle"
                pointer-events="none" ${dead?'opacity="0.4"':''}>${f.glyph}</text>`;
    });
  }
  if (d.damage > 0 && d.damage < d.maxHull) {
    const pct = (d.maxHull - d.damage) / d.maxHull;
    const barCol = pct <= 0.5 ? 'var(--hull-warn)' : 'var(--hull-good)';
    html += `<rect x="${cx - r}" y="${cy + r + 3}" width="${r*2}" height="2" fill="var(--bg)" opacity="0.6"/>`;
    html += `<rect x="${cx - r}" y="${cy + r + 3}" width="${r*2*pct}" height="2" fill="${barCol}"/>`;
  }
  html += `</g>`;
  return html;
}

function renderStaticScenery() {
  if (!state.scenarioData) return '';
  let html = '';
  (state.scenarioData.rings || []).forEach(ring => {
    if (ring.axis === 'horizontal') {
      const y = inchToPx(ring.y);
      html += `<line x1="0" y1="${y}" x2="${BOARD_PX}" y2="${y}"
                stroke="rgba(212,166,71,0.85)" stroke-width="1"/>`;
      html += `<text x="6" y="${y - 3}" font-family="var(--display)" font-size="9"
                fill="rgba(212,166,71,0.65)" letter-spacing="2">PLANETARY RING</text>`;
    } else {
      const x = inchToPx(ring.x);
      html += `<line x1="${x}" y1="0" x2="${x}" y2="${BOARD_PX}"
                stroke="rgba(212,166,71,0.85)" stroke-width="1"/>`;
      html += `<text x="${x + 4}" y="14" font-family="var(--display)" font-size="9"
                fill="rgba(212,166,71,0.65)" letter-spacing="2">PLANETARY RING</text>`;
    }
  });
  // Large objects — Moonskipper overrides position from state.moonPos; Moonswipe from state.moonswipe.positions.
  const _isMoonSkipper = state.scenario && state.scenario.layout === 'se1_moonskipper';
  const _isMoonSwipe = state.scenario && state.scenario.layout === 'se1_moonswipe';
  const _largeObjs = (state.scenarioData.largeObjects || []).map((obj, i) => {
    if (_isMoonSkipper && i === 0 && state.moonPos) return { ...obj, x: state.moonPos.x, y: state.moonPos.y };
    if (_isMoonSwipe && state.moonswipe && state.moonswipe.positions[i]) return { ...obj, x: state.moonswipe.positions[i].x, y: state.moonswipe.positions[i].y };
    return obj;
  });
  _largeObjs.forEach((obj, i) => {
    const cx = inchToPx(obj.x), cy = inchToPx(obj.y), r = inchToPx(obj.diameter / 2);
    const isSelected = _isMoonSwipe && state.moonswipe && state.moonswipe.selected === i;
    const isMoved = _isMoonSwipe && state.moonswipe && state.moonswipe.moved.includes(i);
    // Solid base fill, then radial highlights for depth.
    html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${isMoved ? '#3a5060' : '#5a6878'}" stroke="${isSelected ? 'rgba(255,220,40,0.9)' : '#8a9aaa'}" stroke-width="${isSelected ? 2.5 : 1.5}"/>`;
    html += `<circle cx="${cx - r*0.2}" cy="${cy - r*0.2}" r="${r * 0.55}" fill="#6a7888" opacity="0.7"/>`;
    html += `<circle cx="${cx - r*0.3}" cy="${cy - r*0.3}" r="${r * 0.22}" fill="#8a9aaa" opacity="0.4"/>`;
    if (isSelected) html += `<circle cx="${cx}" cy="${cy}" r="${r + inchToPx(6)}" fill="none" stroke="rgba(255,220,40,0.35)" stroke-width="1" stroke-dasharray="4 3" pointer-events="none"/>`;
    if (_isMoonSwipe && !isMoved && !state.moonswipe?.done) html += `<text x="${cx}" y="${cy + r + 9}" font-family="var(--mono)" font-size="6" fill="rgba(255,220,40,0.7)" text-anchor="middle" pointer-events="none">MOVE</text>`;
  });
  // Moonbreaker: render expanding cloud when moon is broken.
  if (state.scenario && state.scenario.layout === 'se1_moonbreaker' && state.moonBrokenRound != null) {
    const roundsAfterBreak = (state.round || 1) - state.moonBrokenRound - 1;
    const cloudDiam = 12 + 6 * Math.max(0, roundsAfterBreak);
    const ccx = inchToPx(24), ccy = inchToPx(24), cr = inchToPx(cloudDiam / 2);
    html += `<circle cx="${ccx}" cy="${ccy}" r="${cr}" fill="rgba(120,180,230,0.10)"
              stroke="rgba(150,200,240,0.8)" stroke-width="1.2" stroke-dasharray="4 3"
              pointer-events="none"/>`;
    html += `<text x="${ccx}" y="${ccy - cr - 3}" font-family="var(--mono)" font-size="6.5" font-weight="700"
              fill="rgba(150,200,240,0.85)" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke"
              pointer-events="none">MICROMETEOR ${cloudDiam}"</text>`;
  }
  const sceneryPiece = (s, ghost) => {
    const cx = inchToPx(s.x), cy = inchToPx(s.y);
    const w = inchToPx(6), h = inchToPx(3);
    const angle = s.angle || 0;
    const isMicro = s.type === 'micrometeor';
    const fill = isMicro ? 'rgba(120,180,230,0.16)' : 'rgba(225,120,90,0.16)';
    const stroke = isMicro ? 'rgba(150,200,240,0.8)' : 'rgba(235,140,100,0.85)';
    const op = ghost ? 0.5 : 1;
    const label = isMicro ? 'MICROMETEOR' : 'DENSE FIELD';
    let g = `<g transform="translate(${cx},${cy}) rotate(${angle})" opacity="${op}" ${ghost?'pointer-events="none"':`data-scenery-idx="${s._idx}" style="cursor:pointer;"`}>
      <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h*0.4}"
        fill="${fill}" stroke="${stroke}" stroke-width="1.2" stroke-dasharray="${isMicro?'':'4 3'}"/>`;
    for (let i = 0; i < 7; i++) {
      const dx = (Math.sin(i*2.3)*0.42)*w, dy = (Math.cos(i*1.7)*0.34)*h;
      g += `<circle cx="${dx}" cy="${dy}" r="${isMicro?1.5:2}" fill="${stroke}" opacity="0.5"/>`;
    }
    g += `<text x="0" y="${-h/2 - 3}" font-family="var(--mono)" font-size="6.5" font-weight="700"
            fill="${stroke}" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke">${label}</text>`;
    g += `</g>`;
    return g;
  };
  (state.scenarioData.placedScenery || []).forEach((s, i) => {
    html += sceneryPiece(Object.assign({ _idx: i }, s), false);
  });
  if (state.phase === 'scenery' && state.sceneryPlace) {
    const sp = state.sceneryPlace;
    if (sp.pending) {
      html += sceneryPiece({ type: sp.type, x: sp.pending.x / INCH, y: sp.pending.y / INCH, angle: sp.angle || 0 }, true);
      const cx = sp.pending.x, cy = sp.pending.y;
      const v = headingVec(sp.angle || 0);
      html += `<line x1="${cx}" y1="${cy}" x2="${cx + v.x*inchToPx(5)}" y2="${cy + v.y*inchToPx(5)}" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="3 3"/>`;
    } else if (state.hoverPoint) {
      const v = sceneryValid(sp.type, state.hoverPoint.x / INCH, state.hoverPoint.y / INCH);
      const piece = sceneryPiece({ type: sp.type, x: state.hoverPoint.x / INCH, y: state.hoverPoint.y / INCH, angle: 0 }, true);
      html += v.ok ? piece : piece.replace('opacity="0.5"', 'opacity="0.35"') +
        `<circle cx="${state.hoverPoint.x}" cy="${state.hoverPoint.y}" r="5" fill="none" stroke="var(--hull-crit)" stroke-width="1.5"/>`;
    }
  }

  // Focal point rings (scenario-defined, e.g. RSE 8" station zones).
  const _lay = state.scenario && state.scenario.layout && LAYOUTS[state.scenario.layout];
  if (_lay && _lay.focalPoints) {
    _lay.focalPoints.forEach(fp => {
      if (fp.diameter != null) {
        const cx = inchToPx(fp.x), cy = inchToPx(fp.y), r = inchToPx(fp.diameter / 2);
        html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(255,210,60,0.04)"
                  stroke="rgba(255,210,60,0.55)" stroke-width="1" stroke-dasharray="5 4"
                  pointer-events="none"/>`;
        html += `<text x="${cx}" y="${cy - r - 3}" font-family="var(--mono)" font-size="6"
                  fill="rgba(255,210,60,0.6)" text-anchor="middle" pointer-events="none">FOCAL ${fp.diameter}"</text>`;
      }
    });
  }

  // Dynamic debris fields (from station destruction).
  (state.scenarioData.dynamicDebris || []).forEach(dd => {
    const cx = inchToPx(dd.x), cy = inchToPx(dd.y), r = inchToPx(dd.diameter / 2);
    html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(225,120,90,0.12)"
              stroke="rgba(235,140,100,0.9)" stroke-width="1.2" stroke-dasharray="4 3"
              pointer-events="none"/>`;
    for (let i = 0; i < 6; i++) {
      const dx = Math.sin(i * 1.9) * r * 0.55, dy = Math.cos(i * 1.4) * r * 0.45;
      html += `<circle cx="${cx + dx}" cy="${cy + dy}" r="2" fill="rgba(235,140,100,0.6)" pointer-events="none"/>`;
    }
    html += `<text x="${cx}" y="${cy - r - 3}" font-family="var(--mono)" font-size="6" font-weight="700"
              fill="rgba(235,140,100,0.9)" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke"
              pointer-events="none">DEBRIS / FOCAL</text>`;
  });

  // Station–city power links (RSE: yellow dotted line while city has ≥1 power plant).
  if (_lay && _lay.stationCityLinks && state.scenarioData.dropsites) {
    Object.entries(_lay.stationCityLinks).forEach(([stId, ctId]) => {
      const st = state.scenarioData.dropsites.find(d => d.id === stId);
      const ct = state.scenarioData.dropsites.find(d => d.id === ctId);
      if (!st || !ct || st.destroyed || ct.destroyed) return;
      const hasPlant = (ct.features || []).some((fk, fi) => fk === 'power_plant' && !(ct.destroyedFeatures || []).includes(fi));
      if (!hasPlant) return;
      const x1 = inchToPx(st.x), y1 = inchToPx(st.y);
      const x2 = inchToPx(ct.x), y2 = inchToPx(ct.y);
      html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
                stroke="rgba(255,220,40,0.7)" stroke-width="1.2" stroke-dasharray="6 4"
                pointer-events="none"/>`;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      html += `<text x="${mx}" y="${my - 4}" font-family="var(--mono)" font-size="5.5"
                fill="rgba(255,220,40,0.75)" text-anchor="middle" stroke="var(--bg)" stroke-width="2" paint-order="stroke"
                pointer-events="none">BS 5+</text>`;
    });
  }

  return html;
}

/* Render deployment zones on the board (always-on after setup) */
function renderDeploymentZones() {
  if (!state.scenario) return '';
  const dep = DEPLOYMENTS[state.scenario.deployment];
  if (!dep) return '';
  // Determine which color belongs to each physical zone based on deployZone assignment.
  const dz = state.deployZone || { player1: 'south', player2: 'north' };
  const northSide = dz.player1 === 'north' ? 'player1' : 'player2';
  const southSide = dz.player1 === 'south' ? 'player1' : 'player2';
  let html = `<g class="deploy-zones">`;
  html += renderZone(dep.zones.north, sideRgba(northSide, 0.10), sideRgba(northSide, 0.55));
  html += renderZone(dep.zones.south, sideRgba(southSide, 0.10), sideRgba(southSide, 0.55));
  html += `</g>`;
  return html;
}

function renderAssetPhase() {
  const board = document.querySelector('.board-wrap');
  let overlay = document.getElementById('asset-overlay');
  if (overlay) overlay.remove();
  let banner = document.getElementById('asset-move-banner');
  if (banner) banner.remove();
  const prevHud = document.getElementById('asset-phase-hud');
  if (prevHud) prevHud.remove();
  if (!state.assetPhase) return;

  const ap = state.assetPhase;
  const sideName = (s) => playerNameForSide(s);

  if (ap.step === 'assets') {
    // Pending bomber/torpedo attacks flagged by the server — both clients open the modal.
    // No side restriction: renderAttackModal's isAttacker/isDefender flags gate the UI correctly.
    if (ap._pendingBomberResolve) {
      const pbr = ap._pendingBomberResolve;
      ap._pendingBomberResolve = null;
      resolvePendingBomberAttacks(pbr.side, pbr.type);
      renderAll();
      return;
    }

    banner = document.createElement('div');
    banner.id = 'asset-move-banner';
    banner.className = 'deploy-hint';
    const typeLabel = { fighter: 'Fighters', bomber: 'Bombers & Fire Ships', torpedo: 'Torpedoes' }[ap.assetType] || 'Assets';
    const myTurn = !_netSide || !state.assetActiveSide || _gs() === state.assetActiveSide;
    let msg, footer;

    if (!myTurn) {
      msg = `<span>Waiting for <b style="color:var(--${sideCssKey(state.assetActiveSide)})">${playerNameForSide(state.assetActiveSide)}</b> to activate ${typeLabel}…</span>`;
      footer = '';
    } else if (state.assetMove) {
      const a = state.launchedAssets.find(x => x.id === state.assetMove.id);
      const thr = a ? (a.t2t && a._t2tRange ? a._t2tRange : assetThrust(a)) : 0;
      let hint;
      if (a && !a.moved) {
        if (a.kind === 'fighter') hint = `click a destination ≤<b>${thr}"</b> · move onto an enemy Wing to dogfight`;
        else if (a.kind === 'bomber' || a.kind === 'fireship' || a.kind === 'torpedo') hint = `click a destination ≤<b>${thr}"</b> · click an enemy ship to fly in & lock it`;
        else hint = `click a destination ≤<b>${thr}"</b>`;
      } else hint = 'use the right panel';
      msg = `<span><b style="color:var(--${sideCssKey(a?a.side:'player1')})">${a?a.kind:''}</b> selected — ${hint} →</span>`;
      footer = '';
    } else {
      msg = `<span><b style="color:var(--${sideCssKey(state.assetActiveSide)})">${playerNameForSide(state.assetActiveSide)}</b> activates <b>${typeLabel}</b> · click one on the board to move it.</span>`;
      footer = '';
    }
    banner.innerHTML = `${msg}${footer}`;
    board.appendChild(banner);

    // "DONE WITH [TYPE]" / "RESOLVE BOMBER ATTACKS" — resolve pending attacks first, then advance stage.
    const fb = banner.querySelector('#asset-finish-stage');
    if (fb) fb.addEventListener('click', () => {
      state.assetMove = null;
      if (anyPendingBomberAttacks(state.assetActiveSide, ap.assetType)) {
        resolvePendingBomberAttacks(state.assetActiveSide, ap.assetType);
        renderAll();
        return;
      }
      dispatch({ type: 'assetStageDone', side: state.assetActiveSide, assetType: ap.assetType });
      renderAll();
    });

    return;
  }

  const bc = state.battalionCombat;
  const initSide = state.initiativeHolder || 'player1';
  const otherSide = initSide === 'player1' ? 'player2' : 'player1';

  const battSummaryFor = (hlId) => {
    let h = '';
    if (state.scenarioData && state.scenarioData.dropsites) {
      state.scenarioData.dropsites.forEach(ds => {
        const b = dsBattalions(ds);
        const rows = Object.keys(b).filter(k => (b[k].player1||0)+(b[k].player2||0) > 0);
        if (!rows.length) return;
        const hl = ds.id === hlId ? ' style="outline:1px solid var(--ucm);border-radius:3px;padding:3px;"' : '';
        h += `<div class="ap-ds"${hl}><div class="ap-ds-name">${ds.base.name}${dropsiteContested(ds)?' <span style="color:var(--hull-warn);font-size:8px;">CONTESTED</span>':''}</div>`;
        rows.forEach(k => {
          const loc = b[k];
          h += `<div class="ap-loc"><span>${locDisplayName(ds, k)}</span>
            <span><b style="color:var(--ucm)">${loc.player1||0}</b> · <b style="color:var(--shal)">${loc.player2||0}</b></span></div>`;
        });
        h += `</div>`;
      });
    }
    return h || `<div style="color:var(--text-mute);font-style:italic;font-size:10px;">No battalions on any dropsite.</div>`;
  };

  if (bc) {
    const ds = bc.dsId ? state.scenarioData.dropsites.find(d => d.id === bc.dsId) : null;
    let bodyHTML = '', footerHTML = '';
    const logHTML = (bc.log && bc.log.length)
      ? `<div class="ap-section"><div class="ap-log" style="color:var(--text-dim)">${bc.log.slice(-5).join('<br>')}</div></div>` : '';

    // In online mode, only the active actor for each stage can interact.
    // _netSide is null in hotseat (all buttons active).
    const bcMyTurn = (actor) => !_netSide || _netSide === actor;
    const dis = (actor) => bcMyTurn(actor) ? '' : ' disabled';

    if (bc.stage === 'pick') {
      const contested = contestedDropsites();
      const myTurn = bcMyTurn(initSide);
      if (!contested.length) {
        bodyHTML = `<div class="ap-section"><div class="ap-log" style="color:var(--text-mute)">No more contested dropsites — Battalion Combat complete.</div></div>`;
        footerHTML = `<button class="btn-primary" id="bc-to-destroy"${dis(initSide)}>CONTINUE →</button>`;
      } else {
        bodyHTML = `<div class="ap-section"><div class="ap-title">${sideName(initSide)} (1st initiative) — pick a contested dropsite</div>` +
          contested.map(d => `<button class="btn" data-bc-pick="${d.id}" style="width:100%;margin-bottom:3px;"${dis(initSide)}>
            ${d.base.name} <span style="color:var(--text-mute)">(${sideName('player1')} ${dsSideBattalions(d,'player1')} · ${sideName('player2')} ${dsSideBattalions(d,'player2')})</span></button>`).join('') +
          `</div>`;
        footerHTML = '';
      }
    } else if (bc.stage === 'init' || bc.stage === 'other') {
      const actor = bc.stage === 'init' ? initSide : otherSide;
      const enemy = actor === 'player1' ? 'player2' : 'player1';
      const feats = enemyFeatures(ds, actor);
      const myGround = dsBattalions(ds).ground[actor] || 0;
      bodyHTML = `<div class="ap-section">
        <div class="ap-title">${ds.base.name} — ${sideName(actor)} assigns ground battalions${!bcMyTurn(actor) ? ' <span style="color:var(--text-mute);font-size:8px;">(waiting)</span>' : ''}</div>
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:5px;">
          ${sideName(actor)} has <b style="color:var(--${sideCssKey(actor)})">${myGround}</b> battalion${myGround!==1?'s':''} on the dropsite ground.
          ${(myGround>0 && feats.length) ? 'Pick one enemy-held Feature to attack (1-for-1), or skip.' : (myGround<=0 ? 'No ground battalions to assign.' : 'No enemy-held Features.')}
        </div>`;
      if (myGround > 0 && feats.length) {
        bodyHTML += feats.map(fk => `<button class="btn" data-bc-feat="${fk}" style="width:100%;margin-bottom:3px;"${dis(actor)}>
          Attack ${locDisplayName(ds, fk)} <span style="color:var(--text-mute)">(enemy ${dsBattalions(ds)[fk][enemy]})</span></button>`).join('');
      }
      bodyHTML += `</div>`;
      footerHTML = `<button class="btn-primary" id="bc-skip-assign"${dis(actor)}>${bc.stage === 'init' ? 'NEXT PLAYER →' : 'RESOLVE DROPSITE →'}</button>`;
    } else if (bc.stage === 'destroy') {
      const destroyOpts = featureDestroyOptions();
      bodyHTML = `<div class="ap-section">
        <div class="ap-title">Destroy Features <span style="color:var(--text-mute);font-weight:400;font-size:8.5px;">(4+ battalions, no enemy)</span></div>
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:5px;">${destroyOpts.length ? 'Optional — remove all those battalions to destroy the Feature.' : 'No eligible Features.'}</div>`;
      // Destroy buttons are gated per-side: only the side that owns the battalions can destroy.
      bodyHTML += destroyOpts.map(o => `<button class="btn" data-destroy-feature="${o.dsId}|${o.key}" style="width:100%;margin-bottom:3px;"${dis(o.side)}>
        Destroy ${o.name} <span style="color:var(--${sideCssKey(o.side)})">(${sideName(o.side)})</span></button>`).join('');
      bodyHTML += `</div>`;
      // Either side can call bcFinish once there's nothing left to destroy.
      footerHTML = `<button class="btn-primary" id="bc-finish">FINISH COMBAT →</button>`;
    }

    const bcHud = document.createElement('div');
    bcHud.id = 'asset-overlay';
    bcHud.className = 'act-hud';
    bcHud.style.cssText = 'max-width:280px;';
    bcHud.innerHTML = `
      <div style="font-family:var(--display);font-size:10px;letter-spacing:1px;color:var(--text);margin-bottom:2px;">BATTALION COMBAT · R${state.round}</div>
      <div style="font-size:9px;color:var(--text-mute);margin-bottom:6px;">${sideName(initSide)} has initiative</div>
      ${bodyHTML}
      ${logHTML}
      <div class="ap-section"><div class="ap-title" style="font-size:9px;">Battalions <span style="color:var(--text-mute);font-weight:400;">(${sideName('player1')} · ${sideName('player2')})</span></div>${battSummaryFor(bc.dsId)}</div>
      <div style="margin-top:6px;">${footerHTML}</div>
    `;
    document.body.appendChild(bcHud);
    initPanel(bcHud, 'BATTALION COMBAT', 'asset-overlay', 8, 200);
    return;
  }

  // Only reached when battalion combat is needed (auto-advance handles all other cases).
  const _apBtnStyle = 'background:linear-gradient(180deg,#1a6a7a 0%,#0f4a58 100%);border-color:#2a8a9a;color:#e0f8ff;';
  const iVoted = !!_netSide && _assetPhaseVoteType === 'startBattalionCombat' && _assetPhaseVotes.has(_gs());
  const voted = (_assetPhaseVoteType === 'startBattalionCombat') ? _assetPhaseVotes.size : 0;
  const bcBtn = iVoted
    ? `<button class="btn-finish-act" disabled style="${_apBtnStyle}opacity:0.6;">WAITING… (${voted}/2)</button>`
    : `<button class="btn-finish-act" id="asset-start-battalions" style="${_apBtnStyle}">BATTALION COMBAT ▸</button>`;
  const hudEl = document.createElement('div');
  hudEl.id = 'asset-phase-hud';
  hudEl.className = 'act-hud';
  hudEl.innerHTML = `
    <div class="act-hud-title">ASSET PHASE · R${state.round}</div>
    <div style="font-size:10px;color:var(--text-dim);margin-bottom:4px;">${sideName(initSide)} has initiative</div>
    ${bcBtn}
  `;
  document.body.appendChild(hudEl);
  initPanel(hudEl, 'ASSET PHASE', 'asset-phase-hud', 8, 200);
}

/* ==========================================================================
   RENDERING — SIDE PANELS
   ========================================================================== */
function renderPanels() {
  // Hide both side panels during Setup (the scenario overlay is the focus). Collapse
  // their grid columns via a class so the board stays centred and full-width; show them
  // for every other phase.
  const app = document.querySelector('.app');
  if (app) app.classList.toggle('panels-hidden', state.phase === 'setup');

  const ucmDiv = document.getElementById('ucm-groups');
  const shalDiv = document.getElementById('shal-groups');
  ucmDiv.innerHTML = '';
  shalDiv.innerHTML = '';

  // During SETUP, fleets/sides aren't finalised yet (sides randomise at commit),
  // so the ship list is empty until the scenario is confirmed.
  if (state.phase === 'setup') {
    const ucmTitleEl = document.getElementById('ucm-title');
    const shalTitleEl = document.getElementById('shal-title');
    if (ucmTitleEl) ucmTitleEl.childNodes[0].nodeValue = 'FLEET ';
    if (shalTitleEl) shalTitleEl.childNodes[0].nodeValue = 'FLEET ';
    const c1 = document.getElementById('ucm-count'); if (c1) c1.textContent = '';
    const c2 = document.getElementById('shal-count'); if (c2) c2.textContent = '';
    return;
  }

  let ucmPts = 0, shalPts = 0;
  const rf = redFleet(), bf = blueFleet();
  const fleetSortKey = def => {
    const slot = state.slotForSide && state.slotForSide[def.side];
    const imported = slot && state.importedFleets && state.importedFleets[slot];
    const admiralIdx = imported?.admiralGroupIdx ?? -1;
    const isAdmiral = (admiralIdx >= 0 && def.baseId === 'imp' + admiralIdx) ||
      (imported?.admiralAssignments?.some(a => def.baseId === 'imp' + a.groupIdx) ?? false);
    if (isAdmiral) return 0;
    const hasDrop = !!(def.launch && def.launch.some(l => /lander|dropship/i.test(l.type || '')));
    const base = { C: 1, H: 2, M: 4, L: 6 }[def.tonnage] ?? 8;
    return base + (def.tonnage !== 'C' && hasDrop ? 1 : 0);
  };
  const renderSide = (fleet, container, side) => {
    let pts = 0, grpCount = 0;
    // Non-payload groups render as normal individual cards: admiral → C → H/M/L by drop.
    // Fully-destroyed groups are removed from the list.
    fleet.filter(def => !def.payload).sort((a, b) => fleetSortKey(a) - fleetSortKey(b)).forEach(def => {
      pts += def.pts;
      const grp = state.groups[def.id];
      if (grp && grp.ships.every(s => s.destroyed)) return;
      grpCount++;
      container.appendChild(makeGroupCard(def));
    });
    // Payload (Bioficer Cell) groups: collapse into ONE "Cells" card, and only
    // show it once at least one Cell has been detached onto the table. Attached
    // (riding) Cells stay hidden until deployed from their Porter.
    const payloadDefs = fleet.filter(def => def.payload);
    if (payloadDefs.length) {
      payloadDefs.forEach(def => { pts += def.pts; });
      const anyDetached = payloadDefs.some(def => {
        const g = state.groups[def.id];
        return g && g.ships.some(s => !s.destroyed && !s.offTable && !s.attachedTo && !s.deployedByGid);
      });
      if (anyDetached) {
        grpCount++;
        container.appendChild(makeCellsCard(side, payloadDefs));
      }
    }
    return { pts, grpCount };
  };
  const rStat = renderSide(rf, ucmDiv, 'player1');
  const bStat = renderSide(bf, shalDiv, 'player2');
  // AP chip at the top of each fleet list (play phase) — click to adjust that side's AP.
  if (state.phase === 'play' && state.planning) {
    const P = state.planning;
    const apChip = (side, container) => {
      // In online mode only show own AP chip as interactive; opponent chip is read-only.
      const myOnlineSide = _netSide ? _gs() : null;
      const chip = document.createElement('button');
      chip.className = 'ap-chip';
      chip.dataset.apOpen = side;
      chip.title = myOnlineSide && myOnlineSide !== side
        ? 'Opponent\'s Ability Points (view only)'
        : 'Ability Points — click to adjust';
      chip.innerHTML = `<span style="font-size:8px;letter-spacing:0.12em;color:var(--text-mute);">AP</span>
        <b style="color:var(--${sideCssKey(side)});font-size:15px;">${P.ap[side]}</b>
        ${P.passTokens[side] ? `<span style="font-size:8px;color:var(--text-mute);">· ${P.passTokens[side]} PASS</span>` : ''}
        <span style="font-size:9px;color:var(--text-mute);margin-left:auto;">⊕</span>`;
      chip.addEventListener('click', () => {
        const r = chip.getBoundingClientRect();
        state.apEditOpen = side;
        state.apEditAnchor = { top: r.bottom, left: r.left };
        renderAll();
      });
      container.insertBefore(chip, container.firstChild);
    };
    apChip('player1', ucmDiv);
    apChip('player2', shalDiv);
  }
  // Prefer imported fleet pts (includes hardpoints/admirals) over built-in def sums.
  const _importedPts = (side) => {
    const slot = state.slotForSide && state.slotForSide[side];
    const imp = slot && state.importedFleets && state.importedFleets[slot];
    return imp ? _fleetTotalPts(imp) : null;
  };
  ucmPts = _importedPts('player1') ?? rStat.pts;
  shalPts = _importedPts('player2') ?? bStat.pts;
  const redName = playerNameForSide('player1');
  const blueName = playerNameForSide('player2');
  document.getElementById('ucm-count').textContent = `${rStat.grpCount} GRPS · ${ucmPts} PTS`;
  document.getElementById('shal-count').textContent = `${bStat.grpCount} GRPS · ${shalPts} PTS`;
  // Player names in the panel titles + topbar brand.
  const ucmTitle = document.getElementById('ucm-title');
  const shalTitle = document.getElementById('shal-title');
  if (ucmTitle) ucmTitle.childNodes[0].nodeValue = redName.toUpperCase() + ' ';
  if (shalTitle) shalTitle.childNodes[0].nodeValue = blueName.toUpperCase() + ' ';
  // Click player name title to open fleet view.
  [['player1', ucmTitle], ['player2', shalTitle]].forEach(([side, titleEl]) => {
    if (!titleEl) return;
    titleEl.style.cursor = 'pointer';
    titleEl.onclick = (e) => openFleetViewForSide(side, e.currentTarget);
  });

  // Keep the player's own fleet at the top of the left panel; in hotseat fall back to
  // the north-deployment side being first.
  {
    const panelLeft = document.getElementById('panel-left');
    const ucmSection = document.getElementById('ucm-groups') && document.getElementById('ucm-groups').closest('.panel-section');
    const shalSection = document.getElementById('shal-groups') && document.getElementById('shal-groups').closest('.panel-section');
    if (panelLeft && ucmSection && shalSection) {
      let topSection = null;
      if (_netSide === 'player1') topSection = ucmSection;
      else if (_netSide === 'player2') topSection = shalSection;
      else if (state.deployZone) topSection = state.deployZone.player1 === 'north' ? ucmSection : shalSection;
      if (topSection && panelLeft.firstElementChild !== topSection) {
        panelLeft.insertBefore(topSection, panelLeft.firstElementChild);
      }
    }
  }
}

/* Returns role singular or plural based on group size. */
function roleLabel(def) {
  const n = def.groupSize || 1;
  return n > 1 ? def.role + 's' : def.role;
}

function makeGroupCard(def) {
  const grp = getGroup(def.id);
  const card = document.createElement('div');
  card.className = `group-card ${sideCssKey(def.side)}`;
  if (state.selectedGroupId === def.id) card.classList.add('active');
  if (grp.activated) card.classList.add('activated');
  // Alternating activation: dim the faction that isn't up this round.
  if (state.phase === 'play' && state.activeSide && def.side !== state.activeSide && !grp.activated) {
    card.classList.add('off-turn');
  }
  // Activation lock: once a group on this side has started activating (order set or
  // acted), all OTHER same-side groups are locked until FINISH ACTIVATION is pressed.
  const activatingGid = state.phase === 'play' ? activeGroupIdForSide(def.side) : null;
  if (activatingGid && activatingGid !== def.id && !grp.activated) {
    card.classList.add('activation-locked');
  }
  card.dataset.gid = def.id;

  const alive = grp.ships.filter(s => !s.destroyed).length;
  const total = grp.ships.length;
  const onTable = grp.ships.filter(s => !s.destroyed && !s.offTable).length;
  const undeployedCount = alive - onTable;
  // Payload ships still riding inside a Porter (not yet detached).
  const attachedCount = def.payload ? grp.ships.filter(s => !s.destroyed && s.attachedTo).length : 0;
  const sideApproach = state.scenario ? approachFor(def.side) : null;
  const isDirect = sideApproach === 'directly_deploy';
  const deployable = state.scenario ? canDeployNow(def) : false;
  // A non-Vanguard Group on a Close/Distant side waits for off-table activation.
  const isReserve = state.scenario && !deployable;

  // Play-phase activation eligibility (for undeployed Groups in play)
  let playBadgeHTML = '';
  if (state.phase === 'play' && undeployedCount > 0) {
    const elig = canActivateOffTable(def);
    if (elig.eligible) {
      // Eligible to deploy + activate this round — green/amber call to action.
      const label = undeployedCount === total ? 'DEPLOY NOW' : `${undeployedCount} TO PLACE`;
      playBadgeHTML = `<span class="gc-badge ready">${label}</span>`;
    } else {
      // Not yet eligible — show round when available.
      // Extract round number from the reason if present, else show generic.
      const m = elig.reason && elig.reason.match(/Round (\d)/);
      const lbl = m ? `AVAIL R${m[1]}` : 'OFF-TABLE';
      playBadgeHTML = `<span class="gc-badge undeployed">${lbl}</span>`;
    }
  }

  // Badge logic:
  //  - VANGUARD-X" if the Group has Vanguard (always)
  //  - In setup/deploy phase: DIRECT/RESERVE + UNDEPLOYED count
  //  - In play phase: round-aware DEPLOY-NOW / AVAIL-RX badge
  const inNetwork = def.openNetwork && grp.ships.some(s => shipInNetwork(def, s));
  const displayName = inNetwork ? 'Voidgate Network' : def.name;
  const _admiralSlot = state.slotForSide && state.slotForSide[def.side];
  const _importedFleet = _admiralSlot && state.importedFleets && state.importedFleets[_admiralSlot];
  const _admiralIdx = _importedFleet && _importedFleet.admiralGroupIdx != null ? _importedFleet.admiralGroupIdx : -1;
  // Also flag famous admiral groups via admiralAssignments.
  const _asnAdmiral = _importedFleet && _importedFleet.admiralAssignments &&
    _importedFleet.admiralAssignments.some(a => def.baseId === 'imp' + a.groupIdx);
  const isAdmiral = (_admiralIdx >= 0 && def.baseId === 'imp' + _admiralIdx) || !!_asnAdmiral;
  card.innerHTML = `
    <div class="gc-name">${isAdmiral ? '⭐ ' : ''}${displayName}</div>
    <div class="gc-role">${inNetwork ? 'Open Network' : roleLabel(def) + ' · ' + def.tonnage}</div>
    <div class="gc-badges">
      ${def.vanguard && state.phase !== 'play' ? `<span class="gc-badge vanguard">VANGUARD-${def.vanguard}"</span>` : ''}
      ${state.phase !== 'play' && isDirect ? `<span class="gc-badge direct">DIRECT</span>` : ''}
      ${state.phase !== 'play' && isReserve ? `<span class="gc-badge reserve">RESERVE · ${sideApproach === 'close' ? 'CLOSE' : 'DISTANT'}</span>` : ''}
      ${state.phase === 'deploy' && deployable && undeployedCount > 0 && !deploySideAllowed(def.side) ? `<span class="gc-badge reserve">WAIT · RED FIRST</span>` : (state.phase === 'deploy' && deployable && undeployedCount > 0 ? `<span class="gc-badge undeployed">${undeployedCount === total ? 'UNDEPLOYED' : undeployedCount + ' OFF-TABLE'}</span>` : '')}
      ${playBadgeHTML}
      ${attachedCount > 0 ? `<span class="gc-badge reserve">${attachedCount} ATTACHED</span>` : ''}
    </div>
  `;
  card.addEventListener('click', () => {
    // In play phase, silently ignore clicks on groups that have no eligible ships
    // (off-table and not yet eligible to arrive). They auto-activate separately.
    if (state.phase === 'play' && undeployedCount > 0 && onTable === 0) {
      const _elig = canActivateOffTable(def);
      if (!_elig.eligible) return;
    }
    const wasSelected = state.selectedGroupId === def.id;
    selectGroup(def.id);
    // Also select the first alive ship in the group so the ship detail panel shows.
    if (!wasSelected && state.selectedGroupId === def.id) {
      const firstAlive = grp.ships.findIndex(s => !s.destroyed);
      state.selectedShipIdx = firstAlive >= 0 ? firstAlive : 0;
      renderAll(true);
    }
    // On mobile, selecting a unit from the fleet drawer just closes the drawer so
    // the board (with the now-highlighted selection) is visible. The detail/actions
    // drawer stays closed until the player taps ▤ DETAIL.
    if (_isMobileLayout() && state.selectedGroupId === def.id) {
      closeMobileDrawers();
    }
  });

  // Launched-cell sub-items: cells with deployedByGid === this group are shown
  // here so the player can select and activate them without leaving the Porter's context.
  const launchedCells = [];
  Object.entries(state.groups).forEach(([cgid, cgrp]) => {
    cgrp.ships.forEach((cs, csi) => {
      if (cs.deployedByGid === def.id && !cs.destroyed) launchedCells.push({ cgid, csi, cs });
    });
  });
  if (launchedCells.length) {
    const divider = document.createElement('div');
    divider.style.cssText = 'border-top:1px solid rgba(255,255,255,0.07);margin:6px -2px 4px;';
    card.appendChild(divider);
    const hdr = document.createElement('div');
    hdr.style.cssText = 'font-size:8px;letter-spacing:0.1em;color:var(--text-mute);text-transform:uppercase;padding:0 4px 3px;';
    hdr.textContent = 'Launched this activation';
    card.appendChild(hdr);
    launchedCells.forEach(({ cgid, csi, cs }) => {
      const acted = cs.movedThisRound || cs.firedThisActivation || (cs.launchedThisRound > 0);
      const cellDef = getDef(cgid);
      const isSelCell = state.selectedGroupId === cgid && state.selectedShipIdx === csi;
      const row = document.createElement('div');
      row.style.cssText = `display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:3px;cursor:pointer;${isSelCell ? 'background:rgba(255,255,255,0.07);' : ''}`;
      row.innerHTML = `
        <span style="color:var(--text-mute);font-size:11px;">⬡</span>
        <span style="flex:1;font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;color:${acted ? 'var(--text-mute)' : 'var(--text-dim)'};">${cellDef ? cellDef.name : 'Cell'}</span>
        <span class="gc-badge reserve" style="font-size:7.5px;padding:0 4px;">GQ</span>
        ${acted ? '<span style="color:var(--text-mute);font-size:9px;min-width:10px;text-align:right;">✓</span>' : '<span style="color:var(--hull-warn);font-size:9px;min-width:10px;text-align:right;">!</span>'}
      `;
      row.addEventListener('click', e => {
        e.stopPropagation();
        selectGroup(cgid);
        if (state.selectedGroupId === cgid) {
          state.selectedShipIdx = csi;
          renderAll(true);
        }
      });
      card.appendChild(row);
    });
  }

  return card;
}

/* Combined "Cells" card for Bioficer Payload groups. Represents all detached
   Cells (which from R2 count as a single Group). Clicking selects the first
   detached Cell's group so its detail/orders show. */
function makeCellsCard(side, payloadDefs) {
  const card = document.createElement('div');
  card.className = `group-card ${side}`;
  // Collect ONLY detached (deployed, on-table) cells. Attached cells are not
  // shown here — they activate as part of their Porter's activation.
  const detached = [];
  payloadDefs.forEach(def => {
    const g = state.groups[def.id];
    if (!g) return;
    g.ships.forEach((s, si) => { if (!s.destroyed && !s.offTable && !s.attachedTo && !s.deployedByGid) detached.push({ def, si, ship: s }); });
  });
  const first = detached.length ? detached[0] : null;
  if (first && state.selectedGroupId === first.def.id) card.classList.add('active');
  // Points reflect only the deployed cells.
  const deployedPts = detached.reduce((a, d) => a + d.def.pts, 0);
  card.innerHTML = `
    <div class="gc-name">Cells</div>
    <div class="gc-role">Detached Payload Group · ${deployedPts}pts</div>
    <div class="gc-badges">
      <span class="gc-badge reserve">${detached.length} DEPLOYED</span>
      ${state.round >= 2 ? `<span class="gc-badge vanguard">SINGLE GROUP</span>` : ''}
    </div>
    <div class="gc-stats">
      <span><b>FOLLOW</b> GQ</span>
      <span style="color:var(--text-mute)">ignore coherency</span>
    </div>
  `;
  if (first) {
    card.addEventListener('click', () => {
      selectGroup(first.def.id);
      state.selectedShipIdx = first.si; // target a real on-table cell
      renderAll(true);
    });
  }
  return card;
}

function selectGroup(gid) {
  // In replay mode, allow freely selecting any group for viewing — skip all game guards.
  if (_replayMode) {
    state.selectedGroupId = state.selectedGroupId === gid ? null : gid;
    state.selectedShipIdx = state.selectedGroupId ? 0 : null;
    state.selectedDropsiteId = null;
    renderAll(true);
    return;
  }
  // Hotseat turn enforcement: only the active player may interact with their groups.
  if (!_netSide) {
    const def = getDef(gid);
    if (def) {
      if (state.phase === 'deploy' && !deploySideAllowed(def.side)) {
        const active = !state.deployDone.player1 ? 'player1' : 'player2';
        flashLaunchMsg(`${playerNameForSide(active)} deploys first`);
        return;
      }
      if (state.phase === 'play' && state.activeSide && def.side !== state.activeSide) {
        flashLaunchMsg(`${playerNameForSide(state.activeSide)}'s turn to activate`);
        return;
      }
    }
  }
  if (state.phase === 'play') {
    // Block switching to a different group while a FRIENDLY group is mid-activation.
    // In online mode allow free browsing while the opponent's group is mid-activation.
    const midActGid = Object.keys(state.groups).find(id => {
      const g = state.groups[id];
      return g.order && !g.activated;
    });
    if (midActGid && midActGid !== gid) {
      const midActDef = getDef(midActGid);
      const midActIsMine = !_netSide || (midActDef && midActDef.side === _netSide);
      if (midActIsMine) {
        // Allow switching to a cell group whose ships were deployed by the mid-act Porter.
        const tGrp = state.groups[gid];
        const isCellOfMidAct = tGrp && tGrp.ships.some(cs => cs.deployedByGid === midActGid);
        if (!isCellOfMidAct) {
          flashLaunchMsg('Finish the current activation before selecting another Group');
          return;
        }
      }
    }
  }
  if (state.selectedGroupId === gid) {
    state.selectedGroupId = null;
    state.selectedShipIdx = null;
  } else {
    state.selectedGroupId = gid;
    state.selectedShipIdx = null;
  }
  state.selectedDropsiteId = null;
  state.hoverPoint = null;
  state.layerToggle = false;
  state.launching = null;
  arcViewMode = 1;
  renderAll(true);
  netSendPeerView();
}

/* Auto-activate any groups whose ships are all off-table and not yet eligible
   to arrive. Called via setTimeout from renderAll so it runs after the paint
   without needing the player to click the ineligible group card. */
function _autoSkipIneligible() {
  if (state.phase !== 'play') return;
  ['player1','player2'].forEach(side => {
    fleetForSide(side).forEach(def => {
      const grp = state.groups[def.id];
      if (!grp || grp.activated) return;
      const hasOffTable = grp.ships.some(s => !s.destroyed && s.offTable && !s.attachedTo);
      const hasActive   = grp.ships.some(s => !s.destroyed && (!s.offTable || s.justArrived))
                        || (hasOffTable && canActivateOffTable(def).eligible);
      if (!hasActive && _isLegal(state, { type: 'finishActivation', gid: def.id }, side)) {
        dispatch({ type: 'finishActivation', gid: def.id });
      }
    });
  });
}
